}

/* ── Signal / Prediction table ───────────────────────────── */
function renderSignal(D) {
  const picks = D.picks || [];
  if (!picks.length && D.modHome == null) return '';

  // Primary verdict
  const bet  = picks.find(p => p.verdict === 'BET');
  const abw  = picks.find(p => p.verdict === 'ABWÄGEN');
  const best = bet || abw || null;

  let bannerHtml = '';
  if (best) {
    const isBet = best.verdict === 'BET';
    const cls   = isBet ? 'bet' : 'abw';
    const icon  = isBet ? '⚡' : '📈';
    const stars = starsFromConf(best.conf);
    const edge  = best.edgePP != null ? (best.edgePP >= 0 ? '+' : '') + parseFloat(best.edgePP).toFixed(0) + 'pp Edge' : '';
    bannerHtml = `
      <div class="verdict-banner ${cls}">
        <div class="vb-icon">${icon}</div>
        <div class="vb-body">
          <div class="vb-label">${escHtml(best.verdict)}</div>
          <div class="vb-reason">${escHtml(best.market || '')}${edge ? ' · ' + edge : ''}${stars ? ' · ' + starsStr(stars) : ''}</div>
        </div>
        ${best.odds ? `<div class="vb-badge">@${fmtOdds(best.odds)}</div>` : ''}
      </div>`;
  }

  // Model vs Market rows — 1X2
  const rows1x2 = [
    { lbl: 'Heimsieg',  mod: D.modHome, mkt: D.probHome },
    { lbl: 'Unentsch.', mod: D.modDraw, mkt: D.probDraw },
    { lbl: 'Auswärts',  mod: D.modAway, mkt: D.probAway },
  ].filter(r => r.mod != null);

  function edgePP(mod, mkt) {
    if (mod == null || mkt == null) return null;
    return Math.round((parseFloat(mod) - parseFloat(mkt)) * 10) / 10;
  }
  function edgeCls(e) {
    if (e == null || Math.abs(e) < 0.3) return 'flat';
    return e > 0 ? 'pos' : 'neg';
  }

  const tableRows = rows1x2.map(r => {
    const e = edgePP(r.mod, r.mkt);
    const eStr = e != null
      ? (Math.abs(e) < 0.3 ? '—' : (e > 0 ? '+' : '') + e.toFixed(1) + 'pp')
      : '—';
    return `
      <tr class="st-row">
        <td class="st-market">${r.lbl}</td>
        <td class="st-model">${r.mod != null ? r.mod + '%' : '—'}</td>
        <td class="st-market-val">${r.mkt != null ? r.mkt + '%' : '—'}</td>
        <td class="st-edge ${edgeCls(e)}">${eStr}</td>
      </tr>`;
  }).join('');

  // O/U picks from picks array
  let ouRows = '';
  for (const p of picks) {
    const ml = (p.market || '').toLowerCase();
    const isOU = ml.includes('über') || ml.includes('unter') || ml.includes('2.5');
    if (!isOU) continue;
    const e  = p.edgePP != null ? parseFloat(p.edgePP) : null;
    const eStr = e != null ? (e >= 0 ? '+' : '') + e.toFixed(1) + 'pp' : '—';
    ouRows += `
      <tr class="st-row">
        <td class="st-market">${escHtml(p.market)}</td>
        <td class="st-model">${p.modelOdds ? 'FV ' + fmtOdds(p.modelOdds) : '—'}</td>
        <td class="st-market-val">${p.odds ? '@' + fmtOdds(p.odds) : '—'}</td>
        <td class="st-edge ${edgeCls(e)}">${eStr}</td>
      </tr>`;
  }

  const hasTable = tableRows || ouRows;

  return `
    <div class="section">
      <div class="sec-head">
        <span class="sec-ico">🎯</span>
        <span class="sec-title">Wett-Signal</span>
        <span class="sec-tag gold">CocoBet Modell</span>
      </div>

      ${bannerHtml}

      ${hasTable ? `
      <div class="box" style="padding:12px;">
        <div style="font-size:9px;color:var(--sub);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;">Modell vs. Markt — alle Märkte</div>
        <table class="signal-table">
          <thead class="st-head">
            <tr><th>Markt</th><th>Modell</th><th>Pinn.</th><th>Edge</th></tr>
          </thead>
          <tbody>
            ${tableRows}
            ${ouRows}
          </tbody>
        </table>
        <div style="font-size:9px;color:#1a2a1a;margin-top:6px;">Modell = Elo-Wahrsch. · Markt = Pinnacle devigged · Edge in Prozentpunkten</div>
      </div>` : ''}
    </div>`;
}

/* ── Polymarket section ──────────────────────────────────── */
function renderPoly(D) {
  const p = D.polyData;
  if (!p) return '';

  function pct(v) { return v != null ? Math.round(v * 100) + '%' : '—'; }
  function edgeLabel(e) {
    if (e == null || Math.abs(e) < 0.3) return '<span class="poly-edge flat">—</span>';
    const s = (e > 0 ? '+' : '') + e.toFixed(1) + 'pp';
    return `<span class="poly-edge ${e > 0 ? 'pos' : 'neg'}">${s}</span>`;
  }

  const markets = [
    { lbl: 'Heimsieg',  price: p.hw,  edge: p.edge_hw },
    { lbl: 'Unentsch.', price: p.dr,  edge: p.edge_dr },
    { lbl: 'Auswärts',  price: p.aw,  edge: p.edge_aw },
    { lbl: 'Over 2.5',  price: p.o25, edge: p.edge_o25 },
    { lbl: 'Under 2.5', price: p.u25, edge: p.edge_u25 },
    { lbl: 'BTTS',      price: p.btts, edge: null },
  ].filter(m => m.price != null);

  const cards = markets.map(m => `
    <div class="poly-card">
      <div class="poly-label">${m.lbl}</div>
      <div class="poly-price">${pct(m.price)}</div>
      ${edgeLabel(m.edge)}
    </div>`).join('');

  const vol = p.vol ? '$' + (p.vol / 1000).toFixed(0) + 'K' : '—';
  const pinnTag = p.hasPinnacle
    ? '<span style="background:#1a2a3a;color:#60a5fa;border:1px solid #60a5fa44;border-radius:4px;padding:1px 5px;font-size:8px;">Pinnacle ✓</span>'
    : '<span style="font-size:8px;color:#555;">kein Pinn-Vergleich</span>';

  const steamHtml = p.steamLag
    ? '<span class="steam-badge">🔥 STEAM-LAG</span>'
    : '';

  return `
    <div class="section">
      <div class="sec-head">
        <span class="sec-ico">💹</span>
        <span class="sec-title">Polymarket Märkte</span>
        <span class="sec-tag" style="background:rgba(167,139,250,.1);color:var(--purple);border:1px solid rgba(167,139,250,.2);">Prediction Market</span>
      </div>

      ${p.steamLag ? `
      <div style="margin-bottom:10px;">
        <div class="steam-badge" style="font-size:11px;padding:7px 12px;">🔥 STEAM-LAG — Pinnacle bewegte sich, Polymarket hat noch nicht reagiert → potenzielle Arbitrage-Window</div>
      </div>` : ''}

      <div class="poly-grid">${cards}</div>

      <div class="poly-footer">
        <span>Volumen: <strong style="color:#aaa;">${vol}</strong></span>
        ${pinnTag}
        ${steamHtml}
        ${p.slug ? `<a href="https://polymarket.com/event/${p.slug}" target="_blank" rel="noopener" style="color:var(--purple);font-size:9px;text-decoration:none;">→ Polymarket</a>` : ''}
      </div>
      <div style="font-size:9px;color:#333;margin-top:6px;">Edge vs. Pinnacle Fair Value · Positiv = Polymarket zu günstig</div>
    </div>`;
}

/* ── Player Bets section ─────────────────────────────────── */
function renderPlayerBets(D) {
  const homeSquad = D.squads ? D.squads[D.homeId] : null;
  const awaySquad = D.squads ? D.squads[D.awayId] : null;
  const homeProps = D.playerProps ? D.playerProps[D.homeId] : null;
  const awayProps = D.playerProps ? D.playerProps[D.awayId] : null;

  if (!homeSquad && !awaySquad) return '';

  const posLabel = (pos) => {
    const m = { ST:'Stürmer', CF:'Stürmer', FW:'Stürmer', LW:'Flügel', RW:'Flügel',
                CAM:'Off. MF', AM:'Off. MF', CM:'Mittelfeld', MF:'Mittelfeld',
                DM:'Def. MF', CDM:'Def. MF', LB:'Verteidiger', RB:'Verteidiger',
                CB:'Verteidiger', DF:'Verteidiger', GK:'Torwart' };
    return m[(pos||'').toUpperCase()] || pos || '';
  };

  function playerCard(squad, props, teamName, teamFlag, teamId) {
    if (!squad) return '';
    const isAttacker = ['ST','CF','FW','LW','RW','CAM','AM'].includes((squad.position||'').toUpperCase());
    const per90 = squad.minutes && squad.goals != null && squad.minutes > 0
      ? (squad.goals / (squad.minutes / 90)).toFixed(2) : null;

    // Best prop if available
    let propHtml = '';
    if (props && props.anytime) {
      propHtml = `
        <div style="margin-top:8px;background:rgba(245,197,24,.08);border:1px solid rgba(245,197,24,.18);border-radius:6px;padding:6px 10px;">
          <div style="font-size:8px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;">Anytime Scorer</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fff;">@${fmtOdds(props.anytime)}</div>
        </div>`;
    } else if (isAttacker) {
      propHtml = `
        <div class="pb-hint">🎯 Tipp: Anytime Scorer beobachten</div>`;
    }

    return `
      <div class="pb-card">
        <div class="pb-team-label">${escHtml(teamFlag||'')} ${escHtml(teamName||'')}</div>
        <div class="pb-player-name">${escHtml(squad.name || '?')}</div>
        <div class="pb-position">${posLabel(squad.position)}</div>
        <div class="pb-stats">
          ${squad.goals   != null ? `<div class="pb-stat"><div class="pb-stat-val" style="color:#22c55e;">${squad.goals}</div><div class="pb-stat-lbl">Tore</div></div>` : ''}
          ${squad.assists != null ? `<div class="pb-stat"><div class="pb-stat-val" style="color:#60a5fa;">${squad.assists}</div><div class="pb-stat-lbl">Assists</div></div>` : ''}
          ${per90 ? `<div class="pb-stat"><div class="pb-stat-val" style="color:#f0c040;">${per90}</div><div class="pb-stat-lbl">Tore/90</div></div>` : ''}
        </div>
        ${propHtml}
      </div>`;
  }

  const homeCard = playerCard(homeSquad, homeProps, D.home, D.homeFlag, D.homeId);
  const awayCard = playerCard(awaySquad, awayProps, D.away, D.awayFlag, D.awayId);

  return `
    <div class="section">
      <div class="sec-head">
        <span class="sec-ico">⚽</span>
        <span class="sec-title">Spieler-Wetten</span>
        <span class="sec-tag gray">Schlüsselspieler</span>
      </div>
      <div class="player-bets-grid">
        ${homeCard}
        ${awayCard}
      </div>
      <div style="font-size:9px;color:#333;margin-top:-4px;margin-bottom:10px;">Stats letzte Saison (Klub + Nationalteam) · Prop-Quoten live wenn verfügbar</div>
    </div>`;
}

/* ── Sticky bar ──────────────────────────────────────────── */
/* ── Decision Strip — compact top pick summary ───────────── */
function renderDecisionStrip(D) {
  const picks  = D.picks || [];
  const primary = picks.find(p => p.verdict === 'BET') || picks.find(p => p.verdict === 'ABWÄGEN') || null;
  if (!primary) return '';

  const isBet      = primary.verdict === 'BET';
  const cls        = isBet ? 'bet' : 'abw';
  const badgeLabel = isBet ? '⚡ BET' : '📈 ABWÄGEN';
  const starsN     = starsFromConf(primary.conf);

  const edgePp  = primary.edgePP != null ? parseFloat(primary.edgePP) : null;
  const edgeStr = edgePp != null ? (edgePp >= 0 ? '+' : '') + edgePp.toFixed(1) + 'pp Edge' : '';
  const fvStr   = primary.fairValue ? 'FV ' + parseFloat(primary.fairValue).toFixed(2) : '';

  // Kelly fraction: (p_model * odds - 1) / (odds - 1) * 100
  let kellyHtml = '';
  if (primary.odds && D.modHome != null) {
    // Pick which model prob to use based on market string
    const mktLow = (primary.market || '').toLowerCase();
    let pModel = null;
    if (mktLow.includes('heim') || mktLow.includes('home') || mktLow === '1') pModel = D.modHome / 100;
    else if (mktLow.includes('auswärts') || mktLow.includes('away') || mktLow === '2') pModel = D.modAway / 100;
    else if (mktLow.includes('unentsch') || mktLow.includes('draw') || mktLow === 'x') pModel = D.modDraw / 100;

    if (pModel != null && primary.odds > 1) {
      const o = parseFloat(primary.odds);
      const fullKelly = ((pModel * o - 1) / (o - 1) * 100);
      const halfKelly = fullKelly / 2;
      if (fullKelly > 0) {
        kellyHtml = `<div class="ds-kelly">Kelly: <strong>${fullKelly.toFixed(1)}%</strong> · Konservativ: <strong>${halfKelly.toFixed(1)}%</strong> des Bankrolls</div>`;
      }
    }
  }

  const metaParts = [
    starsN ? starsStr(starsN) : '',
    fvStr,
    edgeStr,
  ].filter(Boolean);

  return `
    <div class="decision-strip ${cls}">
      <div class="ds-row">
        <span class="ds-badge ${cls}">${badgeLabel}</span>
        <span class="ds-market">${escHtml(primary.market || '')}</span>
        <span class="ds-odds ${cls}">${primary.odds ? '@' + fmtOdds(primary.odds) : '—'}</span>
      </div>
      ${metaParts.length > 0 ? `<div class="ds-meta">
        ${metaParts.map(m => `<span class="ds-edge ${cls}">${escHtml(m)}</span>`).join('<span style="color:rgba(255,255,255,.15)">·</span>')}
      </div>` : ''}
      ${kellyHtml}
      <div class="pick-env-placeholder" data-market="${escHtml(primary.market||'')}"></div>
    </div>`;
}

function renderStickyBar(D) {
  const betPick = (D.picks || []).find(p => p.verdict === 'BET');
  if (!betPick) return '';

  const edgePp  = betPick.edgePP != null ? parseFloat(betPick.edgePP) : null;
  const edgeStr = edgePp != null ? (edgePp >= 0 ? '+' : '') + edgePp.toFixed(1) + 'pp Edge' : '';
  const stickyStars = starsFromConf(betPick.conf);

  return `
    <div class="sticky" id="sticky-bar">
      <div class="sticky-info">
        <div class="sticky-name">${escHtml(betPick.market || '')}</div>
        <div class="sticky-sub">⚡ BET${stickyStars ? ' · ' + starsStr(stickyStars) : ''}${edgeStr ? ' · ' + edgeStr : ''}</div>
      </div>
      <div class="sticky-odds">${betPick.odds ? '@' + fmtOdds(betPick.odds) : '—'}</div>
      <button class="sticky-btn">Wetten →</button>
    </div>`;
}

/* ── Master render ───────────────────────────────────────── */
function render(D) {
  // Page title
  const pageTitle = (D.home || '') + ' vs ' + (D.away || '') + ' · WM 2026 · CocoBet';
  document.title = pageTitle;

  // Probabilities for hero: prefer pinnacle devigged, else model
  const pH = D.probHome != null ? D.probHome : D.modHome;
  const pD = D.probDraw != null ? D.probDraw : D.modDraw;
  const pA = D.probAway != null ? D.probAway : D.modAway;

  const heroDate = [fmtDate(D.date), D.time].filter(Boolean).join(' · ');

  const html = `
    <nav class="topbar">
      <a class="tb-back" href="../betting-dashboard.html">← Dashboard</a>
      <div class="tb-badge">
        <div class="tb-dot"></div>
        WM 2026 · ${escHtml(D.groupName || D.group || '')}
      </div>
      <span class="tb-spieltag">Spieltag ${safe(D.matchday, '?')}</span>
    </nav>

    <section class="hero">
      <div class="hero-bg-word">${escHtml((D.homeId||'').toUpperCase())} ${escHtml((D.awayId||'').toUpperCase())}</div>

      <div class="hero-matchup">
        <div class="hero-team">
          <div class="hero-flag">${D.homeFlag || '🏳'}</div>
          <div class="hero-name">${escHtml(D.home || '')}</div>
          <div class="hero-elo">Elo ${safe(D.homeElo,'—')}</div>
        </div>

        <div class="hero-center">
          <div class="donut">
            ${buildDonut(pH, pD, pA)}
            <div class="donut-inner">
              <span class="donut-pct">${pH != null ? pH + '%' : '—'}</span>
              <span class="donut-lbl">Heim</span>
            </div>
          </div>
          <div class="hero-vs">vs</div>
          <div class="hero-time">${heroDate}</div>
          ${(()=>{
            // Model-Delta: zeigt Differenz Modell vs Markt wenn beide vorhanden
            if (D.modHome != null && D.probHome != null) {
              const delta = Math.round(D.modHome - D.probHome);
              if (Math.abs(delta) >= 2) {
                const sign  = delta > 0 ? '+' : '';
                const col   = delta > 0 ? 'var(--green)' : 'var(--red)';
                const label = delta > 0 ? 'Modell bullish Heim' : 'Modell bearish Heim';
                return `<div title="${label}" style="font-size:10px;color:${col};letter-spacing:.5px;font-weight:700;margin-top:2px;">${sign}${delta}pp vs Markt</div>`;
              }
            }
            return '';
          })()}</div>

        <div class="hero-team">
          <div class="hero-flag">${D.awayFlag || '🏳'}</div>
          <div class="hero-name">${escHtml(D.away || '')}</div>
          <div class="hero-elo">Elo ${safe(D.awayElo,'—')}</div>
        </div>
      </div>

      <div class="prob-bar">
        <div class="pb-home">
          <span class="pb-pct">${pH != null ? pH + '%' : '—'}</span>
          <span>${escHtml(D.home || '')}</span>
        </div>
        <div class="pb-draw">
          <span class="pb-pct">${pD != null ? pD + '%' : '—'}</span>
          <span style="font-size:9px;display:block;opacity:.7;">Unent.</span>
        </div>
        <div class="pb-away">
          <span>${escHtml(D.away || '')}</span>
          <span class="pb-pct">${pA != null ? pA + '%' : '—'}</span>
        </div>
      </div>
    </section>

    ${D.venue ? `
    <div class="venue-strip">
      <span class="venue-ico">🏟️</span>
      <span>${escHtml(D.venue)}</span>
    </div>` : ''}

    ${renderEnvironment(D)}
    ${renderDecisionStrip(D)}
    ${renderPicks(D)}
    ${renderEngineFlow(D)}
    ${renderOdds(D)}
    ${renderSignal(D)}
    ${renderPoly(D)}
    ${renderEloXg(D)}
    ${renderForm(D)}
    ${renderContext(D)}
    ${renderAI(D)}
    ${renderInsights(D)}
    ${renderH2h(D)}
    ${renderGroup(D)}
    ${renderPlayerBets(D)}

    <div class="page-footer">
      <div class="pf-brand">CocoBet</div>
      <div class="pf-meta">
        WM 2026 · ${escHtml(D.groupName || D.group || '')} · Spieltag ${safe(D.matchday,'?')}<br>
        Generiert: ${safe(D.generatedAt,'—')}<br>
        18+ · Verantwortungsbewusst spielen
      </div>
      <a class="pf-back" href="../betting-dashboard.html">← Zurück zum Dashboard</a>
    </div>

    ${renderStickyBar(D)}
  `;

  document.getElementById('app').innerHTML = html;

  // async: inject live weather + recompute modifiers
  const _venue = lookupVenue(D.venue || D.venueCity || '');
  if (_venue && D.date) injectWeather(_venue, D.date);
}

/* ── Error state ─────────────────────────────────────────── */
function renderError(msg) {
  document.getElementById('app').innerHTML = `
    <div class="error-box">
      <h2>Fehler beim Laden</h2>
      <p>${escHtml(String(msg))}</p>
      <p style="margin-top:10px;">
        <a href="../betting-dashboard.html" style="color:var(--blue);font-size:12px;">← Zurück zum Dashboard</a>
      </p>
    </div>`;
}

/* ── Boot ────────────────────────────────────────────────── */
window._wmTravelBurden = null;

// Cache-Buster auf alle lokalen JSON-Fetches damit GitHub Pages CDN bzw.
// Browser-Disk-Cache nicht stale Picks/Form/Squad-Daten serviert.
// Bug-Fix 07.06.2026: vorher kein ?t=... → Reload zeigte oft alten Stand.
var __cb = '?t=' + Date.now();

// Load travel burden data in background (non-blocking)
fetch('../wm_travel_burden.json' + __cb)
  .then(r => r.ok ? r.json() : null)
  .then(tb => {
    if (tb) window._wmTravelBurden = tb;
  })
  .catch(() => {});

if (!slug) {
  renderError('Kein Spiel-Slug in der URL angegeben. Bitte ?m=wm-xxx-vs-yyy-DATUM verwenden.');
} else {
  fetch('data/' + slug + '.json' + __cb)
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status + ' – ' + r.statusText);
      return r.json();
    })
    .then(function(D) { render(D); })
    .catch(function(err) { renderError(err.message || String(err)); });
}
</script>
