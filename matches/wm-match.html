<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05080f">
<title id="page-title">WM 2026 · CocoBet</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   RESET & VARIABLES
═══════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#f5c518;--green:#22c55e;--red:#ef4444;--blue:#38bdf8;
  --orange:#f97316;--purple:#a78bfa;
  --bg:#05080f;--surface:#0c1018;--card:#111827;--card2:#141d2b;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#f0f4ff;--sub:#6b7a99;--muted:#1e293b;
}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
  max-width:800px;margin:0 auto;
}

/* ── TOPBAR ── */
.topbar{
  position:sticky;top:0;z-index:200;
  background:rgba(5,8,15,.92);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  height:48px;display:flex;align-items:center;
  padding:0 16px;gap:12px;
}
.tb-back{
  display:flex;align-items:center;gap:5px;
  font-size:12px;color:var(--sub);letter-spacing:.5px;
  text-decoration:none;transition:color .2s;
}
.tb-back:hover{color:var(--text);}
.tb-badge{
  margin-left:auto;
  background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.25);
  color:var(--gold);font-size:10px;font-weight:800;
  letter-spacing:1.5px;text-transform:uppercase;
  padding:4px 12px;border-radius:100px;
  display:flex;align-items:center;gap:6px;
}
.tb-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold);animation:tbpulse 2s ease-in-out infinite;}
@keyframes tbpulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.tb-spieltag{font-size:11px;color:var(--sub);letter-spacing:1px;white-space:nowrap;}

/* ── HERO ── */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(170deg,#0a1a0a 0%,#05080f 40%,#0a0515 100%);
  padding:28px 20px 0;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 50%,rgba(34,197,94,.08) 0%,transparent 70%),
    radial-gradient(ellipse 60% 50% at 80% 50%,rgba(239,68,68,.07) 0%,transparent 70%);
  pointer-events:none;
}
.hero-bg-word{
  position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
  font-family:'Bebas Neue',sans-serif;font-size:140px;
  color:rgba(255,255,255,.022);letter-spacing:8px;
  white-space:nowrap;pointer-events:none;line-height:1;
}
.hero-matchup{
  position:relative;z-index:2;
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:12px;
  animation:fadeUp .6s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.hero-team{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
.hero-flag{font-size:48px;line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5));}
.hero-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:30px;letter-spacing:2px;color:#fff;line-height:1;
}
.hero-elo{
  font-size:10px;color:var(--sub);letter-spacing:1.5px;
  text-transform:uppercase;
}
.hero-center{display:flex;flex-direction:column;align-items:center;gap:6px;}
/* DONUT */
.donut{position:relative;width:80px;height:80px;}
.donut svg{width:80px;height:80px;transform:rotate(-90deg);}
.dt{fill:none;stroke:rgba(255,255,255,.07);stroke-width:7;}
.donut-inner{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.donut-pct{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;line-height:1;}
.donut-lbl{font-size:8px;color:var(--sub);letter-spacing:1px;text-transform:uppercase;}
.hero-vs{
  font-family:'Instrument Serif',serif;font-style:italic;
  font-size:14px;color:#333;letter-spacing:2px;
}
.hero-time{font-size:9px;color:var(--sub);letter-spacing:1px;text-transform:uppercase;text-align:center;}
/* PROB BAR */
.prob-bar{
  position:relative;z-index:2;
  margin:16px 0 0;
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:0;
  border-radius:0;overflow:hidden;
  animation:fadeUp .6s .15s ease both;
}
.pb-home,.pb-away{
  padding:9px 14px;display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:800;
}
.pb-home{background:rgba(34,197,94,.12);color:#22c55e;justify-content:flex-start;}
.pb-away{background:rgba(239,68,68,.1);color:#ef4444;justify-content:flex-end;}
.pb-draw{
  background:rgba(245,197,24,.09);color:var(--gold);
  padding:9px 12px;font-size:11px;font-weight:700;
  text-align:center;white-space:nowrap;
}
.pb-pct{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;}

/* venue strip */
.venue-strip{
  background:rgba(255,255,255,.03);
  border-top:1px solid var(--border);
  padding:8px 20px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:10px;color:var(--sub);letter-spacing:.5px;
  position:relative;z-index:2;
}
.venue-ico{font-size:13px;}

/* ── SECTION ── */
.section{padding:14px 16px 0;}
.sec-head{
  display:flex;align-items:center;gap:10px;
  padding-bottom:10px;margin-bottom:12px;
  border-bottom:1px solid var(--border);
}
.sec-ico{font-size:15px;}
.sec-title{font-size:9px;color:var(--sub);letter-spacing:2.5px;text-transform:uppercase;font-weight:700;}
.sec-tag{
  margin-left:auto;font-size:8px;font-weight:800;
  padding:2px 9px;border-radius:100px;letter-spacing:1px;text-transform:uppercase;
}
.sec-tag.gold{background:rgba(245,197,24,.12);color:var(--gold);border:1px solid rgba(245,197,24,.22);}
.sec-tag.green{background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.22);}
.sec-tag.blue{background:rgba(56,189,248,.1);color:var(--blue);border:1px solid rgba(56,189,248,.2);}
.sec-tag.gray{background:rgba(255,255,255,.06);color:#888;border:1px solid rgba(255,255,255,.1);}

/* ── BOX ── */
.box{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:16px;margin-bottom:10px;
  animation:fadeUp .5s ease both;
}

/* ── KONTEXT-CARDS ── */
.ctx-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.ctx-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;
}
.ctx-lbl{font-size:8px;color:var(--sub);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px;}
.ctx-val{font-size:15px;font-weight:800;color:var(--text);}
.ctx-sub{font-size:10px;color:var(--sub);margin-top:2px;}
.venue-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;
  display:flex;align-items:center;gap:10px;
  margin-bottom:10px;
}
.venue-card-ico{font-size:20px;}
.venue-card-name{font-size:13px;font-weight:700;color:var(--text);}
.venue-card-sub{font-size:10px;color:var(--sub);}
.host-bonus{
  background:linear-gradient(90deg,rgba(245,197,24,.1),rgba(245,197,24,.03));
  border:1px solid rgba(245,197,24,.22);
  border-radius:8px;padding:9px 14px;
  display:flex;align-items:center;gap:8px;
  font-size:11px;color:var(--gold);font-weight:700;
  margin-bottom:10px;
}

/* ── AI ANALYSE ── */
.ai-box{
  background:linear-gradient(135deg,rgba(56,189,248,.07),rgba(167,139,250,.05));
  border:1px solid rgba(56,189,248,.15);
  border-radius:12px;padding:16px;margin-bottom:10px;
  animation:fadeUp .5s .1s ease both;
}
.ai-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.ai-badge{
  font-size:8px;font-weight:800;color:var(--blue);letter-spacing:2px;text-transform:uppercase;
  background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.2);
  padding:3px 10px;border-radius:100px;
}
.ai-title{
  font-family:'Instrument Serif',serif;font-style:italic;
  font-size:16px;color:#fff;
}
.ai-text{font-size:12px;color:#8899bb;line-height:1.7;white-space:pre-wrap;}
.ai-text strong{color:#bbc8e0;}

/* DATA PILLS */
.data-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.dp{font-size:9px;font-weight:700;padding:3px 9px;border-radius:100px;letter-spacing:.5px;}
.dp.g{background:rgba(34,197,94,.1);color:#22c55e;border:1px solid rgba(34,197,94,.2);}
.dp.b{background:rgba(56,189,248,.1);color:var(--blue);border:1px solid rgba(56,189,248,.18);}
.dp.o{background:rgba(249,115,22,.1);color:var(--orange);border:1px solid rgba(249,115,22,.18);}
.dp.gray{background:rgba(255,255,255,.06);color:#888;border:1px solid rgba(255,255,255,.1);}

/* ── THE PICK ── */
.pick-hero{
  background:linear-gradient(135deg,rgba(34,197,94,.13),rgba(34,197,94,.04));
  border:1px solid rgba(34,197,94,.3);
  border-radius:14px;padding:18px 16px;
  margin-bottom:10px;
  position:relative;overflow:hidden;
  animation:fadeUp .5s .15s ease both;
}
.pick-hero::before{
  content:'BET';
  position:absolute;right:-8px;top:-8px;
  font-family:'Bebas Neue',sans-serif;font-size:80px;
  color:rgba(34,197,94,.06);letter-spacing:2px;
  pointer-events:none;line-height:1;
}
.ph-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px;}
.ph-badges{display:flex;align-items:center;gap:5px;margin-bottom:8px;flex-wrap:wrap;}
.ph-badge{
  font-size:8px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  padding:3px 9px;border-radius:100px;
}
.ph-badge.bet{background:rgba(34,197,94,.2);color:#22c55e;border:1px solid rgba(34,197,94,.35);}
.ph-badge.abwaegen{background:rgba(249,115,22,.15);color:var(--orange);border:1px solid rgba(249,115,22,.3);}
.ph-badge.stars{background:rgba(255,255,255,.06);color:#aaa;border:1px solid rgba(255,255,255,.1);}
.ph-badge.edge{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.25);}
.ph-name{
  font-family:'Bebas Neue',sans-serif;font-size:32px;
  color:#fff;letter-spacing:2px;line-height:1;margin-bottom:5px;
}
.ph-detail{font-size:11px;color:#668866;}
.ph-detail strong{color:#aaccaa;}
.ph-odds-block{text-align:right;flex-shrink:0;}
.ph-odds{
  font-family:'Bebas Neue',sans-serif;font-size:52px;
  color:#22c55e;letter-spacing:1px;line-height:1;
  text-shadow:0 0 30px rgba(34,197,94,.3);
}
.ph-conf{font-size:9px;color:#446644;text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.signal-bar{
  display:flex;align-items:center;gap:0;
  background:rgba(255,255,255,.04);border-radius:6px;overflow:hidden;
  margin-bottom:10px;
}
.sb-seg{
  flex:1;padding:6px 8px;text-align:center;font-size:9px;font-weight:700;
  letter-spacing:.5px;border-right:1px solid rgba(255,255,255,.06);
}
.sb-seg:last-child{border-right:none;}
.sb-seg .sb-lbl{color:var(--sub);font-size:8px;display:block;margin-bottom:2px;}
.sb-seg .sb-val{color:var(--text);}
.sb-seg.green .sb-val{color:#22c55e;}
.sb-seg.blue .sb-val{color:var(--blue);}
.sb-seg.orange .sb-val{color:var(--orange);}
.model-bar-wrap{margin-bottom:12px;}
.model-bar-labels{display:flex;justify-content:space-between;margin-bottom:4px;}
.model-bar-lbl{font-size:9px;color:var(--sub);letter-spacing:1px;}
.model-bar{height:6px;background:rgba(255,255,255,.07);border-radius:100px;overflow:hidden;position:relative;margin-bottom:4px;}
.mb-model{height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);border-radius:100px;position:absolute;top:0;left:0;}
.mb-market{height:100%;background:rgba(255,255,255,.2);border-radius:100px;position:absolute;top:0;left:0;}
.ph-rationale{
  font-size:11px;color:#668866;line-height:1.6;
  border-top:1px solid rgba(34,197,94,.1);padding-top:10px;margin-top:8px;
}
.ph-rationale strong{color:#aaccaa;}
.bet-btn{
  width:100%;margin-top:12px;
  padding:14px;border-radius:10px;border:none;
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:800;
  letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;
  background:linear-gradient(90deg,#22c55e,#16a34a);
  color:#000;transition:all .2s;
  box-shadow:0 4px 20px rgba(34,197,94,.25);
}
.bet-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(34,197,94,.35);}
.pick-sec{
  background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:8px;
  animation:fadeUp .5s .2s ease both;
}
.ps-badge{font-size:8px;font-weight:800;letter-spacing:1px;margin-bottom:4px;}
.ps-badge.bet{color:var(--green);}
.ps-badge.abwaegen{color:var(--orange);}
.ps-name{font-size:13px;font-weight:700;color:#ccc;}
.ps-detail{font-size:10px;color:var(--sub);}
.ps-odds{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--orange);letter-spacing:1px;}

/* ── ODDS + SHARP RADAR ── */
.odds-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
.odds-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:12px 10px;text-align:center;
  transition:all .2s;
}
.odds-card.highlight{
  background:rgba(34,197,94,.08);
  border-color:rgba(34,197,94,.3);
}
.oc-outcome{font-size:9px;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;}
.oc-odds{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fff;line-height:1;}
.odds-card.highlight .oc-odds{color:#22c55e;}
.oc-impl{font-size:9px;color:var(--sub);margin-top:3px;}
.oc-arrow{font-size:9px;margin-left:2px;}
.oc-arrow.up{color:#22c55e;}
.oc-arrow.down{color:#ef4444;}
.odds-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.sharp-row{
  display:grid;grid-template-columns:90px 1fr 70px;
  align-items:center;gap:10px;
  padding:8px 0;border-bottom:1px solid var(--border);
}
.sharp-row:last-child{border-bottom:none;}
.sr-market{font-size:11px;font-weight:700;color:#aaa;}
.sr-bar-wrap{height:5px;background:rgba(255,255,255,.06);border-radius:100px;overflow:hidden;position:relative;}
.sr-bar{height:100%;border-radius:100px;position:absolute;}
.sr-bar.stable{background:rgba(255,255,255,.2);width:50%;}
.sr-bar.sharp-in{background:linear-gradient(90deg,#22c55e,#16a34a);}
.sr-bar.sharp-out{background:linear-gradient(90deg,#ef4444,#b91c1c);right:0;}
.sr-change{text-align:right;font-size:11px;font-weight:700;}
.sr-change.up{color:#22c55e;}
.sr-change.down{color:#ef4444;}
.sr-change.flat{color:var(--sub);}
.sr-current{font-family:'Bebas Neue',sans-serif;font-size:14px;display:block;}
.sr-move{font-size:9px;display:block;}
.sharp-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.22);
  border-radius:6px;padding:5px 10px;
  font-size:10px;font-weight:700;color:#22c55e;
  margin-bottom:10px;
}
.live-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;box-shadow:0 0 5px #22c55e;animation:tbpulse 1.8s ease-in-out infinite;}

/* ── ELO + xG ── */
.elo-matchup{
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:8px;margin-bottom:10px;
}
.em-team{display:flex;flex-direction:column;gap:3px;}
.em-team.right{align-items:flex-end;text-align:right;}
.em-name{font-size:12px;font-weight:700;color:#aaa;letter-spacing:.5px;}
.em-elo{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fff;line-height:1;}
.em-vs{font-size:10px;color:#333;font-weight:700;letter-spacing:2px;}
.xg-bar-section{margin-bottom:10px;}
.xg-lbl{font-size:9px;color:var(--sub);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;}
.xg-bar-wrap{display:flex;align-items:center;gap:8px;}
.xg-val{font-family:'Bebas Neue',sans-serif;font-size:16px;color:#fff;width:36px;flex-shrink:0;}
.xg-val.right{text-align:right;}
.xg-track{flex:1;height:7px;background:rgba(255,255,255,.07);border-radius:100px;overflow:hidden;display:flex;}
.xg-home-bar{height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);border-radius:100px;}
.xg-away-bar{height:100%;background:linear-gradient(90deg,#ef4444,#b91c1c);border-radius:100px;margin-left:auto;}

/* ── FORM ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.form-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;}
.form-team{font-size:11px;font-weight:700;color:#aaa;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.form-dots{display:flex;gap:4px;}
.fd{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;}
.fd.w{background:rgba(34,197,94,.15);color:#22c55e;}
.fd.d{background:rgba(255,255,255,.07);color:#666;}
.fd.l{background:rgba(239,68,68,.15);color:#ef4444;}
.form-stats{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.fs{font-size:9px;color:var(--sub);}
.fs strong{color:#aaa;}

/* ── H2H ── */
.h2h-bar{display:flex;height:8px;border-radius:100px;overflow:hidden;margin:8px 0 6px;}
.h2h-home{background:linear-gradient(90deg,#22c55e,#16a34a);height:100%;}
.h2h-draw{background:rgba(255,255,255,.18);height:100%;}
.h2h-away{background:linear-gradient(90deg,#ef4444,#b91c1c);height:100%;}
.h2h-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--sub);}
.h2h-stats{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;}
.hs{font-size:9px;color:var(--sub);}
.hs strong{color:#aaa;}

/* ── GRUPPE ── */
.gruppe-table{width:100%;border-collapse:collapse;}
.gt-head th{
  font-size:8px;color:var(--sub);letter-spacing:1.5px;text-transform:uppercase;
  padding:5px 8px;text-align:left;border-bottom:1px solid var(--border);
}
.gt-head th:not(:first-child){text-align:right;}
.gt-row td{
  padding:9px 8px;font-size:12px;color:#ccc;
  border-bottom:1px solid var(--border);
}
.gt-row:last-child td{border-bottom:none;}
.gt-row td:not(:first-child){text-align:right;font-family:'Bebas Neue',sans-serif;font-size:14px;color:#fff;}
.gt-row.highlight td{color:#fff;}
.gt-row.highlight td:first-child{color:#22c55e;font-weight:700;}
.gt-team{display:flex;align-items:center;gap:7px;}
.gt-flag{font-size:16px;}
.gt-elo{font-size:9px;color:var(--sub);}

/* ── BET INSIGHTS ── */
.insights-list{display:flex;flex-direction:column;gap:7px;margin-bottom:4px;}
.insight-row{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--border);
  border-radius:9px;padding:10px 14px;
  animation:fadeUp .4s ease both;
}
.insight-icon{font-size:18px;flex-shrink:0;width:24px;text-align:center;}
.insight-text{font-size:12px;color:#c8d8e0;line-height:1.4;flex:1;}
.insight-row.streak .insight-text{color:#d4edd4;}

<body>

<div id="app">
  <div class="loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-text">Lade Spieldaten…</div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  WM MATCH PAGE  ·  Dynamic Renderer
//  Loads: data/{slug}.json  where slug = ?m= URL param
// ═══════════════════════════════════════════════════════════

const params = new URLSearchParams(location.search);
const slug   = params.get('m') || '';

/* ── Utility helpers ─────────────────────────────────────── */
function safe(v, fallback) {
  fallback = fallback !== undefined ? fallback : '—';
  return (v !== null && v !== undefined && v !== '') ? v : fallback;
}
function escHtml(s) {
  if (typeof s !== 'string') return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtOdds(v) {
  if (v === null || v === undefined || v === '') return '—';
  return parseFloat(v).toFixed(2);
}
function impliedProb(odds) {
  if (!odds || parseFloat(odds) <= 0) return '—';
  return (100 / parseFloat(odds)).toFixed(1);
}
function fmtDate(d) {
  if (!d) return '—';
  const p = String(d).split('-');
  if (p.length === 3) return p[2] + '.' + p[1] + '.' + p[0].slice(-2);
  return d;
}
function starsStr(n) {
  if (!n || n < 1) return '';
  return '★'.repeat(Math.min(5, Math.max(1, parseInt(n))));
}
function starsFromConf(conf) {
  if (!conf) return 0;
  const c = String(conf).toLowerCase();
  if (c === 'high')   return 5;
  if (c === 'medium') return 3;
  if (c === 'low')    return 1;
  return 0;
}
function signStr(v) {
  if (v === null || v === undefined) return '—';
  const n = parseFloat(v);
  return (n > 0 ? '+' : '') + n.toFixed(1);
}

/* ── Donut SVG builder ───────────────────────────────────── */
function buildDonut(pH, pD, pA) {
  const R = 32;
  const C = 2 * Math.PI * R; // ~201.06

  if (pH == null) {
    return '<svg viewBox="0 0 80 80"><circle class="dt" cx="40" cy="40" r="32"/></svg>';
  }

  const hF = parseFloat(pH) / 100;
  const dF = parseFloat(pD || 0) / 100;
  const aF = parseFloat(pA || 0) / 100;

  const hLen = hF * C;
  const dLen = dF * C;
  const aLen = aF * C;

  const dRot = hF * 360;
  const aRot = (hF + dF) * 360;

  return `
    <svg viewBox="0 0 80 80" style="transform:rotate(-90deg);">
      <circle class="dt" cx="40" cy="40" r="${R}"/>
      <circle style="fill:none;stroke:#22c55e;stroke-width:7;stroke-linecap:round;stroke-dasharray:${C.toFixed(2)};stroke-dashoffset:${(C - hLen).toFixed(2)};filter:drop-shadow(0 0 5px #22c55e);" cx="40" cy="40" r="${R}"/>
      <circle style="fill:none;stroke:#f5c518;stroke-width:7;stroke-linecap:round;stroke-dasharray:${C.toFixed(2)};stroke-dashoffset:${(C - dLen).toFixed(2)};" cx="40" cy="40" r="${R}" transform="rotate(${dRot.toFixed(2)} 40 40)"/>
      <circle style="fill:none;stroke:#ef4444;stroke-width:7;stroke-linecap:round;stroke-dasharray:${C.toFixed(2)};stroke-dashoffset:${(C - aLen).toFixed(2)};" cx="40" cy="40" r="${R}" transform="rotate(${aRot.toFixed(2)} 40 40)"/>
    </svg>`;
}

/* ── Tournament Context section ──────────────────────────── */
function renderContext(D) {
  const teamNames = (D.homeTeams || []).map(t => escHtml(t.name || t.id)).join(' · ');
  return `
    <div class="section">
      <div class="sec-head">
        <span class="sec-ico">🏆</span>
        <span class="sec-title">Turnier-Kontext</span>
        <span class="sec-tag gold">WM 2026</span>
      </div>

      <div class="ctx-grid">
        <div class="ctx-card">
          <div class="ctx-lbl">Gruppe</div>
          <div class="ctx-val">${escHtml(D.groupName || D.group || '—')}</div>
          ${teamNames ? `<div class="ctx-sub">${teamNames}</div>` : ''}
        </div>
        <div class="ctx-card">
          <div class="ctx-lbl">Spieltag</div>
          <div class="ctx-val">${safe(D.matchday, '?')} / 3</div>
          <div class="ctx-sub">Gruppenphase</div>
        </div>
        <div class="ctx-card">
          <div class="ctx-lbl">Datum</div>
          <div class="ctx-val">${fmtDate(D.date)}</div>
        </div>
        <div class="ctx-card">
          <div class="ctx-lbl">Anstoss</div>
          <div class="ctx-val">${safe(D.time, '—')}</div>
          <div class="ctx-sub">Lokalzeit</div>
        </div>
      </div>

      ${D.venue ? `
      <div class="venue-card">
        <div class="venue-card-ico">🏟️</div>
        <div>
          <div class="venue-card-name">${escHtml(D.venue)}</div>
          <div class="venue-card-sub">Spielort</div>
        </div>
      </div>` : ''}

      ${D.coHostBonus ? `
      <div class="host-bonus">
        🏠 Co-Host-Bonus: ${escHtml(D.coHostTeam || D.home || '')} spielt im Heimstadion — signifikanter Heimvorteil einberechnet
      </div>` : ''}
    </div>`;
}

/* ── Bet Insights section ────────────────────────────────── */
function renderInsights(D) {
  const items = D.betInsights;
  if (!items || items.length === 0) return '';

  const rows = items.map((it, i) => `
    <div class="insight-row ${it.type || ''}" style="animation-delay:${i * 0.06}s;">
      <span class="insight-icon">${escHtml(it.icon || '•')}</span>
      <span class="insight-text">${escHtml(it.text || '')}</span>
    </div>`).join('');

  return `
    <div class="section">
      <div class="sec-head">
        <span class="sec-ico">💡</span>
        <span class="sec-title">Bet Insights</span>
        <span class="sec-tag blue">CocoBet Analyse</span>
      </div>
      <div class="insights-list">${rows}</div>
      <div style="font-size:9px;color:#1a2a3a;margin-top:2px;margin-bottom:10px;">Basierend auf Formdaten &amp; Direktbegegnungen · Automatisch generiert</div>
    </div>`;
}

/* ── AI Analysis section ─────────────────────────────────── */
function renderAI(D) {
  if (!D.aiPreview) return '';
  return `
    <div class="section">
      <div class="sec-head">
        <span class="sec-ico">🤖</span>
        <span class="sec-title">CocoBet Analyse</span>
        <span class="sec-tag blue">KI-Analyse</span>
      </div>
      <div class="ai-box">
        <div class="ai-header">
          <span class="ai-badge">AI Powered</span>
          <span class="ai-title">${escHtml(D.home || '')} vs ${escHtml(D.away || '')}</span>
        </div>
        <div class="ai-text">${escHtml(D.aiPreview)}</div>
        <div class="data-pills">
          ${D.eloDiff != null ? `<span class="dp g">Elo ${D.eloDiff >= 0 ? '+' : ''}${Math.round(D.eloDiff)}</span>` : ''}
          ${(D.xgHome != null && D.xgAway != null) ? `<span class="dp b">xG ${D.xgHome}:${D.xgAway}</span>` : ''}
          ${D.coHostBonus ? `<span class="dp o">Co-Host-Heimvorteil</span>` : ''}
          ${D.probHome != null ? `<span class="dp gray">Markt ${D.probHome}% Heim</span>` : ''}
        </div>
      </div>
    </div>`;
}

/* ── Picks section ───────────────────────────────────────── */
function renderPicks(D) {
  const picks = D.picks || [];
  if (picks.length === 0) return '';

  const betPicks = picks.filter(p => p.verdict === 'BET');
  const abwPicks = picks.filter(p => p.verdict === 'ABWÄGEN');

  const primary = betPicks[0] || abwPicks[0] || null;
  if (!primary) return '';

  const isBet         = primary.verdict === 'BET';
  const badgeClass    = isBet ? 'bet' : 'abwaegen';
  const badgeLabel    = isBet ? '⚡ BET' : '📈 ABWÄGEN';
  const tagClass      = isBet ? 'green' : 'gold';
  const tagLabel      = isBet ? 'BET' : 'ABWÄGEN';

  // edge string (field is edgePP, not edge)
  const edgePp = primary.edgePP != null ? parseFloat(primary.edgePP) : null;
  const edgeStr = edgePp != null ? (edgePp >= 0 ? '+' : '') + edgePp.toFixed(1) + 'pp' : '';
  // stars derived from conf field
  const primaryStars = starsFromConf(primary.conf);

  const fairVal = primary.fairValue ? parseFloat(primary.fairValue).toFixed(2) : null;

  // Model vs Market bar for this pick's market
  let modPct = null, mktPct = null;
  const mktLow = (primary.market || '').toLowerCase();
  if (mktLow.includes('heim') || mktLow.includes('home') || mktLow === '1') {
    modPct = D.modHome;  mktPct = D.probHome;
  } else if (mktLow.includes('auswärts') || mktLow.includes('away') || mktLow === '2') {
    modPct = D.modAway;  mktPct = D.probAway;
  } else if (mktLow.includes('unentsch') || mktLow.includes('draw') || mktLow === 'x') {
    modPct = D.modDraw;  mktPct = D.probDraw;
  }

  let modelBarHtml = '';
  if (modPct != null && mktPct != null) {
    const topV = Math.max(parseFloat(modPct), parseFloat(mktPct), 10);
    const mW   = Math.min(100, (parseFloat(modPct) / topV * 100)).toFixed(1);
    const kW   = Math.min(100, (parseFloat(mktPct) / topV * 100)).toFixed(1);
    modelBarHtml = `
      <div class="model-bar-wrap">
        <div class="model-bar-labels">
          <span class="model-bar-lbl">Modell-Wahrsch.</span>
          <span class="model-bar-lbl">Markt-Impl.</span>
        </div>
        <div class="model-bar" style="height:6px;">
          <div class="mb-model" style="width:${mW}%;"></div>
          <div class="mb-market" style="width:${kW}%;opacity:.45;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:3px;">
          <span style="font-size:10px;color:#22c55e;font-weight:700;">${modPct}% Modell</span>
          <span style="font-size:10px;color:#888;">${mktPct}% Markt</span>
        </div>
      </div>`;
  }

  // Secondary picks: remaining BETs, then ABWÄGEN (up to 3)
  const secBet  = isBet ? betPicks.slice(1) : betPicks;
  const secAbw  = isBet ? abwPicks : abwPicks.slice(1);
  const secList = [...secBet, ...secAbw].slice(0, 4);

  let secHtml = '';
  for (const sp of secList) {
    const spVerdict = sp.verdict === 'BET' ? 'bet' : 'abwaegen';
    const spLabel   = sp.verdict === 'BET' ? '📈 BET' : '📊 ABWÄGEN';
    const spEdge    = sp.edgePP != null ? (parseFloat(sp.edgePP) >= 0 ? '+' : '') + parseFloat(sp.edgePP).toFixed(1) + 'pp' : '';
    const spFV      = sp.fairValue ? 'FV ' + parseFloat(sp.fairValue).toFixed(2) : '';

/* ── Odds & Sharp Radar section ──────────────────────────── */
function renderOdds(D) {
  if (!D.odds) return '';
  const o    = D.odds;
  const hist = D.oddsHistory || [];

  // Determine which outcome to highlight based on top BET pick
  const betPick = (D.picks || []).find(p => p.verdict === 'BET');
  const mktLow  = betPick ? (betPick.market || '').toLowerCase() : '';
  const hlHome  = mktLow.includes('heim') || mktLow.includes('home');
  const hlDraw  = mktLow.includes('unentsch') || mktLow.includes('draw');
  const hlAway  = mktLow.includes('auswärts') || mktLow.includes('away');

  // Cumulative shifts from oddsHistory
  let homeShift = 0, drawShift = 0, awayShift = 0;
  if (hist.length >= 2) {
    // Compute draw shift from opening vs current implied prob
    const first = hist[0], last = hist[hist.length - 1];
    const drFirst = first.dr && first.dr > 0 ? 100 / first.dr : null;
    const drLast  = last.dr  && last.dr  > 0 ? 100 / last.dr  : null;
    drawShift = (drFirst != null && drLast != null)
      ? Math.round((drLast - drFirst) * 10) / 10 : 0;
    hist.forEach(e => {
      homeShift += (e.hwShift || 0);
      awayShift += (e.awShift || 0);
    });
    homeShift = Math.round(homeShift * 10) / 10;
    awayShift = Math.round(awayShift * 10) / 10;
  }

  function arrowTag(shift) {
    if (Math.abs(shift) < 0.1) return '';
    return shift > 0
      ? '<span class="oc-arrow up">↑</span>'
      : '<span class="oc-arrow down">↓</span>';
  }
  function barClass(shift) {
    if (Math.abs(shift) < 0.3) return 'stable';
    return shift > 0 ? 'sharp-in' : 'sharp-out';
  }
  function barWidth(shift) {
    return Math.min(88, 50 + Math.abs(shift) * 8);
  }
  function changeClass(shift) {
    if (Math.abs(shift) < 0.1) return 'flat';
    return shift > 0 ? 'up' : 'down';
  }
  function ppStr(shift) {
    if (Math.abs(shift) < 0.05) return '0.0pp';
    return (shift > 0 ? '+' : '') + shift.toFixed(1) + 'pp';
  }

  const snapCount = hist.length;
  const openLine  = snapCount > 0 && hist[0].hw
    ? `Open ${fmtOdds(hist[0].hw)} / ${fmtOdds(hist[0].dr)} / ${fmtOdds(hist[0].aw)}`
    : 'Kein Opening-Snapshot';

  // Secondary markets
  let secondaryHtml = '';
  if (o.over25 || o.under25 || o.btts) {
    secondaryHtml = '<div class="odds-grid-2">';
    if (o.over25) {
      secondaryHtml += `
        <div class="odds-card">
          <div class="oc-outcome">Over 2.5</div>
          <div class="oc-odds">${fmtOdds(o.over25)}</div>
          <div class="oc-impl">→ ${impliedProb(o.over25)}% impl.</div>
        </div>`;
    }
    if (o.btts) {
      secondaryHtml += `
        <div class="odds-card">
          <div class="oc-outcome">BTTS Ja</div>
          <div class="oc-odds">${fmtOdds(o.btts)}</div>
          <div class="oc-impl">→ ${impliedProb(o.btts)}% impl.</div>
        </div>`;
    }
    if (o.under25) {
      secondaryHtml += `
        <div class="odds-card">
          <div class="oc-outcome">Under 2.5</div>
          <div class="oc-odds">${fmtOdds(o.under25)}</div>
          <div class="oc-impl">→ ${impliedProb(o.under25)}% impl.</div>
        </div>`;
    }
    secondaryHtml += '</div>';
  }

  return `
    <div class="section">
      <div class="sec-head">
        <span class="sec-ico">📡</span>
        <span class="sec-title">Quoten &amp; Sharp Radar</span>
        <span class="sec-tag green"><span class="live-dot"></span>&nbsp;Live</span>
      </div>

      <div class="odds-grid">
        <div class="odds-card ${hlHome ? 'highlight' : ''}">
          <div class="oc-outcome">Heimsieg${hlHome ? ' ★' : ''}</div>
          <div class="oc-odds">${fmtOdds(o.home)}${arrowTag(homeShift)}</div>
          <div class="oc-impl">→ ${impliedProb(o.home)}% impl.</div>
        </div>
        <div class="odds-card ${hlDraw ? 'highlight' : ''}">
          <div class="oc-outcome">Unentsch.${hlDraw ? ' ★' : ''}</div>
          <div class="oc-odds">${fmtOdds(o.draw)}</div>
          <div class="oc-impl">→ ${impliedProb(o.draw)}% impl.</div>
        </div>
        <div class="odds-card ${hlAway ? 'highlight' : ''}">
          <div class="oc-outcome">Auswärts${hlAway ? ' ★' : ''}</div>
          <div class="oc-odds">${fmtOdds(o.away)}${arrowTag(awayShift)}</div>
          <div class="oc-impl">→ ${impliedProb(o.away)}% impl.</div>
        </div>
      </div>

      ${secondaryHtml}

      <div class="box">
        <div class="sharp-badge"><span class="live-dot"></span>&nbsp;${escHtml(openLine)} · ${snapCount} Snapshot${snapCount !== 1 ? 's' : ''}</div>
        <div class="sharp-row">
          <div class="sr-market">Heimsieg</div>
          <div class="sr-bar-wrap"><div class="sr-bar ${barClass(homeShift)}" style="width:${barWidth(homeShift)}%;"></div></div>
          <div class="sr-change ${changeClass(homeShift)}">
            <span class="sr-current">${fmtOdds(o.home)}</span>
            <span class="sr-move">${ppStr(homeShift)}</span>
          </div>
        </div>
        <div class="sharp-row">
          <div class="sr-market">Unentsch.</div>
          <div class="sr-bar-wrap"><div class="sr-bar ${barClass(drawShift)}" style="width:${barWidth(drawShift)}%;"></div></div>
          <div class="sr-change ${changeClass(drawShift)}">
            <span class="sr-current">${fmtOdds(o.draw)}</span>
            <span class="sr-move">${ppStr(drawShift)}</span>
          </div>
        </div>
        <div class="sharp-row">
          <div class="sr-market">Auswärts</div>
          <div class="sr-bar-wrap"><div class="sr-bar ${barClass(awayShift)}" style="width:${barWidth(awayShift)}%;"></div></div>
          <div class="sr-change ${changeClass(awayShift)}">
            <span class="sr-current">${fmtOdds(o.away)}</span>
            <span class="sr-move">${ppStr(awayShift)}</span>
          </div>
        </div>
        <div style="font-size:9px;color:#333;margin-top:10px;text-align:right;">${snapCount} Snapshot${snapCount !== 1 ? 's' : ''} · Powered by TheOddsAPI</div>
      </div>
    </div>`;
}

                                              `<span style="font-size:9px;background:#2a2a2a;color:#888;border:1px solid #44444466;border-radius:4px;padding:1px 5px;">Poisson-Schätzung</span>`}
          </div>

          </div>
          <div style="display:flex;justify-content:space-between;margin-top:4px;">

/* ── Form section ────────────────────────────────────────── */
function renderForm(D) {
  const hf = D.homeForm;
  const af = D.awayForm;
  if (!hf && !af) return '';

  function formCard(name, flag, f) {
    if (!f) return `
      <div class="form-card">
        <div class="form-team">${flag} ${escHtml(name)}</div>
        <div style="font-size:11px;color:var(--sub);">Keine Form-Daten</div>
      </div>`;

    const last5 = (f.last5 || []).slice(0, 5);
    const dots  = last5.map(r => {
      const c = r === 'W' ? 'w' : r === 'L' ? 'l' : 'd';
      return `<div class="fd ${c}">${r}</div>`;
    }).join('') || '<span style="color:var(--sub);font-size:11px;">—</span>';

    const stats = [
      f.avgScored    != null ? `<span class="fs">Ø Tore: <strong>${parseFloat(f.avgScored).toFixed(1)}</strong></span>` : '',
      f.avgConceded  != null ? `<span class="fs">Ø Geg.: <strong>${parseFloat(f.avgConceded).toFixed(1)}</strong></span>` : '',
      f.games        != null ? `<span class="fs">Sp.: <strong>${f.games}</strong></span>` : '',
      f.over25Rate   != null ? `<span class="fs">O2.5: <strong>${f.over25Rate}%</strong></span>` : '',
      f.bttsRate     != null ? `<span class="fs">BTTS: <strong>${f.bttsRate}%</strong></span>` : '',
    ].filter(Boolean).join('');

    return `
      <div class="form-card">
        <div class="form-team">${flag} ${escHtml(name)}</div>
        <div class="form-dots">${dots}</div>
        ${stats ? `<div class="form-stats">${stats}</div>` : ''}
      </div>`;
  }

  return `
    <div class="section">
      <div class="sec-head">
        <span class="sec-ico">📈</span>
        <span class="sec-title">Form (letzte 5 Spiele)</span>
      </div>
      <div class="form-grid">
        ${formCard(D.home || '', D.homeFlag || '', hf)}
        ${formCard(D.away || '', D.awayFlag || '', af)}
      </div>
    </div>`;
}

/* ── H2H section ─────────────────────────────────────────── */

  const hPct = ((hW / g) * 100).toFixed(0);

    h.bttsRate   != null ? `<span class="hs">BTTS: <strong>${h.bttsRate}%</strong></span>` : '',

  return `
    <div class="section">

/* ── Squad Spotlight section ─────────────────────────────── */
function renderSquads(D) {
  const squads = D.squads;
  if (!squads || Object.keys(squads).length === 0) return '';

  const homeS = squads[D.homeId];
  const awayS = squads[D.awayId];
  if (!homeS && !awayS) return '';

  const posLabel = (pos) => {
    const map = { ST:'Stürmer', CF:'Stürmer', FW:'Stürmer', LW:'Linksaußen', RW:'Rechtsaußen',
                  CAM:'Offensives Mittelfeld', AM:'Angreifer', CM:'Mittelfeld', MF:'Mittelfeld',
                  DM:'Defensives MF', CDM:'Defensives MF', LB:'Linksverteidiger', RB:'Rechtsverteidiger',
                  CB:'Innenverteidiger', DF:'Verteidiger', GK:'Torwart' };
    return map[(pos || '').toUpperCase()] || pos || '';
  };

  const playerCard = (team, flag, player) => {
    if (!player) return '';
    const goals   = player.goals   ?? '—';
    const assists = player.assists  ?? '—';
    const mins    = player.minutes;
    const per90   = (mins && player.goals != null && mins > 0)
      ? (player.goals / (mins / 90)).toFixed(2) : null;
    return `
      <div style="flex:1;min-width:140px;background:var(--bg-alt,rgba(255,255,255,0.04));border:1px solid var(--border,#30363d);border-radius:10px;padding:12px 14px;">
        <div style="font-size:10px;color:var(--muted,#8b949e);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">${escHtml(flag || '')} ${escHtml(team || '')} — Schlüsselspieler</div>
        <div style="font-size:15px;font-weight:800;color:var(--text,#e6edf3);margin-bottom:2px;">${escHtml(player.name || '?')}</div>
        <div style="font-size:11px;color:var(--muted,#8b949e);margin-bottom:8px;">${escHtml(posLabel(player.position))}</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <div style="text-align:center;">
            <div style="font-size:17px;font-weight:900;color:#22c55e;">${goals}</div>
            <div style="font-size:9px;color:var(--muted,#8b949e);text-transform:uppercase;">Tore</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:17px;font-weight:900;color:#60a5fa;">${assists}</div>
            <div style="font-size:9px;color:var(--muted,#8b949e);text-transform:uppercase;">Assists</div>
          </div>
          ${per90 ? `<div style="text-align:center;">
            <div style="font-size:17px;font-weight:900;color:#f0c040;">${per90}</div>
            <div style="font-size:9px;color:var(--muted,#8b949e);text-transform:uppercase;">Tore/90</div>
          </div>` : ''}
          ${mins ? `<div style="text-align:center;">
            <div style="font-size:14px;font-weight:700;color:var(--muted,#8b949e);">${mins}'</div>
            <div style="font-size:9px;color:var(--muted,#8b949e);text-transform:uppercase;">Minuten</div>
          </div>` : ''}
        </div>
      </div>`;
  };

  return `
    <div class="section">
      <div class="sec-head">
        <span class="sec-ico">⭐</span>
        <span class="sec-title">Schlüsselspieler</span>
        <span class="sec-tag gray">Stamm-Spieler</span>

        ${playerCard(D.home, D.homeFlag, homeS)}

      </div>
      <div style="margin-top:8px;font-size:10px;color:var(--muted,#8b949e);">Stats aus letzter Saison (Klub + Nationalteam)</div>
    </div>`;
}

/* ── Signal / Prediction table ───────────────────────────── */
function renderSignal(D) {
  const picks = D.picks || [];
  if (!picks.length && D.modHome == null) return '';

  // Primary verdict
  const bet  = picks.find(p => p.verdict === 'BET');
  const abw  = picks.find(p => p.verdict === 'ABWÄGEN');
  const best = bet || abw || null;

  let bannerHtml = '';
  if (best) {
    const isBet = best.verdict === 'BET';
    const cls   = isBet ? 'bet' : 'abw';
    const icon  = isBet ? '⚡' : '📈';
    const stars = starsFromConf(best.conf);
    const edge  = best.edgePP != null ? (best.edgePP >= 0 ? '+' : '') + parseFloat(best.edgePP).toFixed(0) + 'pp Edge' : '';
    bannerHtml = `
      <div class="verdict-banner ${cls}">
        <div class="vb-icon">${icon}</div>
        <div class="vb-body">
          <div class="vb-label">${escHtml(best.verdict)}</div>
          <div class="vb-reason">${escHtml(best.market || '')}${edge ? ' · ' + edge : ''}${stars ? ' · ' + starsStr(stars) : ''}</div>
        </div>
        ${best.odds ? `<div class="vb-badge">@${fmtOdds(best.odds)}</div>` : ''}
      </div>`;
  }

  // Model vs Market rows — 1X2
  const rows1x2 = [
    { lbl: 'Heimsieg',  mod: D.modHome, mkt: D.probHome },
    { lbl: 'Unentsch.', mod: D.modDraw, mkt: D.probDraw },
    { lbl: 'Auswärts',  mod: D.modAway, mkt: D.probAway },
  ].filter(r => r.mod != null);

  function edgePP(mod, mkt) {
    if (mod == null || mkt == null) return null;
    return Math.round((parseFloat(mod) - parseFloat(mkt)) * 10) / 10;
  }
  function edgeCls(e) {
    if (e == null || Math.abs(e) < 0.3) return 'flat';
    return e > 0 ? 'pos' : 'neg';
  }

  const tableRows = rows1x2.map(r => {
    const e = edgePP(r.mod, r.mkt);
    const eStr = e != null
      ? (Math.abs(e) < 0.3 ? '—' : (e > 0 ? '+' : '') + e.toFixed(1) + 'pp')
      : '—';
    return `
      <tr class="st-row">
        <td class="st-market">${r.lbl}</td>
        <td class="st-model">${r.mod != null ? r.mod + '%' : '—'}</td>
        <td class="st-market-val">${r.mkt != null ? r.mkt + '%' : '—'}</td>
        <td class="st-edge ${edgeCls(e)}">${eStr}</td>
      </tr>`;
  }).join('');

  // O/U picks from picks array
  let ouRows = '';
  for (const p of picks) {
    const ml = (p.market || '').toLowerCase();
    const isOU = ml.includes('über') || ml.includes('unter') || ml.includes('2.5');
    if (!isOU) continue;
    const e  = p.edgePP != null ? parseFloat(p.edgePP) : null;
    const eStr = e != null ? (e >= 0 ? '+' : '') + e.toFixed(1) + 'pp' : '—';
    ouRows += `
      <tr class="st-row">
        <td class="st-market">${escHtml(p.market)}</td>
        <td class="st-model">${p.modelOdds ? 'FV ' + fmtOdds(p.modelOdds) : '—'}</td>
        <td class="st-market-val">${p.odds ? '@' + fmtOdds(p.odds) : '—'}</td>
        <td class="st-edge ${edgeCls(e)}">${eStr}</td>
      </tr>`;
  }

  const hasTable = tableRows || ouRows;

  return `
    <div class="section">
      <div class="sec-head">
        <span class="sec-ico">🎯</span>
        <span class="sec-title">Wett-Signal</span>
        <span class="sec-tag gold">CocoBet Modell</span>
      </div>

      ${bannerHtml}

      ${hasTable ? `
      <div class="box" style="padding:12px;">
        <div style="font-size:9px;color:var(--sub);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;">Modell vs. Markt — alle Märkte</div>
        <table class="signal-table">
          <thead class="st-head">
            <tr><th>Markt</th><th>Modell</th><th>Pinn.</th><th>Edge</th></tr>
          </thead>
          <tbody>
            ${tableRows}
            ${ouRows}
          </tbody>
        </table>
        <div style="font-size:9px;color:#1a2a1a;margin-top:6px;">Modell = Elo-Wahrsch. · Markt = Pinnacle devigged · Edge in Prozentpunkten</div>
      </div>` : ''}
    </div>`;
}

/* ── Polymarket section ──────────────────────────────────── */
function renderPoly(D) {
  const p = D.polyData;
  if (!p) return '';

  function pct(v) { return v != null ? Math.round(v * 100) + '%' : '—'; }
  function edgeLabel(e) {
    if (e == null || Math.abs(e) < 0.3) return '<span class="poly-edge flat">—</span>';
    const s = (e > 0 ? '+' : '') + e.toFixed(1) + 'pp';
    return `<span class="poly-edge ${e > 0 ? 'pos' : 'neg'}">${s}</span>`;
  }

  const markets = [
    { lbl: 'Heimsieg',  price: p.hw,  edge: p.edge_hw },
    { lbl: 'Unentsch.', price: p.dr,  edge: p.edge_dr },
    { lbl: 'Auswärts',  price: p.aw,  edge: p.edge_aw },
    { lbl: 'Over 2.5',  price: p.o25, edge: p.edge_o25 },
    { lbl: 'Under 2.5', price: p.u25, edge: p.edge_u25 },
    { lbl: 'BTTS',      price: p.btts, edge: null },
  ].filter(m => m.price != null);

  const cards = markets.map(m => `
    <div class="poly-card">
      <div class="poly-label">${m.lbl}</div>
      <div class="poly-price">${pct(m.price)}</div>
      ${edgeLabel(m.edge)}
    </div>`).join('');

  const vol = p.vol ? '$' + (p.vol / 1000).toFixed(0) + 'K' : '—';
  const pinnTag = p.hasPinnacle
    ? '<span style="background:#1a2a3a;color:#60a5fa;border:1px solid #60a5fa44;border-radius:4px;padding:1px 5px;font-size:8px;">Pinnacle ✓</span>'
    : '<span style="font-size:8px;color:#555;">kein Pinn-Vergleich</span>';

  const steamHtml = p.steamLag
    ? '<span class="steam-badge">🔥 STEAM-LAG</span>'
    : '';

  return `
    <div class="section">
      <div class="sec-head">
        <span class="sec-ico">💹</span>
        <span class="sec-title">Polymarket Märkte</span>
        <span class="sec-tag" style="background:rgba(167,139,250,.1);color:var(--purple);border:1px solid rgba(167,139,250,.2);">Prediction Market</span>
      </div>

      ${p.steamLag ? `
      <div style="margin-bottom:10px;">
        <div class="steam-badge" style="font-size:11px;padding:7px 12px;">🔥 STEAM-LAG — Pinnacle bewegte sich, Polymarket hat noch nicht reagiert → potenzielle Arbitrage-Window</div>
      </div>` : ''}

      <div class="poly-grid">${cards}</div>

      <div class="poly-footer">
        <span>Volumen: <strong style="color:#aaa;">${vol}</strong></span>
        ${pinnTag}
        ${steamHtml}
        ${p.slug ? `<a href="https://polymarket.com/event/${p.slug}" target="_blank" rel="noopener" style="color:var(--purple);font-size:9px;text-decoration:none;">→ Polymarket</a>` : ''}
      </div>
      <div style="font-size:9px;color:#333;margin-top:6px;">Edge vs. Pinnacle Fair Value · Positiv = Polymarket zu günstig</div>
    </div>`;
}

/* ── Player Bets section ─────────────────────────────────── */
function renderPlayerBets(D) {
  const homeSquad = D.squads ? D.squads[D.homeId] : null;
  const awaySquad = D.squads ? D.squads[D.awayId] : null;
  const homeProps = D.playerProps ? D.playerProps[D.homeId] : null;
  const awayProps = D.playerProps ? D.playerProps[D.awayId] : null;

  if (!homeSquad && !awaySquad) return '';

  const posLabel = (pos) => {
    const m = { ST:'Stürmer', CF:'Stürmer', FW:'Stürmer', LW:'Flügel', RW:'Flügel',
                CAM:'Off. MF', AM:'Off. MF', CM:'Mittelfeld', MF:'Mittelfeld',
                DM:'Def. MF', CDM:'Def. MF', LB:'Verteidiger', RB:'Verteidiger',
                CB:'Verteidiger', DF:'Verteidiger', GK:'Torwart' };
    return m[(pos||'').toUpperCase()] || pos || '';
  };

  function playerCard(squad, props, teamName, teamFlag, teamId) {
    if (!squad) return '';
    const isAttacker = ['ST','CF','FW','LW','RW','CAM','AM'].includes((squad.position||'').toUpperCase());
    const per90 = squad.minutes && squad.goals != null && squad.minutes > 0
      ? (squad.goals / (squad.minutes / 90)).toFixed(2) : null;

    // Best prop if available
    let propHtml = '';
    if (props && props.anytime) {
      propHtml = `
        <div style="margin-top:8px;background:rgba(245,197,24,.08);border:1px solid rgba(245,197,24,.18);border-radius:6px;padding:6px 10px;">
          <div style="font-size:8px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;">Anytime Scorer</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fff;">@${fmtOdds(props.anytime)}</div>
        </div>`;
    } else if (isAttacker) {
      propHtml = `
        <div class="pb-hint">🎯 Tipp: Anytime Scorer beobachten</div>`;
    }

    return `
      <div class="pb-card">
        <div class="pb-team-label">${escHtml(teamFlag||'')} ${escHtml(teamName||'')}</div>
        <div class="pb-player-name">${escHtml(squad.name || '?')}</div>
        <div class="pb-position">${posLabel(squad.position)}</div>
        <div class="pb-stats">
          ${squad.goals   != null ? `<div class="pb-stat"><div class="pb-stat-val" style="color:#22c55e;">${squad.goals}</div><div class="pb-stat-lbl">Tore</div></div>` : ''}
          ${squad.assists != null ? `<div class="pb-stat"><div class="pb-stat-val" style="color:#60a5fa;">${squad.assists}</div><div class="pb-stat-lbl">Assists</div></div>` : ''}
          ${per90 ? `<div class="pb-stat"><div class="pb-stat-val" style="color:#f0c040;">${per90}</div><div class="pb-stat-lbl">Tore/90</div></div>` : ''}
        </div>
        ${propHtml}
      </div>`;
  }

  const homeCard = playerCard(homeSquad, homeProps, D.home, D.homeFlag, D.homeId);
  const awayCard = playerCard(awaySquad, awayProps, D.away, D.awayFlag, D.awayId);

  return `
    <div class="section">
      <div class="sec-head">
        <span class="sec-ico">⚽</span>
        <span class="sec-title">Spieler-Wetten</span>
        <span class="sec-tag gray">Schlüsselspieler</span>
      </div>
      <div class="player-bets-grid">
        ${homeCard}
        ${awayCard}
      </div>
      <div style="font-size:9px;color:#333;margin-top:-4px;margin-bottom:10px;">Stats letzte Saison (Klub + Nationalteam) · Prop-Quoten live wenn verfügbar</div>
    </div>`;
}

/* ── Sticky bar ──────────────────────────────────────────── */
/* ── Decision Strip — compact top pick summary ───────────── */
function renderDecisionStrip(D) {
  const picks  = D.picks || [];
  const primary = picks.find(p => p.verdict === 'BET') || picks.find(p => p.verdict === 'ABWÄGEN') || null;
  if (!primary) return '';

  const isBet      = primary.verdict === 'BET';
  const cls        = isBet ? 'bet' : 'abw';
  const badgeLabel = isBet ? '⚡ BET' : '📈 ABWÄGEN';
  const starsN     = starsFromConf(primary.conf);

  const edgePp  = primary.edgePP != null ? parseFloat(primary.edgePP) : null;
  const edgeStr = edgePp != null ? (edgePp >= 0 ? '+' : '') + edgePp.toFixed(1) + 'pp Edge' : '';
  const fvStr   = primary.fairValue ? 'FV ' + parseFloat(primary.fairValue).toFixed(2) : '';

  // Kelly fraction: (p_model * odds - 1) / (odds - 1) * 100
  let kellyHtml = '';
  if (primary.odds && D.modHome != null) {
    // Pick which model prob to use based on market string
    const mktLow = (primary.market || '').toLowerCase();
    let pModel = null;
    if (mktLow.includes('heim') || mktLow.includes('home') || mktLow === '1') pModel = D.modHome / 100;
    else if (mktLow.includes('auswärts') || mktLow.includes('away') || mktLow === '2') pModel = D.modAway / 100;
    else if (mktLow.includes('unentsch') || mktLow.includes('draw') || mktLow === 'x') pModel = D.modDraw / 100;

    if (pModel != null && primary.odds > 1) {
      const o = parseFloat(primary.odds);
      const fullKelly = ((pModel * o - 1) / (o - 1) * 100);
      const halfKelly = fullKelly / 2;
      if (fullKelly > 0) {
        kellyHtml = `<div class="ds-kelly">Kelly: <strong>${fullKelly.toFixed(1)}%</strong> · Konservativ: <strong>${halfKelly.toFixed(1)}%</strong> des Bankrolls</div>`;
      }
    }
  }

  const metaParts = [
    starsN ? starsStr(starsN) : '',
    fvStr,
    edgeStr,
  ].filter(Boolean);

  return `
    <div class="decision-strip ${cls}">
      <div class="ds-row">
        <span class="ds-badge ${cls}">${badgeLabel}</span>
        <span class="ds-market">${escHtml(primary.market || '')}</span>
        <span class="ds-odds ${cls}">${primary.odds ? '@' + fmtOdds(primary.odds) : '—'}</span>
      </div>
      ${metaParts.length > 0 ? `<div class="ds-meta">
        ${metaParts.map(m => `<span class="ds-edge ${cls}">${escHtml(m)}</span>`).join('<span style="color:rgba(255,255,255,.15)">·</span>')}
      </div>` : ''}
      ${kellyHtml}
    </div>`;
}

function renderStickyBar(D) {
  const betPick = (D.picks || []).find(p => p.verdict === 'BET');
  if (!betPick) return '';

  const edgePp  = betPick.edgePP != null ? parseFloat(betPick.edgePP) : null;
  const edgeStr = edgePp != null ? (edgePp >= 0 ? '+' : '') + edgePp.toFixed(1) + 'pp Edge' : '';
  const stickyStars = starsFromConf(betPick.conf);

  return `
    <div class="sticky" id="sticky-bar">
      <div class="sticky-info">
        <div class="sticky-name">${escHtml(betPick.market || '')}</div>
        <div class="sticky-sub">⚡ BET${stickyStars ? ' · ' + starsStr(stickyStars) : ''}${edgeStr ? ' · ' + edgeStr : ''}</div>
      </div>
      <div class="sticky-odds">${betPick.odds ? '@' + fmtOdds(betPick.odds) : '—'}</div>
      <button class="sticky-btn">Wetten →</button>
    </div>`;
}

/* ── Master render ───────────────────────────────────────── */
function render(D) {
  // Page title
  const pageTitle = (D.home || '') + ' vs ' + (D.away || '') + ' · WM 2026 · CocoBet';
  document.title = pageTitle;

  // Probabilities for hero: prefer pinnacle devigged, else model
  const pH = D.probHome != null ? D.probHome : D.modHome;
  const pD = D.probDraw != null ? D.probDraw : D.modDraw;
  const pA = D.probAway != null ? D.probAway : D.modAway;

  const heroDate = [fmtDate(D.date), D.time].filter(Boolean).join(' · ');

  const html = `
    <nav class="topbar">
      <a class="tb-back" href="../betting-dashboard.html">← Dashboard</a>
      <div class="tb-badge">
        <div class="tb-dot"></div>
        WM 2026 · ${escHtml(D.groupName || D.group || '')}
      </div>
      <span class="tb-spieltag">Spieltag ${safe(D.matchday, '?')}</span>
    </nav>

    <section class="hero">
      <div class="hero-bg-word">${escHtml((D.homeId||'').toUpperCase())} ${escHtml((D.awayId||'').toUpperCase())}</div>

      <div class="hero-matchup">
        <div class="hero-team">
          <div class="hero-flag">${D.homeFlag || '🏳'}</div>
          <div class="hero-name">${escHtml(D.home || '')}</div>
          <div class="hero-elo">Elo ${safe(D.homeElo,'—')}</div>
        </div>

        <div class="hero-center">
          <div class="donut">
            ${buildDonut(pH, pD, pA)}
            <div class="donut-inner">
              <span class="donut-pct">${pH != null ? pH + '%' : '—'}</span>
              <span class="donut-lbl">Heim</span>
            </div>
          </div>
          <div class="hero-vs">vs</div>
          <div class="hero-time">${heroDate}</div>
        </div>

        <div class="hero-team">
          <div class="hero-flag">${D.awayFlag || '🏳'}</div>
          <div class="hero-name">${escHtml(D.away || '')}</div>
          <div class="hero-elo">Elo ${safe(D.awayElo,'—')}</div>
        </div>
      </div>

      <div class="prob-bar">
        <div class="pb-home">
          <span class="pb-pct">${pH != null ? pH + '%' : '—'}</span>
          <span>${escHtml(D.home || '')}</span>
        </div>
        <div class="pb-draw">
          <span class="pb-pct">${pD != null ? pD + '%' : '—'}</span>
          <span style="font-size:9px;display:block;opacity:.7;">Unent.</span>
        </div>
        <div class="pb-away">
          <span>${escHtml(D.away || '')}</span>
          <span class="pb-pct">${pA != null ? pA + '%' : '—'}</span>
        </div>
      </div>
    </section>

    ${D.venue ? `
    <div class="venue-strip">
      <span class="venue-ico">🏟️</span>
      <span>${escHtml(D.venue)}</span>
    </div>` : ''}

    ${renderDecisionStrip(D)}
    ${renderContext(D)}
    ${renderPicks(D)}
    ${renderSignal(D)}
    ${renderAI(D)}
    ${renderInsights(D)}
    ${renderOdds(D)}
    ${renderPoly(D)}
    ${renderEloXg(D)}
    ${renderForm(D)}
    ${renderH2h(D)}
    ${renderGroup(D)}
    ${renderPlayerBets(D)}

    <div class="page-footer">
      <div class="pf-brand">CocoBet</div>
      <div class="pf-meta">
        WM 2026 · ${escHtml(D.groupName || D.group || '')} · Spieltag ${safe(D.matchday,'?')}<br>
        Generiert: ${safe(D.generatedAt,'—')}<br>
        18+ · Verantwortungsbewusst spielen
      </div>
      <a class="pf-back" href="../betting-dashboard.html">← Zurück zum Dashboard</a>
    </div>

    ${renderStickyBar(D)}
  `;

  document.getElementById('app').innerHTML = html;
}

/* ── Error state ─────────────────────────────────────────── */
function renderError(msg) {
  document.getElementById('app').innerHTML = `
    <div class="error-box">
      <h2>Fehler beim Laden</h2>
      <p>${escHtml(String(msg))}</p>
      <p style="margin-top:10px;">
        <a href="../betting-dashboard.html" style="color:var(--blue);font-size:12px;">← Zurück zum Dashboard</a>
      </p>
    </div>`;
}

/* ── Boot ────────────────────────────────────────────────── */
if (!slug) {
  renderError('Kein Spiel-Slug in der URL angegeben. Bitte ?m=wm-xxx-vs-yyy-DATUM verwenden.');
} else {
  fetch('data/' + slug + '.json')
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status + ' – ' + r.statusText);
      return r.json();
    })
    .then(function(D) { render(D); })
    .catch(function(err) { renderError(err.message || String(err)); });
}
</script>
