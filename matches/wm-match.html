<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05080f">
<title id="page-title">WM 2026 · CocoBet</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   RESET & VARIABLES
═══════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#f5c518;--green:#22c55e;--red:#ef4444;--blue:#38bdf8;
  --orange:#f97316;--purple:#a78bfa;
  --bg:#05080f;--surface:#0c1018;--card:#111827;--card2:#141d2b;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#f0f4ff;--sub:#6b7a99;--muted:#1e293b;
}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
  max-width:800px;margin:0 auto;
}

/* ── TOPBAR ── */
.topbar{
  position:sticky;top:0;z-index:200;
  background:rgba(5,8,15,.92);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  height:48px;display:flex;align-items:center;
  padding:0 16px;gap:12px;
}
.tb-back{
  display:flex;align-items:center;gap:5px;
  font-size:12px;color:var(--sub);letter-spacing:.5px;
  text-decoration:none;transition:color .2s;
}
.tb-back:hover{color:var(--text);}
.tb-badge{
  margin-left:auto;
  background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.25);
  color:var(--gold);font-size:10px;font-weight:800;
  letter-spacing:1.5px;text-transform:uppercase;
  padding:4px 12px;border-radius:100px;
  display:flex;align-items:center;gap:6px;
}
.tb-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold);animation:tbpulse 2s ease-in-out infinite;}
@keyframes tbpulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.tb-spieltag{font-size:11px;color:var(--sub);letter-spacing:1px;white-space:nowrap;}

/* ── HERO ── */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(170deg,#0a1a0a 0%,#05080f 40%,#0a0515 100%);
  padding:28px 20px 0;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 50%,rgba(34,197,94,.08) 0%,transparent 70%),
    radial-gradient(ellipse 60% 50% at 80% 50%,rgba(239,68,68,.07) 0%,transparent 70%);
  pointer-events:none;
}
.hero-bg-word{
  position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
  font-family:'Bebas Neue',sans-serif;font-size:140px;
  color:rgba(255,255,255,.022);letter-spacing:8px;
  white-space:nowrap;pointer-events:none;line-height:1;
}
.hero-matchup{
  position:relative;z-index:2;
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:12px;
  animation:fadeUp .6s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.hero-team{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
.hero-flag{font-size:48px;line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5));}
.hero-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:30px;letter-spacing:2px;color:#fff;line-height:1;
}
.hero-elo{
  font-size:10px;color:var(--sub);letter-spacing:1.5px;
  text-transform:uppercase;
}
.hero-center{display:flex;flex-direction:column;align-items:center;gap:6px;}
/* DONUT */
.donut{position:relative;width:80px;height:80px;}
.donut svg{width:80px;height:80px;transform:rotate(-90deg);}
.dt{fill:none;stroke:rgba(255,255,255,.07);stroke-width:7;}
.donut-inner{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.donut-pct{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;line-height:1;}
.donut-lbl{font-size:8px;color:var(--sub);letter-spacing:1px;text-transform:uppercase;}
.hero-vs{
  font-family:'Instrument Serif',serif;font-style:italic;
  font-size:14px;color:#333;letter-spacing:2px;
}
.hero-time{font-size:9px;color:var(--sub);letter-spacing:1px;text-transform:uppercase;text-align:center;}
/* PROB BAR */
.prob-bar{
  position:relative;z-index:2;
  margin:16px 0 0;
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:0;
  border-radius:0;overflow:hidden;
  animation:fadeUp .6s .15s ease both;
}
.pb-home,.pb-away{
  padding:9px 14px;display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:800;
}
.pb-home{background:rgba(34,197,94,.12);color:#22c55e;justify-content:flex-start;}
.pb-away{background:rgba(239,68,68,.1);color:#ef4444;justify-content:flex-end;}
.pb-draw{
  background:rgba(245,197,24,.09);color:var(--gold);
  padding:9px 12px;font-size:11px;font-weight:700;
  text-align:center;white-space:nowrap;
}
.pb-pct{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;}

/* venue strip */
.venue-strip{
  background:rgba(255,255,255,.03);
  border-top:1px solid var(--border);
  padding:8px 20px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:10px;color:var(--sub);letter-spacing:.5px;
  position:relative;z-index:2;
}
.venue-ico{font-size:13px;}

/* ── SECTION ── */
.section{padding:14px 16px 0;}
.sec-head{
  display:flex;align-items:center;gap:10px;
  padding-bottom:10px;margin-bottom:12px;
  border-bottom:1px solid var(--border);
}
.sec-ico{font-size:15px;}
.sec-title{font-size:9px;color:var(--sub);letter-spacing:2.5px;text-transform:uppercase;font-weight:700;}
.sec-tag{
  margin-left:auto;font-size:8px;font-weight:800;
  padding:2px 9px;border-radius:100px;letter-spacing:1px;text-transform:uppercase;
}
.sec-tag.gold{background:rgba(245,197,24,.12);color:var(--gold);border:1px solid rgba(245,197,24,.22);}
.sec-tag.green{background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.22);}
.sec-tag.blue{background:rgba(56,189,248,.1);color:var(--blue);border:1px solid rgba(56,189,248,.2);}
.sec-tag.gray{background:rgba(255,255,255,.06);color:#888;border:1px solid rgba(255,255,255,.1);}

/* ── BOX ── */
.box{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:16px;margin-bottom:10px;
  animation:fadeUp .5s ease both;
}

/* ── KONTEXT-CARDS ── */
.ctx-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.ctx-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;
}
.ctx-lbl{font-size:8px;color:var(--sub);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px;}
.ctx-val{font-size:15px;font-weight:800;color:var(--text);}
.ctx-sub{font-size:10px;color:var(--sub);margin-top:2px;}
.venue-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;
  display:flex;align-items:center;gap:10px;
  margin-bottom:10px;
}
.venue-card-ico{font-size:20px;}
.venue-card-name{font-size:13px;font-weight:700;color:var(--text);}
.venue-card-sub{font-size:10px;color:var(--sub);}
.host-bonus{
  background:linear-gradient(90deg,rgba(245,197,24,.1),rgba(245,197,24,.03));
  border:1px solid rgba(245,197,24,.22);
  border-radius:8px;padding:9px 14px;
  display:flex;align-items:center;gap:8px;
  font-size:11px;color:var(--gold);font-weight:700;
  margin-bottom:10px;
}

/* ── AI ANALYSE ── */
.ai-box{
  background:linear-gradient(135deg,rgba(56,189,248,.07),rgba(167,139,250,.05));
  border:1px solid rgba(56,189,248,.15);
  border-radius:12px;padding:16px;margin-bottom:10px;
  animation:fadeUp .5s .1s ease both;
}
.ai-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.ai-badge{
  font-size:8px;font-weight:800;color:var(--blue);letter-spacing:2px;text-transform:uppercase;
  background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.2);
  padding:3px 10px;border-radius:100px;
}
.ai-title{
  font-family:'Instrument Serif',serif;font-style:italic;
  font-size:16px;color:#fff;
}
.ai-text{font-size:12px;color:#8899bb;line-height:1.7;white-space:pre-wrap;}
.ai-text strong{color:#bbc8e0;}

/* DATA PILLS */
.data-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.dp{font-size:9px;font-weight:700;padding:3px 9px;border-radius:100px;letter-spacing:.5px;}
.dp.g{background:rgba(34,197,94,.1);color:#22c55e;border:1px solid rgba(34,197,94,.2);}
.dp.b{background:rgba(56,189,248,.1);color:var(--blue);border:1px solid rgba(56,189,248,.18);}
.dp.o{background:rgba(249,115,22,.1);color:var(--orange);border:1px solid rgba(249,115,22,.18);}
.dp.gray{background:rgba(255,255,255,.06);color:#888;border:1px solid rgba(255,255,255,.1);}

/* ── THE PICK ── */
.pick-hero{
  background:linear-gradient(135deg,rgba(34,197,94,.13),rgba(34,197,94,.04));
  border:1px solid rgba(34,197,94,.3);
  border-radius:14px;padding:18px 16px;
  margin-bottom:10px;
  position:relative;overflow:hidden;
  animation:fadeUp .5s .15s ease both;
}
.pick-hero::before{
  content:'BET';
  position:absolute;right:-8px;top:-8px;
  font-family:'Bebas Neue',sans-serif;font-size:80px;
  color:rgba(34,197,94,.06);letter-spacing:2px;
  pointer-events:none;line-height:1;
}
.ph-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px;}
.ph-badges{display:flex;align-items:center;gap:5px;margin-bottom:8px;flex-wrap:wrap;}
.ph-badge{
  font-size:8px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  padding:3px 9px;border-radius:100px;
}
.ph-badge.bet{background:rgba(34,197,94,.2);color:#22c55e;border:1px solid rgba(34,197,94,.35);}
.ph-badge.abwaegen{background:rgba(249,115,22,.15);color:var(--orange);border:1px solid rgba(249,115,22,.3);}
.ph-badge.stars{background:rgba(255,255,255,.06);color:#aaa;border:1px solid rgba(255,255,255,.1);}
.ph-badge.edge{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.25);}
.ph-name{
  font-family:'Bebas Neue',sans-serif;font-size:32px;
  color:#fff;letter-spacing:2px;line-height:1;margin-bottom:5px;
}
.ph-detail{font-size:11px;color:#668866;}
.ph-detail strong{color:#aaccaa;}
.ph-odds-block{text-align:right;flex-shrink:0;}
.ph-odds{
  font-family:'Bebas Neue',sans-serif;font-size:52px;
  color:#22c55e;letter-spacing:1px;line-height:1;
  text-shadow:0 0 30px rgba(34,197,94,.3);
}
.ph-conf{font-size:9px;color:#446644;text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.signal-bar{
  display:flex;align-items:center;gap:0;
  background:rgba(255,255,255,.04);border-radius:6px;overflow:hidden;
  margin-bottom:10px;
}
.sb-seg{
  flex:1;padding:6px 8px;text-align:center;font-size:9px;font-weight:700;
  letter-spacing:.5px;border-right:1px solid rgba(255,255,255,.06);
}
.sb-seg:last-child{border-right:none;}
.sb-seg .sb-lbl{color:var(--sub);font-size:8px;display:block;margin-bottom:2px;}
.sb-seg .sb-val{color:var(--text);}
.sb-seg.green .sb-val{color:#22c55e;}
.sb-seg.blue .sb-val{color:var(--blue);}
.sb-seg.orange .sb-val{color:var(--orange);}
.model-bar-wrap{margin-bottom:12px;}
.model-bar-labels{display:flex;justify-content:space-between;margin-bottom:4px;}
.model-bar-lbl{font-size:9px;color:var(--sub);letter-spacing:1px;}
.model-bar{height:6px;background:rgba(255,255,255,.07);border-radius:100px;overflow:hidden;position:relative;margin-bottom:4px;}
.mb-model{height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);border-radius:100px;position:absolute;top:0;left:0;}
.mb-market{height:100%;background:rgba(255,255,255,.2);border-radius:100px;position:absolute;top:0;left:0;}
.ph-rationale{
  font-size:11px;color:#668866;line-height:1.6;
  border-top:1px solid rgba(34,197,94,.1);padding-top:10px;margin-top:8px;
}
.ph-rationale strong{color:#aaccaa;}
/* Why-Modal-Button + Modal — Audit Fix 06.06.2026 */
.pwm-btn{
  display:block;width:100%;
  background:#161b22;border:1px solid rgba(0,212,161,0.4);
  color:#00d4a1;border-radius:8px;
  padding:11px 14px;font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit;
  margin:14px 0 10px;
  transition:background 0.15s, border-color 0.15s;
}
.pwm-btn:hover{ background:rgba(0,212,161,0.08); border-color:#00d4a1; }
.pwm-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.75);
  z-index:9999;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  backdrop-filter:blur(4px);
}
.pwm-content{
  background:#0d1117;border:1px solid #30363d;
  border-radius:14px;padding:24px;
  max-width:560px;width:100%;max-height:90vh;
  overflow-y:auto;position:relative;
}
.pwm-close{
  position:absolute;top:14px;right:14px;
  background:none;border:none;color:#8b949e;
  font-size:20px;cursor:pointer;line-height:1;
  padding:6px;border-radius:4px;
}
.pwm-close:hover{ background:rgba(255,255,255,0.06); color:#e6edf3; }
.pwm-head{ margin-bottom:18px; padding-right:30px; }
.pwm-conf-badge{
  display:inline-block;font-size:10px;font-weight:700;
  letter-spacing:.5px;padding:4px 10px;border-radius:6px;
  margin-bottom:8px;
}
.pwm-title{ font-size:20px;font-weight:800;color:#fff;letter-spacing:-0.3px;margin-bottom:3px; }
.pwm-sub{ font-size:12px;color:#8b949e; }
.pwm-section{
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:10px;padding:14px;
  margin-bottom:12px;
}
.pwm-section-title{
  font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:#8b949e;margin-bottom:10px;
}
.pwm-table{ width:100%;font-size:13px;border-collapse:collapse; }
.pwm-table td{ padding:5px 0; }
.pwm-table td:first-child{ color:#8b949e; }
.pwm-table td:nth-child(2){ text-align:right;color:#e6edf3; }
.pwm-text{ font-size:13px;color:#e6edf3;line-height:1.55; }
.pwm-foot{
  font-size:10px;color:#8b949e;text-align:center;
  border-top:1px solid #30363d;padding-top:10px;margin-top:8px;
}
.bet-btn{
  width:100%;margin-top:12px;
  padding:14px;border-radius:10px;border:none;
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:800;
  letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;
  background:linear-gradient(90deg,#22c55e,#16a34a);
  color:#000;transition:all .2s;
  box-shadow:0 4px 20px rgba(34,197,94,.25);
}
.bet-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(34,197,94,.35);}
.pick-sec{
  background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:8px;
  animation:fadeUp .5s .2s ease both;
}
.ps-badge{font-size:8px;font-weight:800;letter-spacing:1px;margin-bottom:4px;}
.ps-badge.bet{color:var(--green);}
.ps-badge.abwaegen{color:var(--orange);}
.ps-name{font-size:13px;font-weight:700;color:#ccc;}
.ps-detail{font-size:10px;color:var(--sub);}
.ps-odds{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--orange);letter-spacing:1px;}

/* ── ODDS + SHARP RADAR ── */
.odds-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
.odds-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:12px 10px;text-align:center;
  transition:all .2s;
}
.odds-card.highlight{
  background:rgba(34,197,94,.08);
  border-color:rgba(34,197,94,.3);
}
.oc-outcome{font-size:9px;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;}
.oc-odds{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fff;line-height:1;}
.odds-card.highlight .oc-odds{color:#22c55e;}
.oc-impl{font-size:9px;color:var(--sub);margin-top:3px;}
.oc-arrow{font-size:9px;margin-left:2px;}
.oc-arrow.up{color:#22c55e;}
.oc-arrow.down{color:#ef4444;}
.odds-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.sharp-row{
  display:grid;grid-template-columns:90px 1fr 70px;
  align-items:center;gap:10px;
  padding:8px 0;border-bottom:1px solid var(--border);
}
.sharp-row:last-child{border-bottom:none;}
.sr-market{font-size:11px;font-weight:700;color:#aaa;}
.sr-bar-wrap{height:5px;background:rgba(255,255,255,.06);border-radius:100px;overflow:hidden;position:relative;}
.sr-bar{height:100%;border-radius:100px;position:absolute;}
.sr-bar.stable{background:rgba(255,255,255,.2);width:50%;}
.sr-bar.sharp-in{background:linear-gradient(90deg,#22c55e,#16a34a);}
.sr-bar.sharp-out{background:linear-gradient(90deg,#ef4444,#b91c1c);right:0;}
.sr-change{text-align:right;font-size:11px;font-weight:700;}
.sr-change.up{color:#22c55e;}
.sr-change.down{color:#ef4444;}
.sr-change.flat{color:var(--sub);}
.sr-current{font-family:'Bebas Neue',sans-serif;font-size:14px;display:block;}
.sr-move{font-size:9px;display:block;}
.sharp-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.22);
  border-radius:6px;padding:5px 10px;
  font-size:10px;font-weight:700;color:#22c55e;
  margin-bottom:10px;
}
.live-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;box-shadow:0 0 5px #22c55e;animation:tbpulse 1.8s ease-in-out infinite;}

/* ── ELO + xG ── */
.elo-matchup{
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:8px;margin-bottom:10px;
}
.em-team{display:flex;flex-direction:column;gap:3px;}
.em-team.right{align-items:flex-end;text-align:right;}
.em-name{font-size:12px;font-weight:700;color:#aaa;letter-spacing:.5px;}
.em-elo{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fff;line-height:1;}
.em-vs{font-size:10px;color:#333;font-weight:700;letter-spacing:2px;}
.xg-bar-section{margin-bottom:10px;}
.xg-lbl{font-size:9px;color:var(--sub);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;}
.xg-bar-wrap{display:flex;align-items:center;gap:8px;}
.xg-val{font-family:'Bebas Neue',sans-serif;font-size:16px;color:#fff;width:36px;flex-shrink:0;}
.xg-val.right{text-align:right;}
.xg-track{flex:1;height:7px;background:rgba(255,255,255,.07);border-radius:100px;overflow:hidden;display:flex;}
.xg-home-bar{height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);border-radius:100px;}
.xg-away-bar{height:100%;background:linear-gradient(90deg,#ef4444,#b91c1c);border-radius:100px;margin-left:auto;}

/* ── FORM ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.form-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;}
.form-team{font-size:11px;font-weight:700;color:#aaa;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.form-dots{display:flex;gap:4px;}

     Spiegelt pick_constants.json (Python-Master). MUSS vor dem inline-Script geladen sein. -->
<script src="../_pick_helpers.js"></script>

<script>
// ═══════════════════════════════════════════════════════════
//  WM MATCH PAGE  ·  Dynamic Renderer
//  Loads: data/{slug}.json  where slug = ?m= URL param
// ═══════════════════════════════════════════════════════════

/* ── Utility helpers ─────────────────────────────────────── */
function safe(v, fallback) {
  fallback = fallback !== undefined ? fallback : '—';
  return (v !== null && v !== undefined && v !== '') ? v : fallback;
}
function escHtml(s) {
  if (typeof s !== 'string') return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtOdds(v) {
  if (v === null || v === undefined || v === '') return '—';
  return parseFloat(v).toFixed(2);
}
function impliedProb(odds) {
  if (!odds || parseFloat(odds) <= 0) return '—';
  return (100 / parseFloat(odds)).toFixed(1);
}
function fmtDate(d) {
  if (!d) return '—';
  const p = String(d).split('-');
  if (p.length === 3) return p[2] + '.' + p[1] + '.' + p[0].slice(-2);
  return d;
}
function starsStr(n) {
  if (!n || n < 1) return '';
  return '★'.repeat(Math.min(5, Math.max(1, parseInt(n))));
}
function starsFromConf(conf) {
  if (!conf) return 0;
  const c = String(conf).toLowerCase();
  if (c === 'high')   return 5;
  if (c === 'medium') return 3;
  if (c === 'low')    return 1;
  return 0;
}
function signStr(v) {
  if (v === null || v === undefined) return '—';
  const n = parseFloat(v);
  return (n > 0 ? '+' : '') + n.toFixed(1);
}

/* ── Donut SVG builder ───────────────────────────────────── */
function buildDonut(pH, pD, pA) {
  const R = 32;
  const C = 2 * Math.PI * R; // ~201.06

  if (pH == null) {
    return '<svg viewBox="0 0 80 80"><circle class="dt" cx="40" cy="40" r="32"/></svg>';
  }

  const hF = parseFloat(pH) / 100;
  const dF = parseFloat(pD || 0) / 100;
  const aF = parseFloat(pA || 0) / 100;

  const hLen = hF * C;
  const dLen = dF * C;
  const aLen = aF * C;

  const dRot = hF * 360;
  const aRot = (hF + dF) * 360;

  return `
    <svg viewBox="0 0 80 80" style="transform:rotate(-90deg);">
      <circle class="dt" cx="40" cy="40" r="${R}"/>
      <circle style="fill:none;stroke:#22c55e;stroke-width:7;stroke-linecap:round;stroke-dasharray:${C.toFixed(2)};stroke-dashoffset:${(C - hLen).toFixed(2)};filter:drop-shadow(0 0 5px #22c55e);" cx="40" cy="40" r="${R}"/>
      <circle style="fill:none;stroke:#f5c518;stroke-width:7;stroke-linecap:round;stroke-dasharray:${C.toFixed(2)};stroke-dashoffset:${(C - dLen).toFixed(2)};" cx="40" cy="40" r="${R}" transform="rotate(${dRot.toFixed(2)} 40 40)"/>
      <circle style="fill:none;stroke:#ef4444;stroke-width:7;stroke-linecap:round;stroke-dasharray:${C.toFixed(2)};stroke-dashoffset:${(C - aLen).toFixed(2)};" cx="40" cy="40" r="${R}" transform="rotate(${aRot.toFixed(2)} 40 40)"/>
    </svg>`;
}

function lookupVenue(venueStr) {
  if (!venueStr) return null;
  const k = String(venueStr).toLowerCase().trim();
  if (VENUES[k]) return VENUES[k];
  for (const [key, v] of Object.entries(VENUES)) {
    if (k.includes(key) || key.includes(k)) return v;
  }
  return null;
}

/* env modifiers — returns array of {type, icon, cls, pickCls, text} */
function getEnvModifiers(venue, weather) {
  if (!venue) return [];
  const mods = [];
  const isDome      = venue.type === 'dome';
  const alt         = venue.alt || 0;
  const temp        = (weather && weather.temp != null) ? weather.temp : venue.temp;
  const hum         = (weather && weather.hum  != null) ? weather.hum  : venue.hum;
  const rainChance  = (weather && weather.rain != null) ? weather.rain  : 0;

  if (!isDome && alt >= 1200) {
    const severity = alt >= 2000 ? 'Extrem' : 'Moderat';
    const pct      = alt >= 2000 ? '~20%' : '~12%';
    mods.push({ type:'altitude', icon:'🏔️', cls:'env-modifier-alt', pickCls:'pick-env-mod-alt',
      text:`${severity}e Höhenluft (${alt}m) — Over 2.5 Goals historisch ${pct} seltener, BTTS-Rate sinkt. Under & BTTS-Nein bevorzugen.` });
  }
  if (!isDome && temp >= 31) {
    const sev  = temp >= 36 ? 'Extreme' : 'Starke';
    const humStr = hum >= 65 ? ` · ${hum}% Luftfeuchte` : '';
    mods.push({ type:'heat', icon:'🌡️', cls:'env-modifier-heat', pickCls:'pick-env-mod-heat',
      text:`${sev} Hitze: ${temp}°C${humStr} — Pressing-Systeme degradieren ab Min. 60. Konditionsstärkere Teams profitieren. Späte Goals wahrscheinlicher.` });
  }
  if (!isDome && rainChance >= 55) {
    mods.push({ type:'rain', icon:'🌧️', cls:'env-modifier-rain', pickCls:'pick-env-mod-rain',
      text:`Regen erwartet (${rainChance}%) — flaches Passspiel leidet, Standards & Direktschüsse gewinnen an Bedeutung. BTTS-Rate tendenziell erhöht.` });
  }
  return mods;
}

/* cache for live weather (avoid repeated fetches) */
const _wxCache = {};

/* ── Weather fetch — Open-Meteo forecast API (16-day window) ── */
async function fetchWeather(lat, lon, dateStr) {
  const key = `${lat},${lon},${dateStr}`;
  if (_wxCache[key]) return _wxCache[key];

  // Check how many days until match — Open-Meteo forecasts up to 16 days
  const today    = new Date(); today.setHours(0,0,0,0);
  const matchDay = new Date(dateStr); matchDay.setHours(0,0,0,0);
  const daysAway = Math.round((matchDay - today) / 86400000);

  if (daysAway > 16) {
    // Beyond forecast window — return sentinel so caller can show "available in X days"
    _wxCache[key] = { tooFar: true, daysAway };
    return _wxCache[key];
  }

  try {
    // Daily: temp, rain, wind
    // Hourly: relative_humidity_2m — we fetch and average midday values (hours 11-14)
    const base = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&timezone=auto`;
    const dailyUrl  = `${base}&daily=temperature_2m_max,precipitation_probability_max,windspeed_10m_max` +
                      `&start_date=${dateStr}&end_date=${dateStr}`;
    const hourlyUrl = `${base}&hourly=relative_humidity_2m` +
                      `&start_date=${dateStr}&end_date=${dateStr}`;

    const [dr, hr] = await Promise.all([fetch(dailyUrl), fetch(hourlyUrl)]);
    if (!dr.ok) return null;
    const dj = await dr.json();
    const dd = dj.daily || {};

    // Humidity: average hours 10-15 (midday) from hourly data
    let hum = null;
    if (hr.ok) {
      const hj = await hr.json();
      const humArr = (hj.hourly || {}).relative_humidity_2m || [];
      const midday = humArr.slice(10, 16).filter(v => v != null);
      if (midday.length > 0) hum = Math.round(midday.reduce((a,b) => a+b, 0) / midday.length);
    }

    const wx = {
      temp: dd.temperature_2m_max           ? Math.round(dd.temperature_2m_max[0])           : null,
      rain: dd.precipitation_probability_max ? Math.round(dd.precipitation_probability_max[0]) : null,
      wind: dd.windspeed_10m_max             ? Math.round(dd.windspeed_10m_max[0])             : null,
      hum,
      daysAway,
    };
    _wxCache[key] = wx;
    return wx;
  } catch(e) { return null; }
}

/* inject live weather into the already-rendered env section */
async function injectWeather(venue, dateStr) {
  const block = document.getElementById('env-wx-block');
  if (!block) return;

  const wx = await fetchWeather(venue.lat, venue.lon, dateStr);

  if (!wx) {
    block.innerHTML = '<span class="env-loading">⚠️ Wetterdienst nicht erreichbar</span>';
    return;
  }

  // Match too far in future (>16 days) — show baseline + countdown
  if (wx.tooFar) {
    const remainDays = wx.daysAway - 16;
    block.innerHTML = `<div class="env-wrow">
      <span class="env-wchip">📅 Live-Vorhersage in ~${remainDays}d verfügbar</span>
      <span class="env-wchip" style="color:#6e7681">Baseline: 🌡️ ~${venue.temp}°C · 💧 ~${venue.hum}% Luftfeuchte</span>
    </div>`;
    return;
  }

  const temp = wx.temp != null ? wx.temp : venue.temp;
  const rain = wx.rain != null ? wx.rain : 0;
  const wind = wx.wind != null ? wx.wind : null;
  const hum  = wx.hum  != null ? wx.hum  : venue.hum;
  const isDome = venue.type === 'dome';

  // Freshness label
  const daysAway = wx.daysAway || 0;
  const freshnessLabel = daysAway <= 3
    ? `<span class="env-wchip" style="color:#3fb950;font-size:9px">● Live</span>`
    : `<span class="env-wchip" style="color:#e3b341;font-size:9px">● ${daysAway}T-Prognose</span>`;

  let chips = '';
  if (isDome) {
    chips = `<span class="env-wchip">🏛️ <strong>Klimatisiert</strong> · kontrollierte Bedingungen</span>${freshnessLabel}`;
  } else {
    if (temp != null) chips += `<span class="env-wchip">🌡️ <strong>${temp}°C</strong></span>`;
    if (hum  != null) chips += `<span class="env-wchip">💧 <strong>${hum}%</strong></span>`;
    if (rain != null) chips += `<span class="env-wchip">🌧️ <strong>${rain}%</strong> Regen</span>`;
    if (wind != null) chips += `<span class="env-wchip">💨 <strong>${wind} km/h</strong></span>`;
    chips += freshnessLabel;
  }
  block.innerHTML = `<div class="env-wrow">${chips}</div>`;

  // Update env modifier section with live data (re-render modifiers with real wx)
  const modBlock = document.getElementById('env-modifiers-block');
  if (modBlock) {
    const mods = getEnvModifiers(venue, wx);
    modBlock.innerHTML = mods.map(m =>
      `<div class="env-modifier ${m.cls}">${m.icon} ${m.text}</div>`
    ).join('');
  }
  // Update pick modifiers
  document.querySelectorAll('.pick-env-placeholder').forEach(el => {
    const mods = getEnvModifiers(venue, wx);
    const relevant = mods.filter(m => {
      const mkt = el.dataset.market || '';
      if (m.type === 'altitude') return mkt.includes('2.5') || mkt.toLowerCase().includes('btts') || mkt.toLowerCase().includes('both');
      return true; // heat and rain always relevant
    });
    el.innerHTML = relevant.map(m =>
      `<div class="pick-env-mod ${m.pickCls}">${m.icon} ${m.text}</div>`
    ).join('');
  });
}

  let typePill = '';
  if (venue) {
    if (venue.type === 'dome')      typePill = `<span class="env-pill env-pill-dome">🏛️ Dome/AC</span>`;
    else if (venue.type === 'open-roof') typePill = `<span class="env-pill env-pill-dome">🌤️ Offenes Dach</span>`;
    else                             typePill = `<span class="env-pill env-pill-mild">🌿 Outdoor</span>`;
  }
  // Temp pill (static baseline, updated live by injectWeather)
  let tempPill = '';
  if (venue && venue.type !== 'dome') {
    const t = venue.temp;
    if (t >= 33)      tempPill = `<span class="env-pill env-pill-heat">🌡️ ~${t}°C</span>`;
    else if (t >= 28) tempPill = `<span class="env-pill env-pill-mid">🌡️ ~${t}°C</span>`;
    else              tempPill = `<span class="env-pill env-pill-normal">🌡️ ~${t}°C</span>`;
  }

  // ── Travel burden — loaded from wm_travel_burden.json (cached globally) ──
  const venueCountry = venue ? venue.country : '';
  const homeNations  = ['USA', 'Kanada', 'Mexiko'];

  function travelRow(teamName, teamFlag, teamId) {
    // Home advantage check
    const venCo = venueCountry.toLowerCase();
    const isHomeTeam = (venCo === 'usa' && teamId === 'USA')
                    || (venCo === 'mexiko' && teamId === 'MEX')
                    || (venCo === 'kanada' && teamId === 'CAN');

    const tb = (window._wmTravelBurden || {})[teamId];

    // Build leg context for THIS matchday transition
    let legHtml = '';
    if (tb && tb.legs) {
      const leg = tb.legs.find(l => l.matchday_to === D.matchday);
      if (leg && !leg.same_venue) {
        const bCol = leg.burden === 'critical'    ? '#f85149'
                   : leg.burden === 'significant' ? '#f97316'
                   : leg.burden === 'moderate'    ? '#e3b341' : '#6e7681';
        const crossStr = leg.border_crossing ? ' · 🛂 Grenzüberquerung' : '';
        legHtml = `<div style="margin-top:4px;padding:4px 7px;border-radius:5px;border-left:2px solid ${bCol};background:${bCol}10;font-size:10px;color:${bCol};line-height:1.45">
          ${leg.from_city} → ${leg.to_city} · ${leg.km.toLocaleString('de')} km · ${leg.rest_days}T Pause${crossStr}
        </div>`;
      } else if (leg && leg.same_venue) {
        legHtml = `<div style="margin-top:4px;font-size:10px;color:#3fb950">✓ Gleiches Stadion wie Spiel ${D.matchday - 1}</div>`;
      }
    }

    // Overall burden badge
    let badge = '';
    if (isHomeTeam) {
      badge = `<span class="env-tbadge env-tbadge-home">🏠 Heimvorteil</span>`;
    } else if (tb) {
      const sc = tb.burden_score;
      if (sc === 0)      badge = `<span class="env-tbadge env-tbadge-neutral">✓ Kein Reise</span>`;
      else if (sc >= 7)  badge = `<span class="env-tbadge env-tbadge-cross2">⚠️ ${tb.burden_label}</span>`;
      else if (sc >= 4)  badge = `<span class="env-tbadge env-tbadge-cross1">~ ${tb.burden_label}</span>`;
      else               badge = `<span class="env-tbadge env-tbadge-neutral">${tb.burden_label}</span>`;
    } else {
      badge = `<span class="env-tbadge env-tbadge-neutral">Neutral</span>`;
    }

    // Games route overview
    let routeHtml = '';
    if (tb && tb.games && tb.games.length > 0) {
      const cities = tb.games.map(g => g.city);
      routeHtml = `<div style="font-size:9px;color:#6e7681;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
        ${cities.join(' → ')}
      </div>`;
    }

    return `
      <div class="env-trow">
        <div class="env-trow-flag">${teamFlag || '🏳'}</div>
        <div class="env-trow-info">
          <div class="env-trow-name">${escHtml(teamName || '')}</div>
          ${routeHtml}
          ${legHtml}
        </div>
        ${badge}
      </div>`;
  }

  // ── Initial modifiers (static baseline, no live weather yet) ──
  const staticMods = getEnvModifiers(venue, null);

  const dateStr = D.date || '';

  return `
    <div class="env-section">
      <div class="env-section-title">🌍 Spielort & Umgebung</div>
      <div class="env-grid">

        <div class="env-card">
          <div class="env-card-label">Venue & Klima</div>
          <div class="env-venue-name">${escHtml(venueName)}</div>
          <div class="env-venue-city">${escHtml(venueCity)}</div>
          <div class="env-pills">${altPill}${typePill}${tempPill}</div>
          <div id="env-wx-block"><span class="env-loading">⟳ Lade Wettervorhersage…</span></div>
        </div>

        <div class="env-card">
          <div class="env-card-label">Teams · Reisekontext</div>
          <div class="env-travel-rows">
            ${travelRow(D.home, D.homeFlag, D.homeId)}
            ${travelRow(D.away, D.awayFlag, D.awayId)}
          </div>
        </div>

      </div>
    </div>

    <div id="env-modifiers-block">
      ${staticMods.map(m => `<div class="env-modifier ${m.cls}">${m.icon} ${m.text}</div>`).join('')}
    </div>`;
}

// Zeigt: Roh-Edge → Signal-Stack → Effective Edge + Verdict-Begründung.
// Defensiv: nur sichtbar wenn primary.signals[] existiert + nicht leer.
// Picks vor 08.06.2026 ohne Engine-Felder: Section bleibt unsichtbar.
function renderEngineFlow(D) {
  const picks = D.picks || [];
  if (picks.length === 0) return '';
  // Wähle den primären Pick — gleiche Logik wie renderPicks (saferAlt → BET → ABWÄGEN)
  const visible = picks.filter(p => !p.trackingExcluded);
  if (!visible.length) return '';
  const sorted = [...visible].sort((a, b) => {
    if (!!a.saferAltFor && !b.saferAltFor) return -1;
    if (!!b.saferAltFor && !a.saferAltFor) return 1;
    if (a.verdict === 'BET' && b.verdict !== 'BET') return -1;
    if (b.verdict === 'BET' && a.verdict !== 'BET') return 1;
    return 0;
  });
  const primary = sorted[0];
  if (!primary || !Array.isArray(primary.signals) || primary.signals.length === 0) return '';

  const rawEdge = parseFloat(primary.edgePP) || 0;
  const effEdge = primary.effectiveEdgePP !== undefined && primary.effectiveEdgePP !== null
                  ? parseFloat(primary.effectiveEdgePP) : rawEdge;
  const adj     = primary.signalAdjustmentPP !== undefined && primary.signalAdjustmentPP !== null
                  ? parseFloat(primary.signalAdjustmentPP) : 0;

  // Max-Score für Balken-Skalierung (Visual)
  const maxAbs = Math.max(2.0, ...primary.signals.map(s => Math.abs(s.weighted_score !== undefined ? s.weighted_score : s.score)));

  const rows = primary.signals.map(s => {
    const sc = s.weighted_score !== undefined ? s.weighted_score : s.score;
    const isPos = sc > 0;
    const pct = Math.min(45, (Math.abs(sc) / maxAbs) * 45);
    const sym = isPos ? '+' : '';
    const cls = isPos ? 'pos' : 'neg';
    const ev = (s.evidence || s.name || '').replace(/[<>]/g, '');
    const barStyle = isPos
      ? `left:50%; width:${pct}%;`
      : `right:50%; width:${pct}%;`;
    return `
      <div class="efl-row">
        <div class="efl-lbl">${escHtml(ev)}</div>
        <div class="efl-bar-wrap"><span class="efl-bar ${cls}" style="${barStyle}"></span></div>
        <div class="efl-val ${cls}">${sym}${sc.toFixed(1)}pp</div>
      </div>`;
  }).join('');

  // Verdict-Begründung
  let verdictBlock = '';
  if (primary.downgradedReason) {
    verdictBlock = `
      <div class="efl-verdict warn">
        ⚖️ <strong>Engine-Hinweis:</strong> ${escHtml(primary.downgradedReason)}
      </div>`;
  } else if (primary.verdict === 'BET' && adj > 0) {
    verdictBlock = `
      <div class="efl-verdict bet">
        ✅ <strong>Engine bestätigt:</strong> ${primary.signals.length} Signal${primary.signals.length>1?'e':''} mit Netto ${adj>=0?'+':''}${adj.toFixed(1)}pp Edge-Adjustment.
      </div>`;
  }

  const adjLabel = adj >= 0 ? `+${adj.toFixed(1)}pp` : `${adj.toFixed(1)}pp`;
  const adjCls = adj >= 0 ? 'pos' : 'neg';

  return `
    <div class="section">
      <div class="sec-head">
        <span class="sec-ico">🧠</span>
        <span class="sec-title">Wie die Engine zum Urteil kommt</span>
        <span class="sec-tag blue">${primary.signals.length} Signale</span>
      </div>
      <div class="efl-box">
        <div class="efl-head">
          <div class="efl-title">Edge-Anpassung im Detail</div>
          <div class="efl-sub">${escHtml(primary.market)} @ ${primary.odds}</div>
        </div>

        <div class="efl-row start">
          <div class="efl-lbl">📊 Roher Edge (Modell vs Markt)</div>
          <div></div>
          <div class="efl-val gold">${rawEdge>=0?'+':''}${rawEdge.toFixed(1)}pp</div>
        </div>

        ${rows}

        <hr class="efl-divider">

        <div class="efl-row">
          <div class="efl-lbl"><em style="color:#8b949e;">Σ Engine-Adjustment</em></div>
          <div></div>
          <div class="efl-val ${adjCls}">${adjLabel}</div>
        </div>

        <div class="efl-row end">
          <div class="efl-lbl">🎯 Effective Edge nach Engine</div>
          <div></div>
          <div class="efl-val cyan">${effEdge>=0?'+':''}${effEdge.toFixed(1)}pp</div>
        </div>

        ${verdictBlock}
      </div>
    </div>`;
}

function renderPicks(D) {
  const picks = D.picks || [];
  if (picks.length === 0) return '';

  // Audit-Fix 06.06.2026: trackingExcluded Picks komplett raus.
  // Diese werden vom Tracker (resolve_wm_picks.py) bewusst als VOID markiert
  // wenn sie direktional widersprüchlich zum Hero sind — sie sollen NIRGENDS
  // angezeigt werden, weder Hero noch Secondary.
  const visiblePicks = picks.filter(p => !p.trackingExcluded);

  // Audit-Fix 06.06.2026: Smart-Sub-Picks (saferAltFor) gewinnen über BET/ABWÄGEN.
  // Wenn AH Aus +0.5 als safer-Alt zu DNB Aus markiert ist, soll AH Hero werden
  // auch wenn ABWÄGEN — niedrigere Quote = sicherere Wette bei vergleichbarer Edge.
  const allSorted = [...visiblePicks].sort((a, b) => {
    const aSafer = !!a.saferAltFor;
    const bSafer = !!b.saferAltFor;
    if (aSafer && !bSafer) return -1;
    if (bSafer && !aSafer) return 1;
    if (a.verdict === 'BET' && b.verdict !== 'BET') return -1;
    if (b.verdict === 'BET' && a.verdict !== 'BET') return 1;
    return (parseFloat(b.edgePP)||0) - (parseFloat(a.edgePP)||0);
  });
  const primary = allSorted[0] || null;
  if (!primary) return '';

  // BET/ABWÄGEN-Listen für Secondary-Rendering (Hero schon raus)
  const remainingPicks = allSorted.slice(1);
  const betPicks = primary.verdict === 'BET'
    ? [primary, ...remainingPicks.filter(p => p.verdict === 'BET')]
    : remainingPicks.filter(p => p.verdict === 'BET');
  const abwPicks = primary.verdict === 'ABWÄGEN'
    ? [primary, ...remainingPicks.filter(p => p.verdict === 'ABWÄGEN')]
    : remainingPicks.filter(p => p.verdict === 'ABWÄGEN');

  // ── Asym-Datenbasis-Check (Fix #2) ──
  const isAsym = primary.dataQuality === 'elo+form_asym' || primary.dataQuality === 'elo_only';
  const heroIsRisky = (parseFloat(primary.odds)||0) > 3.0;
  const allAsym = picks.every(p => p.verdict === 'WATCH'
    || p.dataQuality === 'elo+form_asym' || p.dataQuality === 'elo_only');

  // Wenn asym + Hero-Quote >3.0 + alle asym → als "Beobachtungs-Spiel" rendern
  if (allAsym && isAsym && heroIsRisky) {
    return `
      <div class="section" id="picks-section">
        <div class="sec-head">
          <span class="sec-ico">⏳</span>
          <span class="sec-title">Beobachtungs-Spiel</span>
          <span class="sec-tag" style="background:rgba(139,148,158,.12);border:1px solid rgba(139,148,158,.4);color:#8b949e;">DATEN UNVOLLSTÄNDIG</span>
        </div>
        <div style="background:rgba(255,165,0,.06);border:1px solid rgba(255,165,0,.30);border-radius:10px;padding:14px 18px;color:#e3b341;font-size:13px;line-height:1.55;">
          ⚠️ <strong>Form-Daten eines Teams fehlen.</strong> Das Modell stützt sich nur auf Elo + Form-Daten des Gegners — keine verlässliche Pick-Empfehlung. Sobald die fehlenden Form-Daten via API-Football reinkommen, wird das Spiel aktualisiert.
        </div>
      </div>`;
  }

  const isBet         = primary.verdict === 'BET';
  const badgeClass    = isBet ? 'bet' : 'abwaegen';
  const badgeLabel    = isBet ? '⚡ BET' : '📈 ABWÄGEN';
  const tagClass      = isBet ? 'green' : 'gold';
  const tagLabel      = isBet ? 'BET' : 'ABWÄGEN';

  // edge string (field is edgePP, not edge)
  const edgePp = primary.edgePP != null ? parseFloat(primary.edgePP) : null;
  const edgeStr = edgePp != null ? (edgePp >= 0 ? '+' : '') + edgePp.toFixed(1) + 'pp' : '';
  // stars derived from conf field
  const primaryStars = starsFromConf(primary.conf);

  const fairVal = primary.fairValue ? parseFloat(primary.fairValue).toFixed(2) : null;

  // Fix #4: Model vs Market bar — erweitert auf O/U, BTTS, DC, AH
  // Berechnet pModel + pMarket aus primary.modelOdds/odds wenn keine spezifischen
  // Probabilities verfügbar sind (z.B. für O/U-Markt)
  let modPct = null, mktPct = null;
  const mktLow = (primary.market || '').toLowerCase();
  if (mktLow.includes('heim') && !mktLow.includes('dnb') && !mktLow.includes('ah')) {
    modPct = D.modHome;  mktPct = D.probHome;
  } else if (mktLow.includes('auswärts') && !mktLow.includes('dnb') && !mktLow.includes('ah')) {
    modPct = D.modAway;  mktPct = D.probAway;
  } else if (mktLow.includes('unentsch')) {
    modPct = D.modDraw;  mktPct = D.probDraw;
  } else if (primary.modelOdds && primary.odds) {
    // Generischer Fallback für O/U, BTTS, DC, AH, DNB
    modPct = ((1 / parseFloat(primary.modelOdds)) * 100).toFixed(1);
    mktPct = ((1 / parseFloat(primary.odds)) * 100).toFixed(1);
  }

  let modelBarHtml = '';
  if (modPct != null && mktPct != null) {
    const topV = Math.max(parseFloat(modPct), parseFloat(mktPct), 10);
    const mW   = Math.min(100, (parseFloat(modPct) / topV * 100)).toFixed(1);
    const kW   = Math.min(100, (parseFloat(mktPct) / topV * 100)).toFixed(1);
    modelBarHtml = `
      <div class="model-bar-wrap">
        <div class="model-bar-labels">
          <span class="model-bar-lbl">Modell-Wahrsch.</span>
          <span class="model-bar-lbl">Markt-Impl.</span>
        </div>
        <div class="model-bar" style="height:6px;">
          <div class="mb-model" style="width:${mW}%;"></div>
          <div class="mb-market" style="width:${kW}%;opacity:.45;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:3px;">
          <span style="font-size:10px;color:#22c55e;font-weight:700;">${modPct}% Modell</span>
          <span style="font-size:10px;color:#888;">${mktPct}% Markt</span>
        </div>
      </div>`;
  }

  // Fix #3: Cross-Market-Filter — widersprüchliche Secondary-Picks ausfiltern
  const primaryDir = _PICK_DIRECTION_MAP[primary.market];
  const secBetAll = isBet ? betPicks.slice(1) : betPicks;
  const secAbwAll = isBet ? abwPicks : abwPicks.slice(1);
  const secAll    = [...secBetAll, ...secAbwAll];
  const secFiltered = secAll.filter(sp => {
    const dir = _PICK_DIRECTION_MAP[sp.market];
    if (!dir || !primaryDir) return true;
    return !_picksIncompatible(primaryDir, dir);
  });
  const secList = secFiltered.slice(0, 4);
  const filteredOutCount = secAll.length - secFiltered.length;

  let secHtml = '';
  for (const sp of secList) {
    const spVerdict = sp.verdict === 'BET' ? 'bet' : 'abwaegen';
    const spLabel   = sp.verdict === 'BET' ? '📈 BET' : '📊 ABWÄGEN';
    const spEdge    = sp.edgePP != null ? (parseFloat(sp.edgePP) >= 0 ? '+' : '') + parseFloat(sp.edgePP).toFixed(1) + 'pp' : '';
    const spFV      = sp.fairValue ? 'FV ' + parseFloat(sp.fairValue).toFixed(2) : '';
    const spDetail  = [spFV, spEdge ? spEdge + ' Edge' : ''].filter(Boolean).join(' · ');
    // Smart-Sub-Badge: 🛡️ wenn safer-alt — Abkürzungen DNB/AH/DC ausschreiben
    const _expandMarket = (m) => (m || '')
      .replace(/\bDNB\b/g, 'Draw No Bet')
      .replace(/\bAH\b/g, 'Asian Handicap')
      .replace(/\bDC\b/g, 'Doppelte Chance')
      .replace(/\bBTTS\b/g, 'Beide treffen');
    const saferBadge = sp.saferAltFor
      ? `<span style="background:rgba(76,201,240,.12);border:1px solid rgba(76,201,240,.4);color:#4cc9f0;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:6px;" title="Engine empfiehlt diese sicherere Variante anstelle der Original-Wette.">🛡️ Sicherere Variante (statt ${escHtml(_expandMarket(sp.saferAltFor))})</span>`
      : '';
    // Downgraded-Reason-Hinweis
    const dgr = sp.downgradedReason
      ? `<div style="font-size:10px;color:#e3b341;margin-top:3px;opacity:.85;">⤷ ${escHtml(sp.downgradedReason)}</div>`
      : '';
    secHtml += `
      <div class="pick-sec">
        <div>
          <div class="ps-badge ${spVerdict}">${spLabel}${saferBadge}</div>
          <div class="ps-name">${escHtml(sp.market || '')}</div>
          <div class="ps-detail">${escHtml(spDetail)}</div>
          ${dgr}
        </div>
        <div class="ps-odds">${sp.odds ? '@' + fmtOdds(sp.odds) : '—'}</div>
      </div>`;
  }
  if (filteredOutCount > 0) {
    secHtml += `<div style="font-size:10px;color:var(--sub);margin-top:8px;opacity:.6;text-align:center;">
      ${filteredOutCount} weitere ${filteredOutCount === 1 ? 'Pick wurde' : 'Picks wurden'} ausgeblendet
      (Konflikt mit Top-Pick-Richtung)
    </div>`;
  }

  // Fix #2: Asym-Pill + DowngradedReason für Primary-Pick
  const asymPill = isAsym
    ? `<span style="background:rgba(255,165,0,.10);border:1px solid rgba(255,165,0,.4);color:#ff8c00;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.3px;margin-left:8px;">⚠️ DATEN ASYM</span>`
    : '';
  const downgradedHtml = primary.downgradedReason
    ? `<div style="background:rgba(227,179,65,.07);border-left:3px solid #e3b341;padding:8px 12px;margin:10px 0;border-radius:4px;font-size:11px;color:#e3b341;line-height:1.5;">
         ⤷ ${escHtml(primary.downgradedReason)}
       </div>` : '';

  // Fix #1: Why-Modal-Button
  const why = _renderPickWhyButton(D, primary);

  return `
    <div class="section" id="picks-section">
      <div class="sec-head">
        <span class="sec-ico">🎯</span>
        <span class="sec-title">Top Pick</span>
        <span class="sec-tag ${tagClass}">${tagLabel}</span>
        ${asymPill}
      </div>

      <div class="pick-hero">
        <div class="ph-top">
          <div class="ph-left">
            <div class="ph-badges">
              <span class="ph-badge ${badgeClass}">${badgeLabel}</span>
              ${primaryStars ? `<span class="ph-badge stars">${starsStr(primaryStars)}</span>` : ''}
              ${edgeStr ? `<span class="ph-badge edge">${edgeStr} Edge</span>` : ''}
            </div>
            <div class="ph-name">${escHtml(primary.market || '')}</div>
            <div class="ph-detail">
              ${fairVal ? `FV <strong>${fairVal}</strong>` : ''}
              ${primary.odds ? (fairVal ? ' · ' : '') + 'Markt ' + fmtOdds(primary.odds) : ''}
              ${edgeStr ? ' · ' + edgeStr : ''}
            </div>
          </div>
          <div class="ph-odds-block">
            <div class="ph-odds">${primary.odds ? '@' + fmtOdds(primary.odds) : '—'}</div>
            ${primaryStars >= 3 ? '<div class="ph-conf">HIGH CONF</div>' : ''}
          </div>
        </div>

        <div class="signal-bar">
          <div class="sb-seg ${edgePp != null && edgePp > 0 ? 'green' : ''}">
            <span class="sb-lbl">Edge</span>
            <span class="sb-val">${edgeStr || '—'}</span>
          </div>
          <div class="sb-seg blue">
            <span class="sb-lbl">Verdikt</span>
            <span class="sb-val">${escHtml(primary.verdict || '—')}</span>
          </div>
          <div class="sb-seg orange">
            <span class="sb-lbl">Sterne</span>
            <span class="sb-val">${starsStr(primaryStars) || '—'}</span>
          </div>
        </div>

        ${modelBarHtml}

        ${downgradedHtml}

        ${primary.rationale ? `<div class="ph-rationale">${escHtml(primary.rationale)}</div>` : ''}

        <div class="pick-env-placeholder" data-market="${escHtml(primary.market||'')}"></div>

        ${why.button}

        <button class="bet-btn">Jetzt Wetten →</button>
      </div>

      ${secHtml}
    </div>`;
}

/* ── Odds & Sharp Radar section ──────────────────────────── */
function renderOdds(D) {
  if (!D.odds) return '';
  const o    = D.odds;
  const hist = D.oddsHistory || [];

  // Determine which outcome to highlight based on top BET pick
  const betPick = (D.picks || []).find(p => p.verdict === 'BET');
  const mktLow  = betPick ? (betPick.market || '').toLowerCase() : '';
  const hlHome  = mktLow.includes('heim') || mktLow.includes('home');
  const hlDraw  = mktLow.includes('unentsch') || mktLow.includes('draw');
  const hlAway  = mktLow.includes('auswärts') || mktLow.includes('away');

  // Alle drei Shifts als implied-probability-Änderung (pp) von Opening zu aktuell.
  // Einheitliche Basis: positiv = wahrscheinlicher geworden, negativ = unwahrscheinlicher.
  let homeShift = 0, drawShift = 0, awayShift = 0;
  if (hist.length >= 2) {
    const first = hist[0], last = hist[hist.length - 1];
    const toProb = (odds) => (odds && odds > 0) ? 100 / odds : null;
    const hwFirst = toProb(first.hw), hwLast = toProb(last.hw);
    const drFirst = toProb(first.dr), drLast = toProb(last.dr);
    const awFirst = toProb(first.aw), awLast = toProb(last.aw);
    homeShift = (hwFirst != null && hwLast != null) ? Math.round((hwLast - hwFirst) * 10) / 10 : 0;
    drawShift = (drFirst != null && drLast != null) ? Math.round((drLast - drFirst) * 10) / 10 : 0;
    awayShift = (awFirst != null && awLast != null) ? Math.round((awLast - awFirst) * 10) / 10 : 0;
  }

  function arrowTag(shift) {
    if (Math.abs(shift) < 0.1) return '';
    return shift > 0
      ? '<span class="oc-arrow up">↑</span>'
      : '<span class="oc-arrow down">↓</span>';
  }
  function barClass(shift) {
    if (Math.abs(shift) < 0.3) return 'stable';
    return shift > 0 ? 'sharp-in' : 'sharp-out';
  }
  function barWidth(shift) {
    return Math.min(88, 50 + Math.abs(shift) * 8);
  }
  function changeClass(shift) {
    if (Math.abs(shift) < 0.1) return 'flat';
    return shift > 0 ? 'up' : 'down';
  }
  function ppStr(shift) {
    if (Math.abs(shift) < 0.05) return '0.0pp';
    return (shift > 0 ? '+' : '') + shift.toFixed(1) + 'pp';
  }

  const snapCount = hist.length;
  const openLine  = snapCount > 0 && hist[0].hw
    ? `Open ${fmtOdds(hist[0].hw)} / ${fmtOdds(hist[0].dr)} / ${fmtOdds(hist[0].aw)}`
    : 'Kein Opening-Snapshot';

  // Secondary markets
  let secondaryHtml = '';
  if (o.over25 || o.under25 || o.btts) {
    secondaryHtml = '<div class="odds-grid-2">';
    if (o.over25) {
      secondaryHtml += `
        <div class="odds-card">
          <div class="oc-outcome">Over 2.5</div>
          <div class="oc-odds">${fmtOdds(o.over25)}</div>
          <div class="oc-impl">→ ${impliedProb(o.over25)}% impl.</div>
        </div>`;
    }
    if (o.btts) {
      secondaryHtml += `
        <div class="odds-card">
          <div class="oc-outcome">BTTS Ja</div>
          <div class="oc-odds">${fmtOdds(o.btts)}</div>
          <div class="oc-impl">→ ${impliedProb(o.btts)}% impl.</div>
        </div>`;
    }
    if (o.under25) {
      secondaryHtml += `
        <div class="odds-card">
          <div class="oc-outcome">Under 2.5</div>
          <div class="oc-odds">${fmtOdds(o.under25)}</div>
          <div class="oc-impl">→ ${impliedProb(o.under25)}% impl.</div>
        </div>`;
    }
    secondaryHtml += '</div>';
  }

  return `
    <div class="section">
      <div class="sec-head">
        <span class="sec-ico">📡</span>
        <span class="sec-title">Quoten &amp; Sharp Radar</span>
        <span class="sec-tag green"><span class="live-dot"></span>&nbsp;Live</span>
      </div>

      <div class="odds-grid">
        <div class="odds-card ${hlHome ? 'highlight' : ''}">
          <div class="oc-outcome">Heimsieg${hlHome ? ' ★' : ''}</div>
          <div class="oc-odds">${fmtOdds(o.home)}${arrowTag(homeShift)}</div>
          <div class="oc-impl">→ ${impliedProb(o.home)}% impl.</div>
        </div>
        <div class="odds-card ${hlDraw ? 'highlight' : ''}">
          <div class="oc-outcome">Unentsch.${hlDraw ? ' ★' : ''}</div>
          <div class="oc-odds">${fmtOdds(o.draw)}</div>
          <div class="oc-impl">→ ${impliedProb(o.draw)}% impl.</div>
        </div>
        <div class="odds-card ${hlAway ? 'highlight' : ''}">
          <div class="oc-outcome">Auswärts${hlAway ? ' ★' : ''}</div>
          <div class="oc-odds">${fmtOdds(o.away)}${arrowTag(awayShift)}</div>
          <div class="oc-impl">→ ${impliedProb(o.away)}% impl.</div>
        </div>
      </div>

      ${secondaryHtml}

      <div class="box">
        <div class="sharp-badge"><span class="live-dot"></span>&nbsp;${escHtml(openLine)} · ${snapCount} Snapshot${snapCount !== 1 ? 's' : ''}</div>
        <div class="sharp-row">
          <div class="sr-market">Heimsieg</div>
          <div class="sr-bar-wrap"><div class="sr-bar ${barClass(homeShift)}" style="width:${barWidth(homeShift)}%;"></div></div>
          <div class="sr-change ${changeClass(homeShift)}">
            <span class="sr-current">${fmtOdds(o.home)}</span>
            <span class="sr-move">${ppStr(homeShift)}</span>
          </div>
        </div>
        <div class="sharp-row">
          <div class="sr-market">Unentsch.</div>
          <div class="sr-bar-wrap"><div class="sr-bar ${barClass(drawShift)}" style="width:${barWidth(drawShift)}%;"></div></div>
          <div class="sr-change ${changeClass(drawShift)}">
            <span class="sr-current">${fmtOdds(o.draw)}</span>
            <span class="sr-move">${ppStr(drawShift)}</span>
          </div>
        </div>
        <div class="sharp-row">
          <div class="sr-market">Auswärts</div>
          <div class="sr-bar-wrap"><div class="sr-bar ${barClass(awayShift)}" style="width:${barWidth(awayShift)}%;"></div></div>
          <div class="sr-change ${changeClass(awayShift)}">
            <span class="sr-current">${fmtOdds(o.away)}</span>
            <span class="sr-move">${ppStr(awayShift)}</span>
          </div>
        </div>
        <div style="font-size:9px;color:#333;margin-top:10px;text-align:right;">${snapCount} Snapshot${snapCount !== 1 ? 's' : ''} · Powered by TheOddsAPI</div>
      </div>
    </div>`;
}

/* ── Elo & xG Matchup section ────────────────────────────── */
function renderEloXg(D) {
  const xgH = D.xgHome;
  const xgA = D.xgAway;
  const diff = D.eloDiff;

  const diffColor = diff > 0 ? '#22c55e' : diff < 0 ? '#ef4444' : '#aaa';
  const diffStr   = diff != null ? (diff >= 0 ? '+' : '') + Math.round(diff) : '—';

  const totalXg   = (xgH || 0) + (xgA || 0) || 1;
  const xgHPct    = ((xgH || 0) / totalXg * 100).toFixed(1);
  const xgAPct    = ((xgA || 0) / totalXg * 100).toFixed(1);

  return `
    <div class="section">
      <div class="sec-head">
        <span class="sec-ico">📊</span>
        <span class="sec-title">Elo &amp; xG Matchup</span>
      </div>

      <div class="box">
        <div class="elo-matchup">
          <div class="em-team">
            <div class="em-name">${safe(D.homeFlag,'')} ${escHtml(D.home || '')}</div>
            <div class="em-elo">${safe(D.homeElo, '—')}</div>
          </div>
          <div class="em-vs">ELO</div>
          <div class="em-team right">
            <div class="em-name">${escHtml(D.away || '')} ${safe(D.awayFlag,'')}</div>
            <div class="em-elo">${safe(D.awayElo, '—')}</div>
          </div>
        </div>

        <div style="text-align:center;margin-bottom:12px;">
          <span style="font-size:11px;color:var(--sub);">Elo-Differenz&nbsp;</span>
          <span style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:${diffColor};">${diffStr}</span>
          ${D.probHome != null ? `<span style="font-size:11px;color:var(--sub);"> → ${D.probHome}% Heimsieg-Wahrsch.</span>` : ''}
        </div>

        ${xgH != null || xgA != null ? `
        <div class="xg-bar-section">
          <div class="xg-lbl" style="display:flex;align-items:center;gap:6px;">
            <span>Erwartete Tore (xG)</span>
            ${D.xgSource === 'api_football' ? `<span style="font-size:9px;background:#1a3a2a;color:#22c55e;border:1px solid #22c55e44;border-radius:4px;padding:1px 5px;">API-Football ✓</span>` :
              D.xgSource === 'partial'      ? `<span style="font-size:9px;background:#1a2a3a;color:#60a5fa;border:1px solid #60a5fa44;border-radius:4px;padding:1px 5px;">Teilweise API</span>` :
                                              `<span style="font-size:9px;background:#2a2a2a;color:#888;border:1px solid #44444466;border-radius:4px;padding:1px 5px;">Poisson-Schätzung</span>`}
          </div>
          <div class="xg-bar-wrap">
            <div class="xg-val">${xgH != null ? xgH : '—'}</div>
            <div class="xg-track">
              <div class="xg-home-bar" style="width:${xgHPct}%;"></div>
              <div class="xg-away-bar" style="width:${xgAPct}%;"></div>
            </div>
            <div class="xg-val right">${xgA != null ? xgA : '—'}</div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:4px;">
            <span style="font-size:9px;color:#22c55e;">${escHtml(D.home || '')} xG</span>
            <span style="font-size:9px;color:#ef4444;">${escHtml(D.away || '')} xG</span>
          </div>
        </div>` : ''}
      </div>
    </div>`;
}

/* ── Form section ────────────────────────────────────────── */
function renderForm(D) {
  const hf = D.homeForm;
  const af = D.awayForm;
  if (!hf && !af) return '';

  function formCard(name, flag, f) {
    if (!f) return `
      <div class="form-card">
        <div class="form-team">${flag} ${escHtml(name)}</div>
        <div style="font-size:11px;color:var(--sub);">Keine Form-Daten</div>
      </div>`;

    const last5 = (f.last5 || []).slice(0, 5);
    const dots  = last5.map(r => {
      const c = r === 'W' ? 'w' : r === 'L' ? 'l' : 'd';
      return `<div class="fd ${c}">${r}</div>`;
    }).join('') || '<span style="color:var(--sub);font-size:11px;">—</span>';

    const stats = [
      f.avgScored    != null ? `<span class="fs">Ø Tore: <strong>${parseFloat(f.avgScored).toFixed(1)}</strong></span>` : '',
      f.avgConceded  != null ? `<span class="fs">Ø Geg.: <strong>${parseFloat(f.avgConceded).toFixed(1)}</strong></span>` : '',
      f.games        != null ? `<span class="fs">Sp.: <strong>${f.games}</strong></span>` : '',
      f.over25Rate   != null ? `<span class="fs">O2.5: <strong>${f.over25Rate}%</strong></span>` : '',
      f.bttsRate     != null ? `<span class="fs">BTTS: <strong>${f.bttsRate}%</strong></span>` : '',
    ].filter(Boolean).join('');

    return `
      <div class="form-card">
        <div class="form-team">${flag} ${escHtml(name)}</div>
        <div class="form-dots">${dots}</div>
        ${stats ? `<div class="form-stats">${stats}</div>` : ''}
      </div>`;
  }

  return `
    <div class="section">
      <div class="sec-head">
        <span class="sec-ico">📈</span>
        <span class="sec-title">Form (letzte 5 Spiele)</span>
      </div>
      <div class="form-grid">
        ${formCard(D.home || '', D.homeFlag || '', hf)}
        ${formCard(D.away || '', D.awayFlag || '', af)}
      </div>
    </div>`;
}

/* ── H2H section ─────────────────────────────────────────── */
function renderH2h(D) {
  const h = D.h2h;
  if (!h || !h.games) return '';

  const g    = h.games || 1;
  const hW   = h.homeWins || 0;
  const dr   = h.draws    || 0;
  const aW   = h.awayWins || 0;

  const hPct = ((hW / g) * 100).toFixed(0);
  const dPct = ((dr / g) * 100).toFixed(0);
  const aPct = ((aW / g) * 100).toFixed(0);

  const stats = [
    h.avgGoals   != null ? `<span class="hs">Ø Tore/Spiel: <strong>${parseFloat(h.avgGoals).toFixed(1)}</strong></span>` : '',
    h.over25Rate != null ? `<span class="hs">Over 2.5: <strong>${h.over25Rate}%</strong></span>` : '',
    h.bttsRate   != null ? `<span class="hs">BTTS: <strong>${h.bttsRate}%</strong></span>` : '',
  ].filter(Boolean).join('');

  return `
    <div class="section">
      <div class="sec-head">
        <span class="sec-ico">🔁</span>
        <span class="sec-title">Head-to-Head</span>
        <span class="sec-tag gold">${h.games} Spiele</span>
      </div>
      <div class="box">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:11px;">
          <span style="color:#22c55e;font-weight:700;">${safe(D.homeFlag,'')} ${escHtml(D.home||'')} <strong>${hW}W</strong></span>
          <span style="color:var(--gold);">Unentsch. <strong>${dr}</strong></span>
          <span style="color:#ef4444;font-weight:700;"><strong>${aW}W</strong> ${escHtml(D.away||'')} ${safe(D.awayFlag,'')}</span>
        </div>
        <div class="h2h-bar">
          <div class="h2h-home" style="width:${hPct}%;"></div>
          <div class="h2h-draw" style="width:${dPct}%;"></div>
          <div class="h2h-away" style="width:${aPct}%;"></div>
        </div>
        <div class="h2h-labels">
          <span>${hPct}%</span>
          <span>${dPct}%</span>
          <span>${aPct}%</span>
        </div>
        ${stats ? `<div class="h2h-stats">${stats}</div>` : ''}
      </div>
    </div>`;
}

/* ── Squad Spotlight section ─────────────────────────────── */
function renderSquads(D) {
  const squads = D.squads;
  if (!squads || Object.keys(squads).length === 0) return '';

  const homeS = squads[D.homeId];
  const awayS = squads[D.awayId];
  if (!homeS && !awayS) return '';

  const posLabel = (pos) => {
    const map = { ST:'Stürmer', CF:'Stürmer', FW:'Stürmer', LW:'Linksaußen', RW:'Rechtsaußen',
                  CAM:'Offensives Mittelfeld', AM:'Angreifer', CM:'Mittelfeld', MF:'Mittelfeld',
                  DM:'Defensives MF', CDM:'Defensives MF', LB:'Linksverteidiger', RB:'Rechtsverteidiger',
                  CB:'Innenverteidiger', DF:'Verteidiger', GK:'Torwart' };
    return map[(pos || '').toUpperCase()] || pos || '';
  };

  const playerCard = (team, flag, player) => {
    if (!player) return '';
    const goals   = player.goals   ?? '—';
    const assists = player.assists  ?? '—';
    const mins    = player.minutes;
    const per90   = (mins && player.goals != null && mins > 0)
      ? (player.goals / (mins / 90)).toFixed(2) : null;
    return `
      <div style="flex:1;min-width:140px;background:var(--bg-alt,rgba(255,255,255,0.04));border:1px solid var(--border,#30363d);border-radius:10px;padding:12px 14px;">
        <div style="font-size:10px;color:var(--muted,#8b949e);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">${escHtml(flag || '')} ${escHtml(team || '')} — Schlüsselspieler</div>
        <div style="font-size:15px;font-weight:800;color:var(--text,#e6edf3);margin-bottom:2px;">${escHtml(player.name || '?')}</div>
        <div style="font-size:11px;color:var(--muted,#8b949e);margin-bottom:8px;">${escHtml(posLabel(player.position))}</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <div style="text-align:center;">
            <div style="font-size:17px;font-weight:900;color:#22c55e;">${goals}</div>
            <div style="font-size:9px;color:var(--muted,#8b949e);text-transform:uppercase;">Tore</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:17px;font-weight:900;color:#60a5fa;">${assists}</div>
            <div style="font-size:9px;color:var(--muted,#8b949e);text-transform:uppercase;">Assists</div>
          </div>
          ${per90 ? `<div style="text-align:center;">
            <div style="font-size:17px;font-weight:900;color:#f0c040;">${per90}</div>
            <div style="font-size:9px;color:var(--muted,#8b949e);text-transform:uppercase;">Tore/90</div>
          </div>` : ''}
          ${mins ? `<div style="text-align:center;">
            <div style="font-size:14px;font-weight:700;color:var(--muted,#8b949e);">${mins}'</div>
            <div style="font-size:9px;color:var(--muted,#8b949e);text-transform:uppercase;">Minuten</div>
          </div>` : ''}
        </div>
      </div>`;
  };

  return `
    <div class="section">
      <div class="sec-head">
        <span class="sec-ico">⭐</span>
        <span class="sec-title">Schlüsselspieler</span>
        <span class="sec-tag gray">Stamm-Spieler</span>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        ${playerCard(D.home, D.homeFlag, homeS)}
        ${playerCard(D.away, D.awayFlag, awayS)}
      </div>
      <div style="margin-top:8px;font-size:10px;color:var(--muted,#8b949e);">Stats aus letzter Saison (Klub + Nationalteam)</div>
    </div>`;
}

/* ── Group Table section ─────────────────────────────────── */

  const teams = D.homeTeams;
  if (!teams || teams.length === 0) return '';

  const sorted = [...teams].sort((a, b) => (b.elo || 0) - (a.elo || 0));

  const rows = sorted.map(t => {
    const hi = (t.id === D.homeId || t.id === D.awayId);
    return `
      <tr class="gt-row ${hi ? 'highlight' : ''}">
        <td>
          <div class="gt-team">
            <span class="gt-flag">${t.flag || '🏳'}</span>
            <div>
              <div>${escHtml(t.name || t.id)}</div>
              <div class="gt-elo">Elo ${t.elo || '—'}</div>
            </div>
          </div>
        </td>
        <td>0</td><td>0</td><td>0</td>
      </tr>`;
  }).join('');

  return `
    <div class="section">
      <div class="sec-head">
        <span class="sec-ico">📋</span>

      </div>
      <div class="box">
        <table class="gruppe-table">

          </thead>
          <tbody>${rows}</tbody>
        </table>
        <div style="font-size:9px;color:#2a3a2a;margin-top:8px;text-align:center;">Turnier noch nicht gestartet · Elo-Reihenfolge</div>
