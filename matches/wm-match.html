<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080c10">
<title>WM 2026 — Match-Analyse</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c10;--card:#0f1419;--card2:#141b22;--card3:#1a2332;
  --border:#1e2d3d;--border2:#243040;
  --accent:#00d4a1;--red:#f85149;--yellow:#e3b341;
  --text:#e8edf3;--muted:#6b7a8d;--muted2:#8b9ab0;
  --green:#3fb950;--blue:#58a6ff;--purple:#a78bfa;
  --gold:#f0c040;--gold-dim:#f0c04018;--gold-border:#f0c04030;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:80px;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}

/* ── Nav ─────────────────────────────────────────────── */
.top-nav{background:rgba(8,12,16,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;gap:8px}
.nav-back{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted2);padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);transition:all .15s}
.nav-back:hover{color:var(--text);border-color:var(--border2)}
.nav-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.nav-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-border)}
.nav-matchday{font-size:11px;color:var(--muted);white-space:nowrap}

/* ── Hero ────────────────────────────────────────────── */
.hero{position:relative;background:linear-gradient(180deg,#0d1420 0%,#080c10 100%);border-bottom:1px solid var(--border);overflow:hidden;padding:28px 16px 20px}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 20% 50%,#00d4a108 0%,transparent 60%),radial-gradient(ellipse 60% 60% at 80% 50%,#f0c04006 0%,transparent 60%);pointer-events:none}
.hero-inner{position:relative;max-width:860px;margin:0 auto}
.hero-teams{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
.hero-team{flex:1;text-align:center}
.hero-team.home{text-align:right}.hero-team.away{text-align:left}
.team-flag{font-size:38px;display:block;margin-bottom:6px;line-height:1}
.hero-name{font-size:15px;font-weight:700;color:var(--text);line-height:1.2;margin-bottom:3px}
.hero-elo{font-size:11px;color:var(--muted)}
.hero-center{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 4px}
.hero-kickoff{font-size:11px;color:var(--muted);margin-top:4px;text-align:center;line-height:1.5}
.hero-donut-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;text-align:center;margin-bottom:2px}

/* Prob legend */
.prob-legend{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.prob-leg{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;border:1px solid}
.prob-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.pp-h{background:#00d4a110;color:#00d4a1;border-color:#00d4a130}.pp-h .prob-dot{background:#00d4a1}
.pp-d{background:#e3b34110;color:#e3b341;border-color:#e3b34130}.pp-d .prob-dot{background:#e3b341}
.pp-a{background:#a78bfa10;color:#a78bfa;border-color:#a78bfa30}.pp-a .prob-dot{background:#a78bfa}

/* ── Content wrapper ─────────────────────────────────── */
.content{max-width:860px;margin:0 auto;padding:0 12px}
.section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.section::before{content:'';position:absolute;top:0;left:0;width:3px;bottom:0;background:linear-gradient(180deg,var(--accent),transparent);border-radius:16px 0 0 16px}
.section.wm-gold::before{background:linear-gradient(180deg,var(--gold),transparent)}
.stitle{font-size:11px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sticon{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}

/* ── Upset Score ─────────────────────────────────────── */
.upset-card{border-radius:16px;padding:18px 20px;margin-bottom:14px;position:relative;overflow:hidden}
.upset-card.high{background:linear-gradient(135deg,#1a0800,#0f1419);border:1px solid #f8514930}
.upset-card.high::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#f85149,#e3b341,transparent)}
.upset-card.medium{background:linear-gradient(135deg,#140a00,#0f1419);border:1px solid #e3b34130}
.upset-card.medium::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#e3b341,transparent)}
.upset-inner{display:flex;align-items:center;gap:16px}
.upset-score-num{font-size:40px;font-weight:900;line-height:1;flex-shrink:0}
.upset-score-num.high{color:#f85149}
.upset-score-num.medium{color:#e3b341}
.upset-right{flex:1}
.upset-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.upset-label.high{color:#f85149}
.upset-label.medium{color:#e3b341}
.upset-sub{font-size:12px;color:var(--muted2);line-height:1.5}
.upset-dots{display:flex;gap:3px;margin-top:10px}
.upset-dot{width:18px;height:6px;border-radius:3px;background:#ffffff08}
.upset-dot.filled.high{background:#f85149}
.upset-dot.filled.medium{background:#e3b341}
.upset-dot.filled.low{background:#3fb950}

/* ── Tournament context ──────────────────────────────── */
.ctx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.ctx-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px}
.ctx-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.ctx-val{font-size:14px;font-weight:700;color:var(--text)}
.cohost-note{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:var(--gold-dim);border:1px solid var(--gold-border);font-size:12px;color:var(--gold);font-weight:600}

/* ── Pick cards ──────────────────────────────────────── */
.pick-card{border-radius:12px;padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden}
.pick-card.bet{background:linear-gradient(135deg,#001a13,#0a1419);border:1px solid #00d4a125}
.pick-card.bet::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:12px 0 0 12px}
.pick-card.abwaegen{background:linear-gradient(135deg,#1a1400,#0f1419);border:1px solid #e3b34125}
.pick-card.abwaegen::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--yellow);border-radius:12px 0 0 12px}
.pick-card.skip{background:var(--card2);border:1px solid var(--border);opacity:.65}
.pick-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px}
.pick-left{display:flex;align-items:flex-start;gap:10px}
.pick-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.pick-market{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px}
.pick-verdict-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.pick-verdict-label.bet{color:var(--accent)}
.pick-verdict-label.abwaegen{color:var(--yellow)}
.pick-verdict-label.skip{color:var(--muted)}
.pick-odds-big{text-align:right;flex-shrink:0}
.pick-odds-num{font-size:22px;font-weight:800;color:var(--text);line-height:1}
.pick-odds-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* Pick probability bar */
.pick-prob-row{margin-bottom:10px}
.pick-prob-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.pick-prob-labels{font-size:10px;color:var(--muted)}
.pick-prob-values{font-size:10px;font-weight:700;display:flex;gap:10px}
.pick-prob-track{height:7px;border-radius:4px;background:#ffffff08;overflow:hidden;position:relative}
.pick-prob-fill-mkt{height:100%;background:#ffffff15;position:absolute;top:0;left:0}
.pick-prob-fill-model{height:100%;background:var(--accent);opacity:.85;position:absolute;top:0;left:0}

/* Pick pills */
.pick-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{padding:4px 9px;border-radius:7px;font-size:11px;font-weight:600;border:1px solid;white-space:nowrap}
.p-bet{background:#00d4a110;border-color:#00d4a135;color:var(--accent)}
.p-edge{background:#3fb95012;border-color:#3fb95040;color:var(--green)}
.p-conf{background:#a78bfa08;border-color:#a78bfa30;color:var(--purple)}
.p-info{background:#ffffff06;border-color:var(--border2);color:var(--muted2)}

/* ── Stats / Form comparison ─────────────────────────── */
.stats-names{display:flex;justify-content:space-between;margin-bottom:12px}
.stats-name{font-size:13px;font-weight:700;color:var(--muted2);display:flex;align-items:center;gap:5px}
.sbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sbar-val{font-size:13px;font-weight:700;min-width:42px;text-align:right;white-space:nowrap}
.sbar-center{flex:1;min-width:0}
.sbar-label{font-size:10px;color:var(--muted);text-align:center;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.sbar-track{height:8px;border-radius:4px;overflow:hidden;background:#ffffff06;display:flex}

/* Last-5 form dots */
.form-dots{display:flex;gap:4px;flex-wrap:wrap}
.form-dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#080c10;flex-shrink:0}
.form-dot.W{background:var(--accent)}
.form-dot.D{background:var(--yellow)}
.form-dot.L{background:var(--red)}

/* ── H2H ─────────────────────────────────────────────── */
.h2h-kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.h2h-kpi{flex:1;min-width:58px;text-align:center;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 6px}
.kpi-val{font-size:20px;font-weight:800;color:var(--text);line-height:1}
.kpi-lbl{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.3}
.h2h-bar{height:10px;border-radius:5px;overflow:hidden;display:flex;margin-bottom:14px}
.h2h-bar-h{background:var(--accent)}
.h2h-bar-d{background:var(--yellow)}
.h2h-bar-a{background:var(--purple)}

/* ── Group table ─────────────────────────────────────── */
.group-table{width:100%;border-collapse:collapse;font-size:12px}
.group-table th{color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-size:10px;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--border);text-align:right}
.group-table th:first-child{text-align:left}
.group-table td{padding:8px 8px;border-bottom:1px solid var(--border);text-align:right;color:var(--muted2)}
.group-table td:first-child{text-align:left;color:var(--text);font-weight:600}
.group-table tr:last-child td{border-bottom:none}
.group-table tr.highlight td{color:var(--text)}
.gt-flag{font-size:14px;margin-right:4px}
.gt-elo{font-size:10px;color:var(--muted);font-weight:400}

/* ── Odds grid ───────────────────────────────────────── */
.odds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.ocard{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px}
.ocard-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.ocard-cur{font-size:20px;font-weight:800;color:var(--text);line-height:1;margin-bottom:4px}
.ocard-impl{font-size:10px;color:var(--muted2)}

/* ── Sharp Radar ─────────────────────────────────────── */
.radar-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.radar-pill{padding:5px 12px;border-radius:8px;font-size:11px;font-weight:700;border:1px solid}
.radar-pill.open{background:#58a6ff10;border-color:#58a6ff30;color:var(--blue)}
.radar-pill.current{background:#00d4a110;border-color:#00d4a130;color:var(--accent)}
.radar-pill.move-up{background:#f8514910;border-color:#f8514930;color:var(--red)}
.radar-pill.move-down{background:#3fb95010;border-color:#3fb95030;color:var(--green)}
.radar-pill.neutral{background:#ffffff06;border-color:var(--border2);color:var(--muted2)}
.radar-markets{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.radar-market{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.radar-market-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.radar-market-name{font-size:11px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px}
.radar-market-shift{font-size:11px;font-weight:700}
.radar-market-shift.up{color:var(--red)}
.radar-market-shift.down{color:var(--green)}
.radar-market-shift.flat{color:var(--muted)}
.radar-sparkline{height:36px;width:100%;position:relative}
.radar-sparkline svg{width:100%;height:100%;display:block;overflow:visible}
.radar-odds-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.radar-odds-open{font-size:10px;color:var(--muted)}
.radar-odds-cur{font-size:13px;font-weight:700;color:var(--text)}
.radar-odds-impl{font-size:10px;color:var(--muted2)}
.radar-snap-count{font-size:10px;color:var(--muted);margin-top:10px;text-align:right;font-style:italic}
.radar-nodata{font-size:12px;color:var(--muted);font-style:italic}

/* Loading / Error */
.state{max-width:480px;margin:80px auto;padding:0 20px;text-align:center}
.state-icon{font-size:40px;margin-bottom:16px}
.state-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px}
.state-sub{font-size:13px;color:var(--muted);line-height:1.6}
.spinner{width:32px;height:32px;border:3px solid #ffffff10;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Footer */
.page-footer{text-align:center;font-size:11px;color:var(--muted);margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}

/* Mobile */
@media(max-width:480px){
  .hero{padding:18px 12px}
  .hero-name{font-size:13px}
  .team-flag{font-size:30px}
  .section{padding:14px 12px}
  .pick-market{font-size:13px}
  .pick-odds-num{font-size:18px}
  .sbar-val{font-size:12px;min-width:34px}
  .kpi-val{font-size:17px}
  .h2h-kpi{min-width:52px;padding:8px 4px}
  .ctx-grid{grid-template-columns:repeat(2,1fr)}
  .odds-grid{grid-template-columns:repeat(3,1fr)}
  .prob-leg{font-size:10px;padding:3px 7px}
}
</style>
</head>
<body>

<div id="app">
  <div class="state">
    <div class="spinner"></div>
    <div class="state-title">WM-Analyse wird geladen…</div>
  </div>
</div>

<script>
// ── Donut SVG ──────────────────────────────────────────────────────────────
function donutSvg(h, d, a, size=130, stroke=13) {
  if (h == null || d == null || a == null) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${(size-stroke)/2}" fill="none" stroke="#ffffff08" stroke-width="${stroke}"/><text x="${size/2}" y="${size/2+5}" text-anchor="middle" font-size="11" fill="#6b7a8d" font-family="system-ui,sans-serif">n/a</text></svg>`;
  }
  const cx = cy = size/2, r = (size-stroke)/2, gap = 3;
  function arc(startDeg, spanDeg, color) {
    if (spanDeg < 2) return '';
    const s = (startDeg-90)*Math.PI/180, e = (startDeg+spanDeg-gap-90)*Math.PI/180;
    const x1=cx+r*Math.cos(s), y1=cy+r*Math.sin(s);
    const x2=cx+r*Math.cos(e), y2=cy+r*Math.sin(e);
    const lg = (spanDeg-gap)>180?1:0;
    return `<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${lg},1 ${x2.toFixed(2)},${y2.toFixed(2)}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"/>`;
  }
  const hd=h*3.6, dd=d*3.6, ad=a*3.6;
  const topVal=Math.max(h,d,a);
  const topColor=topVal===h?'#00d4a1':topVal===d?'#e3b341':'#a78bfa';
  const topLbl=topVal===h?'Heim':topVal===d?'Unent.':'Ausw.';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#ffffff08" stroke-width="${stroke}"/>
    ${arc(0,hd,'#00d4a1')}${arc(hd,dd,'#e3b341')}${arc(hd+dd,ad,'#a78bfa')}
    <text x="${cx}" y="${cy-8}" text-anchor="middle" font-size="9" fill="#6b7a8d" font-family="system-ui,sans-serif">${topLbl}</text>
    <text x="${cx}" y="${cy+8}" text-anchor="middle" font-size="17" font-weight="800" fill="${topColor}" font-family="system-ui,sans-serif">${topVal}%</text>
  </svg>`;
}

// ── Render: Nav + Hero ────────────────────────────────────────────────────
function renderHero(D) {
  const h = D.probHome, dr = D.probDraw, a = D.probAway;
  const hLabel = D.home.split(' ').at(-1);
  const aLabel = D.away.split(' ').at(-1);
  const kickoff = [D.date, D.time].filter(Boolean).join(' · ');
  const probLegend = (h != null) ? `
<div class="prob-legend">
  <div class="prob-leg pp-h"><div class="prob-dot"></div>${hLabel} ${h}%</div>
  <div class="prob-leg pp-d"><div class="prob-dot"></div>Unent. ${dr}%</div>
  <div class="prob-leg pp-a"><div class="prob-dot"></div>${aLabel} ${a}%</div>
</div>` : '';

  return `
<nav class="top-nav">
  <a class="nav-back" href="../betting-dashboard.html">← Dashboard</a>
  <div class="nav-right">
    <span class="nav-badge">⚽ WM 2026 · ${D.groupName}</span>
    <span class="nav-matchday">Spieltag ${D.matchday}</span>
  </div>
</nav>
<div class="hero">
  <div class="hero-inner">
    <div class="hero-teams">
      <div class="hero-team home">
        <span class="team-flag">${D.homeFlag}</span>
        <div class="hero-name">${D.home}</div>
        <div class="hero-elo">Elo ${D.homeElo}</div>
      </div>
      <div class="hero-center">
        <div class="hero-donut-label">Markt-Wahrsch.</div>
        ${donutSvg(h, dr, a)}
        <div class="hero-kickoff">${kickoff}${D.venue ? '<br><span style="font-size:10px">' + D.venue + '</span>' : ''}</div>
      </div>
      <div class="hero-team away">
        <span class="team-flag">${D.awayFlag}</span>
        <div class="hero-name">${D.away}</div>
        <div class="hero-elo">Elo ${D.awayElo}</div>
      </div>
    </div>
    ${probLegend}
  </div>
</div>`;
}

// ── Render: Upset Score ───────────────────────────────────────────────────
function renderUpsetScore(D) {
  const score = D.upsetScore || 0;
  if (score < 3) return '';
  const isHigh = score >= 6;
  const cls = isHigh ? 'high' : 'medium';
  const label = isHigh ? '🔥 Hohes Upset-Potenzial' : '⚠️ Moderates Upset-Potenzial';
  const gapAbs = Math.abs(D.eloDiff);
  const sub = `Elo-Differenz: ${gapAbs} Punkte (${D.home} ${D.homeElo} · ${D.away} ${D.awayElo})`;
  const dots = Array.from({length:10}, (_,i) =>
    `<div class="upset-dot${i < score ? ' filled '+cls : ''}"></div>`
  ).join('');
  return `
<div class="content">
<div class="upset-card ${cls}">
  <div class="upset-inner">
    <div class="upset-score-num ${cls}">${score}</div>
    <div class="upset-right">
      <div class="upset-label ${cls}">${label}</div>
      <div class="upset-sub">${sub}</div>
      <div class="upset-dots">${dots}</div>
    </div>
  </div>
</div>
</div>`;
}

// ── Render: Tournament Context ────────────────────────────────────────────
function renderContext(D) {
  const cohostHtml = D.coHostBonus ? `
<div class="cohost-note">🏟️ Co-Host-Bonus: ${D.coHostTeam} spielt im Heimstadion</div>` : '';
  const oddsHtml = D.odds ? (() => {
    const o = D.odds;
    const cards = [
      o.home  != null ? {l:'Heimsieg',  v:o.home}  : null,
      o.draw  != null ? {l:'Unentsch.', v:o.draw}  : null,
      o.away  != null ? {l:'Auswärts',  v:o.away}  : null,
      o.over25  != null ? {l:'Over 2.5',   v:o.over25}  : null,
      o.under25 != null ? {l:'Under 2.5',  v:o.under25} : null,
      o.btts    != null ? {l:'BTTS',       v:o.btts}    : null,
    ].filter(Boolean);
    if (!cards.length) return '';
    return `<div class="stitle" style="margin-top:14px"><div class="sticon" style="background:#e3b34115;border:1px solid #e3b34130">📈</div>Aktuelle Quoten</div>
<div class="odds-grid">${cards.map(c => {
      const impl = c.v > 1 ? Math.round(100/c.v) + '%' : '';
      return `<div class="ocard">
  <div class="ocard-label">${c.l}</div>
  <div class="ocard-cur">${c.v.toFixed(2)}</div>
  ${impl ? `<div class="ocard-impl">→ ${impl} impl.</div>` : ''}
</div>`;
    }).join('')}</div>`;
  })() : '';

  return `
<div class="content">
<div class="section wm-gold">
  <div class="stitle"><div class="sticon" style="background:var(--gold-dim);border:1px solid var(--gold-border)">🏆</div>Turnier-Kontext</div>
  <div class="ctx-grid">
    <div class="ctx-card"><div class="ctx-label">Gruppe</div><div class="ctx-val">${D.groupName}</div></div>
    <div class="ctx-card"><div class="ctx-label">Spieltag</div><div class="ctx-val">${D.matchday} / 3</div></div>
    <div class="ctx-card"><div class="ctx-label">Datum</div><div class="ctx-val">${D.date}</div></div>
    <div class="ctx-card"><div class="ctx-label">Anstoß</div><div class="ctx-val">${D.time || '—'}</div></div>
  </div>
  ${D.venue ? `<div style="font-size:12px;color:var(--muted2);margin-bottom:10px">📍 ${D.venue}</div>` : ''}
  ${cohostHtml}
  ${oddsHtml}
</div>
</div>`;
}

// ── Render: Picks ─────────────────────────────────────────────────────────
function renderPicks(D) {
  const picks = D.picks || [];
  const ordered = [
    ...picks.filter(p => (p.verdict||'').toUpperCase() === 'BET'),
    ...picks.filter(p => (p.verdict||'').toUpperCase() === 'ABWÄGEN' || (p.verdict||'').toUpperCase() === 'ABWAEGEN'),
    ...picks.filter(p => !['BET','ABWÄGEN','ABWAEGEN'].includes((p.verdict||'').toUpperCase())),
  ];
  if (!ordered.length) return '';

  const cards = ordered.map(pick => {
    const verdict = (pick.verdict || '').toUpperCase();
    const isbet   = verdict === 'BET';
    const isabw   = verdict === 'ABWÄGEN' || verdict === 'ABWAEGEN';
    const cls     = isbet ? 'bet' : isabw ? 'abwaegen' : 'skip';
    const vLabel  = isbet ? '⚡ BET' : isabw ? '⚖️ ABWÄGEN' : '— SKIP';
    const odds    = pick.odds;
    const mo      = pick.modelOdds;

    let mktProb = null, modProb = null;
    if (odds && odds > 1) mktProb = Math.round(100 / odds);
    if (mo   && mo   > 1) modProb = Math.round(100 / mo);

    const probBar = (modProb || mktProb) ? `
<div class="pick-prob-row">
  <div class="pick-prob-head">
    <span class="pick-prob-labels">Modell vs. Markt-impl.</span>
    <div class="pick-prob-values">
      ${modProb != null ? `<span style="color:var(--accent)">${modProb}% Modell</span>` : ''}
      ${mktProb != null ? `<span style="color:var(--muted2)">${mktProb}% Markt</span>` : ''}
    </div>
  </div>
  <div class="pick-prob-track">
    ${mktProb != null ? `<div class="pick-prob-fill-mkt" style="width:${mktProb}%"></div>` : ''}
    ${modProb != null ? `<div class="pick-prob-fill-model" style="width:${modProb}%"></div>` : ''}
  </div>
</div>` : '';

    let pills = '';
    if (isbet) pills += `<span class="pill p-bet">⚡ BET</span>`;
    if (pick.edgePP != null && pick.edgePP > 0) pills += `<span class="pill p-edge">+${pick.edgePP}pp Edge</span>`;
    const confLabel = pick.conf === 'high' ? '★★★ HIGH' : pick.conf === 'medium' ? '★★ MEDIUM' : pick.conf || '';
    if (confLabel) pills += `<span class="pill p-conf">${confLabel}</span>`;
    if (pick.info) pills += `<span class="pill p-info">${pick.info}</span>`;

    return `<div class="pick-card ${cls}">
  <div class="pick-header">
    <div class="pick-left">
      <div class="pick-icon">${pick.icon || '🎯'}</div>
      <div>
        <div class="pick-market">${pick.market || ''}</div>
        <div class="pick-verdict-label ${cls}">${vLabel}</div>
      </div>
    </div>
    <div class="pick-odds-big">
      <div class="pick-odds-num">${odds != null ? odds.toFixed(2) : '—'}</div>
      <div class="pick-odds-lbl">Quote</div>
    </div>
  </div>
  ${probBar}
  <div class="pick-pills">${pills || '<span class="pill p-info" style="opacity:.5">Keine Zusatzinfo</span>'}</div>
</div>`;
  }).join('');

  return `
<div class="content">
<div class="section">
  <div class="stitle"><div class="sticon" style="background:#00d4a115;border:1px solid #00d4a130">🎯</div>Picks</div>
  ${cards}
</div>
</div>`;
}

// ── Render: Form comparison ───────────────────────────────────────────────
function renderForm(D) {
  const hf = D.homeForm, af = D.awayForm;
  if (!hf && !af) return '';

  function formDots(last5) {
    return (last5 || []).map(r =>
      `<div class="form-dot ${r}">${r}</div>`
    ).join('');
  }

  function sbar(label, hv, av, higherBetter=true) {
    if (hv == null && av == null) return '';
    const tot = (hv||0) + (av||0);
    const hBar = tot > 0 ? Math.round((hv||0)/tot*100) : 50;
    const hWin = hv != null && av != null && (higherBetter ? hv > av : hv < av);
    const aWin = hv != null && av != null && !hWin && hv !== av;
    const hc = hWin ? 'var(--accent)' : '#8b949e';
    const ac = aWin ? 'var(--accent)' : '#8b949e';
    const fmt = v => v == null ? '—' : (Number.isInteger(v) ? v : parseFloat(v).toFixed(1));
    return `<div class="sbar">
  <span class="sbar-val" style="color:${hc}">${fmt(hv)}</span>
  <div class="sbar-center">
    <div class="sbar-label">${label}</div>
    <div class="sbar-track">
      <div style="width:${hBar}%;height:100%;background:${hc === 'var(--accent)' ? '#00d4a120' : '#ffffff08'};border-right:2px solid ${hc}"></div>
      <div style="width:${100-hBar}%;height:100%;background:${ac === 'var(--accent)' ? '#00d4a120' : '#ffffff08'};border-left:2px solid ${ac}"></div>
    </div>
  </div>
  <span class="sbar-val" style="color:${ac};text-align:left">${fmt(av)}</span>
</div>`;
  }

  const hLast5 = hf ? formDots(hf.last5) : '';
  const aLast5 = af ? formDots(af.last5) : '';

  const barsHtml = [
    sbar('∅ Tore/Spiel',      hf?.avgGoals,     af?.avgGoals),
    sbar('∅ Geschossen',      hf?.avgScored,    af?.avgScored),
    sbar('∅ Kassiert',        hf?.avgConceded,  af?.avgConceded, false),
    sbar('Over 2.5 Rate (%)', hf?.over25Rate,   af?.over25Rate),
    sbar('BTTS Rate (%)',     hf?.bttsRate,     af?.bttsRate),
  ].filter(Boolean).join('');

  return `
<div class="content">
<div class="section">
  <div class="stitle"><div class="sticon" style="background:#58a6ff15;border:1px solid #58a6ff30">📊</div>Form-Vergleich</div>
  <div class="stats-names">
    <span class="stats-name">${D.homeFlag} ${D.home}</span>
    <span class="stats-name">${D.away} ${D.awayFlag}</span>
  </div>
  ${(hLast5 || aLast5) ? `
<div style="display:flex;justify-content:space-between;margin-bottom:14px;gap:8px">
  <div>
    <div style="font-size:10px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px">Letzte 5</div>
    <div class="form-dots">${hLast5 || '<span style="color:var(--muted);font-size:11px">keine Daten</span>'}</div>
  </div>
  <div style="text-align:right">
    <div style="font-size:10px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px">Letzte 5</div>
    <div class="form-dots" style="justify-content:flex-end">${aLast5 || '<span style="color:var(--muted);font-size:11px">keine Daten</span>'}</div>
  </div>
</div>` : ''}
  ${barsHtml || '<div style="font-size:12px;color:var(--muted);font-style:italic">Formdaten noch nicht verfügbar.</div>'}
  ${hf?.games ? `<div style="font-size:10px;color:var(--muted);margin-top:8px">Datenbasis: ${hf.games} Spiele</div>` : ''}
</div>
</div>`;
}

// ── Render: H2H ───────────────────────────────────────────────────────────
function renderH2H(D) {
  const h = D.h2h;
  if (!h || !h.games) return '';
  const g = h.games || 1;
  return `
<div class="content">
<div class="section">
  <div class="stitle"><div class="sticon" style="background:#a78bfa15;border:1px solid #a78bfa30">🔄</div>Direktvergleich (H2H)</div>
  <div class="h2h-kpis">
    <div class="h2h-kpi"><div class="kpi-val" style="color:#00d4a1">${h.homeWins}</div><div class="kpi-lbl">${D.home.split(' ').at(-1)}<br>Siege</div></div>
    <div class="h2h-kpi"><div class="kpi-val" style="color:#e3b341">${h.draws}</div><div class="kpi-lbl">Unent-<br>schieden</div></div>
    <div class="h2h-kpi"><div class="kpi-val" style="color:#a78bfa">${h.awayWins}</div><div class="kpi-lbl">${D.away.split(' ').at(-1)}<br>Siege</div></div>
    <div class="h2h-kpi"><div class="kpi-val">${h.avgGoals != null ? parseFloat(h.avgGoals).toFixed(1) : '—'}</div><div class="kpi-lbl">∅ Tore<br>/Spiel</div></div>
    ${h.over25Rate != null ? `<div class="h2h-kpi"><div class="kpi-val">${h.over25Rate}%</div><div class="kpi-lbl">Over<br>2.5</div></div>` : ''}
    ${h.bttsRate   != null ? `<div class="h2h-kpi"><div class="kpi-val">${h.bttsRate}%</div><div class="kpi-lbl">BTTS<br>Rate</div></div>` : ''}
  </div>
  <div class="h2h-bar">
    <div class="h2h-bar-h" style="width:${h.homeBar}%"></div>
    <div class="h2h-bar-d" style="width:${h.drawBar}%"></div>
    <div class="h2h-bar-a" style="width:${h.awayBar}%"></div>
  </div>
  <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted)">
    <span style="color:#00d4a1">${Math.round(h.homeWins/g*100)}% ${D.home.split(' ').at(-1)}</span>
    <span style="color:#e3b341">${Math.round(h.draws/g*100)}% X</span>
    <span style="color:#a78bfa">${Math.round(h.awayWins/g*100)}% ${D.away.split(' ').at(-1)}</span>
  </div>
  <div style="font-size:10px;color:var(--muted);margin-top:8px">Aus ${h.games} Direktduellen · Perspektive: ${D.home}</div>
</div>
</div>`;
}

// ── Render: Group Table ───────────────────────────────────────────────────
function renderGroupTable(D) {
  const teams = D.homeTeams || [];
  const fixtures = D.groupFixtures || [];
  if (!teams.length) return '';

  // Calculate standings from fixture results
  const pts = {}, played = {}, gf = {}, ga = {}, wins = {}, draws = {}, losses = {};
  teams.forEach(t => {
    pts[t.id] = 0; played[t.id] = 0;
    gf[t.id] = 0; ga[t.id] = 0;
    wins[t.id] = 0; draws[t.id] = 0; losses[t.id] = 0;
  });

  fixtures.forEach(fx => {
    const r = fx.result;
    if (!r || r.home == null || r.away == null) return;
    const h = fx.home, a = fx.away;
    played[h] = (played[h]||0)+1; played[a] = (played[a]||0)+1;
    gf[h] = (gf[h]||0)+r.home;   ga[h] = (ga[h]||0)+r.away;
    gf[a] = (gf[a]||0)+r.away;   ga[a] = (ga[a]||0)+r.home;
    if (r.home > r.away)       { pts[h]=(pts[h]||0)+3; wins[h]=(wins[h]||0)+1; losses[a]=(losses[a]||0)+1; }
    else if (r.home < r.away)  { pts[a]=(pts[a]||0)+3; wins[a]=(wins[a]||0)+1; losses[h]=(losses[h]||0)+1; }
    else                       { pts[h]=(pts[h]||0)+1; pts[a]=(pts[a]||0)+1; draws[h]=(draws[h]||0)+1; draws[a]=(draws[a]||0)+1; }
  });

  // Sort by pts → goal diff → goals for → elo
  const sorted = [...teams].sort((a, b) => {
    const pdiff = (pts[b.id]||0) - (pts[a.id]||0);
    if (pdiff !== 0) return pdiff;
    const gdA = (gf[a.id]||0) - (ga[a.id]||0);
    const gdB = (gf[b.id]||0) - (ga[b.id]||0);
    if (gdB !== gdA) return gdB - gdA;
    const gfDiff = (gf[b.id]||0) - (gf[a.id]||0);
    if (gfDiff !== 0) return gfDiff;
    return (b.elo||0) - (a.elo||0);
  });

  const hasResults = fixtures.some(fx => fx.result && fx.result.home != null);
  const tbody = sorted.map((t, i) => {
    const isMatch = t.id === D.homeId || t.id === D.awayId;
    const gdVal = (gf[t.id]||0) - (ga[t.id]||0);
    const gdStr = gdVal > 0 ? `+${gdVal}` : `${gdVal}`;
    return `<tr${isMatch ? ' class="highlight"' : ''}>
  <td><span class="gt-flag">${t.flag}</span>${t.name} <span class="gt-elo">${t.elo}</span></td>
  ${hasResults ? `<td>${played[t.id]||0}</td><td>${wins[t.id]||0}</td><td>${draws[t.id]||0}</td><td>${losses[t.id]||0}</td><td>${gdStr}</td>` : ''}
  <td style="color:var(--gold);font-weight:700">${pts[t.id]||0}</td>
</tr>`;
  }).join('');

  return `
<div class="content">
<div class="section wm-gold">
  <div class="stitle"><div class="sticon" style="background:var(--gold-dim);border:1px solid var(--gold-border)">🏅</div>${D.groupName} — Tabelle</div>
  <div style="overflow-x:auto">
  <table class="group-table">
    <thead><tr>
      <th>Team</th>
      ${hasResults ? '<th>Sp</th><th>S</th><th>U</th><th>N</th><th>TD</th>' : ''}
      <th>Pkt</th>
    </tr></thead>
    <tbody>${tbody}</tbody>
  </table>
  </div>
  ${!hasResults ? '<div style="font-size:10px;color:var(--muted);margin-top:8px;font-style:italic">Turnier noch nicht gestartet — Elo-Reihenfolge</div>' : ''}
</div>
</div>`;
}

// ── Render: Sharp Radar ────────────────────────────────────────────────────
function renderSharpRadar(D) {
  const history = D.oddsHistory || [];
  const oddsOpen = D.oddsOpen;
  const oddsCur  = D.odds;

  if (!oddsCur && (!history || history.length === 0)) return '';

  function implProb(o) {
    if (!o || o <= 0) return null;
    return Math.round(100 / o * 10) / 10;
  }

  function sparkline(values, width=280, height=36) {
    if (!values || values.length < 2) return '';
    const min = Math.min(...values) * 0.99;
    const max = Math.max(...values) * 1.01;
    const range = max - min || 1;
    const pts = values.map((v, i) => {
      const x = i / (values.length - 1) * width;
      const y = height - ((v - min) / range) * height;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    const first = values[0], last = values[values.length - 1];
    const color = last < first ? '#f85149' : last > first ? '#3fb950' : '#8b9ab0';
    return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
  <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
  <circle cx="${values.map((v,i)=>i/(values.length-1)*width).at(-1).toFixed(1)}" cy="${(height-((last-min)/range)*height).toFixed(1)}" r="3" fill="${color}"/>
</svg>`;
  }

  function shiftPill(totalShift) {
    if (Math.abs(totalShift) < 1) return '<span class="radar-pill neutral">➡️ Stabil</span>';
    if (totalShift > 5) return `<span class="radar-pill move-up">⬆️ +${totalShift.toFixed(1)}pp Sharp</span>`;
    if (totalShift < -5) return `<span class="radar-pill move-down">⬇️ ${totalShift.toFixed(1)}pp Gestiegen</span>`;
    if (totalShift > 0) return `<span class="radar-pill move-up">⬆️ +${totalShift.toFixed(1)}pp</span>`;
    return `<span class="radar-pill move-down">⬇️ ${totalShift.toFixed(1)}pp</span>`;
  }

  // Total shift seit Open
  function totalShift(openO, curO) {
    const op = implProb(openO), cp = implProb(curO);
    if (!op || !cp) return 0;
    return parseFloat((cp - op).toFixed(1));
  }

  // Market blocks
  const markets = [
    { key: 'hw', label: 'Heimsieg',      openO: oddsOpen?.hw, curO: oddsCur?.home },
    { key: 'dr', label: 'Unentschieden', openO: oddsOpen?.dr, curO: oddsCur?.draw },
    { key: 'aw', label: 'Auswärtssieg',  openO: oddsOpen?.aw, curO: oddsCur?.away },
  ].filter(m => m.curO);

  const marketHtml = markets.map(m => {
    const histVals = history.map(s => s[m.key]).filter(Boolean);
    const spark = sparkline(histVals);
    const ts = totalShift(m.openO, m.curO);
    const tsClass = ts > 0 ? 'up' : ts < 0 ? 'down' : 'flat';
    const tsStr = ts > 0 ? `+${ts.toFixed(1)}pp` : `${ts.toFixed(1)}pp`;
    const curImpl = implProb(m.curO);
    const openImpl = implProb(m.openO);

    return `<div class="radar-market">
  <div class="radar-market-head">
    <span class="radar-market-name">${m.label}</span>
    <span class="radar-market-shift ${tsClass}">${m.openO ? tsStr : '—'}</span>
  </div>
  ${histVals.length >= 2 ? `<div class="radar-sparkline">${spark}</div>` : ''}
  <div class="radar-odds-row">
    <span class="radar-odds-open">${m.openO ? `Open: ${m.openO.toFixed(2)} (${openImpl}%)` : 'Kein Open'}</span>
    <div style="text-align:right">
      <div class="radar-odds-cur">${m.curO ? m.curO.toFixed(2) : '—'}</div>
      <div class="radar-odds-impl">${curImpl ? curImpl + '%' : ''}</div>
    </div>
  </div>
</div>`;
  }).join('');

  // Overall status pill
  const hwShift = totalShift(oddsOpen?.hw, oddsCur?.home);
  const awShift = totalShift(oddsOpen?.aw, oddsCur?.away);
  const biggestShift = Math.abs(hwShift) > Math.abs(awShift) ? hwShift : awShift;

  const openPill = oddsOpen
    ? `<span class="radar-pill open">📍 Open ${oddsOpen.hw?.toFixed(2)} / ${oddsOpen.dr?.toFixed(2)} / ${oddsOpen.aw?.toFixed(2)}</span>`
    : '';

  return `
<div class="content">
<div class="section">
  <div class="stitle"><div class="sticon" style="background:#f8514915;border:1px solid #f8514930">📡</div>Sharp Radar</div>
  <div class="radar-meta">
    ${openPill}
    ${shiftPill(biggestShift)}
  </div>
  <div class="radar-markets">${marketHtml || '<div class="radar-nodata">Noch keine Odds-Daten verfügbar.</div>'}</div>
  ${history.length > 0 ? `<div class="radar-snap-count">${history.length} Snapshot${history.length !== 1 ? 's' : ''} · Powered by TheOddsAPI</div>` : ''}
</div>
</div>`;
}

// ── Bootstrap ──────────────────────────────────────────────────────────────
async function init() {
  const slug = new URLSearchParams(location.search).get('m');
  if (!slug) {
    document.getElementById('app').innerHTML = `<div class="state">
      <div class="state-icon">⚠️</div>
      <div class="state-title">Kein Match angegeben</div>
      <div class="state-sub">URL-Parameter <code>?m=slug</code> fehlt.<br>
        <a href="../betting-dashboard.html">← Zurück zum Dashboard</a></div>
    </div>`;
    return;
  }

  let D;
  try {
    const res = await fetch(`data/${slug}.json`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    D = await res.json();
  } catch(e) {
    document.getElementById('app').innerHTML = `<div class="state">
      <div class="state-icon">🔍</div>
      <div class="state-title">Daten nicht gefunden</div>
      <div class="state-sub">Für <strong>${slug}</strong> liegt noch keine WM-Analyse vor.<br>
        <a href="../betting-dashboard.html">← Zurück zum Dashboard</a></div>
    </div>`;
    return;
  }

  document.title = `${D.home} vs ${D.away} · WM 2026 — CocoBet`;

  document.getElementById('app').innerHTML = `
${renderHero(D)}
${renderUpsetScore(D)}
${renderContext(D)}
${renderPicks(D)}
${renderSharpRadar(D)}
${renderForm(D)}
${renderH2H(D)}
${renderGroupTable(D)}
<div class="content">
<div class="page-footer">
  WM 2026 · ${D.groupName} · Spieltag ${D.matchday} · Generiert: ${D.generatedAt}<br>
  <a href="../betting-dashboard.html">← Zurück zum Dashboard</a>
</div>
</div>`;
}

init();
</script>
