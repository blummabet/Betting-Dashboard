name: 📋 WM Lineup-Watcher (T-1h Hot-Cron)

# Hochfrequenter Watcher der NUR fetch_wm_lineups.py ausführt.
# Während Match-Hours (09:00-23:00 UTC) alle 15 min.
# Damit kein WM-Spiel das T-1h-Lineup-Fenster verpasst, egal welche Anpfiff-Zeit
# (auch Nachtspiele 1/4/6 Uhr Wien Zeit werden zuverlässig abgedeckt).
#
# Dedup über wm_lineup_alerts.json — pro fixture+team+status nur einmal alarmen.
# API-Last: max ~56 Runs × 1-3 Calls = ~150 Calls/Tag → bei 75k Limit egal.
#
# Nach WM: Cron lockern (alle 30 min reicht für reguläre Liga-Spielzeiten).

on:
  # 20.07.2026 WM-WINTERISIERUNG: WM beendet → Lineup-Watcher pausiert (keine Aufstellungen mehr).
  # Reaktivieren für WM 2030 / Testläufe: einkommentieren.
  # schedule:
  #   # 09:00-23:00 UTC alle 15 min — covered alle WM-Anpfiffe inkl. Nachtspiele
  #   - cron: '*/15 9-23 * * *'

  # Manuell triggerbar für Tests
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # AUDIT-Fix 08.06.2026: Eigene Group statt fetch-wm-data.
  # Vorher: 15-min-Cron-Watcher blockierte ständig fetch-wm-data (10-20min Laufzeit).
  # Jetzt: lineup-watcher läuft unabhängig. Er schreibt NUR wm_lineups.json +
  # wm_lineup_alerts.json — keine Konflikte mit wm2026-data.json (das er nur liest).
  # cancel-in-progress: true damit ein neuer 15-min-Tick einen hängenden Run beendet.
  group: wm-lineup-watcher
  cancel-in-progress: true

jobs:
  fetch-lineups:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📋 Lineups fetchen + Telegram-Alert
        run: python fetch_wm_lineups.py
        continue-on-error: true
        env:
          APISPORTS_KEY:           ${{ secrets.APISPORTS_KEY }}
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      # NEU 11.06.2026: Picks neu generieren, WENN neue Aufstellungen reinkamen.
      # Vorher holte der Watcher nur Lineups + Telegram-Alert — das 📋-Lineup-
      # Signal floss aber NICHT in die Cards (erst beim 5×/Tag fetch-wm-data-Cron,
      # der oft erst nach Anpfiff lief). Jetzt: bei neuer Lineup-Datei sofort
      # generate_wm_picks → Lineup-Signal landet in Echtzeit auf der Card + Conviction.
      - name: 🎯 Picks neu generieren bei neuen Lineups
        run: |
          if ! git diff --quiet -- wm_lineups.json 2>/dev/null; then
            echo "📋 Neue Aufstellungen erkannt → generate_wm_picks läuft"
            python generate_wm_picks.py || true
            # 21.06.2026: Event-Page-Payloads sofort mit-neu-bauen, damit das
            # Aufstellungs-Signal auch die Match-Pages erreicht (rein lokal, 0 API-Calls).
            echo "📄 Match-Pages neu bauen (Lineup-Signal → Event-Page)"
            python generate_wm_match_pages.py || true
          else
            echo "ℹ️ Keine neuen Aufstellungen — keine Pick-Regenerierung nötig"
          fi
        continue-on-error: true

      - name: 💾 State-Files committen + pushen
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "actions@github.com"
          # git add -u (11.06.2026): staged ALLE getrackten Änderungen — also auch
          # wm2026-data.json aus der Pick-Regenerierung oben, nicht nur die Lineups.
          # Sonst käme das Lineup-Signal zwar in die Picks, aber nicht ins Repo.
          git add -u 2>/dev/null || true
          git add wm_lineups.json2>/dev/null || true
          git add wm_lineup_alerts.json2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Änderungen — sauberer Exit"
          else
            TIMESTAMP=$(date +'%d.%m.%Y %H:%M')
            git commit -m "📋 Lineup-Watcher ${TIMESTAMP}"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            # Robust push mit Retry
            PUSHED=0
            for attempt in 1 2 3 4 5; do
              git pull origin main --no-rebase -X ours --autostash 2>&1 || true
              CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
              if [ -n "$CONFLICTS" ]; then
                echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
                git diff --staged --quiet || git commit -m "🔧 auto-resolve merge conflicts"
              fi
              if git push 2>&1; then
                echo "✅ Push erfolgreich"
                PUSHED=1
                break
              fi
              sleep $((attempt * 3))
            done
            # FIX 12.06.2026: NICHT `[ ... ] && exit 1` als letzte Zeile — bei
            # erfolgreichem Push (PUSHED=1) liefert der fehlschlagende Test selbst
            # Exit-Status 1, der unter `bash -e` zum Step-Exit wird → Job rot trotz
            # ✅ Push. Sauber per if-Block.
            if [ "$PUSHED" = "0" ]; then echo "❌ Push fehlgeschlagen"; exit 1; fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
