name: 🌍 WM 2026 Daten aktualisieren

on:
  # 5× täglich: 06:00, 10:00, 14:00, 18:00, 22:00 Vienna (04:00, 08:00, 12:00, 16:00, 20:00 UTC)
  # Vor dem Tournament: feineres Edge-Tracking + frühere Steam-Lag-Erkennung
  # TheOddsAPI-Budget: ~5 Requests/Run × 5 Runs/Tag = 25 Requests/Tag (von ~400 täglichem Kontingent)
  schedule:
    - cron: '0 4,8,12,16,20 * * *'

  # Manuell jederzeit auslösbar (z.B. für ersten Test)
  workflow_dispatch:
    inputs:
      force_squads:
        description: 'Squad-Daten neu fetchen (überschreibt bestehende)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  fetch-wm-data:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Dependencies installieren
        run: pip install -r requirements.txt

      # ── Squad Spotlight (API-Football, läuft die ganze Tournier-Phase) ──
      - name: 🧬 WM Squad-Spotlight fetchen
        run: python fetch_wm_squads.py
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      # ── Odds (TheOddsAPI, silently no-op wenn WM noch nicht gelistet) ──
      - name: 💰 WM Odds fetchen
        run: python fetch_wm_odds.py
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      # ── Sharp Move Detection (direkt nach Odds-Fetch) ─────────────────
      - name: 📡 WM Sharp Moves detektieren
        run: python detect_wm_sharp_moves.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # ── Form + H2H (API-Football, täglich) ───────────────────────────
      - name: 📊 WM Form & H2H fetchen
        run: python fetch_wm_form.py
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      # ── Corner Stats (API-Football, täglich, max 10 Spiele pro Team) ────
      - name: 📐 WM Corner Stats fetchen
        run: python fetch_wm_corners.py
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      # ── Spielergebnisse fetchen (schreibt result in wm2026-data.json Fixtures) ────
      - name: ⚽ WM Spielergebnisse fetchen
        run: python fetch_wm_match_results.py
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      # ── Pick-Generator (nach Form + Odds + Corners, schreibt auch upsetScores) ───────
      - name: 🎯 WM Picks + Upset Scores generieren
        run: python generate_wm_picks.py
        continue-on-error: true

      # ── Player Props (TheOddsAPI, nur Spiele der nächsten 7 Tage) ───────────
      - name: ⚽ WM Player Props fetchen
        run: python fetch_wm_player_props.py
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      # ── Player Spotlight (2-3x pro Woche, Di/Do/Sa) ──────────────────────
      - name: 🌟 WM Player Spotlight generieren & senden
        run: |
          DOW=$(date +%u)
          if [ "$DOW" = "2" ] || [ "$DOW" = "4" ] || [ "$DOW" = "6" ]; then
            python generate_wm_player_spotlight.py
          else
            echo "Heute kein Spotlight-Tag (Mo/Mi/Fr/So)"
          fi
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_SPOTLIGHTS:   "2"

      # ── Polymarket Preise (Gamma API + CLOB Depth + Edge Alerts) ────────
      - name: 💹 WM Polymarket Preise + Edge Alerts
        run: python fetch_wm_poly_prices.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      # ── Steam Lag Monitor (nach Poly-Preise, damit frische Edges) ───────────
      - name: 🔥 Steam Lag Monitor — Signale loggen + Sell Alerts
        run: python steam_lag_monitor.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # ── Match Previews (regelbasiert, kein API-Key nötig) ────────────────
      - name: 📝 WM Match Previews generieren
        run: python generate_wm_rule_preview.py
        continue-on-error: true

      # ── Event Pages (matches/data/wm-*.json) ─────────────────────────────
      - name: 📄 WM Event Pages generieren
        run: python generate_wm_match_pages.py
        continue-on-error: true

      # ── Commit wm2026-data.json + match pages wenn geändert ──────────────
      - name: 💾 WM Daten speichern
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "actions@github.com"
          git add wm2026-data.json wm2026-odds-history.json wm_poly_prices.json \
                  wm2026-poly-history.json \
                  wm_results.json matches/data/wm-*.json matches/wm-index.json
          git add telegram-log.json wm_sharp_dedup.json wm_sharp_moves_log.json steam_lag_log.json steam_lag_sell_dedup.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Änderungen — kein Commit nötig."
          else
            TIMESTAMP=$(date +'%d.%m.%Y %H:%M')
            git commit -m "🌍 WM 2026 Data Update ${TIMESTAMP} UTC"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git pull origin main --no-rebase -X ours || true
            # Auto-resolve any remaining conflict markers (generated files always use ours)
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
            if [ -n "$CONFLICTS" ]; then
              echo "⚠️ Löse verbleibende Konflikte (ours):"
              echo "$CONFLICTS" | while read f; do
                echo "  → $f"
                git checkout --ours -- "$f"
                git add "$f"
              done
              git commit -m "🔧 Auto-resolve merge conflicts in generated data files"
            fi
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Telegram Morning Card (nur wenn WM Spieltag) ─────────────────────
      - name: 📱 WM Telegram Morning Card
        run: python telegram_wm.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_WM_MODE:       morning
