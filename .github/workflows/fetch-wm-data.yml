name: 🌍 WM 2026 Daten aktualisieren

on:
  # 5× täglich: 06:00, 10:00, 14:00, 18:00, 22:00 Vienna (04:00, 08:00, 12:00, 16:00, 20:00 UTC)
  # Vor dem Tournament: feineres Edge-Tracking + frühere Steam-Lag-Erkennung
  # TheOddsAPI-Budget (KORRIGIERT 16.06.2026): NICHT ~5 Req/Run. Das per-Event-Modell
  # (totals/btts/dc + alternate_totals/spreads pro Spiel) macht ~2 Calls × ~72 Spiele
  # = ~144 Requests/Run. Kosten = Märkte×Regionen: nach Senkung auf eu,uk + Entfernen
  # des redundanten `spreads` ~720 Credits/Run × 5 = ~3.600/Tag (~108K/Monat). 100K-
  # Limit am 16.06. erreicht → nächster Hebel: per-Event-Calls auf KO-nahe Spiele begrenzen.
  # 20.07.2026 WM-WINTERISIERUNG: WM beendet (Finale 19.07.) → Daten-/Odds-Refresh pausiert. Spart
  # TheOddsAPI-Budget + stoppt Fehlalarme. Reaktivieren für WM 2030 / Testläufe: einkommentieren.
  # schedule:
  #   - cron: '0 4,8,12,16,20 * * *'

  # Manuell jederzeit auslösbar (z.B. für ersten Test)
  workflow_dispatch:
    inputs:
      force_squads:
        description: 'Squad-Daten neu fetchen (überschreibt bestehende)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

# Verhindert gleichzeitige Runs → kein Doppelpost + keine Git-Push-Konflikte
concurrency:
  group: fetch-wm-data
  cancel-in-progress: false   # warten, nicht abbrechen

jobs:
  fetch-wm-data:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Dependencies installieren
        run: pip install -r requirements.txt

      # 29.06.2026 (Lucas, Telegram-Ausmisten): Pre-Season-Content (telegram_wm_preseason.py,
      # Kalender D-11…D-1) entfernt — die WM läuft seit 11.06., der Step war eine Leiche
      # (nur noch datumsgeschützt). Mitsamt dem dedizierten „State SOFORT persistieren"-Commit.

      # ── Squad Spotlight (API-Football, läuft die ganze Tournier-Phase) ──
      # force_squads=true (manueller Dispatch) → --force, sonst skippt das Script
      # alle Teams die schon einen Eintrag haben → key_players (15.06.2026) käme nie
      # rein. Ohne Force: nur neue/fehlende Teams.
      - name: 🧬 WM Squad-Spotlight fetchen
        run: python fetch_wm_squads.py ${{ (github.event_name == 'workflow_dispatch' && inputs.force_squads) && '--force' || '' }}
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      # ── Odds (TheOddsAPI, silently no-op wenn WM noch nicht gelistet) ──
      - name: 💰 WM Odds fetchen
        run: python fetch_wm_odds.py
        continue-on-error: true
        env:
          ODDS_API_KEY:            ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      # ── Multi-Book Soft-Konsens (API-Football, 13 Books) für public_static_bias ──
      # Nach fetch_wm_odds (Pinnacle steht), vor generate_wm_picks. Überschreibt die
      # public_* Felder (vorher 1 Soft-Book = verrauscht) mit robustem Median-Konsens.
      - name: 🏦 WM Multi-Book Konsens (Public-Bias)
        run: python fetch_wm_multibook_odds.py --write
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      # ── Sharp Move Detection (direkt nach Odds-Fetch) ─────────────────
      # Channel-Fix 05.06.2026: Alerts gehen jetzt an TRADES-Channel (privat)
      - name: 📡 WM Sharp Moves detektieren
        run: python detect_wm_sharp_moves.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:           ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID:  ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      # ── Verletzungen & Sperren (API-Football, täglich) ───────────────────────
      - name: 🏥 WM Verletzungen & Sperren fetchen
        run: python fetch_wm_injuries.py
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      # ── Form + H2H (API-Football, täglich) ───────────────────────────
      - name: 📊 WM Form & H2H fetchen
        run: python fetch_wm_form.py
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      - name: 🔥 WM-Serien berechnen (Streak-Content)
        run: python compute_streaks.py
        continue-on-error: true

      # ── Corner Stats (API-Football, täglich, max 10 Spiele pro Team) ────
      - name: 📐 WM Corner Stats fetchen
        run: python fetch_wm_corners.py
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      # ── NT-xG aus API-Football fixture statistics (Coverage-Lücke füllen) ──
      # Understat hat nur ~15 Europa-Teams. Diese Pipeline füllt die ~33 anderen
      # Teams (CONMEBOL/AFC/Afrika/CONCACAF/OFC) mit NT-xG aus den letzten ~10
      # Nationalmannschafts-Spielen. Cached 14 Tage pro Team — sehr API-sparsam.
      # Muss VOR generate_wm_picks laufen damit xg_strength Signal merged.
      - name: 📈 WM NT-xG (API-Football) fetchen
        run: python fetch_wm_nt_xg.py
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      # ── Aufstellungen T-1h vor Anpfiff (lineup_signal-Datenquelle) ─────
      # Holt nur Spiele in den nächsten 3h. Cache-TTL 45min. Wenn kein Spiel
      # anstehend → silent exit. Muss VOR generate_wm_picks laufen damit
      # lineup_signal die aktuellen Lineups nutzen kann.
      # --no-alerts: NUR der */15-Watcher (wm-lineup-watcher.yml) sendet Lineup-
      # Alerts. Dieser Lauf überlappt zu :00 mit dem Watcher → ohne den Schalter
      # senden beide denselben Alert (Race vor Dedup-Commit). Hier nur Daten holen.
      - name: 📋 WM Aufstellungen (T-1h) fetchen
        run: python fetch_wm_lineups.py --no-alerts
        continue-on-error: true
        env:
          APISPORTS_KEY:           ${{ secrets.APISPORTS_KEY }}
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      # ── Spieler-Match-Stats-Backfill (Ledger frisch halten für Spieler-Serien) ──
      # 06.07.2026 (Lucas): sonst schreibt nur fetch_wm_nt_xg das Ledger fort (3-Tage-Cache) →
      # neueste KO-Spiele fehlen. Holt gezielt nur die beendeten Fixtures aus wm_lineups.json,
      # die noch nicht im Ledger sind (heute 2-4 Spiele, gedeckelt). MUSS vor compute_player_streaks.
      - name: 🧾 WM Spieler-Match-Stats nachladen (Ledger-Backfill)
        run: python fetch_wm_player_stats.py
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      # ── Spieler-Serien (Content) — braucht player_form_ledger + Lineups + wm_streaks ──
      # 06.07.2026 (Lucas): Torserie/Torbeteiligung/Zu-Null als quotenloses Content-Produkt.
      # Nach compute_streaks + fetch_wm_lineups + Ledger-Backfill. Nur Spieler von Teams im Turnier.
      - name: 🎯 WM Spieler-Serien berechnen
        run: python compute_player_streaks.py
        continue-on-error: true

      # ── Signal-Check „Analyse"-Tab (Content) — vorgerechnete Signal-Bilanz je Spiel×Markt ──
      # 06.07.2026 (Lucas): eigener Nav-Tab. STRIKT isoliert (kein Verdict, nicht in Picks/Ledger).
      # Muss NACH allen Daten-/Signal-Files laufen. Statisches Pages-Frontend liest signal_check.json.
      - name: 🔎 Signal-Check-Batch (Analyse-Tab)
        run: python signal_check.py --batch
        continue-on-error: true

      # ── API-Football Predictions (externes Cross-Model) ───────────────
      # Drittes Modell unabhängig von Skellam+Elo und Pinnacle. apif_predictions
      # Signal vergleicht pro 1X2/DNB-Pick gegen Pinnacle implied. Cache 24h
      # → max 1 API-Call pro Match pro Tag.
      - name: 📊 WM API-Football Predictions fetchen
        run: python fetch_wm_apifootball_predictions.py
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      # ── Wettervorhersage (WeatherAPI, 14-Tage-Forecast, alle WM-Venues) ──
      # Umgestellt 09.06.2026 von Open-Meteo (gab 403 Forbidden in unserer
      # Umgebung) auf WeatherAPI.com (1M Calls/Monat gratis, stabiler).
      # Liefert Daten für weather_signal (Hitze-Penalty bei Cold-Climate-Teams)
      # + Renderer-Pille auf Cards. Pro Run ein Call pro Venue (~14 Calls).
      - name: 🌡️ WM Wettervorhersage fetchen
        run: python fetch_wm_weather.py
        continue-on-error: true
        env:
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}

      # ── Spielergebnisse fetchen (schreibt result in wm2026-data.json Fixtures) ────
      - name: ⚽ WM Spielergebnisse fetchen
        run: python fetch_wm_match_results.py
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      # ── Echte Venues (+ Kickoff) aus API-Football ────────────────────────
      # MUSS VOR generate_wm_picks laufen: Venue treibt travel_burden/altitude/
      # weather. Seed-Spielplan hatte falsche/Platzhalter-Venues (z.B. KOR-CZE
      # als SoFi LA statt real Guadalajara). Schreibt fx.venue + fx.kickoff +
      # wm_venue_schedule.json. Idempotent: nach Erst-Korrektur keine Änderung.
      - name: 🏟️ WM Venues + Kickoff fetchen (API-Football)
        run: python fetch_wm_venues.py --write
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      # ── Pick-Generator (nach Form + Odds + Corners, schreibt auch upsetScores) ───────
      - name: 🎯 WM Picks + Upset Scores generieren
        run: python generate_wm_picks.py
        continue-on-error: true

      # Pick-Validator wurde 16.06.2026 NACH fetch_wm_poly_prices verschoben (siehe unten):
      # er prüft u.a. E_HOMEAWAY_SWAP gegen Polymarket als Referenz. Lief er VOR der
      # Poly-Normalisierung, sah er gespiegelte/veraltete poly_hw → False-Swaps (MAR-HTI,
      # ZAF-KOR, CUW-CIV waren alle Fehlalarme, Pinnacle+Poly stimmten in Wahrheit überein).

      # ── Pick-Änderungen erkennen (Snapshot-Diff gegen letzten Run) ─────────
      - name: 🔄 WM Pick-Änderungen erkennen
        run: python detect_pick_changes.py
        continue-on-error: true

      # ── Pick-Changes Telegram-Digest (nur 1× täglich um 12:00 UTC = 14:00 Wien) ────
      - name: 📨 Pick-Changes Telegram-Digest
        if: github.event.schedule == '0 4,8,12,16,20 * * *'
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "12" ]; then
            python send_pick_changes_digest.py
          else
            echo "ℹ️  Nicht 12:00 UTC — Digest geskippt (läuft 1× täglich)"
          fi
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:           ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID:  ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      # ── Picks gegen Spielergebnisse auflösen (WIN/LOSS/VOID) ─────────
      - name: 📊 WM Picks resolven
        run: python resolve_wm_picks.py
        continue-on-error: true

      # ── Confidence-Backtest aggregieren (Hit-Rate pro Cluster) ──────
      - name: 🎯 WM Pick-Confidence berechnen
        run: python compute_pick_confidence.py
        continue-on-error: true

      # ── Player Props (TheOddsAPI, nur Spiele der nächsten 4 Tage) ───────────
      # Props öffnen sich bei Soccer typischerweise erst 1-3 Tage vor Anpfiff.
      # 4 Tage Fenster ist konservativ — verschwendet keine API-Credits auf leere Picks.
      - name: ⚽ WM Player Props fetchen
        run: python fetch_wm_player_props.py
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DAYS_AHEAD: "4"

      # ── Spieler-Picks kuratieren (HERO/VALUE/STAT/FIRST) ────────────────
      - name: 🎯 WM Spieler-Picks generieren
        run: python generate_wm_player_picks.py
        continue-on-error: true

      # ── Player Spotlight (2x pro Woche, Di/Do/Sa, nur Morgen-Cron) ──────
      # AUDIT-Fix 06.06.2026: Nur bei 08:00 UTC Cron laufen, nicht bei allen 5.
      # Vorher: 4-5 Runs am Spotlight-Tag × 2 Spotlights = 8-10 Sends statt 2.
      # Plus: das Python-Script hat jetzt ein hartes Tages-Limit, falls
      # ein Manual-Run dazwischen kommt.
      - name: 🌟 WM Player Spotlight generieren & senden
        run: |
          DOW=$(date +%u)
          HOUR=$(date -u +%H)
          if [ "$DOW" = "2" ] || [ "$DOW" = "4" ] || [ "$DOW" = "6" ]; then
            if [ "$HOUR" = "08" ]; then
              python generate_wm_player_spotlight.py
            else
              echo "Spotlight-Tag ($DOW), aber nicht 08:00 UTC ($HOUR) — geskippt"
            fi
          else
            echo "Heute kein Spotlight-Tag (Mo/Mi/Fr/So)"
          fi
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_SPOTLIGHTS:   "2"

      # ── Polymarket Preise (Gamma API + CLOB Depth + Edge Alerts) ────────
      - name: 💹 WM Polymarket Preise + Edge Alerts
        run: python fetch_wm_poly_prices.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      # ── Smart-Money (Poly Geld-/Wallet-Verteilung) — NACH fetch_wm_poly_prices ──
      # Braucht hwTokens/drTokens/awTokens + Preise aus wm_poly_prices.json. Lagt 1 Zyklus
      # in die Picks (Card-only, niedrig gewichtet → unkritisch). Poly geoblockt → nur Runner.
      - name: 💰 WM Polymarket Smart-Money
        run: python fetch_wm_poly_smartmoney.py
        continue-on-error: true

      # Direkt nach dem Fetch: der Snapshot hält nur das aktuelle Fenster, was hier nicht
      # weggeschrieben wird, ist beim nächsten Lauf weg. Läuft auch nach der WM weiter —
      # der Wallet-Track-Record ist datensatz-übergreifend wertvoll (dieselben Wallets
      # handeln später MLS/CL), deshalb ist WM-Historie kein Wegwerf-Bestand.
      - name: 📒 WM Wallet-Ledger fortschreiben
        run: python build_poly_wallet_ledger.py
        continue-on-error: true

      - name: 🎯 WM Poly-Kohärenz + Settlement-Lücken
        run: |
          python poly_coherence.py || true
          python poly_settlement_gap.py || true
        continue-on-error: true

      - name: 🅼 WM Maker-Markout messen
        run: python poly_markout.py || true
        continue-on-error: true

      - name: 🎯 WM Geld-Genauigkeit (liegt das Geld richtig?)
        run: python poly_money_accuracy.py || true
        continue-on-error: true

      # ── Pick-Validator — NACH fetch_wm_poly_prices (FIX 16.06.2026) ──────────────
      # MUSS nach der Poly-Normalisierung laufen: E_HOMEAWAY_SWAP prüft den 1X2-Favoriten
      # gegen Polymarket. Vorher (Step ~233, vor Poly) sah er gespiegelte/veraltete poly_hw
      # → False-Swap-Alarme. Schreibt pick_validation_report.json für die Status-Seite.
      - name: 🔍 WM Picks validieren
        run: python validate_wm_picks.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      # ── Steam Lag Monitor (nach Poly-Preise, damit frische Edges) ───────────
      # Channel-Fix 05.06.2026: Alerts gehen jetzt an TRADES-Channel (privat)
      - name: 🔥 Steam Lag Monitor — Signale loggen + Sell Alerts
        run: python steam_lag_monitor.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:           ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID:  ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      # ── AI Match Previews (Claude Haiku, nach Picks damit Edges bekannt) ────
      - name: 🤖 WM AI Match Previews generieren
        run: python generate_wm_ai_preview.py
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_ALL:         "false"   # nur neue/geänderte Spiele regenerieren

      # ── Match Previews (regelbasiert, Fallback wenn kein AI-Preview) ────
      - name: 📝 WM Match Previews generieren
        run: python generate_wm_rule_preview.py
        continue-on-error: true

      # ── Event Pages (matches/data/wm-*.json) ─────────────────────────────
      - name: 📄 WM Event Pages generieren
        run: python generate_wm_match_pages.py
        continue-on-error: true

      # ── Pre-Match Readiness — MUSS NACH fetch_wm_poly_prices laufen (FIX 12.06.2026)! ──
      # Der Poly-Backfill normalisiert fx.date + entfernt Phantom-Odds-Keys. Lief
      # Readiness DAVOR (alte Position vor poly), meldete wm_status.json schedule_date
      # + no_phantom_odds rot, OBWOHL die committeten Daten sauber waren (Report ≠
      # Realität). Jetzt am Ende, vor dem Commit → Report spiegelt den Endstand.
      - name: 🚦 Pre-Match Readiness Check
        run: python pre_match_readiness.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      # ── Telegram Morning Card — 1×/Tag, robust (FIX 13.06.2026) ──────────────
      # Vorher Gate „schedule && HOUR==08" → verpasste den Post, wenn der 08:00-Cron
      # verspätet kam/ausfiel (GitHub-Schedules sind unzuverlässig) oder nur manuelle
      # Läufe liefen. Heute kam DESHALB keine Karte. Jetzt: ab 08:00 UTC bei JEDEM Lauf
      # senden — Doppel-Post verhindert die Datums-Dedup in telegram_wm.py
      # (_already_sent_today). WICHTIG: Step liegt jetzt VOR dem Commit, damit der
      # Dedup-Marker (wm_telegram_sent.json) persistiert — das war die eigentliche
      # Ursache der früheren Mehrfach-Posts (Marker nach Commit → nie committet).
      - name: 📱 WM Telegram Morning Card
        if: always()
        run: |
          H=$((10#$(date -u +%H)))
          if [ "$H" -ge 8 ]; then
            python telegram_wm.py
          else
            echo "ℹ️  vor 08:00 UTC (${H} Uhr) — Morning Card noch nicht"
          fi
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_WM_MODE:       morning

      # Intraday-„Neuer Pick"-Noti (03.07.2026, Lucas): läuft bei JEDEM Fetch (5×/Tag) und
      # meldet nur Picks, die seit dem heutigen Digest neu dazukamen (späte Steam-Picks wie
      # Ghana). Vor dem Digest setzt es stumm die Basis. Muss NACH der Morning Card laufen.
      - name: 🆕 WM Neuer-Pick-Noti (Intraday)
        if: always()
        run: python notify_new_picks.py

      # 30.08.2026 (Lucas): Schattenbuch zum Gegensignal-Filter. Schreibt JEDEN announce-faehigen
      # Pick mit — den gesendeten wie den aussortierten — und rechnet beide ab. Muss NACH der Noti
      # laufen (gleicher Stand) und VOR dem Commit.
      - name: 📓 Push-Schattenbuch fortschreiben
        run: python pick_push_ledger.py || true
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Serien-Watch (pre-match) + Serie gehalten/gerissen (post-match) — 04.07.2026, Lucas.
      # Beide Modi je Lauf, dedup-sicher über streak_watch.json (watch merkt sich, recap löst auf).
      - name: 🔥 WM Serien-Watch + Recap
        if: always()
        run: |
          TG_STREAK_MODE=watch python telegram_streak_watch.py || true
          TG_STREAK_MODE=recap python telegram_streak_watch.py || true
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # ── Commit wm2026-data.json + match pages wenn geändert ──────────────
      # if: always() (11.06.2026) — Commit MUSS laufen, auch wenn ein Schritt
      # davor hart abbricht. Sonst bleiben frisch gefetchte Odds im Runner und
      # landen nie auf GitHub (= "STALE" im Dashboard trotz erfolgreichem Fetch).
      - name: 💾 WM Daten speichern
        if: always()
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "actions@github.com"
          # FIX 11.06.2026: BULLETPROOF staging. Vorher NUR git add $(registry) —
          # wenn das aus irgendeinem Grund nichts staged (Script-Env, Pfad), wurde
          # trotz frisch gefetchter Odds "Keine Änderungen" gemeldet → nichts
          # committet → GitHub blieb tagelang auf altem Stand ("STALE" im Dashboard).
          # git add -u staged JEDE Änderung an bereits getrackten Dateien (Odds,
          # Picks, History …) unabhängig vom Registry-Script.
          git add -u 2>/dev/null || true
          # Registry zusätzlich für NEUE (untracked) Files (z.B. neue match-pages).
          git add $(python32>/dev/null || true
          git add state_files_registry.py2>/dev/null || true
          git add --bash-list2>/dev/null || true
          git add fetch_wm_data)2>/dev/null || true
          # wm_status.json (Status-Seite Single Source of Truth) explizit — neu/untracked,
          # wird von git add -u nicht erfasst.
          git add wm_status.json 2>/dev/null || true
          git add wm_streaks.json 2>/dev/null || true   # Streak-Content (neu/untracked, 28.06.2026)
          git add player_streaks.json 2>/dev/null || true   # Spieler-Serien-Content (06.07.2026)
          git add signal_check.json 2>/dev/null || true      # Signal-Check „Analyse"-Tab (06.07.2026)
          git add pick_announce_state.json 2>/dev/null || true   # Neuer-Pick-Noti-Basis (03.07.2026)
          git add pick_push_ledger.json 2>/dev/null || true   # Neuer-Pick-Noti-Basis (03.07.2026)
          git add streak_watch.json 2>/dev/null || true          # Serien-Watch-State (04.07.2026)
          # Diagnose: was ist staged? (im Log sichtbar, kein stilles Versagen mehr)
          echo "📋 Staged für Commit:"; git diff --staged --name-only | sed 's/^/   /' || true
          if git diff --staged --quiet; then
            echo "⚠️  Keine Änderungen gestaged — wenn ein Fetch lief, ist das verdächtig!"
          else
            TIMESTAMP=$(date +'%d.%m.%Y %H:%M')
            git commit -m "🌍 WM 2026 Data Update ${TIMESTAMP} UTC"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            # ── Robust pull+push mit Retry ──────────────────────────────────
            # --autostash schützt vor "your local changes would be overwritten"
            # wenn ein paralleler Workflow zwischen Commit und Pull schreibt.
            # Bei Push-Fail: erneut pullen + push (max 5 Versuche).
            PUSHED=0
            for attempt in 1 2 3 4 5; do
              git pull origin main --no-rebase -X ours --autostash 2>&1 || true
              # Verbleibende Konfliktmarker (ours) auflösen
              CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
              if [ -n "$CONFLICTS" ]; then
                echo "⚠️ Auto-resolve Konflikte (ours) — Versuch $attempt:"
                echo "$CONFLICTS" | while read f; do
                  echo "  → $f"
                  git checkout --ours -- "$f"
                  git add "$f"
                done
                git diff --staged --quiet || git commit -m "🔧 auto-resolve merge conflicts"
              fi
              if git push 2>&1; then
                echo "✅ Push erfolgreich nach Versuch $attempt"
                PUSHED=1
                break
              fi
              echo "⚠️ Push $attempt fehlgeschlagen — retry in $((attempt * 3))s..."
              sleep $((attempt * 3))
            done
            if [ "$PUSHED" = "0" ]; then
              echo "❌ Push nach 5 Versuchen fehlgeschlagen"
              exit 1
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

