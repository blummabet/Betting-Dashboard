name: 📤 Telegram senden (DEAKTIVIERT — Telegram läuft jetzt über update-dashboard.yml)

on:
  # DEAKTIVIERT: Cron läuft jetzt in update-dashboard.yml (dort werden Picks
  # zuerst frisch generiert, dann erst gesendet). Dieser Workflow hat stale
  # picks_output.json verwendet → falsche Picks gesendet.
  # Für manuelle Tests: update-dashboard.yml → "Run workflow" verwenden.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Was senden?'
        required: true
        default: 'picks'
        type: choice
        options:
          - picks
          - recap
          - watch
          - all

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Dependencies installieren
        run: pip install -r requirements.txt

      - name: 🕐 Modus bestimmen
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$(date -u +%H)
            if   [ "$HOUR" = "07" ]; then echo "tg_mode=picks"  >> $GITHUB_OUTPUT
            elif [ "$HOUR" = "09" ]; then echo "tg_mode=recap"  >> $GITHUB_OUTPUT
            elif [ "$HOUR" = "11" ]; then echo "tg_mode=watch"  >> $GITHUB_OUTPUT
            else                          echo "tg_mode=picks"  >> $GITHUB_OUTPUT
            fi
          else
            echo "tg_mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          fi

      - name: 📤 Telegram senden
        run: python telegram_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: '-1003819239615'
          TG_MODE: ${{ steps.mode.outputs.tg_mode }}

      - name: 💾 telegram_sent.json pushen
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "actions@github.com"
          git add telegram_sent.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "📤 Telegram gesendet ($(date +'%d.%m.%Y %H:%M') UTC)"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git pull origin main --no-rebase -X ours
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
