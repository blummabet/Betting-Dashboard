name: 🔒 Liga Closing-Capture (nah am Anpfiff)

# 09.07.2026 (Lucas: „Liga auf top"). Pendant zu capture-closing.yml (WM). Der volle Liga-Lauf
# (2×/Tag) + dichter 2h-Refresh verpassen die letzten Minuten vor Anpfiff → „Closing" veraltet →
# CLV gegen tote Linie. Dieser Job läuft alle 15 min in den Anpfiff-Bändern und ruft fetch_liga_odds
# im CLOSING_CAPTURE_ONLY-Modus: der interne Guard (_has_imminent_kickoff) feuert TheOddsAPI NUR an,
# wenn ein Liga-Spiel in [-20 … +90] min anpfeift — sonst sofortiger No-Op (quota-schonend).
# Committet NUR liga_closing_lines.json + liga-odds-history.json (verwirft liga-data.json → clobbert
# nie Picks/Daten). resolve_wm_results liest liga_closing_lines.json bevorzugt.
on:
  schedule:
    # 28.08.2026 (Lucas: „Last senken") — Fenster gegen die ECHTEN Anpfiff-Zeiten gelegt.
    # Alle Top-5-Anpfiffe in liga-data.json liegen zwischen 10:00 und 20:00 UTC (Verteilung:
    # 10h:2, 11h:7, 12h:1, 13h:140, 14h:268, 15h:443, 16h:490, 17h:233, 18h:50, 19h:67, 20h:51).
    # Vorher lief das Fenster 11-23 + 0-4 = 72 Läufe/Tag. Die Blöcke 21-23 und 0-4 (32 Läufe)
    # konnten nie etwas einfangen — der 0-4-Block kam per Copy-Paste aus capture-closing-mls
    # („späte MLS-Anpfiffe"), MLS hat aber sein eigenes Capture. Umgekehrt begann das Fenster
    # erst um 11:00, sodass die 9 Fixtures mit Anpfiff 10:00/11:00 nie eine saubere
    # Closing-Linie bekamen. 9-21 behebt beides: -20 Läufe/Tag UND die Lücke zu.
    - cron: '*/15 9-21 * * *'    # Top-5-Anpfiffe 10-20 UTC, mit Vorlauf ab 09:00
  workflow_dispatch:

permissions:
  contents: write
  actions: read          # run_health.py liest die Steps DIESES Laufs

concurrency:
  group: capture-closing-liga
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      COCOBET_DATASET: liga
      COCOBET_PROFILE: liga_default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 📦 Dependencies
        run: pip install -r requirements.txt

      - name: 🔒 Liga-Closing nah am Anpfiff erfassen
        run: python fetch_liga_odds.py
        continue-on-error: true
        env:
          CLOSING_CAPTURE_ONLY: '1'
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: 📡 Liga Sharp-Moves erkennen + Alert (nah am Anpfiff)
        # B1 (25.07): der 15-Min-Anpfiff-Job ist das dichteste Band → Steam-Moves
        # kurz vor Kickoff werden hier erkannt und sofort auf Telegram gealertet
        # (Dedup verhindert Wiederholung; re-alert nur bei +2pp Progression).
        # Nur bei imminentem Anpfiff hat der Fetch die History bewegt → sonst No-Op.
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
        run: python detect_wm_sharp_moves.py || true

      # 28.08.2026 (Lucas: „Fehler, die wir gar nicht mitkriegen") — 135 Steps stehen repo-weit
      # auf continue-on-error. Dieser Waechter fragt ueber die GitHub-API die Steps DIESES Laufs
      # ab und meldet jeden gescheiterten, auch wenn der Job gruen bleibt. `if: always()`, damit
      # er gerade dann laeuft, wenn vorher etwas schiefging. Muss VOR dem Commit stehen, sonst
      # bleibt health/ auf der Runner-Platte liegen.
      - name: 🩺 Lauf-Gesundheit (verschluckte Fehler sichtbar machen)
        if: always()
        continue-on-error: true
        run: python3 run_health.py --slug closing-liga
        env:
          GITHUB_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      - name: 💾 Closing committen (nur wenn geändert)
        run: |
          git config user.name  "CocoBet Bot"
          git config user.email "bot@cocobet.local"
          # liga-data.json bewusst VERWERFEN — der CLV-Resolver liest primär liga_closing_lines.json
          # (merge_closing_lines hat das Closing schon dort gespiegelt). So clobbert der 15min-Job
          # NIEMALS die Picks/Daten der Haupt-Pipeline.
          git checkout -- liga-data.json 2>/dev/null || true
          # 02.09.2026: hier stand `git add <pfad>2>/dev/null` OHNE Leerzeichen. Die Shell liest
          # das als Pfad `<pfad>2` — eine Datei, die es nicht gibt. `|| true` schluckt den Fehler,
          # danach ist NICHTS gestaged, der Commit-Schritt meldet „keine Änderung" und der Job wird
          # gruen. Genau die Signatur „frischer Job, alte Daten", die uns schon den sechsstuendigen
          # Betfair-Ausfall gekostet hat. 83 solche Zeilen in 18 Workflows, alle mit Leerzeichen.
          git add liga_closing_lines.json 2>/dev/null || true
          git add liga-odds-history.json 2>/dev/null || true
          git add liga_sharp_moves_log.json 2>/dev/null || true
          git add liga_sharp_dedup.json 2>/dev/null || true
          # 28.08.2026: eigene Zeile, eigener Pfad — health/<slug>.json wird NUR von diesem
          # Workflow geschrieben, deshalb kann sie mit keinem anderen kollidieren.
          git add health/closing-liga.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Closing-Änderung — nichts zu committen."; exit 0
          fi
          git commit -m "🔒 Liga Closing-Capture $(date -u +'%d.%m.%Y %H:%M') UTC"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            bash scripts/ci_pull.sh main || true   # 03.09.2026: raeumt untrackte Kollisionen weg (s. Skript)
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
            if [ -n "$CONFLICTS" ]; then
              echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
              git diff --staged --quiet || git commit -m "🔧 auto-resolve closing merge"
            fi
            if git push 2>&1; then echo "✅ Push nach Versuch $attempt"; exit 0; fi
            echo "⚠️ Push $attempt fehlgeschlagen — retry…"; sleep $((attempt * 3))
          done
          echo "❌ Push fehlgeschlagen"; exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
