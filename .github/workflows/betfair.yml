name: 🟡 Betfair Radar (Betwatch)

# Betwatch blockt GitHubs US-Runner (HTTP 403) → läuft wie die Poly-Fetcher auf dem
# Mac-Runner ([self-hosted, macOS], Österreich-IP). Auth via Token-Header (auf dem Mac-Runner
# akzeptiert). Holt Betfair-Odds + Volumina, schreibt betfair_prices.json + betfair_history.json.
# Push mit Pull-Retry (wie manage-mls-poly.yml): das Repo wird ständig bebot-pusht → ein nackter
# `git push` scheitert non-fast-forward. Darum vor jedem Push pullen (-X ours) und bis zu 5x retry.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: betfair
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 8
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python finden (lokal, kein setup-python auf self-hosted)
        run: |
          PYTHON=""
          for PY in /opt/homebrew/bin/python3.13 /opt/homebrew/bin/python3.12 /opt/homebrew/bin/python3.11 /usr/local/bin/python3.13 /usr/local/bin/python3.12 /usr/local/bin/python3.11 /usr/bin/python3; do
            if "$PY" --version >/dev/null 2>&1; then PYTHON="$PY"; break; fi
          done
          if [ -z "$PYTHON" ]; then echo "❌ kein Python3 gefunden"; exit 1; fi
          echo "✅ $PYTHON ($($PYTHON --version))"
          echo "BETFAIR_PY=$PYTHON" >> $GITHUB_ENV

      - name: 🟡 Betfair/Betwatch fetchen
        run: ${{ env.BETFAIR_PY }} fetch_betfair_betwatch.py
        env:
          BETWATCH_KEY: ${{ secrets.BETWATCH_KEY }}
          # optional tunebar: BETWATCH_MAX_DETAIL / BETWATCH_WINDOW_H

      - name: 💾 Committen + Push (Pull-Retry, wie die Poly-Workflows)
        run: |
          git config user.name "cocobet-bot"
          git config user.email "bot@users.noreply.github.com"
          git add betfair_prices.json betfair_history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "keine Änderung — nichts zu committen"
            exit 0
          fi
          git commit -m "🟡 Betfair Radar Update $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull origin main --no-rebase -X ours --autostash 2>&1 || true
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            if [ -n "$CONFLICTS" ]; then
              echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
              git diff --staged --quiet || git commit -m "🔧 auto-resolve merge [skip ci]"
            fi
            if git push 2>&1; then echo "✅ Push nach Versuch $attempt"; exit 0; fi
            echo "Push-Versuch $attempt fehlgeschlagen — retry…"; sleep 3
          done
          echo "❌ Push nach 5 Versuchen fehlgeschlagen"; exit 1
