name: 🟡 Betfair Radar (Betwatch)

# Betwatch blockt GitHubs US-Runner (HTTP 403) → läuft wie die Poly-Fetcher auf dem
# Mac-Runner ([self-hosted, macOS], Österreich-IP). Auth via Token-Header (auf dem Mac-Runner
# akzeptiert). Holt Betfair-Odds + Volumina, schreibt betfair_prices.json + betfair_history.json.
# Push mit Pull-Retry (wie manage-mls-poly.yml): das Repo wird ständig bebot-pusht → ein nackter
# `git push` scheitert non-fast-forward. Darum vor jedem Push pullen (-X ours) und bis zu 5x retry.
on:
  schedule:
    # 🔴 17.09.2026 (Lucas: „der Betfair-Cron sollte alle 10 min, tut er aber nicht, weil damals
    # irgendwas nicht ging — in Wahrheit rennt er alle 15 min, falls das irgendwo wichtig ist").
    #
    # Es war wichtig. Nachgemessen an `health/betfair.json` (20 Laeufe, 02:05–06:35 UTC):
    # 17 von 19 Abstaenden liegen bei exakt 15,0 Minuten. Zum Vergleich poly-global-scan
    # (Cron `15,45`): gemessene 29,7 Minuten — der haelt seinen Takt also punktgenau.
    # Der Job hat 29 Schritte und braucht laenger als sein eigenes Intervall; mit
    # `cancel-in-progress: false` verschluckt jeder dritte Tick.
    #
    # Ein Cron, der etwas anderes behauptet als er liefert, ist nicht nur Kosmetik: die
    # Schedule-Bilanz (`test_cron_schedule_hygiene`) rechnete diesen Workflow mit 144 Laeufen/Tag
    # gegen einen Deckel von 540 — geliefert hat er 96. 48 Slots waren auf dem Papier belegt und
    # in Wahrheit frei, und genau an diesem Deckel scheiterte am 03.09. der Wunsch nach einem
    # eigenen Cron fuer den Stake-Sammler.
    #
    # Also sagt der Cron ab jetzt, was passiert. Am tatsaechlichen Takt aendert das nichts.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read          # run_health.py liest die Steps DIESES Laufs

concurrency:
  group: betfair
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 8
    env:
      # 13.08.2026 (Lucas): BETWATCH_KEY job-weit -> die autoritative /results-Korrektur (verify_settled in
      # betfair_track_record + betfair_public_eval + Money-Map-Settle in betfair_consensus) kann laufen.
      # Ohne Key blieben per Live-Feed falsch abgerechnete Picks stehen (z.B. Palmeiras 1:0 statt 1:1 -> won).
      BETWATCH_KEY: ${{ secrets.BETWATCH_KEY }}
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python finden (lokal, kein setup-python auf self-hosted)
        run: |
          PYTHON=""
          for PY in /opt/homebrew/bin/python3.13 /opt/homebrew/bin/python3.12 /opt/homebrew/bin/python3.11 /usr/local/bin/python3.13 /usr/local/bin/python3.12 /usr/local/bin/python3.11 /usr/bin/python3; do
            if "$PY" --version >/dev/null 2>&1; then PYTHON="$PY"; break; fi
          done
          if [ -z "$PYTHON" ]; then echo "❌ kein Python3 gefunden"; exit 1; fi
          echo "✅ $PYTHON ($($PYTHON --version))"
          echo "BETFAIR_PY=$PYTHON" >> $GITHUB_ENV

      # 03.09.2026 — der Stake-Sammler reist hier mit, nicht mehr beim Poly-Live-Scan.
      # Grund: der erste echte Lauf zeigte, dass 50 Eintraege (Stakes Deckel) nur 12 Minuten
      # abdecken. Bei einem 15-Minuten-Takt fehlten damit rund 3 Minuten je Zyklus — und zwar
      # genau dann, wenn viel los ist.
      #
      # 🔴 17.09.2026: hier stand „dieser Job laeuft */10, also mit 2 Minuten Ueberlappung".
      # Der Cron sagte das, der Runner nicht — gemessen 15,0 Minuten (s. oben beim Schedule).
      # Es gab also nie eine Ueberlappung, sondern im Schnitt eine Punktlandung und in
      # Stosszeiten eine Luecke: 37,4 % der Laeufe, 855,8 Minuten blind seit dem 13.09.
      # Deshalb faellt derselbe Sammler am Ende des Jobs ein ZWEITES Mal an (s. dort).
      # Was dann noch fehlt, sagt der Sammler selbst: er misst die Luecke und schreibt sie
      # ins Ledger, statt sie als ruhigen Abend durchgehen zu lassen.
      - name: 🎰 Stake Highroller sammeln
        continue-on-error: true
        env:
          STAKE_MIN_USD: '1000'
        run: ${{ env.BETFAIR_PY }} stake_highroller_fetch.py || echo "  ⚠️ Stake-Abruf fehlgeschlagen (Betfair laeuft weiter)"

      # Abrechnung und Auswertung haengen direkt hinter dem Sammeln. Beide sind billig:
      # settle fragt nur Wetten nach, die reif und noch nicht abgerechnet sind (jede genau
      # einmal), analyse rechnet lokal. Beide duerfen scheitern, ohne Betfair mitzureissen.
      - name: 🧾 Stake-Wetten abrechnen
        continue-on-error: true
        run: ${{ env.BETFAIR_PY }} stake_settle.py || echo "  ⚠️ Stake-Abrechnung fehlgeschlagen"

      # Die Norm MUSS vor der Auswertung laufen — sie waechst ueber die Zeit und wird von
      # stake_analyse.py nur noch gelesen (das Ledger reicht nur ~3 Tage zurueck).
      - name: 📊 Liga-Norm nachtragen (waechst mit)
        continue-on-error: true
        run: ${{ env.BETFAIR_PY }} stake_league_norm.py || echo "  ⚠️ Stake-Norm fehlgeschlagen"

      - name: 📐 Stake auswerten (Schubladen, Auffaellige)
        continue-on-error: true
        run: ${{ env.BETFAIR_PY }} stake_analyse.py || echo "  ⚠️ Stake-Auswertung fehlgeschlagen"

      # ⚡ 🔴 12.09.2026 — hier, NICHT in stake-radar.yml.
      #
      # Gestern eingehaengt in `stake-radar.yml`, und der Push ist nie gelaufen: dieser Workflow
      # hat NUR `workflow_dispatch`, keinen Schedule. Letzter Lauf war der 07.09., von Hand.
      # Gesammelt wird Stake in DIESEM Job (Cron */15, gemessener Takt 15,0 Min), und der Push
      # gehoert dorthin, wo die Daten entstehen.
      #
      # Exakt die Fehlerklasse, die in stake-radar.yml selbst dokumentiert steht („Rollout-Luecke
      # … der Code war da, der Produzent nicht neu gelaufen") — ich habe den Kommentar gelesen
      # und den Push trotzdem daneben gehaengt.
      - name: ⚡ Stake-Bursts in den Trades-Channel
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
        run: ${{ env.BETFAIR_PY }} stake_burst_push.py || echo "  ⚠️ Stake-Burst-Push fehlgeschlagen"

      - name: 🟡 Betfair/Betwatch fetchen
        run: ${{ env.BETFAIR_PY }} fetch_betfair_betwatch.py
        env:
          BETWATCH_KEY: ${{ secrets.BETWATCH_KEY }}
          # optional tunebar: BETWATCH_MAX_DETAIL / BETWATCH_WINDOW_H

      - name: Betfair-Richtung (Back/Lay je Runner aus der Quotenbewegung)
        run: ${{ env.BETFAIR_PY }} betfair_direction.py
        continue-on-error: true

      - name: Betfair-Konsens (Zweitmeinung Pinnacle/Soft, rein lesend, kein Push)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BETWATCH_KEY: ${{ secrets.BETWATCH_KEY }}   # 13.08.2026 (Lucas): Money-Map-Ledger gegen /football/results abrechnen
        run: ${{ env.BETFAIR_PY }} betfair_consensus.py
        continue-on-error: true

      - name: 🔗 Terminal-Kartenlink (unsere Card neben die Geld-Seite der Boerse)
        run: ${{ env.BETFAIR_PY }} betfair_card_link.py
        continue-on-error: true

      - name: 🔎 Kohaerenz-Beobachter (wann liegt Geld in den Tormaerkten?)
        run: ${{ env.BETFAIR_PY }} betfair_coherence_watch.py
        continue-on-error: true

      - name: 📊 Track-Record aktualisieren (Trefferquote je Liga×Markt)
        run: ${{ env.BETFAIR_PY }} betfair_track_record.py

      # 06.09.2026 (Lucas: „das ins Positive umkehren und faden … irgendwo tracken, dass ich
      # mitschauen kann"). Vorregistrierte Schublade: die Regel steht fest, was ab dem 07.09.
      # dazukommt, ist sauber out-of-sample. Laeuft NACH betfair_track_record.py, weil sie
      # dessen Ledger UND den frischen Preis-Schnappschuss liest.
      - name: 🔄 Fade-Unter (vorregistriert) neu rechnen
        run: ${{ env.BETFAIR_PY }} fade_unter.py
        continue-on-error: true

      # 29.08.2026 (Lucas: „sowas könnte man schon als super killer Element bauen"): die
      # Konjunktions-Sektion. Läuft NACH betfair_track_record.py und betfair_consensus.py,
      # weil sie beider Ausgaben liest (Signal-Stand + Poly/Pinnacle je Spiel).
      - name: 🔒 Konjunktion (nur wo mehrere Geldströme gleichzeitig zustimmen)
        run: ${{ env.BETFAIR_PY }} killer.py
        continue-on-error: true

      # Das Freigabe-Register lief bisher gar nicht im Takt — freigabe.json wurde einmal von
      # Hand erzeugt und war seitdem alt. Damit die Sektion oben ihren eigenen Stand ehrlich
      # zeigen kann, muss das Register mitlaufen.
      - name: ✅ Freigabe-Register neu bewerten
        run: ${{ env.BETFAIR_PY }} freigabe.py
        continue-on-error: true

      # 09.09.2026 (Lucas: „schaffen wir eine eigene Stats-Seite … alles auf Monatsbasis und
      # Wochenbasis auch"). Liest nur, was die Schritte darueber geschrieben haben — muss also
      # NACH ihnen laufen, sonst zeigt die Seite den Stand des Vorlaufs.
      - name: 📊 Stats je Woche/Monat
        run: ${{ env.BETFAIR_PY }} stats_perioden.py
        continue-on-error: true

      # 01.09.2026 (Lucas: „damit ich aktiv drauf aufmerksam werde"): zwei Pushes in den
      # TRADES-Channel, bewusst schmal geschnitten.
      #   · Konjunktion NUR Stufe 1 (~5/Tag). Alles zu pushen waeren 20-58/Tag, und Stufe 2
      #     traegt im eigenen Buch nur +0,2%. Der Median-Abstand Latch→Anpfiff liegt bei 48
      #     Minuten — deshalb muss das hier im 15-Minuten-Takt mitlaufen, sonst ist die
      #     Nachricht wertlos, wenn sie ankommt.
      #   · Freigabe-Wechsel: selten, aber das wichtigste Ereignis im System. Auch die
      #     RUECKNAHME wird gemeldet.
      # Beide fuehren ihr EIGENES Buch (killer_push_ledger.json) — zum Preis, der in der
      # Nachricht stand, nicht zum Haltepreis der Flaeche.
      - name: 📣 Konjunktion Stufe 1 → Trades-Channel
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
        run: ${{ env.BETFAIR_PY }} killer_push.py
        continue-on-error: true

      - name: 🔓 Freigabe-Wechsel → Trades-Channel
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
        run: ${{ env.BETFAIR_PY }} freigabe_push.py
        continue-on-error: true

      - name: 📚 Liga-Basis lernen (was ist ueblich fuer Liga X in Phase Y — Basis fuers x-Norm-Badge)
        run: ${{ env.BETFAIR_PY }} betfair_league_norm.py
        continue-on-error: true

      - name: Draw-Geld-Tracker (X-Einsaetze, Pre-Match + In-Play, kam X)
        run: ${{ env.BETFAIR_PY }} betfair_draw_tracker.py
        continue-on-error: true

      - name: 🧭 Übersicht-Sidecar (Steam + frischer Zufluss, leicht für den ersten Menüpunkt)
        run: ${{ env.BETFAIR_PY }} build_betfair_overview.py
        continue-on-error: true

      - name: 📣 Betfair-Alerts (Trades-Channel + öffentlicher Moneyflow)
        run: ${{ env.BETFAIR_PY }} betfair_alerts.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          # 🔴 21.09.2026: Diese Meldung ging in den OEFFENTLICHEN Kanal. `tg_send` faellt ohne
          # gesetzte TELEGRAM_CHAT_ID auf die feste oeffentliche ID zurueck, und dieses Secret
          # ist bewusst leer. `TELEGRAM_CHAT_ID` steht hier deshalb NICHT mehr — sie wuerde nur
          # wieder in den oeffentlichen Rueckfall fuehren. Der Sender ist jetzt `tg_send_ops`,
          # er nimmt OPS, sonst TRADES, und sonst sendet er nicht.
          TELEGRAM_OPS_CHAT_ID:    ${{ secrets.TELEGRAM_OPS_CHAT_ID }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      # 🔴 20.09.2026 (Lucas: „Beide Spiele stehen nicht in der Betfair-Public-Bilanz").
      # Eines davon — Lyon v Rennes — war GESENDET: betfair_public_seen.json trug den Schluessel
      # `fresh:36039873`, den es nur bei erfolgreichem Versand bekommt. Im Ledger stand keine
      # Zeile, und in KEINEM der letzten 40 Commits hat sie je gestanden. Die Pruefung ueber
      # alle Eintraege: 4 von 277 gesendeten Public-Pushes haben keine Ledger-Zeile (1,4 %).
      # Der Grund liegt im Ablauf, nicht im Code: dieser Lauf sendet hier und committet erst
      # zwoelf Schritte spaeter, nach einem Schritt, der ~12 Minuten schlaeft — bei einem Takt
      # von 15 Minuten. Alles, was in der Zwischenzeit mit dem Arbeitsverzeichnis passiert,
      # kostet den Beleg, waehrend die Wirkung (die Nachricht) laengst draussen ist.
      # Genau dafuer gibt es scripts/ci_sichern.sh — es hing bisher nur an den Poly-Workflows.
      - name: 🔐 Beleg der gesendeten Pushes sofort sichern
        run: bash scripts/ci_sichern.sh "Beleg der Betfair-Pushes" betfair_public_ledger.json betfair_public_seen.json betfair_alerts_seen.json betfair_public_trichter.json betfair_public_schatten.json betfair_rutsch_ledger.json betfair_rutsch_seen.json
        continue-on-error: true

      # 20.09.2026 (Vorfall Toulouse–Le Havre, 19.09.): eine Poly-Position lief ins Spiel,
      # weil der Hard-Close des Positions-Managers ausfiel und nichts davon ins Buch kam.
      # Der Waechter gehoert NICHT in manage-liga-poly.yml: dessen Cron behauptet 25 Laeufe
      # am Tag, gezaehlt aus health/liga-poly.json kamen am 16.-19.09. vier, vier, fuenf und
      # fuenf. Ein Waechter mit derselben Luecke wie das Bewachte nuetzt nichts. Dieser
      # Workflow laeuft alle 15 Minuten auf demselben Mac und tut es nachweislich.
      # Rein lesend: er verkauft nichts, er meldet nur.
      - name: 🚨 Offene Poly-Positionen kurz vor Anpfiff (rein lesend)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
        run: ${{ env.BETFAIR_PY }} poly_offene_wache.py

      - name: 📈 Public-Push-Auswertung (Treffer/ROI der Moneyflow-Signale)
        run: ${{ env.BETFAIR_PY }} betfair_public_eval.py
        continue-on-error: true

      # 🔴 17.09.2026 (Lucas, zu einem Fremd-Radar-Post aus der kasachischen Pervaya Liga:
      # „sowas findest du nicht? Gab's nicht in unserem Feed?"). Gab es nicht — und der Grund war
      # die Abdeckung, nicht die Schwelle:
      #
      #   · Stakes Feed gibt HOECHSTENS 50 Eintraege her (MAX_LIMIT; 51 liefert kommentarlos
      #     null). Bei 2,4 Wetten/Minute sind das rund 21 Minuten Gedaechtnis.
      #   · Dieser Job laeuft gemessen alle 15,0 Minuten (health/betfair.json).
      #   · Ergebnis: in 138 von 369 Laeufen entstand trotzdem eine Luecke — 37,4 %, zusammen
      #     855,8 Minuten blind seit dem 13.09., laengste Einzelluecke 24,3 Minuten. In
      #     Stosszeiten ist das 50er-Fenster eben kuerzer als der Abstand zum naechsten Lauf.
      #
      # Ein eigener Cron fuer den Sammler waere der teure Weg (+144 Laeufe/Tag gegen einen
      # Deckel von 540). Der billige: ihn ZWEIMAL je Lauf holen. Der erste Abruf steht ganz oben
      # (Schritt 4), dieser hier am Ende — dazwischen liegen die ~12 Minuten, die der Job
      # braucht. Aus einem Sample alle 15 Minuten werden damit zwei im Abstand von rund 12 und 3
      # Minuten, ohne einen einzigen zusaetzlichen Schedule-Slot.
      #
      # Der Burst-Push laeuft gleich mit: sonst saehe der zweite Abruf zwar den Burst, wuerde ihn
      # aber erst im naechsten Lauf melden — und die Altersgrenze (MAX_ALTER_MIN=30) ist bei
      # einem 15-Minuten-Takt knapp genug. Der Deckel je Aufruf (4) bleibt, der Dedup ueber
      # `stake_burst_seen.json` verhindert Wiederholungen aus dem ersten Abruf.
      - name: 🎰 Stake Highroller nachfassen (zweites Sample, ~12 Min nach dem ersten)
        env:
          STAKE_MIN_USD: "1000"
        run: ${{ env.BETFAIR_PY }} stake_highroller_fetch.py || echo "  ⚠️ Stake-Nachfass fehlgeschlagen"
        continue-on-error: true

      - name: ⚡ Stake-Bursts aus dem zweiten Sample
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
        run: ${{ env.BETFAIR_PY }} stake_burst_push.py || echo "  ⚠️ Stake-Burst-Push (2) fehlgeschlagen"
        continue-on-error: true

      - name: Daten-Integritaet (Guard-Batterie, rein lesend)
        run: ${{ env.BETFAIR_PY }} betfair_data_integrity.py
        continue-on-error: true

      # 🔴 20.09.2026 (Lucas: „ich weiß dann nicht, funktioniert das eigentlich, was tracken wir
      # da … es ist halt sehr viel aktuell"). Drei Guard-Batterien laufen 57 Pruefungen und
      # schreiben sie in drei Artefakte — und sonst nirgendwohin. Am Abend des 20.09. standen
      # dort 14 Befunde, darunter Positionen, die seit 13 Tagen offen sind.
      # Fehlerklasse: ein Messgeraet, dessen Zeiger niemand ansieht.
      #
      # Bewusst KEIN eigener Workflow: die Runner sind gesaettigt (zwei Workflows liefern ueber
      # Soll, alle anderen 2-7 Laeufe am Tag — s. check_takt_stimmt_mit_dem_cron). Dieser Lauf
      # faehrt zuverlaessig; das Skript entscheidet selbst, ob es dran ist (Fenster 06-10 UTC,
      # einmal je Tag), und schweigt, wenn nichts kaputt ist.
      - name: 🩺 Stoerungsmeldung (einmal am Tag, nur wenn etwas kaputt ist)
        run: ${{ env.BETFAIR_PY }} stoerungsmeldung.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
          TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}

      # 28.08.2026 (Lucas: „Fehler, die wir gar nicht mitkriegen") — 135 Steps stehen repo-weit
      # auf continue-on-error. Dieser Waechter fragt ueber die GitHub-API die Steps DIESES Laufs
      # ab und meldet jeden gescheiterten, auch wenn der Job gruen bleibt. `if: always()`, damit
      # er gerade dann laeuft, wenn vorher etwas schiefging. Muss VOR dem Commit stehen, sonst
      # bleibt health/ auf der Runner-Platte liegen.
      - name: 🩺 Lauf-Gesundheit (verschluckte Fehler sichtbar machen)
        if: always()
        continue-on-error: true
        # Self-hosted Mac: kein setup-python, deshalb der oben gefundene Interpreter.
        # `python3` waere hier /usr/bin/python3 und je nach Mac zu alt.
        run: ${{ env.BETFAIR_PY || 'python3' }} run_health.py --slug betfair
        env:
          GITHUB_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      - name: 💾 Committen + Push (Pull-Retry, wie die Poly-Workflows)
        run: |
          git config user.name "cocobet-bot"
          git config user.email "bot@users.noreply.github.com"
          git add betfair_card_link.json 2>/dev/null || true        # Terminal: unsere Card je Boersen-Spiel
          # 28.08.2026: eigene Zeile, eigener Pfad — health/<slug>.json wird NUR von diesem
          # Workflow geschrieben, deshalb kann sie mit keinem anderen kollidieren.
          git add health/betfair.json 2>/dev/null || true
          git add betfair_coherence_watch.json 2>/dev/null || true   # ab wann liegt Geld in den Tormaerkten
          git add fade_unter.json 2>/dev/null || true                # vorregistrierte Fade-Schublade
          git add betfair_reaktiv_ledger.json 2>/dev/null || true    # 15.09.2026: verworfene Alarme (Tor im Zufluss-Fenster) — still wegwerfen hiesse, nie zu erfahren, ob es richtig war
          git add betfair_public_trichter.json 2>/dev/null || true   # 19.09.2026: wo die Public-Alarme haengen bleiben — sonst ist ein stummer Tag von einem kaputten Kanal nicht zu unterscheiden
          # 🔴 02.09.2026 — DIE ZWEITE RUNDE DERSELBEN FALLE. `git add a b c` staged NICHTS,
          # sobald EIN Pfad nicht existiert (fatal: pathspec). Mit `2>/dev/null || true`
          # sieht man den Fehler nicht, danach ist der Index leer, `git diff --cached --quiet`
          # meldet „keine Aenderung" und der Lauf endet GRUEN — sechs Stunden lang, waehrend
          # `betfair_card_link.json`, `health/betfair.json` und `betfair_coherence_watch.json`
          # weiter aktualisiert wurden, weil sie ihre EIGENE Zeile haben. Genau daran war der
          # Ausfall vom 01.09. 22:30 UTC zu erkennen: drei Dateien lebten, dreiunddreissig nicht.
          # Ausloeser diesmal: neue Dateien (punkte_*, vorregistrierung, odds_sports), die es auf
          # dem Runner noch gar nicht gab. Ab jetzt bekommt JEDE Datei ihre eigene Zeile —
          # eine fehlende kostet dann genau sich selbst und nicht den ganzen Lauf.
          git add stats_perioden.json 2>/dev/null || true      # Stats-Seite: Wochen/Monate je Strom
          git add stake_highroller.json 2>/dev/null || true
          git add stake_bet_ledger.json 2>/dev/null || true
          git add stake_query.json 2>/dev/null || true
          git add stake_kurse.json 2>/dev/null || true
          git add stake_auswertung.json 2>/dev/null || true
          git add stake_vorregistrierung.json 2>/dev/null || true
          git add stake_league_norm.json 2>/dev/null || true
          git add stake_league_norm_state.json 2>/dev/null || true
          git add stake_burst_ledger.json 2>/dev/null || true      # ⚡ das Buch des Burst-Pushs
          git add stake_burst_seen.json 2>/dev/null || true        # sein Dedup-Stand (48h TTL)
          # 13.09.2026: das Beinahe-Buch — was der Filter verwirft und warum
          git add stake_burst_verworfen.json 2>/dev/null || true
          # 🪶 22.09.2026 (Lucas: „was ist da jetzt mit diesen 12 Megabyte"): Einrueckung
          # raus, bevor gestaged wird. betfair_prices.json traegt 0,51 MB Leerraum und wechselt
          # alle 14 Minuten — die Uebersicht laedt sie also bei JEDEM Refresh. Idempotent.
          python3 scripts/json_kompakt.py betfair_prices.json || true
          git add betfair_prices.json 2>/dev/null || true
          git add betfair_history.json 2>/dev/null || true
          git add betfair_overview.json 2>/dev/null || true
