name: 🟡 Betfair Radar (Betwatch)

# Betwatch blockt GitHubs US-Runner (HTTP 403) → läuft wie die Poly-Fetcher auf dem
# Mac-Runner ([self-hosted, macOS], Österreich-IP). Auth via Token-Header (auf dem Mac-Runner
# akzeptiert). Holt Betfair-Odds + Volumina, schreibt betfair_prices.json + betfair_history.json.
# Push mit Pull-Retry (wie manage-mls-poly.yml): das Repo wird ständig bebot-pusht → ein nackter
# `git push` scheitert non-fast-forward. Darum vor jedem Push pullen (-X ours) und bis zu 5x retry.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read          # run_health.py liest die Steps DIESES Laufs

concurrency:
  group: betfair
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 8
    env:
      # 13.08.2026 (Lucas): BETWATCH_KEY job-weit -> die autoritative /results-Korrektur (verify_settled in
      # betfair_track_record + betfair_public_eval + Money-Map-Settle in betfair_consensus) kann laufen.
      # Ohne Key blieben per Live-Feed falsch abgerechnete Picks stehen (z.B. Palmeiras 1:0 statt 1:1 -> won).
      BETWATCH_KEY: ${{ secrets.BETWATCH_KEY }}
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python finden (lokal, kein setup-python auf self-hosted)
        run: |
          PYTHON=""
          for PY in /opt/homebrew/bin/python3.13 /opt/homebrew/bin/python3.12 /opt/homebrew/bin/python3.11 /usr/local/bin/python3.13 /usr/local/bin/python3.12 /usr/local/bin/python3.11 /usr/bin/python3; do
            if "$PY" --version >/dev/null 2>&1; then PYTHON="$PY"; break; fi
          done
          if [ -z "$PYTHON" ]; then echo "❌ kein Python3 gefunden"; exit 1; fi
          echo "✅ $PYTHON ($($PYTHON --version))"
          echo "BETFAIR_PY=$PYTHON" >> $GITHUB_ENV

      - name: 🟡 Betfair/Betwatch fetchen
        run: ${{ env.BETFAIR_PY }} fetch_betfair_betwatch.py
        env:
          BETWATCH_KEY: ${{ secrets.BETWATCH_KEY }}
          # optional tunebar: BETWATCH_MAX_DETAIL / BETWATCH_WINDOW_H

      - name: Betfair-Richtung (Back/Lay je Runner aus der Quotenbewegung)
        run: ${{ env.BETFAIR_PY }} betfair_direction.py
        continue-on-error: true

      - name: Betfair-Konsens (Zweitmeinung Pinnacle/Soft, rein lesend, kein Push)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BETWATCH_KEY: ${{ secrets.BETWATCH_KEY }}   # 13.08.2026 (Lucas): Money-Map-Ledger gegen /football/results abrechnen
        run: ${{ env.BETFAIR_PY }} betfair_consensus.py
        continue-on-error: true

      - name: 🔗 Terminal-Kartenlink (unsere Card neben die Geld-Seite der Boerse)
        run: ${{ env.BETFAIR_PY }} betfair_card_link.py
        continue-on-error: true

      - name: 🔎 Kohaerenz-Beobachter (wann liegt Geld in den Tormaerkten?)
        run: ${{ env.BETFAIR_PY }} betfair_coherence_watch.py
        continue-on-error: true

      - name: 📊 Track-Record aktualisieren (Trefferquote je Liga×Markt)
        run: ${{ env.BETFAIR_PY }} betfair_track_record.py

      # 29.08.2026 (Lucas: „sowas könnte man schon als super killer Element bauen"): die
      # Konjunktions-Sektion. Läuft NACH betfair_track_record.py und betfair_consensus.py,
      # weil sie beider Ausgaben liest (Signal-Stand + Poly/Pinnacle je Spiel).
      - name: 🔒 Konjunktion (nur wo mehrere Geldströme gleichzeitig zustimmen)
        run: ${{ env.BETFAIR_PY }} killer.py
        continue-on-error: true

      # Das Freigabe-Register lief bisher gar nicht im Takt — freigabe.json wurde einmal von
      # Hand erzeugt und war seitdem alt. Damit die Sektion oben ihren eigenen Stand ehrlich
      # zeigen kann, muss das Register mitlaufen.
      - name: ✅ Freigabe-Register neu bewerten
        run: ${{ env.BETFAIR_PY }} freigabe.py
        continue-on-error: true

      # 01.09.2026 (Lucas: „damit ich aktiv drauf aufmerksam werde"): zwei Pushes in den
      # TRADES-Channel, bewusst schmal geschnitten.
      #   · Konjunktion NUR Stufe 1 (~5/Tag). Alles zu pushen waeren 20-58/Tag, und Stufe 2
      #     traegt im eigenen Buch nur +0,2%. Der Median-Abstand Latch→Anpfiff liegt bei 48
      #     Minuten — deshalb muss das hier im 15-Minuten-Takt mitlaufen, sonst ist die
      #     Nachricht wertlos, wenn sie ankommt.
      #   · Freigabe-Wechsel: selten, aber das wichtigste Ereignis im System. Auch die
      #     RUECKNAHME wird gemeldet.
      # Beide fuehren ihr EIGENES Buch (killer_push_ledger.json) — zum Preis, der in der
      # Nachricht stand, nicht zum Haltepreis der Flaeche.
      - name: 📣 Konjunktion Stufe 1 → Trades-Channel
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
        run: ${{ env.BETFAIR_PY }} killer_push.py
        continue-on-error: true

      - name: 🔓 Freigabe-Wechsel → Trades-Channel
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
        run: ${{ env.BETFAIR_PY }} freigabe_push.py
        continue-on-error: true

      - name: 📚 Liga-Basis lernen (was ist ueblich fuer Liga X in Phase Y — Basis fuers x-Norm-Badge)
        run: ${{ env.BETFAIR_PY }} betfair_league_norm.py
        continue-on-error: true

      - name: Draw-Geld-Tracker (X-Einsaetze, Pre-Match + In-Play, kam X)
        run: ${{ env.BETFAIR_PY }} betfair_draw_tracker.py
        continue-on-error: true

      - name: 🧭 Übersicht-Sidecar (Steam + frischer Zufluss, leicht für den ersten Menüpunkt)
        run: ${{ env.BETFAIR_PY }} build_betfair_overview.py
        continue-on-error: true

      - name: 📣 Betfair-Alerts (Trades-Channel + öffentlicher Moneyflow)
        run: ${{ env.BETFAIR_PY }} betfair_alerts.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
          TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 📈 Public-Push-Auswertung (Treffer/ROI der Moneyflow-Signale)
        run: ${{ env.BETFAIR_PY }} betfair_public_eval.py
        continue-on-error: true

      - name: Daten-Integritaet (Guard-Batterie, rein lesend)
        run: ${{ env.BETFAIR_PY }} betfair_data_integrity.py
        continue-on-error: true

      # 28.08.2026 (Lucas: „Fehler, die wir gar nicht mitkriegen") — 135 Steps stehen repo-weit
      # auf continue-on-error. Dieser Waechter fragt ueber die GitHub-API die Steps DIESES Laufs
      # ab und meldet jeden gescheiterten, auch wenn der Job gruen bleibt. `if: always()`, damit
      # er gerade dann laeuft, wenn vorher etwas schiefging. Muss VOR dem Commit stehen, sonst
      # bleibt health/ auf der Runner-Platte liegen.
      - name: 🩺 Lauf-Gesundheit (verschluckte Fehler sichtbar machen)
        if: always()
        continue-on-error: true
        # Self-hosted Mac: kein setup-python, deshalb der oben gefundene Interpreter.
        # `python3` waere hier /usr/bin/python3 und je nach Mac zu alt.
        run: ${{ env.BETFAIR_PY || 'python3' }} run_health.py --slug betfair
        env:
          GITHUB_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      - name: 💾 Committen + Push (Pull-Retry, wie die Poly-Workflows)
        run: |
          git config user.name "cocobet-bot"
          git config user.email "bot@users.noreply.github.com"
          git add betfair_card_link.json 2>/dev/null || true        # Terminal: unsere Card je Boersen-Spiel
          # 28.08.2026: eigene Zeile, eigener Pfad — health/<slug>.json wird NUR von diesem
          # Workflow geschrieben, deshalb kann sie mit keinem anderen kollidieren.
          git add health/betfair.json 2>/dev/null || true
          git add betfair_coherence_watch.json 2>/dev/null || true   # ab wann liegt Geld in den Tormaerkten
          # 🔴 02.09.2026 — DIE ZWEITE RUNDE DERSELBEN FALLE. `git add a b c` staged NICHTS,
          # sobald EIN Pfad nicht existiert (fatal: pathspec). Mit `2>/dev/null || true`
          # sieht man den Fehler nicht, danach ist der Index leer, `git diff --cached --quiet`
          # meldet „keine Aenderung" und der Lauf endet GRUEN — sechs Stunden lang, waehrend
          # `betfair_card_link.json`, `health/betfair.json` und `betfair_coherence_watch.json`
          # weiter aktualisiert wurden, weil sie ihre EIGENE Zeile haben. Genau daran war der
          # Ausfall vom 01.09. 22:30 UTC zu erkennen: drei Dateien lebten, dreiunddreissig nicht.
          # Ausloeser diesmal: neue Dateien (punkte_*, vorregistrierung, odds_sports), die es auf
          # dem Runner noch gar nicht gab. Ab jetzt bekommt JEDE Datei ihre eigene Zeile —
          # eine fehlende kostet dann genau sich selbst und nicht den ganzen Lauf.
          git add betfair_prices.json 2>/dev/null || true
          git add betfair_history.json 2>/dev/null || true
          git add betfair_overview.json 2>/dev/null || true
          git add betfair_track_state.json 2>/dev/null || true
          git add betfair_track_results.json 2>/dev/null || true
          git add betfair_track_record.json 2>/dev/null || true
          git add betfair_league_norm.json 2>/dev/null || true
          git add betfair_league_norm_state.json 2>/dev/null || true
          git add betfair_direction.json 2>/dev/null || true
          git add betfair_draw_state.json 2>/dev/null || true
          git add betfair_draw_results.json 2>/dev/null || true
          git add betfair_draw_record.json 2>/dev/null || true
          git add betfair_alerts_seen.json 2>/dev/null || true
          git add betfair_public_seen.json 2>/dev/null || true
          git add betfair_public_ledger.json 2>/dev/null || true
          git add betfair_public_record.json 2>/dev/null || true
          git add betfair_consensus.json 2>/dev/null || true
          git add betfair_anker.json 2>/dev/null || true
          git add betfair_consensus_history.json 2>/dev/null || true
          git add odds_sports.json 2>/dev/null || true
          git add betfair_status.json 2>/dev/null || true
          git add money_map.json 2>/dev/null || true
          git add money_map_ledger.json 2>/dev/null || true
          git add money_map_record.json 2>/dev/null || true
          git add killer.json 2>/dev/null || true
          git add killer_state.json 2>/dev/null || true
          git add killer_ledger.json 2>/dev/null || true
          git add punkte_state.json 2>/dev/null || true
          git add punkte_ledger.json 2>/dev/null || true
          git add freigabe.json 2>/dev/null || true
          git add vorregistrierung.json 2>/dev/null || true
          git add killer_push_seen.json 2>/dev/null || true
          git add killer_push_ledger.json 2>/dev/null || true
          git add freigabe_push_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "keine Änderung — nichts zu committen"
            exit 0
          fi
          git commit -m "🟡 Betfair Radar Update $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          MINE=$(git rev-parse HEAD)   # 16.08.2026 (Lucas): unsere frische Version, um den reinen Snapshot betfair_prices.json nach dem Merge zu erzwingen
          for attempt in 1 2 3 4 5; do
            git pull origin main --no-rebase -X ours --autostash 2>&1 || true
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            if [ -n "$CONFLICTS" ]; then
              echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
              git diff --staged --quiet || git commit -m "🔧 auto-resolve merge [skip ci]"
            fi
            # 16.08.2026 (Lucas): reiner Snapshot betfair_prices.json nach dem Merge IMMER auf unsere
            # frische Version — der zeilenbasierte -X ours-Merge verdoppelt sonst Array-Eintraege (Doppel-
            # Spiele im Radar). Voll neu generiert je Lauf -> kein Datenverlust. Nur DIESE Datei.
            git checkout "$MINE" -- betfair_prices.json 2>/dev/null && git add betfair_prices.json
            git diff --staged --quiet || git commit -m "🔧 betfair_prices frisch (kein Merge-Doppel) [skip ci]"
            if git push 2>&1; then echo "✅ Push nach Versuch $attempt"; exit 0; fi
            echo "Push-Versuch $attempt fehlgeschlagen — retry…"; sleep 3
          done
          echo "❌ Push nach 5 Versuchen fehlgeschlagen"; exit 1
