name: 📈 MLS Odds Refresh (dicht)

# 09.07.2026 (Lucas: „MLS voll ready, gleich wie Top-5"). Pendant zu fetch-liga-odds-dense.yml.
# Der volle update-mls-Lauf holt Quoten nur 2×/Tag → Steam-Moves verwaschen/verpasst. Dieser
# schlanke Dienst holt NUR die MLS-Quoten (1X2/O/U/BTTS/AH) + Sharp-Radar + Picks alle 2h.
# Kein voller Pipeline-Lauf (keine Form/xG/Lineups). fetch_liga_odds ist dataset-aware und holt bei
# COCOBET_DATASET=mls ausschließlich MLS (Ligen ohne Fixtures werden übersprungen).
on:
  schedule:
    # 30.08.2026: von :00 auf :23. Beleg aus health/liga-odds-dense.json (derselbe Cron):
    # die tatsächlichen Abstände waren 4,93h · 3,10h · 4,18h · 6,36h · 7,17h gegen einen
    # 2h-Takt — bei durchweg `ok: true` und null Fehlern. Die Läufe scheitern nicht, sie
    # werden gar nicht erst gestartet: GitHub verwirft geplante Läufe unter Last, und :00
    # ist global die vollste Minute. Dieselbe Lehre wie beim Digest am 28.08. (:00 -> :07).
    - cron: '23 */2 * * *'   # alle 2h, bewusst NICHT auf der vollen Stunde
  workflow_dispatch:

permissions:
  contents: write
  actions: read          # run_health.py liest die Steps DIESES Laufs

# Teilt die Gruppe mit update-mls → kein gleichzeitiges Schreiben/Pushen von mls-data.json.
concurrency:
  group: update-mls
  cancel-in-progress: false

jobs:
  mls-odds-refresh:
    runs-on: ubuntu-latest
    env:
      COCOBET_DATASET: mls
      COCOBET_PROFILE: mls_default
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Dependencies
        run: pip install -r requirements.txt

      - name: 💰 MLS-Quoten holen (nur fetch_liga_odds)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FETCH_EXTRA_MARKETS: '1'   # 20.08.2026 (Lucas): Pinnacle-BTTS + alternate_totals pro Spiel holen (Credits aufgeladen) → fair_btts wird berechnet, BTTS handelbar statt ~Modell
        run: python fetch_liga_odds.py

      - name: 📡 MLS Sharp-Moves erkennen (Radar)
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
        run: python detect_wm_sharp_moves.py || true

      # Polymarket-Preise mit-aktualisieren (12.07.2026): Poly ist die Trade-Gegenseite und speist
      # smart_money/polymarket_sharp/steam_lag. Im 2h-Takt frisch → Edges + Signale aktuell.
      - name: 💹 MLS Polymarket Preise + Edges
        run: python fetch_wm_poly_prices.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      - name: 💰 MLS Polymarket Smart-Money + Wallets
        run: python fetch_wm_poly_smartmoney.py
        continue-on-error: true

      # Direkt nach dem Fetch — siehe update-mls.yml: der Snapshot ist flüchtig.
      # Dieser 2h-Takt ist die dichteste Sammlung, die wir haben, und damit die wertvollste.
      - name: 📒 MLS Wallet-Ledger fortschreiben
        run: python build_poly_wallet_ledger.py
        continue-on-error: true

      # 19.07.2026 — Poly-Edge-Detektoren: interne Fehlbepreisung + Auflösungs-Lücken.
      # Reine Analyse der frisch geholten Preise, kein Geld. Speist den Wallets-Tab.
      - name: 🎯 MLS Poly-Kohärenz + Settlement-Lücken
        run: |
          python poly_coherence.py || true
          python poly_settlement_gap.py || true
        continue-on-error: true

      # Markout: misst über die Tage, ob Making trägt (Adverse Selection) — Tor für maker_enabled.
      - name: 🅼 MLS Maker-Markout messen
        run: python poly_markout.py || true
        continue-on-error: true

      # Geld-Genauigkeit: friert die Geld-Verteilung nah am Anpfiff ein, löst gegen Ergebnis auf.
      - name: 🎯 MLS Geld-Genauigkeit (liegt das Geld richtig?)
        run: python poly_money_accuracy.py || true
        continue-on-error: true

      # Picks aus den frischen Odds neu generieren — MLS läuft voll nur 2×/Tag; ohne diesen
      # Schritt wären Steam-Picks bis zu 12h alt. Nutzt die bestehenden Signal-Daten (Form/xG/
      # Lineups vom letzten Volllauf) + die eben geholten Odds + die frischen Poly-Preise.
      - name: 🎯 MLS-Picks aus frischen Odds generieren
        run: python generate_mls_picks.py || true

      - name: 🆕 MLS Neuer-Pick-Noti (Intraday)
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_new_picks.py || true

      # 30.08.2026 (Lucas): Schattenbuch zum Gegensignal-Filter. Schreibt JEDEN announce-faehigen
      # Pick mit — den gesendeten wie den aussortierten — und rechnet beide ab. Muss NACH der Noti
      # laufen (gleicher Stand) und VOR dem Commit.

      # 30.08.2026 (Lucas: „was soll ich mir bei MLS in den Actions anschauen?") — die Antwort war
      # bis hier: nichts, es gibt nichts zu sehen. Der Waechter lief in beiden LIGA-Workflows,
      # aber in keinem MLS-Workflow — deshalb existierte nie eine health/mls*.json, und ob ein
      # Lauf stattfand, scheiterte oder gecancelt wurde, stand nirgends. Gleiche Verdrahtung wie
      # bei der Liga: `if: always()`, VOR dem Commit, damit health/ nicht auf der Platte bleibt.
      - name: 🩺 Lauf-Gesundheit (verschluckte Fehler sichtbar machen)
        if: always()
        continue-on-error: true
        run: python3 run_health.py --slug mls-odds-dense
        env:
          GITHUB_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
      - name: 📓 Push-Schattenbuch fortschreiben
        run: python pick_push_ledger.py || true

      - name: 💾 Odds + Snapshots + Closing committen
        run: |
          git config user.name  "CocoBet Bot"
          git config user.email "bot@cocobet.local"
          python build_dashboard_pulse.py || true   # 14.08.2026 (Lucas): Puls oefter frisch (gegen "Stand vor 3h")
          # 02.09.2026: hier stand `git add <pfad>2>/dev/null` OHNE Leerzeichen. Die Shell liest
          # das als Pfad `<pfad>2` — eine Datei, die es nicht gibt. `|| true` schluckt den Fehler,
          # danach ist NICHTS gestaged, der Commit-Schritt meldet „keine Änderung" und der Job wird
          # gruen. Genau die Signatur „frischer Job, alte Daten", die uns schon den sechsstuendigen
          # Betfair-Ausfall gekostet hat. 83 solche Zeilen in 18 Workflows, alle mit Leerzeichen.
          git add health/mls-odds-dense.json 2>/dev/null || true
          git add dashboard_pulse.json 2>/dev/null || true
          git add mls-data.json 2>/dev/null || true
          git add mls-odds-history.json 2>/dev/null || true
          git add mls_closing_lines.json 2>/dev/null || true
          git add mls_sharp_moves_log.json 2>/dev/null || true
          git add mls_sharp_dedup.json 2>/dev/null || true
          git add mls_pick_announce_state.json 2>/dev/null || true
          git add mls_pick_push_ledger.json 2>/dev/null || true
          git add mls_poly_prices.json 2>/dev/null || true
          git add mls_poly_smartmoney.json 2>/dev/null || true
          git add mls_poly_wallets.json 2>/dev/null || true
          git add mls_poly_wallet_ledger.json 2>/dev/null || true
          git add mls_poly_coherence.json 2>/dev/null || true
          git add mls_poly_settlement.json 2>/dev/null || true
          git add mls_poly_markout.json 2>/dev/null || true
          git add mls_poly_money_close.json 2>/dev/null || true
          git add mls_poly_money_accuracy.json 2>/dev/null || true
          git add mls-poly-history.json 2>/dev/null || true
          git add mls_edge_alert_dedup.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Änderung — nichts zu committen."; exit 0
          fi
          git commit -m "mls: dichter Odds-Refresh + Move-Scan [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            bash scripts/ci_pull.sh main || true   # 03.09.2026: raeumt untrackte Kollisionen weg (s. Skript)
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
            if [ -n "$CONFLICTS" ]; then
              echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
              git diff --staged --quiet || git commit -m "🔧 auto-resolve merge conflicts"
            fi
            if git push 2>&1; then echo "✅ Push nach Versuch $attempt"; exit 0; fi
            echo "⚠️ Push $attempt fehlgeschlagen — retry in $((attempt * 3))s…"; sleep $((attempt * 3))
          done
          echo "❌ Push fehlgeschlagen"; exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
