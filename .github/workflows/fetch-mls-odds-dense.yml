name: 📈 MLS Odds Refresh (dicht)

# 09.07.2026 (Lucas: „MLS voll ready, gleich wie Top-5"). Pendant zu fetch-liga-odds-dense.yml.
# Der volle update-mls-Lauf holt Quoten nur 2×/Tag → Steam-Moves verwaschen/verpasst. Dieser
# schlanke Dienst holt NUR die MLS-Quoten (1X2/O/U/BTTS/AH) + Sharp-Radar + Picks alle 2h.
# Kein voller Pipeline-Lauf (keine Form/xG/Lineups). fetch_liga_odds ist dataset-aware und holt bei
# COCOBET_DATASET=mls ausschließlich MLS (Ligen ohne Fixtures werden übersprungen).
on:
  schedule:
    - cron: '0 */2 * * *'   # alle 2h; die 07/19-Vollläufe (update-mls) teilen die Gruppe
  workflow_dispatch:

permissions:
  contents: write

# Teilt die Gruppe mit update-mls → kein gleichzeitiges Schreiben/Pushen von mls-data.json.
concurrency:
  group: update-mls
  cancel-in-progress: false

jobs:
  mls-odds-refresh:
    runs-on: ubuntu-latest
    env:
      COCOBET_DATASET: mls
      COCOBET_PROFILE: mls_default
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Dependencies
        run: pip install -r requirements.txt

      - name: 💰 MLS-Quoten holen (nur fetch_liga_odds)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_liga_odds.py

      - name: 📡 MLS Sharp-Moves erkennen (Radar)
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
        run: python detect_wm_sharp_moves.py || true

      # Picks aus den frischen Odds neu generieren — MLS läuft voll nur 2×/Tag; ohne diesen
      # Schritt wären Steam-Picks bis zu 12h alt. Nutzt die bestehenden Signal-Daten (Form/xG/
      # Lineups vom letzten Volllauf) + die eben geholten Odds.
      - name: 🎯 MLS-Picks aus frischen Odds generieren
        run: python generate_mls_picks.py || true

      - name: 🆕 MLS Neuer-Pick-Noti (Intraday)
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_new_picks.py || true

      - name: 💾 Odds + Snapshots + Closing committen
        run: |
          git config user.name  "CocoBet Bot"
          git config user.email "bot@cocobet.local"
          git add mls-data.json 2>/dev/null || true
          git add mls-odds-history.json 2>/dev/null || true
          git add mls_closing_lines.json 2>/dev/null || true
          git add mls_sharp_moves_log.json 2>/dev/null || true
          git add mls_sharp_dedup.json 2>/dev/null || true
          git add mls_pick_announce_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Änderung — nichts zu committen."; exit 0
          fi
          git commit -m "mls: dichter Odds-Refresh + Move-Scan [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            git pull origin main --no-rebase -X ours --autostash 2>&1 || true
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
            if [ -n "$CONFLICTS" ]; then
              echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
              git diff --staged --quiet || git commit -m "🔧 auto-resolve merge conflicts"
            fi
            if git push 2>&1; then echo "✅ Push nach Versuch $attempt"; exit 0; fi
            echo "⚠️ Push $attempt fehlgeschlagen — retry in $((attempt * 3))s…"; sleep $((attempt * 3))
          done
          echo "❌ Push fehlgeschlagen"; exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
