name: 📊 WM 2026 Telegram Recap

on:
  # 11:00 Vienna (09:00 UTC) — Vormittags-Recap vom VORTAG (telegram_wm.py
  # nutzt 'gestern' als Default). Bewusst NICHT abends:
  #  · Vollständig: läuft nach dem 08:00-UTC fetch-wm-data-Lauf, der auch
  #    Nach-Mitternacht-UTC-Spiele auflöst (z.B. KOR-CZE, Anpfiff 02:00 UTC,
  #    Ende ~04:00). Ein Abend-Recap (21:30 UTC) würde solche Spiele verpassen.
  #  · Ein Recap statt zwei → kein Doppel-Post, weniger Lärm.
  # 20.07.2026 WM-WINTERISIERUNG: WM beendet → kein täglicher WM-Recap mehr. Reaktivieren: einkommentieren.
  # schedule:
  #   - cron: '0 9 * * *'

  workflow_dispatch:
    inputs:
      recap_date:
        description: 'Datum für Recap (YYYY-MM-DD, leer = gestern)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  wm-recap:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      # 🔴 27.09.2026 (Marsborne, 2x $5 im Abstand von 3,5 Min): ein geplanter Lauf, der
      # hinter einem anderen in der Warteschlange stand, checkt den Commit von SEINEM
      # Ausloese-Zeitpunkt aus — nicht den neuesten. Jeder Dedup-Stand, den der Lauf davor
      # gesichert hat, fehlt ihm. Deshalb: auf den neuesten Stand, BEVOR etwas sendet oder setzt.
      # Waechter: tests/test_workflow_frisch_vor_wirkung.py
      - name: 🔄 Auf den neuesten Stand (vor jeder Wirkung)
        run: bash scripts/ci_pull.sh main || true

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📊 WM Recap senden
        run: python telegram_wm.py
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_WM_MODE:       recap
