name: 🔥 Serien der Woche (Telegram Public)

# 29.06.2026 (Lucas): wöchentlicher „Serien der Woche"-Digest in den Public-Channel.
# Liest das committete wm_streaks.json (von fetch-wm-data). TikTok-safe, keine Quoten.
# Montags 09:00 UTC = 11:00 Wien. Dataset: WM (default). Liga/MLS später via COCOBET_DATASET.
on:
  schedule:
    - cron: '0 9 * * 1'   # Montag 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  streaks-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 🔥 Serien-Digest senden
        run: python telegram_streaks.py
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
