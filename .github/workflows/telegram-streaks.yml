name: 🔥 Serien der Woche (Telegram Public)

# 29.06.2026 (Lucas): wöchentlicher „Serien der Woche"-Digest in den Public-Channel.
# Liest das committete {prefix}streaks.json (von update-*). TikTok-safe, keine Quoten.
# Montags 09:00 UTC = 11:00 Wien.
# 15.07.2026 (Lucas: „Serien-der-Woche für MLS"): Matrix über alle drei Datensätze. telegram_streaks
# ist dataset-aware (D.prefix()), COCOBET_DATASET=wm ist funktional identisch zum Default → WM
# unverändert. Fehlt ein {prefix}streaks.json, ist der Lauf ein No-Op.
on:
  schedule:
    - cron: '0 9 * * 1'   # Montag 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streaks-digest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # ein Datensatz-Fehler stoppt die anderen nicht
      matrix:
        # 27.07.2026 (Lucas: „WM-Streaks obwohl vorbei"): wm-Zweig entfernt. Zusätzlich hält der
        # Frische-Guard in telegram_streaks.py jeden eingefrorenen Datensatz still (doppelt sicher).
        include:
          - dataset: liga
            profile: liga_default
          - dataset: mls
            profile: mls_default
    env:
      COCOBET_DATASET: ${{ matrix.dataset }}
      COCOBET_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 🔥 Serien-Digest senden (${{ matrix.dataset }})
        run: python telegram_streaks.py
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 💾 Digest-State committen (Woche-über-Woche-Dedup)
        run: |
          git config user.name  "CocoBet Bot"
          git config user.email "bot@cocobet.local"
          git add ${{ matrix.dataset }}_streaks_digest_state.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "kein State-Update — nichts zu committen."; exit 0; fi
          git commit -m "🔥 Serien-Digest-State ${{ matrix.dataset }} $(date -u +'%d.%m.%Y') [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for a in 1 2 3 4 5; do
            bash scripts/ci_pull.sh main || true   # 03.09.2026: raeumt untrackte Kollisionen weg (s. Skript)
            if git push 2>&1; then echo "✅ Push $a"; exit 0; fi
            echo "⚠️ Push $a fehlgeschlagen — retry…"; sleep $((a * 3))
          done
          echo "❌ Push fehlgeschlagen"; exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
