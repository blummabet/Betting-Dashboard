          wm_path = Path("wm2026-data.json")
          with open(wm_path) as f:
              wm = json.load(f)

          squads = wm.get("squads") or {}
          filled = 0
          for tid, data in FALLBACK.items():
              if not squads.get(tid, {}).get("name"):
                  squads[tid] = data
                  filled += 1

          wm["squads"] = squads
          with open(wm_path, "w") as f:
              json.dump(wm, f, ensure_ascii=False, indent=2)

          total = len([v for v in squads.values() if v.get("name")])
          print(f"Squads: {total}/48 total ({filled} from fallback)")
          PYEOF

      - name: Commit & Push
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "actions@github.com"
          git add fetch_wm_squads.py wm2026-data.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Fix WM squads: v2 script + 48/48 squad spotlights"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
