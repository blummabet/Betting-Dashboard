name: ⚽ MLS aktualisieren (Brücken-Liga)

# 29.06.2026 (Lucas): MLS als Brücken-Liga nach der WM (MLS-Restart 16.07., MLS Cup 18.12.).
# Eigener Datensatz auf dem WM/Liga-Stack: COCOBET_DATASET=mls + COCOBET_PROFILE=mls_default →
# schreibt NUR mls-data.json + mls_*-Sibling-Dateien, rührt WM (wm2026-data.json) und Liga
# (liga-data.json) NICHT an. Phase 1: Daten + Quoten + Picks + Resolve + CLV + Serien + Lernen.
# Reise/Höhe/Wetter (Phase 2) folgen mit MLS-Venue-Geodaten. Kein Poly/Trading.
# Takt an US-Anpfiffe: 19:00 UTC (Pre-Match für Abendspiele ET) + 07:00 UTC (Ergebnisse über Nacht).
on:
  schedule:
    # GETRENNT (nicht '0 7,19') — nur so unterscheidet github.event.schedule PRE- vs POST-Match:
    # 30.08.2026: von :00 auf :11 — gleiche Lehre wie beim Liga-Digest am 28.08. (:00 -> :07):
    # auf der vollen Stunde starten repo-weit die meisten Jobs, und :00 ist auch GitHub-global
    # die vollste Minute; geplante Läufe werden dort unter Last verworfen. Die beiden Crons
    # bleiben GETRENNT (nicht '11 7,19'), weil nur so github.event.schedule PRE von POST
    # unterscheidet.
    - cron: '11 19 * * *'   # PRE-Match: Abends CET, vor den US-Abendspielen (Digest + Previews)
    - cron: '11 7 * * *'    # POST-Match: Morgens CET, nach den Nachtspielen (Recap + Reviews)
  workflow_dispatch:

permissions:
  contents: write
  actions: read          # run_health.py liest die Steps DIESES Laufs

concurrency:
  # 30.08.2026: EIGENE Gruppe. Vorher teilten sich update-mls, fetch-mls-odds-dense und
  # mls-backtest die Gruppe „update-mls" — genau die Konstellation, die am 28.08. für die Liga
  # als Ursache erkannt und dort behoben wurde (update-liga -> update-liga-main), für die MLS
  # aber nie nachgezogen. Ein WARTENDER Lauf wird vom nächsten Ankömmling GECANCELT, nicht
  # verschoben; der seltenste Teilnehmer (hier der 07/19-Volllauf mit Digest und Recap) ist
  # damit strukturell der Verlierer.
  group: update-mls-main
  cancel-in-progress: false

env:
  COCOBET_DATASET: mls
  COCOBET_PROFILE: mls_default

jobs:
  update-mls:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Dependencies installieren
        run: pip install -r requirements.txt

      # 15.07.2026 (Lucas: „ganzer Telegram/TikTok-Ablauf für MLS"). generate_daily_tiktok rendert
      # HTML→PNG via Playwright/Chromium. Ohne den Renderer fing render_to_png den ImportError still
      # ab → 0 Cards (mls_daily-tiktok/ war LEER, Liga genauso). Nur der WM-Workflow installierte
      # Chromium. Analog zu daily-tiktok.yml.
      - name: 🎭 Playwright + Chromium (für TikTok-Card-Rendering)
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: 🗂️ MLS-Daten bauen (Teams + Fixtures + Ergebnisse)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python build_liga_data.py

      - name: 📐 MLS Club-Elo holen (Baseline/Evidenz — KEINE Pick-Quelle)
        run: python fetch_liga_elo.py || true

      - name: 📊 MLS Form + H2H holen
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_form.py || true

      - name: 🚩 MLS Ecken- + Karten-Statistik (für Serien)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_corners.py || true

      - name: 🔥 MLS-Serien berechnen (Streak-Content)
        run: python compute_streaks.py || true

      # 15.07.2026: Spieler-Serien (Torserie/Zu-Null) für TikTok-Player-Cards + Wochen-Digest.
      # fetch_wm_player_stats hält das player_form_ledger frisch (MUSS vor compute_player_streaks);
      # beide sind dataset-aware (mls_player_form_ledger.json / mls_player_streaks.json).
      - name: 🧾 MLS Spieler-Match-Stats nachladen (Ledger-Backfill)
        run: python fetch_wm_player_stats.py || true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      - name: 🎯 MLS Spieler-Serien berechnen
        run: python compute_player_streaks.py || true

      - name: 📈 MLS xG holen (echtes Klub-xG aus /fixtures/statistics)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_liga_xg.py || true

      - name: 👥 MLS Kader/Schlüsselspieler holen (lineup_signal + player_form-Baselines)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_squads.py || true

      - name: ⚽ MLS Top-Torjäger holen (topscorer_momentum)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_liga_topscorers.py || true

      - name: 🔁 MLS Trainerwechsel + Schlüssel-Abgänge (coach_change + transfer_shift)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_liga_team_changes.py || true

      - name: 🤕 MLS Verletzungen/Sperren holen (League + /sidelined)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_injuries.py || true

      - name: 🔮 MLS API-Football-Predictions holen (3. Modell, Cross-Check)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_apifootball_predictions.py || true

      - name: 📋 MLS Aufstellungen holen (greift T-1h vor Anpfiff)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_lineups.py --no-alerts || true

      - name: 💰 MLS-Quoten holen (1X2 + O/U + BTTS, Pinnacle+Betfair-Anker, Opening-Carry)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_liga_odds.py

      - name: 📡 MLS Sharp-Moves erkennen (Radar)
        run: python detect_wm_sharp_moves.py || true

      # Pick-/Resolve-Schritte dürfen den Daten-Commit NICHT blockieren (|| true + commit if: always()).
      # ── Polymarket MLS (12.07.2026, Lucas: „MLS ist auf Polymarket da", Woche 25 ab 17.07.) ──
      # MUSS VOR der Pick-Generierung laufen: die Signale smart_money / polymarket_sharp /
      # steam_lag sind für mls_default aktiv und lesen mls_poly_prices.json + mls_poly_smartmoney.json.
      # Läuft GitHub-hosted (ubuntu) — wie bei der WM (fetch-wm-data.yml) erreicht der US-Runner
      # Gamma + data-api. continue-on-error: ein Poly-Ausfall darf die MLS-Pipeline nie stoppen
      # (die Fetcher haben Wipe-Schutz → schreiben bei 0 Märkten gar nicht).
      - name: 💹 MLS Polymarket Preise + Edges (series_slug soccer-mls)
        run: python fetch_wm_poly_prices.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      - name: 💰 MLS Polymarket Smart-Money + Wallets
        run: python fetch_wm_poly_smartmoney.py
        continue-on-error: true

      # Wallet-Ledger MUSS direkt nach dem Fetch laufen: der Snapshot hält nur das aktuelle
      # Fenster (Top-Holder + jüngste große Trades). Was hier nicht weggeschrieben wird, ist
      # beim nächsten Lauf weg — der spätere Wallet-Track-Record hat diese Beobachtung dann nie.
      - name: 📒 MLS Wallet-Ledger fortschreiben
        run: python build_poly_wallet_ledger.py
        continue-on-error: true

      - name: 🎯 MLS Poly-Kohärenz + Settlement-Lücken
        run: |
          python poly_coherence.py || true
          python poly_settlement_gap.py || true
        continue-on-error: true

      - name: 🅼 MLS Maker-Markout messen
        run: python poly_markout.py || true
        continue-on-error: true

      - name: 🎯 MLS Geld-Genauigkeit (liegt das Geld richtig?)
        run: python poly_money_accuracy.py || true
        continue-on-error: true

      - name: 🎯 MLS-Picks generieren (Signal-Engine, mls_default)
        run: python generate_mls_picks.py || true

      - name: 📄 MLS Event-Pages generieren (live Spiele)
        run: python generate_wm_match_pages.py || true

      - name: ✅ MLS-Picks resolven (WIN/LOSS/VOID)
        run: python resolve_wm_picks.py || true

      - name: 📉 MLS-CLV setzen (Einstieg vs Closing)
        run: python resolve_steam_clv.py || true

      - name: 🎯 MLS-CLV-Bilanz aggregieren (Scoreboard)
        run: python compute_clv_summary.py || true

      - name: 📊 MLS Post-Match-xG ans Fixture (für Prozess-Verdict)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_liga_match_stats.py || true

      - name: 🧠 MLS Lern-Loop (Ledger + Bayesian-Gewichte, prozess-gewichtet)
        run: |
          python build_signal_ledger.py --write || true
          python update_signal_weights.py || true
          python compute_pick_calibration.py --write || true   # 27.07.2026 (Lucas): Kalibrierung auch für MLS/Liga (lief nur WM)
          python build_dashboard_pulse.py || true   # 30.07.2026 (Lucas): Übersicht-Puls (letzte 30 Picks · CLV/Trefferquote)

      - name: 🛡️ MLS Guard-Batterie (mls_status.json)
        run: python wm_data_integrity.py || true

      # ── Content-Ausspielung (01.07.2026 Phase B, Lucas): dataset-aware Telegram + TikTok für MLS ──
      # Zeit-gegated an US-Anpfiffe. 19:00-Lauf = PRE-Match (Digest + Previews vor den Abendspielen),
      # 07:00-Lauf = POST-Match (Recap + Reviews nach den Nachtspielen). Manueller Dispatch = PRE-Match.
      - name: 🤖 MLS AI-Previews generieren (Basis für Preview-Cards)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_wm_ai_preview.py || true

      - name: 📣 MLS Pick-Digest → Public (PRE-Match)
        if: github.event.schedule == '11 19 * * *' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_WM_MODE:       morning
        run: python telegram_wm.py || true

      # 30.08.2026 (Lucas-Checkup): der Digest ging heute früh RAUS, aber `lastDigestDate` blieb
      # auf dem 29.08. stehen — der Lauf starb, bevor er am Jobende committen konnte. Der
      # Versand steht früh im Job, der Commit ganz hinten; alles dazwischen ist Risiko.
      #
      # Die Folge ist nicht kosmetisch: notify_new_picks prüft `lastDigestDate == heute`. Steht
      # dort ein alter Tag, hält es sich für VOR dem Digest, setzt stumm die Basis und sendet
      # den ganzen Tag nichts. Genau die Lücke, für die die Intraday-Noti gebaut wurde.
      #
      # Das ist dieselbe Lehre wie am 27.08. („Digest kam heute früh nicht"), eine Ebene höher:
      # damals fehlte die Datei in der Commit-Liste, jetzt kommt die Commit-Liste zu spät.
      # Deshalb: die drei kleinen Zustandsdateien direkt nach dem Senden sichern. `if: always()`,
      # damit ein Fehler im Sende-Schritt den Zustand nicht mitreißt.
      - name: 💾 Digest-Zustand sofort sichern (Digest)
        if: always()
        continue-on-error: true
        run: |
          # 02.09.2026: hier stand `git add <pfad>2>/dev/null` OHNE Leerzeichen. Die Shell liest
          # das als Pfad `<pfad>2` — eine Datei, die es nicht gibt. `|| true` schluckt den Fehler,
          # danach ist NICHTS gestaged, der Commit-Schritt meldet „keine Änderung" und der Job wird
          # gruen. Genau die Signatur „frischer Job, alte Daten", die uns schon den sechsstuendigen
          # Betfair-Ausfall gekostet hat. 83 solche Zeilen in 18 Workflows, alle mit Leerzeichen.
          git add mls_pick_announce_state.json 2>/dev/null || true
          git add mls_telegram_sent.json 2>/dev/null || true
          git add mls-telegram-log.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "mls: Digest-Zustand (Digest) [skip ci]" || exit 0
          for attempt in 1 2 3; do
            git pull origin main --no-rebase -X ours --autostash 2>&1 || true
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
            if [ -n "$CONFLICTS" ]; then
              echo "$CONFLICTS" | while read cf; do git checkout --ours -- "$cf"; git add "$cf"; done
              git diff --staged --quiet || git commit -m "auto-resolve merge conflicts"
            fi
            git push 2>&1 && exit 0
            echo "  Push $attempt fehlgeschlagen — retry…"; sleep $((attempt * 3))
          done
          echo "  Digest-Zustand konnte nicht gepusht werden — der Jobende-Commit versucht es erneut."

      - name: 🎬 MLS TikTok Preview-Cards (PRE-Match)
        if: github.event.schedule == '11 19 * * *' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          SEND_PREVIEWS: "true"
          SEND_REVIEWS:  "false"
        run: python generate_daily_tiktok.py || true

      - name: 📊 MLS Recap → Public (POST-Match)
        if: github.event.schedule == '11 7 * * *'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_WM_MODE:       recap
        run: python telegram_wm.py || true

      # 30.08.2026 (Lucas-Checkup): der Digest ging heute früh RAUS, aber `lastDigestDate` blieb
      # auf dem 29.08. stehen — der Lauf starb, bevor er am Jobende committen konnte. Der
      # Versand steht früh im Job, der Commit ganz hinten; alles dazwischen ist Risiko.
      #
      # Die Folge ist nicht kosmetisch: notify_new_picks prüft `lastDigestDate == heute`. Steht
      # dort ein alter Tag, hält es sich für VOR dem Digest, setzt stumm die Basis und sendet
      # den ganzen Tag nichts. Genau die Lücke, für die die Intraday-Noti gebaut wurde.
      #
      # Das ist dieselbe Lehre wie am 27.08. („Digest kam heute früh nicht"), eine Ebene höher:
      # damals fehlte die Datei in der Commit-Liste, jetzt kommt die Commit-Liste zu spät.
      # Deshalb: die drei kleinen Zustandsdateien direkt nach dem Senden sichern. `if: always()`,
      # damit ein Fehler im Sende-Schritt den Zustand nicht mitreißt.
      - name: 💾 Digest-Zustand sofort sichern (Recap)
        if: always()
        continue-on-error: true
        run: |
          git add mls_pick_announce_state.json 2>/dev/null || true
          git add mls_telegram_sent.json 2>/dev/null || true
          git add mls-telegram-log.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "mls: Digest-Zustand (Recap) [skip ci]" || exit 0
          for attempt in 1 2 3; do
            git pull origin main --no-rebase -X ours --autostash 2>&1 || true
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
            if [ -n "$CONFLICTS" ]; then
              echo "$CONFLICTS" | while read cf; do git checkout --ours -- "$cf"; git add "$cf"; done
              git diff --staged --quiet || git commit -m "auto-resolve merge conflicts"
            fi
            git push 2>&1 && exit 0
            echo "  Push $attempt fehlgeschlagen — retry…"; sleep $((attempt * 3))
          done
          echo "  Digest-Zustand konnte nicht gepusht werden — der Jobende-Commit versucht es erneut."

      - name: 🎬 MLS TikTok Review-Cards (POST-Match)
        if: github.event.schedule == '11 7 * * *'
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
          SEND_PREVIEWS: "false"
          SEND_REVIEWS:  "true"
        run: python generate_daily_tiktok.py || true

      # Intraday-„Neuer Pick"-Noti (03.07.2026): meldet Nachzügler seit dem heutigen Digest.
      - name: 🆕 MLS Neuer-Pick-Noti (Intraday)
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_new_picks.py || true

      # 30.08.2026 (Lucas): Schattenbuch zum Gegensignal-Filter. Schreibt JEDEN announce-faehigen
      # Pick mit — den gesendeten wie den aussortierten — und rechnet beide ab. Muss NACH der Noti
      # laufen (gleicher Stand) und VOR dem Commit.

      # 30.08.2026 (Lucas: „was soll ich mir bei MLS in den Actions anschauen?") — die Antwort war
      # bis hier: nichts, es gibt nichts zu sehen. Der Waechter lief in beiden LIGA-Workflows,
      # aber in keinem MLS-Workflow — deshalb existierte nie eine health/mls*.json, und ob ein
      # Lauf stattfand, scheiterte oder gecancelt wurde, stand nirgends. Gleiche Verdrahtung wie
      # bei der Liga: `if: always()`, VOR dem Commit, damit health/ nicht auf der Platte bleibt.
      - name: 🩺 Lauf-Gesundheit (verschluckte Fehler sichtbar machen)
        if: always()
        continue-on-error: true
        run: python3 run_health.py --slug update-mls
        env:
          GITHUB_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
      - name: 📓 Push-Schattenbuch fortschreiben
        run: python pick_push_ledger.py || true

      # Serien-Watch pre-match (PRE-Lauf, vor den US-Abendspielen) + Recap post-match (POST-Lauf).
      - name: 🔥 MLS Serien-Watch (PRE-Match)
        if: github.event.schedule == '11 19 * * *' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_STREAK_MODE:   watch
        run: python telegram_streak_watch.py || true

      - name: 📊 MLS Serien-Recap (POST-Match)
        if: github.event.schedule == '11 7 * * *'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_STREAK_MODE:   recap
        run: python telegram_streak_watch.py || true

      # 12.07.2026 (Lucas: „Cards für Liga kaputt"): HARTER Stopp vor dem Commit. Genau dieser
      # Datensatz (mls-data.json) wurde bei abgelaufenem API-Key leer geschrieben und gepusht →
      # die Liga-Cards (die MLS mit-mergen) kippten. KEIN `|| true`: ein Wipe macht den Job ROT.
      - name: 🛡️ Wipe-Check (kein leerer Datensatz darf committet werden)
        run: python check_not_wiped.py

      - name: 💾 mls-data.json committen
        if: always()
        run: |
          git config user.name  "CocoBet Bot"
          git config user.email "bot@cocobet.local"
          # EINZELN stagen (atomar — nicht-existente Pfade dürfen den add nicht killen).
          git add health/update-mls.json 2>/dev/null || true
          git add mls-data.json || true
          git add mls-odds-history.json 2>/dev/null || true
          git add mls_lineups.json 2>/dev/null || true
          git add mls_signal_ledger.json 2>/dev/null || true
          git add mls_pick_calibration.json 2>/dev/null || true
          git add mls_signal_weights.json 2>/dev/null || true
          git add mls_clv_summary.json 2>/dev/null || true
          git add dashboard_pulse.json 2>/dev/null || true
          git add mls_streaks.json 2>/dev/null || true
          git add mls_status.json 2>/dev/null || true
          git add mls_sharp_moves_log.json 2>/dev/null || true
          git add mls_sharp_dedup.json 2>/dev/null || true
          git add matches/mls-index.json 2>/dev/null || true
          git add matches/data/mls-*.json 2>/dev/null || true
          git add mls_match_stats_cache.json 2>/dev/null || true
          git add mls_apif_predictions.json 2>/dev/null || true
          git add mls_player_form.json 2>/dev/null || true
          git add mls_player_form_ledger.json 2>/dev/null || true
          # 15.07.2026: Datenbasis für Player-TikTok-Cards + Wochen-Digest — ohne Commit nach
          # jedem Lauf weg, der Wochen-Digest fände dann nichts.
          git add mls_player_streaks.json 2>/dev/null || true
          git add mls_daily-tiktok 2>/dev/null || true   # gerenderte TikTok-Cards (Archiv)
          git add mls_tiktok_sent.json 2>/dev/null || true
          git add mls-telegram-log.json 2>/dev/null || true
          git add mls_pick_announce_state.json 2>/dev/null || true
          git add mls_pick_push_ledger.json 2>/dev/null || true
          git add mls_streak_watch.json 2>/dev/null || true
          # Polymarket-MLS (12.07.2026): Preise/Smart-Money/Wallets speisen Signale + 🐋-Tab.
          git add mls_poly_prices.json 2>/dev/null || true
          git add mls_poly_smartmoney.json 2>/dev/null || true
          git add mls_poly_wallets.json 2>/dev/null || true
          git add mls_poly_wallet_ledger.json 2>/dev/null || true
          git add mls_poly_coherence.json 2>/dev/null || true
          git add mls_poly_settlement.json 2>/dev/null || true
          git add mls_poly_markout.json 2>/dev/null || true
          git add mls_poly_money_close.json 2>/dev/null || true
          git add mls_poly_money_accuracy.json 2>/dev/null || true
          git add mls-poly-history.json 2>/dev/null || true
          git add mls_edge_alert_dedup.json 2>/dev/null || true
          # 13.07.2026 (MLS-Audit): wurden geschrieben, aber nie committet → Swap-Guard ohne
          # Gedächtnis, Telegram-Tagesmarker wirkungslos (Doppelpost-Risiko).
          git add mls_swap_history.json 2>/dev/null || true
          git add mls_telegram_sent.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "mls: Daten + Quoten + Picks + Resolve + Lernen [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Remote kann sich zwischenzeitlich bewegt haben (paralleler Workflow) → rebasen, dann push.
          # --autostash: Pipeline-Scripts fassen auch geteilte tracked-Dateien an (z.B. telegram-log.json),
          # die NICHT in der kuratierten Stage-Liste stehen → ohne autostash bricht der Rebase mit
          # „cannot pull with rebase: You have unstaged changes" ab (Bug 29.06.2026, 1. MLS-Lauf).
          # 14.08.2026 (Lucas): Push-Race mit parallelen Bot-Pushes (betfair alle 10 Min, liga, ...) -> Retry.
          # Vor JEDEM Versuch neu rebasen; ein einzelner rebase+push verliert, wenn origin/main sich
          # zwischen rebase und push nochmal bewegt. Bis 5x, dann erst echter Fehler.
          # 15.08.2026 (Lucas): Merge (-X ours) statt Rebase + explizite Konfliktaufloesung.
          # Der Rebase-Ansatz blieb bei Konflikten in geteilten JSONs (liga-odds-history.json) haengen
          # (detached HEAD, unmerged files) und ALLE Retries scheiterten mit 'unmerged files'. Merge
          # -X ours loest die meisten Konflikte automatisch zugunsten der frisch generierten Runner-Daten;
          # verbleibende behalten wir per --ours und committen sie. Robust gegen Parallel-Bot-Push-Races.
          for attempt in 1 2 3 4 5; do
            git pull origin main --no-rebase -X ours --autostash 2>&1 || true
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            if [ -n "$CONFLICTS" ]; then
              echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
              git diff --staged --quiet || git commit -m "mls: auto-resolve merge [skip ci]"
            fi
            if git push; then echo "OK Push nach Versuch $attempt"; break; fi
            echo "Push-Versuch $attempt fehlgeschlagen (origin bewegt) - retry..."; sleep 3
            if [ "$attempt" = "5" ]; then echo "Push nach 5 Versuchen fehlgeschlagen"; exit 1; fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
