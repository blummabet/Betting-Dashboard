          # also nur auf dem Papier (WM und MLS committen ihn längst). Eigene Zeile, nie an
          # eine lange anhängen: `git add a b c` staged NICHTS, wenn EINE Datei fehlt.
          git add liga_telegram_sent.json 2>/dev/null || true       # Doppel-Post-Sperre Public-Digest
          git add liga_steam_lag_sell_dedup.json 2>/dev/null || true # Sell-Alert Dedup
          # Poly-Analyseschicht (25.08.2026, Audit-Befund 07) — ohne diese Zeilen laeuft der
