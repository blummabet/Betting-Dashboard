          git add health/liga.json 2>/dev/null || true
          git add liga_steam_lag_log.json 2>/dev/null || true        # Steam-Lag Signal-Log
          # 27.08.2026 (Lucas: „Digest kam heute früh nicht"): telegram_wm.py hat einen
