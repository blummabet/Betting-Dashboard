name: ⚽ Liga aktualisieren (Top 5)

# 25.06.2026 (Lucas): Liga auf dem WM-Stack, PARALLEL zur WM. Eigener Workflow, fest auf
# COCOBET_DATASET=liga + COCOBET_PROFILE=liga_default → schreibt NUR liga-data.json, rührt die
# WM-Pipeline (wm2026-data.json, profiles.active=wm2026) NICHT an. Phase 1: Daten + Quoten + Picks
# + Resolve + CLV (kein Poly). Takt 2×/Tag während der WM; danach hochdrehen.
on:
  schedule:
    # GETRENNT (nicht '0 6,18') — nur so unterscheidet github.event.schedule PRE- vs POST-Match:
    # 28.08.2026 (Lucas: „ich hab den Push in der Früh vermisst") — von :00 auf :07 verschoben.
    # Zwei Gründe, beide gemessen: (1) auf der vollen Stunde starten repo-weit bis zu 11 Jobs
    # gleichzeitig, und :00 ist auch GitHub-global die vollste Minute. (2) 6 und 18 sind GERADE
    # Stunden — genau die, auf denen fetch-liga-odds-dense (`0 */2`) läuft, und 18:00 zusätzlich
    # manage-liga-poly. Alle drei lagen bis eben in DERSELBEN concurrency-Gruppe (s. unten):
    # zwei bis drei Läufe in derselben Minute, einer läuft, die anderen warten — und ein
    # wartender Lauf wird vom nächsten Ankömmling GECANCELT, nicht verschoben. Der Digest war
    # mit 2 von 39 Läufen der seltenste Teilnehmer und damit strukturell der Verlierer.
    # Beleg: 15.08., 27.08. und 28.08. fiel der 06:00-Slot komplett aus; der Abendlauf vom
    # 27.08. kam erst am 28.08. um 02:00 an.
    # GETRENNT (nicht '7 6,18') — nur so unterscheidet github.event.schedule PRE- vs POST-Match.
    - cron: '7 6 * * *'    # PRE-Match: Morgens CET, vor den Nachmittags-Anpfiffen (Digest + Previews)
    # 31.08.2026 (Lucas: der Morgen-Digest fehlte schon wieder) — NACHZUEGLER.
    # Der :07-Slot war die Antwort auf drei ausgefallene 06:00-Laeufe im August; am 31.08.
    # fiel auch er aus (kein Lauf, kein Eintrag in liga_telegram_sent.json). Gegen einen
    # verschluckten Cron hilft kein besserer Cron, nur ein zweiter Versuch.
    # Das ist NUR sicher, seit `liga_telegram_sent.json` committet wird (27.08.): der
    # Marker `morning_card:<datum>` haelt den Digest zurueck, wenn der 06:07-Lauf ihn
    # schon geschickt hat. Ohne diesen Marker waere das hier ein Doppelpost-Generator.
    # 07:37 UTC = 09:37 CEST, immer noch vor den fruehesten Top-5-Anpfiffen (10:00 UTC).
    - cron: '37 7 * * *'   # PRE-Match Nachzuegler: faengt einen verschluckten 06:07-Lauf auf
    - cron: '7 18 * * *'   # POST-Match: Abends CET (Recap + Reviews decken den Vortag ab)
  workflow_dispatch:

permissions:
  contents: write
  actions: read          # run_health.py liest die Steps DIESES Laufs

concurrency:
  # 28.08.2026: EIGENE Gruppe. Vorher teilte sich dieser Workflow die Gruppe „update-liga" mit
  # manage-liga-poly (25 Läufe/Tag) und fetch-liga-odds-dense (12/Tag) — 39 Läufe durch eine
  # Spur, und wer wartet, wird gecancelt. Nötig war das Bündeln nie: die drei laufen auf
  # VERSCHIEDENEN Maschinen (2x ubuntu, 1x Mac), teilen also keine Dateien; sie schützt nur vor
  # Git-Push-Races, und dafür hat jeder der drei längst seine 5-fach-Rebase-Retry-Schleife.
  group: update-liga-main
  cancel-in-progress: false

env:
  COCOBET_DATASET: liga
  COCOBET_PROFILE: liga_default

jobs:
  update-liga:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Dependencies installieren
        run: pip install -r requirements.txt

      # 15.07.2026: Liga rendert seit Wochen 0 TikTok-Cards, weil Playwright/Chromium fehlte
      # (render_to_png fing den ImportError still ab). Analog update-mls + daily-tiktok.yml.
      - name: 🎭 Playwright + Chromium (für TikTok-Card-Rendering)
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: 🗂️ Liga-Daten bauen (Teams + Fixtures + Ergebnisse)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python build_liga_data.py

      - name: 📐 Liga Club-Elo holen (Baseline/Evidenz — KEINE Pick-Quelle)
        run: python fetch_liga_elo.py || true

      - name: 📊 Liga Form + H2H holen (letzte Saison als erster Inhalt)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_form.py || true

      - name: 🚩 Liga Ecken-Statistik (für Ecken-Serien)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_corners.py || true

      - name: 🔥 Liga-Serien berechnen (Streak-Content)
        run: python compute_streaks.py || true

      # 15.07.2026: Spieler-Serien für TikTok-Player-Cards + Wochen-Digest (fehlten der Liga bisher).
      - name: 🧾 Liga Spieler-Match-Stats nachladen (Ledger-Backfill)
        run: python fetch_wm_player_stats.py || true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      - name: 🎯 Liga Spieler-Serien berechnen
        run: python compute_player_streaks.py || true

      - name: 📈 Liga xG holen (echtes Klub-xG aus /fixtures/statistics)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_liga_xg.py || true

      - name: 👥 Liga Kader/Schlüsselspieler holen (für lineup_signal + player_form-Baselines)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_squads.py || true

      - name: ⚽ Liga Top-Torjäger holen (topscorer_momentum)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_liga_topscorers.py || true

      - name: 🔁 Liga Trainerwechsel + Schlüssel-Abgänge (coach_change + transfer_shift)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_liga_team_changes.py || true

      - name: 🤕 Liga Verletzungen/Sperren holen (League + /sidelined)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_injuries.py || true

      - name: 🔮 Liga API-Football-Predictions holen (3. Modell, Cross-Check)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_apifootball_predictions.py || true

      - name: 📋 Liga Aufstellungen holen (greift T-1h vor Anpfiff)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_lineups.py --no-alerts || true

      - name: 💰 Liga-Quoten holen (1X2 + O/U + BTTS, Opening-Carry)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_liga_odds.py

      - name: 📡 Liga Sharp-Moves erkennen (Radar)
        run: python detect_wm_sharp_moves.py || true

      # ── Polymarket Preise + Steam-Lag (04.08.2026, Lucas: La Liga „gleich scharf schalten“) ──
      # Pini-Move → Poly zieht verzögert nach. fetch_wm_poly_prices ist dataset-aware
      # (liga-data.json → liga_poly_prices.json + liga-poly-history.json), steam_lag_monitor
      # rechnet Pini-vs-Poly-Edges und pusht Trade-Signale in den TRADES-Channel. Beide
      # continue-on-error (Poly kann geoblockt sein / erste Läufe ohne Match).
      - name: 💹 Liga Polymarket Preise + Edge Alerts
        run: python fetch_wm_poly_prices.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      - name: 🔥 Liga Steam Lag Monitor — Signale loggen + Sell Alerts
        run: python steam_lag_monitor.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      # ── Poly-Analyseschicht (25.08.2026, Audit-Befund 07) ────────────────────────────
      # Liga tradet seit dem 19.08. real auf Polymarket, aber diese sechs Skripte liefen nur
      # fuer MLS und WM. Sieben liga_poly_*-Dateien existierten schlicht nicht, der „⚽ Top-5"-
      # Punkt im Wallets-Tab holte 404er. Alle sind dataset-aware und lesen COCOBET_DATASET aus
      # dem env-Block dieses Workflows.
      - name: 💰 Liga Polymarket Smart-Money + Wallets
        run: python fetch_wm_poly_smartmoney.py
        continue-on-error: true

      # MUSS direkt nach dem Fetch laufen: der Snapshot haelt nur das AKTUELLE Fenster
      # (Top-Holder + juengste grosse Trades). Was hier nicht weggeschrieben wird, ist beim
      # naechsten Lauf weg — der spaetere Wallet-Track-Record hat diese Beobachtung dann nie.
      - name: 📒 Liga Wallet-Ledger fortschreiben
        run: python build_poly_wallet_ledger.py
        continue-on-error: true

      - name: 🎯 Liga Poly-Kohärenz + Settlement-Lücken
        run: |
          python poly_coherence.py || true
          python poly_settlement_gap.py || true
        continue-on-error: true

      - name: 🅼 Liga Maker-Markout messen
        run: python poly_markout.py || true
        continue-on-error: true

      - name: 🎯 Liga Geld-Genauigkeit (liegt das Geld richtig?)
        run: python poly_money_accuracy.py || true
        continue-on-error: true

      # 25.06.2026 (Lucas: „Navi da, keine Cards"): Pick-/Resolve-Schritte dürfen den Commit der
      # Daten NICHT blockieren. Wenn einer crasht, liegen Teams+Fixtures+Quoten trotzdem in
      # liga-data.json → Cards erscheinen. Darum `|| true` + Commit mit `if: always()`.
      - name: 🎯 Liga-Picks generieren (Signal-Engine, liga_default)
        run: python generate_liga_picks.py || true

      - name: 📄 Liga Event-Pages generieren (live Spiele)
        run: python generate_wm_match_pages.py || true

      - name: ✅ Liga-Picks resolven (WIN/LOSS/VOID)
        run: python resolve_wm_picks.py || true

      - name: 📉 Liga-CLV setzen (Einstieg vs Closing)
        run: python resolve_steam_clv.py || true

      - name: 🎯 Liga-CLV-Bilanz aggregieren (Scoreboard)
        run: python compute_clv_summary.py || true

      - name: 📊 Liga Post-Match-xG ans Fixture (für Prozess-Verdict)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_liga_match_stats.py || true

      - name: 🧠 Liga Lern-Loop (Ledger + Bayesian-Gewichte, prozess-gewichtet)
        run: |
          python build_signal_ledger.py --write || true
          python update_signal_weights.py || true
          python compute_pick_calibration.py --write || true   # 27.07.2026 (Lucas): Kalibrierung auch für MLS/Liga (lief nur WM)
          python build_dashboard_pulse.py || true   # 30.07.2026 (Lucas): Übersicht-Puls (letzte 30 Picks · CLV/Trefferquote)

      - name: 🛡️ Liga Guard-Batterie (liga_status.json)
        run: python wm_data_integrity.py || true

      # 04.09.2026 (Lucas: „mir waere es wichtig fehlerfrei zu sein"). Die Uebersicht verdichtet
      # elf Engines zu Saetzen — und genau dort entstanden am 04.09. drei Fehler an einem Tag,
      # alle derselben Bauart: eine Behauptung, die die Zahl daneben widerlegt. Betfair, Poly und
      # WM haben je eine Guard-Batterie; die Uebersicht hatte keine.
      - name: 🧭 Uebersicht Guard-Batterie (uebersicht_integrity.json)
        run: python uebersicht_integrity.py || true

      # ── Content-Ausspielung (01.07.2026 Phase B, Lucas): dataset-aware Telegram + TikTok für Liga ──
      # 06:00-Lauf = PRE-Match (Digest + Previews vor den Nachmittagsspielen), 18:00-Lauf = POST-Match
      # (Recap + Reviews; decken den Vortag ab). Manueller Dispatch = PRE-Match.
      - name: 🤖 Liga AI-Previews generieren (Basis für Preview-Cards)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_wm_ai_preview.py || true

      - name: 📣 Liga Pick-Digest → Public (PRE-Match)
        if: github.event.schedule == '7 6 * * *' || github.event.schedule == '37 7 * * *' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_WM_MODE:       morning
        run: python telegram_wm.py || true

      # 30.08.2026 (Lucas-Checkup): der Digest ging heute früh RAUS, aber `lastDigestDate` blieb
      # auf dem 29.08. stehen — der Lauf starb, bevor er am Jobende committen konnte. Der
      # Versand steht früh im Job, der Commit ganz hinten; alles dazwischen ist Risiko.
      #
      # Die Folge ist nicht kosmetisch: notify_new_picks prüft `lastDigestDate == heute`. Steht
      # dort ein alter Tag, hält es sich für VOR dem Digest, setzt stumm die Basis und sendet
      # den ganzen Tag nichts. Genau die Lücke, für die die Intraday-Noti gebaut wurde.
      #
      # Das ist dieselbe Lehre wie am 27.08. („Digest kam heute früh nicht"), eine Ebene höher:
      # damals fehlte die Datei in der Commit-Liste, jetzt kommt die Commit-Liste zu spät.
      # Deshalb: die drei kleinen Zustandsdateien direkt nach dem Senden sichern. `if: always()`,
      # damit ein Fehler im Sende-Schritt den Zustand nicht mitreißt.
      - name: 💾 Digest-Zustand sofort sichern (Digest)
        if: always()
        continue-on-error: true
        run: |
          # 02.09.2026: hier stand `git add <pfad>2>/dev/null` OHNE Leerzeichen. Die Shell liest
          # das als Pfad `<pfad>2` — eine Datei, die es nicht gibt. `|| true` schluckt den Fehler,
          # danach ist NICHTS gestaged, der Commit-Schritt meldet „keine Änderung" und der Job wird
          # gruen. Genau die Signatur „frischer Job, alte Daten", die uns schon den sechsstuendigen
          # Betfair-Ausfall gekostet hat. 83 solche Zeilen in 18 Workflows, alle mit Leerzeichen.
          git add liga_pick_announce_state.json 2>/dev/null || true
          git add liga_telegram_sent.json 2>/dev/null || true
          git add liga-telegram-log.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "liga: Digest-Zustand (Digest) [skip ci]" || exit 0
          for attempt in 1 2 3; do
            bash scripts/ci_pull.sh main || true   # 03.09.2026: raeumt untrackte Kollisionen weg (s. Skript)
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
            if [ -n "$CONFLICTS" ]; then
              echo "$CONFLICTS" | while read cf; do git checkout --ours -- "$cf"; git add "$cf"; done
              git diff --staged --quiet || git commit -m "auto-resolve merge conflicts"
            fi
            git push 2>&1 && exit 0
            echo "  Push $attempt fehlgeschlagen — retry…"; sleep $((attempt * 3))
          done
          echo "  Digest-Zustand konnte nicht gepusht werden — der Jobende-Commit versucht es erneut."

      - name: 🎬 Liga TikTok Preview-Cards (PRE-Match)
        if: github.event.schedule == '7 6 * * *' || github.event.schedule == '37 7 * * *' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
          TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          SEND_PREVIEWS: "true"
          SEND_REVIEWS:  "false"
          # 21.08.2026 (Lucas): Money-Map-Cards (Betfair-€ + Poly-$ + Pinnacle je Spiel, nur mmStrong).
          # money_map.json ist GLOBAL -> NUR hier setzen (ein Lauf/Tag), sonst 3x dieselbe Card (liga/mls/wm).
          SEND_MONEYMAP: "true"
          # Money-Map-Cards auch an den PUBLIC-Channel (Lucas: taeglicher Public-Heartbeat).
          # 21.08.2026: erstmal "false" = NUR Trades (Lucas testet zuerst). Auf "true" flippen wenn ok.
          MONEYMAP_PUBLIC: "false"
        run: python generate_daily_tiktok.py || true

      - name: 📊 Liga Recap → Public (POST-Match)
        if: github.event.schedule == '7 18 * * *'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_WM_MODE:       recap
        run: python telegram_wm.py || true

      # 30.08.2026 (Lucas-Checkup): der Digest ging heute früh RAUS, aber `lastDigestDate` blieb
      # auf dem 29.08. stehen — der Lauf starb, bevor er am Jobende committen konnte. Der
      # Versand steht früh im Job, der Commit ganz hinten; alles dazwischen ist Risiko.
      #
      # Die Folge ist nicht kosmetisch: notify_new_picks prüft `lastDigestDate == heute`. Steht
      # dort ein alter Tag, hält es sich für VOR dem Digest, setzt stumm die Basis und sendet
      # den ganzen Tag nichts. Genau die Lücke, für die die Intraday-Noti gebaut wurde.
      #
      # Das ist dieselbe Lehre wie am 27.08. („Digest kam heute früh nicht"), eine Ebene höher:
      # damals fehlte die Datei in der Commit-Liste, jetzt kommt die Commit-Liste zu spät.
      # Deshalb: die drei kleinen Zustandsdateien direkt nach dem Senden sichern. `if: always()`,
      # damit ein Fehler im Sende-Schritt den Zustand nicht mitreißt.
      - name: 💾 Digest-Zustand sofort sichern (Recap)
        if: always()
        continue-on-error: true
        run: |
          git add liga_pick_announce_state.json 2>/dev/null || true
          git add liga_telegram_sent.json 2>/dev/null || true
          git add liga-telegram-log.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "liga: Digest-Zustand (Recap) [skip ci]" || exit 0
          for attempt in 1 2 3; do
            bash scripts/ci_pull.sh main || true   # 03.09.2026: raeumt untrackte Kollisionen weg (s. Skript)
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
            if [ -n "$CONFLICTS" ]; then
              echo "$CONFLICTS" | while read cf; do git checkout --ours -- "$cf"; git add "$cf"; done
              git diff --staged --quiet || git commit -m "auto-resolve merge conflicts"
            fi
            git push 2>&1 && exit 0
            echo "  Push $attempt fehlgeschlagen — retry…"; sleep $((attempt * 3))
          done
          echo "  Digest-Zustand konnte nicht gepusht werden — der Jobende-Commit versucht es erneut."

      - name: 🎬 Liga TikTok Review-Cards (POST-Match)
        if: github.event.schedule == '7 18 * * *'
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
          SEND_PREVIEWS: "false"
          SEND_REVIEWS:  "true"
        run: python generate_daily_tiktok.py || true

      # Intraday-„Neuer Pick"-Noti (03.07.2026): meldet Nachzügler seit dem heutigen Digest.
      - name: 🆕 Liga Neuer-Pick-Noti (Intraday)
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_new_picks.py || true

      # 30.08.2026 (Lucas): Schattenbuch zum Gegensignal-Filter. Schreibt JEDEN announce-faehigen
      # Pick mit — den gesendeten wie den aussortierten — und rechnet beide ab. Muss NACH der Noti
      # laufen (gleicher Stand) und VOR dem Commit.
      - name: 📓 Push-Schattenbuch fortschreiben
        run: python pick_push_ledger.py || true

      # Serien-Watch pre-match (PRE-Lauf 06:00) + Recap post-match (POST-Lauf 18:00).
      - name: 🔥 Liga Serien-Watch (PRE-Match)
        if: github.event.schedule == '7 6 * * *' || github.event.schedule == '37 7 * * *' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_STREAK_MODE:   watch
        run: python telegram_streak_watch.py || true

      - name: 📊 Liga Serien-Recap (POST-Match)
        if: github.event.schedule == '7 18 * * *'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_STREAK_MODE:   recap
        run: python telegram_streak_watch.py || true

      # 12.07.2026 (Lucas: „Cards für Liga kaputt"): HARTER Stopp vor dem Commit. Alle Schritte
      # laufen mit `|| true` und das git add ist bedingungslos → ohne diesen Check würde ein
      # leer-geschriebener Datensatz (API-Key abgelaufen) einfach gepusht. KEIN `|| true` hier:
      # ein Wipe muss den Job ROT machen, nicht ins Live-Frontend wandern.
      # 28.08.2026 (Lucas: „Fehler, die wir gar nicht mitkriegen") — 135 Steps stehen repo-weit
      # auf continue-on-error. Dieser Waechter fragt ueber die GitHub-API die Steps DIESES Laufs
      # ab und meldet jeden gescheiterten, auch wenn der Job gruen bleibt. `if: always()`, damit
      # er gerade dann laeuft, wenn vorher etwas schiefging. Muss VOR dem Commit stehen, sonst
      # bleibt health/ auf der Runner-Platte liegen.
      - name: 🩺 Lauf-Gesundheit (verschluckte Fehler sichtbar machen)
        if: always()
        continue-on-error: true
        run: python3 run_health.py --slug liga
        env:
          GITHUB_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      - name: 🛡️ Wipe-Check (kein leerer Datensatz darf committet werden)
        run: python check_not_wiped.py

      - name: 💾 liga-data.json committen
        if: always()
        run: |
          git config user.name  "CocoBet Bot"
          git config user.email "bot@cocobet.local"
          # EINZELN stagen (25.06.2026, Lucas: Bug „Everything up-to-date"): git add ist atomar —
          # ein nicht-existenter Pfad (liga-odds-history.json gibt's anfangs nicht) ließ den GANZEN
          # add fehlschlagen → liga-data.json wurde nie gestaged → nie committet → Live blieb Platzhalter.
          git add liga-data.json || true
          git add liga-odds-history.json 2>/dev/null || true
          git add liga_lineups.json 2>/dev/null || true
          git add liga_signal_ledger.json 2>/dev/null || true
          git add liga_pick_calibration.json 2>/dev/null || true
          git add liga_signal_weights.json 2>/dev/null || true
          git add liga_clv_summary.json 2>/dev/null || true
          git add dashboard_pulse.json 2>/dev/null || true
          git add liga_streaks.json 2>/dev/null || true
          git add liga_status.json 2>/dev/null || true
