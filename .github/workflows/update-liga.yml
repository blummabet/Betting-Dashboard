name: ⚽ Liga aktualisieren (Top 5)

# 25.06.2026 (Lucas): Liga auf dem WM-Stack, PARALLEL zur WM. Eigener Workflow, fest auf
# COCOBET_DATASET=liga + COCOBET_PROFILE=liga_default → schreibt NUR liga-data.json, rührt die
# WM-Pipeline (wm2026-data.json, profiles.active=wm2026) NICHT an. Phase 1: Daten + Quoten + Picks
# + Resolve + CLV (kein Poly). Takt 2×/Tag während der WM; danach hochdrehen.
on:
  schedule:
    # GETRENNT (nicht '0 6,18') — nur so unterscheidet github.event.schedule PRE- vs POST-Match:
    - cron: '0 6 * * *'    # PRE-Match: Morgens CET, vor den Nachmittags-Anpfiffen (Digest + Previews)
    - cron: '0 18 * * *'   # POST-Match: Abends CET (Recap + Reviews decken den Vortag ab)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-liga
  cancel-in-progress: false

env:
  COCOBET_DATASET: liga
  COCOBET_PROFILE: liga_default

jobs:
  update-liga:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Dependencies installieren
        run: pip install -r requirements.txt

      # 15.07.2026: Liga rendert seit Wochen 0 TikTok-Cards, weil Playwright/Chromium fehlte
      # (render_to_png fing den ImportError still ab). Analog update-mls + daily-tiktok.yml.
      - name: 🎭 Playwright + Chromium (für TikTok-Card-Rendering)
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: 🗂️ Liga-Daten bauen (Teams + Fixtures + Ergebnisse)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python build_liga_data.py

      - name: 📐 Liga Club-Elo holen (Baseline/Evidenz — KEINE Pick-Quelle)
        run: python fetch_liga_elo.py || true

      - name: 📊 Liga Form + H2H holen (letzte Saison als erster Inhalt)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_form.py || true

      - name: 🚩 Liga Ecken-Statistik (für Ecken-Serien)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_corners.py || true

      - name: 🔥 Liga-Serien berechnen (Streak-Content)
        run: python compute_streaks.py || true

      # 15.07.2026: Spieler-Serien für TikTok-Player-Cards + Wochen-Digest (fehlten der Liga bisher).
      - name: 🧾 Liga Spieler-Match-Stats nachladen (Ledger-Backfill)
        run: python fetch_wm_player_stats.py || true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      - name: 🎯 Liga Spieler-Serien berechnen
        run: python compute_player_streaks.py || true

      - name: 📈 Liga xG holen (echtes Klub-xG aus /fixtures/statistics)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_liga_xg.py || true

      - name: 👥 Liga Kader/Schlüsselspieler holen (für lineup_signal + player_form-Baselines)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_squads.py || true

      - name: ⚽ Liga Top-Torjäger holen (topscorer_momentum)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_liga_topscorers.py || true

      - name: 🔁 Liga Trainerwechsel + Schlüssel-Abgänge (coach_change + transfer_shift)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_liga_team_changes.py || true

      - name: 🤕 Liga Verletzungen/Sperren holen (League + /sidelined)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_injuries.py || true

      - name: 🔮 Liga API-Football-Predictions holen (3. Modell, Cross-Check)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_apifootball_predictions.py || true

      - name: 📋 Liga Aufstellungen holen (greift T-1h vor Anpfiff)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_lineups.py --no-alerts || true

      - name: 💰 Liga-Quoten holen (1X2 + O/U + BTTS, Opening-Carry)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_liga_odds.py

      - name: 📡 Liga Sharp-Moves erkennen (Radar)
        run: python detect_wm_sharp_moves.py || true

      # ── Polymarket Preise + Steam-Lag (04.08.2026, Lucas: La Liga „gleich scharf schalten“) ──
      # Pini-Move → Poly zieht verzögert nach. fetch_wm_poly_prices ist dataset-aware
      # (liga-data.json → liga_poly_prices.json + liga-poly-history.json), steam_lag_monitor
      # rechnet Pini-vs-Poly-Edges und pusht Trade-Signale in den TRADES-Channel. Beide
      # continue-on-error (Poly kann geoblockt sein / erste Läufe ohne Match).
      - name: 💹 Liga Polymarket Preise + Edge Alerts
        run: python fetch_wm_poly_prices.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      - name: 🔥 Liga Steam Lag Monitor — Signale loggen + Sell Alerts
        run: python steam_lag_monitor.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      # 25.06.2026 (Lucas: „Navi da, keine Cards"): Pick-/Resolve-Schritte dürfen den Commit der
      # Daten NICHT blockieren. Wenn einer crasht, liegen Teams+Fixtures+Quoten trotzdem in
      # liga-data.json → Cards erscheinen. Darum `|| true` + Commit mit `if: always()`.
      - name: 🎯 Liga-Picks generieren (Signal-Engine, liga_default)
        run: python generate_liga_picks.py || true

      - name: 📄 Liga Event-Pages generieren (live Spiele)
        run: python generate_wm_match_pages.py || true

      - name: ✅ Liga-Picks resolven (WIN/LOSS/VOID)
        run: python resolve_wm_picks.py || true

      - name: 📉 Liga-CLV setzen (Einstieg vs Closing)
        run: python resolve_steam_clv.py || true

      - name: 🎯 Liga-CLV-Bilanz aggregieren (Scoreboard)
        run: python compute_clv_summary.py || true

      - name: 📊 Liga Post-Match-xG ans Fixture (für Prozess-Verdict)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_liga_match_stats.py || true

      - name: 🧠 Liga Lern-Loop (Ledger + Bayesian-Gewichte, prozess-gewichtet)
        run: |
          python build_signal_ledger.py --write || true
          python update_signal_weights.py || true
          python compute_pick_calibration.py --write || true   # 27.07.2026 (Lucas): Kalibrierung auch für MLS/Liga (lief nur WM)
          python build_dashboard_pulse.py || true   # 30.07.2026 (Lucas): Übersicht-Puls (letzte 30 Picks · CLV/Trefferquote)

      - name: 🛡️ Liga Guard-Batterie (liga_status.json)
        run: python wm_data_integrity.py || true

      # ── Content-Ausspielung (01.07.2026 Phase B, Lucas): dataset-aware Telegram + TikTok für Liga ──
      # 06:00-Lauf = PRE-Match (Digest + Previews vor den Nachmittagsspielen), 18:00-Lauf = POST-Match
      # (Recap + Reviews; decken den Vortag ab). Manueller Dispatch = PRE-Match.
      - name: 🤖 Liga AI-Previews generieren (Basis für Preview-Cards)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_wm_ai_preview.py || true

      - name: 📣 Liga Pick-Digest → Public (PRE-Match)
        if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_WM_MODE:       morning
        run: python telegram_wm.py || true

      - name: 🎬 Liga TikTok Preview-Cards (PRE-Match)
        if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          SEND_PREVIEWS: "true"
          SEND_REVIEWS:  "false"
        run: python generate_daily_tiktok.py || true

      - name: 📊 Liga Recap → Public (POST-Match)
        if: github.event.schedule == '0 18 * * *'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_WM_MODE:       recap
        run: python telegram_wm.py || true

      - name: 🎬 Liga TikTok Review-Cards (POST-Match)
        if: github.event.schedule == '0 18 * * *'
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
          SEND_PREVIEWS: "false"
          SEND_REVIEWS:  "true"
        run: python generate_daily_tiktok.py || true

      # Intraday-„Neuer Pick"-Noti (03.07.2026): meldet Nachzügler seit dem heutigen Digest.
      - name: 🆕 Liga Neuer-Pick-Noti (Intraday)
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_new_picks.py || true

      # Serien-Watch pre-match (PRE-Lauf 06:00) + Recap post-match (POST-Lauf 18:00).
      - name: 🔥 Liga Serien-Watch (PRE-Match)
        if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_STREAK_MODE:   watch
        run: python telegram_streak_watch.py || true

      - name: 📊 Liga Serien-Recap (POST-Match)
        if: github.event.schedule == '0 18 * * *'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_STREAK_MODE:   recap
        run: python telegram_streak_watch.py || true

      # 12.07.2026 (Lucas: „Cards für Liga kaputt"): HARTER Stopp vor dem Commit. Alle Schritte
      # laufen mit `|| true` und das git add ist bedingungslos → ohne diesen Check würde ein
      # leer-geschriebener Datensatz (API-Key abgelaufen) einfach gepusht. KEIN `|| true` hier:
      # ein Wipe muss den Job ROT machen, nicht ins Live-Frontend wandern.
      - name: 🛡️ Wipe-Check (kein leerer Datensatz darf committet werden)
        run: python check_not_wiped.py

      - name: 💾 liga-data.json committen
        if: always()
        run: |
          git config user.name  "CocoBet Bot"
          git config user.email "bot@cocobet.local"
          # EINZELN stagen (25.06.2026, Lucas: Bug „Everything up-to-date"): git add ist atomar —
          # ein nicht-existenter Pfad (liga-odds-history.json gibt's anfangs nicht) ließ den GANZEN
          # add fehlschlagen → liga-data.json wurde nie gestaged → nie committet → Live blieb Platzhalter.
          git add liga-data.json || true
          git add liga-odds-history.json 2>/dev/null || true
          git add liga_lineups.json 2>/dev/null || true
          git add liga_signal_ledger.json 2>/dev/null || true
          git add liga_pick_calibration.json 2>/dev/null || true
          git add liga_signal_weights.json 2>/dev/null || true
          git add liga_clv_summary.json 2>/dev/null || true
          git add dashboard_pulse.json 2>/dev/null || true
          git add liga_streaks.json 2>/dev/null || true
          git add liga_status.json 2>/dev/null || true
          git add liga_sharp_moves_log.json 2>/dev/null || true
          git add liga_sharp_dedup.json 2>/dev/null || true
          git add matches/liga-index.json matches/data/liga-*.json 2>/dev/null || true
          git add liga_match_stats_cache.json 2>/dev/null || true
          git add liga_apif_predictions.json 2>/dev/null || true
          git add liga_player_form.json liga_player_form_ledger.json 2>/dev/null || true
          git add liga_player_streaks.json 2>/dev/null || true
          git add liga_daily-tiktok 2>/dev/null || true
          git add liga_tiktok_sent.json liga-telegram-log.json 2>/dev/null || true
          git add liga_pick_announce_state.json 2>/dev/null || true
          git add liga_streak_watch.json 2>/dev/null || true
          git add liga_poly_prices.json 2>/dev/null || true          # Poly-Preise (Trading-Lag)
          git add liga-poly-history.json 2>/dev/null || true         # Poly-Preis-Historie
          git add liga_steam_lag_log.json 2>/dev/null || true        # Steam-Lag Signal-Log
          git add liga_steam_lag_sell_dedup.json 2>/dev/null || true # Sell-Alert Dedup
          git diff --staged --quiet || git commit -m "liga: Daten + Quoten + Picks + Resolve + Lernen [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Remote kann sich zwischenzeitlich bewegt haben (paralleler Workflow) → rebasen, dann push.
          # --autostash: geteilte tracked-Dateien (z.B. telegram-log.json) außerhalb der Stage-Liste
          # dürfen den Rebase nicht mit „unstaged changes" blockieren (Fix 29.06.2026, s. update-mls).
          # 14.08.2026 (Lucas): Push-Race mit parallelen Bot-Pushes (betfair alle 10 Min, liga, ...) -> Retry.
          # Vor JEDEM Versuch neu rebasen; ein einzelner rebase+push verliert, wenn origin/main sich
          # zwischen rebase und push nochmal bewegt. Bis 5x, dann erst echter Fehler.
          # 15.08.2026 (Lucas): Merge (-X ours) statt Rebase + explizite Konfliktaufloesung.
          # Der Rebase-Ansatz blieb bei Konflikten in geteilten JSONs (liga-odds-history.json) haengen
          # (detached HEAD, unmerged files) und ALLE Retries scheiterten mit 'unmerged files'. Merge
          # -X ours loest die meisten Konflikte automatisch zugunsten der frisch generierten Runner-Daten;
          # verbleibende behalten wir per --ours und committen sie. Robust gegen Parallel-Bot-Push-Races.
          for attempt in 1 2 3 4 5; do
            git pull origin main --no-rebase -X ours --autostash 2>&1 || true
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            if [ -n "$CONFLICTS" ]; then
              echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
              git diff --staged --quiet || git commit -m "liga: auto-resolve merge [skip ci]"
            fi
            if git push; then echo "OK Push nach Versuch $attempt"; break; fi
            echo "Push-Versuch $attempt fehlgeschlagen (origin bewegt) - retry..."; sleep 3
            if [ "$attempt" = "5" ]; then echo "Push nach 5 Versuchen fehlgeschlagen"; exit 1; fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
