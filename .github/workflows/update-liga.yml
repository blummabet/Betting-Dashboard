name: ⚽ Liga aktualisieren (Top 5)

# 25.06.2026 (Lucas): Liga auf dem WM-Stack, PARALLEL zur WM. Eigener Workflow, fest auf
# COCOBET_DATASET=liga + COCOBET_PROFILE=liga_default → schreibt NUR liga-data.json, rührt die
# WM-Pipeline (wm2026-data.json, profiles.active=wm2026) NICHT an. Phase 1: Daten + Quoten + Picks
# + Resolve + CLV (kein Poly). Takt 2×/Tag während der WM; danach hochdrehen.
on:
  schedule:
    - cron: '0 6,18 * * *'   # 2×/Tag (vor/nach den meisten Liga-Anpfiffen)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-liga
  cancel-in-progress: false

env:
  COCOBET_DATASET: liga
  COCOBET_PROFILE: liga_default

jobs:
  update-liga:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Dependencies installieren
        run: pip install -r requirements.txt

      - name: 🗂️ Liga-Daten bauen (Teams + Fixtures + Ergebnisse)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python build_liga_data.py

      - name: 📐 Liga Club-Elo holen (Baseline/Evidenz — KEINE Pick-Quelle)
        run: python fetch_liga_elo.py || true

      - name: 📊 Liga Form + H2H holen (letzte Saison als erster Inhalt)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_form.py || true

      - name: 🚩 Liga Ecken-Statistik (für Ecken-Serien)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_corners.py || true

      - name: 🔥 Liga-Serien berechnen (Streak-Content)
        run: python compute_streaks.py || true

      - name: 📈 Liga xG holen (echtes Klub-xG aus /fixtures/statistics)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_liga_xg.py || true

      - name: 👥 Liga Kader/Schlüsselspieler holen (für lineup_signal + player_form-Baselines)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_squads.py || true

      - name: ⚽ Liga Top-Torjäger holen (topscorer_momentum)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_liga_topscorers.py || true

      - name: 🔁 Liga Trainerwechsel + Schlüssel-Abgänge (coach_change + transfer_shift)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_liga_team_changes.py || true

      - name: 🤕 Liga Verletzungen/Sperren holen (League + /sidelined)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_injuries.py || true

      - name: 🔮 Liga API-Football-Predictions holen (3. Modell, Cross-Check)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_apifootball_predictions.py || true

      - name: 📋 Liga Aufstellungen holen (greift T-1h vor Anpfiff)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_lineups.py --no-alerts || true

      - name: 💰 Liga-Quoten holen (1X2 + O/U + BTTS, Opening-Carry)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_liga_odds.py

      - name: 📡 Liga Sharp-Moves erkennen (Radar)
        run: python detect_wm_sharp_moves.py || true

      # 25.06.2026 (Lucas: „Navi da, keine Cards"): Pick-/Resolve-Schritte dürfen den Commit der
      # Daten NICHT blockieren. Wenn einer crasht, liegen Teams+Fixtures+Quoten trotzdem in
      # liga-data.json → Cards erscheinen. Darum `|| true` + Commit mit `if: always()`.
      - name: 🎯 Liga-Picks generieren (Signal-Engine, liga_default)
        run: python generate_liga_picks.py || true

      - name: 📄 Liga Event-Pages generieren (live Spiele)
        run: python generate_wm_match_pages.py || true

      - name: ✅ Liga-Picks resolven (WIN/LOSS/VOID)
        run: python resolve_wm_picks.py || true

      - name: 📉 Liga-CLV setzen (Einstieg vs Closing)
        run: python resolve_steam_clv.py || true

      - name: 🎯 Liga-CLV-Bilanz aggregieren (Scoreboard)
        run: python compute_clv_summary.py || true

      - name: 📊 Liga Post-Match-xG ans Fixture (für Prozess-Verdict)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_liga_match_stats.py || true

      - name: 🧠 Liga Lern-Loop (Ledger + Bayesian-Gewichte, prozess-gewichtet)
        run: |
          python build_signal_ledger.py --write || true
          python update_signal_weights.py || true

      - name: 🛡️ Liga Guard-Batterie (liga_status.json)
        run: python wm_data_integrity.py || true

      - name: 💾 liga-data.json committen
        if: always()
        run: |
          git config user.name  "CocoBet Bot"
          git config user.email "bot@cocobet.local"
          # EINZELN stagen (25.06.2026, Lucas: Bug „Everything up-to-date"): git add ist atomar —
          # ein nicht-existenter Pfad (liga-odds-history.json gibt's anfangs nicht) ließ den GANZEN
          # add fehlschlagen → liga-data.json wurde nie gestaged → nie committet → Live blieb Platzhalter.
          git add liga-data.json || true
          git add liga-odds-history.json 2>/dev/null || true
          git add liga_lineups.json 2>/dev/null || true
          git add liga_signal_ledger.json 2>/dev/null || true
          git add liga_signal_weights.json 2>/dev/null || true
          git add liga_clv_summary.json 2>/dev/null || true
          git add liga_streaks.json 2>/dev/null || true
          git add liga_status.json 2>/dev/null || true
          git add liga_sharp_moves_log.json 2>/dev/null || true
          git add liga_sharp_dedup.json 2>/dev/null || true
          git add matches/liga-index.json matches/data/liga-*.json 2>/dev/null || true
          git add liga_match_stats_cache.json 2>/dev/null || true
          git add liga_apif_predictions.json 2>/dev/null || true
          git add liga_player_form.json liga_player_form_ledger.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "liga: Daten + Quoten + Picks + Resolve + Lernen [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Remote kann sich zwischenzeitlich bewegt haben (paralleler Workflow) → rebasen, dann push.
          git pull --rebase origin main || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
