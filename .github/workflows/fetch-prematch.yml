name: Fetch Pre-Match Data

on:
  # Automatisch: 3x täglich (04:00, 12:00, 20:00 Wien-Zeit = 02:00, 10:00, 18:00 UTC)
  # The Odds API hat genug Quota (100K/Monat) — kein Grund mehr auf 2x zu begrenzen
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 10 * * *'
    - cron: '0 18 * * *'
  # Manuell auslösbar (GitHub → Actions → "Run workflow")
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch Pre-Match Data
        run: node prematch-server.js --write
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        timeout-minutes: 10

      # Validierung: Workflow schlägt fehl wenn prematch-data.json leer ist.
      # Damit löst update-dashboard.yml (workflow_run-Trigger) NICHT aus → keine
      # Picks werden mit leeren Daten generiert.
      - name: Prematch-Daten validieren
        run: |
          COUNT=$(node -e "
            try {
              const d = require('./prematch-data.json');
              const n = (d.fixtures || []).length;
              process.stdout.write(String(n));
            } catch(e) { process.stdout.write('0'); }
          " 2>/dev/null || echo 0)
          echo "prematch-data.json: $COUNT Fixtures"
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ FEHLER: prematch-data.json hat 0 Fixtures — Fetch fehlgeschlagen oder keine Spiele im Zeitfenster."
            echo "   Prüfe API-Quota (APISPORTS_KEY / ODDS_API_KEY) und Server-Logs oben."
            exit 1
          fi
          echo "✅ $COUNT Fixtures geladen — Fetch erfolgreich."

      - name: Commit & Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add prematch-data.json
          git add squad-cache.json
          git add bookings-cache.json
          git add referee-cache.json
          git diff --staged --quiet || git commit -m "chore: update prematch data [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Robust pull+push mit Retry — --autostash schützt vor Race Conditions
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            git pull origin main --no-rebase -X ours --autostash 2>&1 || true
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
            if [ -n "$CONFLICTS" ]; then
              echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
              git diff --staged --quiet || git commit -m "🔧 auto-resolve merge conflicts"
            fi
            if git push 2>&1; then
              echo "✅ Push erfolgreich nach Versuch $attempt"
              PUSHED=1
              break
            fi
            echo "⚠️ Push $attempt fehlgeschlagen — retry in $((attempt * 3))s..."
            sleep $((attempt * 3))
          done
          if [ "$PUSHED" = "0" ]; then echo "❌ Push fehlgeschlagen"; exit 1; fi
