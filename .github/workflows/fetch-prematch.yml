name: Fetch Pre-Match Data

on:
  # Automatisch: 4x täglich (7:00, 11:00, 15:00, 19:00 Wien-Zeit = 5:00, 9:00, 13:00, 17:00 UTC)
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 9 * * *'
    - cron: '0 13 * * *'
    - cron: '0 17 * * *'
  # Manuell auslösbar (GitHub → Actions → "Run workflow")
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch Pre-Match Data
        run: node prematch-server.js --write
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        timeout-minutes: 10

      # Validierung: Workflow schlägt fehl wenn prematch-data.json leer ist.
      # Damit löst update-dashboard.yml (workflow_run-Trigger) NICHT aus → keine
      # Picks werden mit leeren Daten generiert.
      - name: Prematch-Daten validieren
        run: |
          COUNT=$(node -e "
            try {
              const d = require('./prematch-data.json');
              const n = (d.fixtures || []).length;
              process.stdout.write(String(n));
            } catch(e) { process.stdout.write('0'); }
          " 2>/dev/null || echo 0)
          echo "prematch-data.json: $COUNT Fixtures"
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ FEHLER: prematch-data.json hat 0 Fixtures — Fetch fehlgeschlagen oder keine Spiele im Zeitfenster."
            echo "   Prüfe API-Quota (APISPORTS_KEY / ODDS_API_KEY) und Server-Logs oben."
            exit 1
          fi
          echo "✅ $COUNT Fixtures geladen — Fetch erfolgreich."

      - name: Commit & Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add prematch-data.json squad-cache.json bookings-cache.json referee-cache.json
          git diff --staged --quiet || git commit -m "chore: update prematch data [skip ci]"
          git pull origin main --no-rebase -X ours
          git push
