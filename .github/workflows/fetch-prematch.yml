name: Fetch Pre-Match Data

on:
  # Automatisch: 4x täglich (7:00, 11:00, 15:00, 19:00 Wien-Zeit = 5:00, 9:00, 13:00, 17:00 UTC)
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 9 * * *'
    - cron: '0 13 * * *'
    - cron: '0 17 * * *'
  # Manuell auslösbar (GitHub → Actions → "Run workflow")
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Brauchen wir um prematch-data.json zu commiten

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch Pre-Match Data
        run: node prematch-server.js --write
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        timeout-minutes: 10

      - name: Commit & Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add prematch-data.json squad-cache.json bookings-cache.json
          # Nur committen wenn sich tatsächlich etwas geändert hat
          git diff --staged --quiet || git commit -m "chore: update prematch data [skip ci]"
          # Pull rebase before push to avoid rejection when other commits landed in between
          git pull origin main --no-rebase -X ours
          git push
