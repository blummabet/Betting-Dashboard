name: 🚀 Deploy to GitHub Pages

on:
  # Deployen wenn sich HTML/JS/CSS oder WM-Spieldaten geändert haben.
  # ACHTUNG: greift NUR bei menschlichen Pushes. Commits, die die CI mit dem
  # default GITHUB_TOKEN pusht (Dashboard Bot, 5x/Tag Daten-Updates), lösen
  # per GitHub-Rekursionsschutz KEINE Workflows aus → dieser push-Trigger
  # sieht Bot-Daten-Updates nicht. Deshalb zusätzlich der schedule unten.
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - '.nojekyll'
      - '**.json'

  # Universeller Sicherheitsnetz-Trigger: republisht main alle 15 Min, damit
  # JEDES Bot-Daten-Update (Venues, Kickoffs, wm_status, Poly, Lineups …) auf
  # der Live-Seite landet — ohne dass man jeden Daten-Workflow einzeln
  # verdrahten muss. Deploy ist gratis (public repo) + concurrency-sicher.
  schedule:
    - cron: '*/15 * * * *'

  # Manuell jederzeit ausführbar
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig — laufenden Deploy abbrechen statt queuen
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🔧 Pages einrichten
        uses: actions/configure-pages@v5

      - name: 📦 Seiten hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
