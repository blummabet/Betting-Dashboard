name: 🚀 Deploy to GitHub Pages

on:
  # Deployen wenn sich HTML/JS/CSS oder WM-Spieldaten geändert haben.
  # ACHTUNG: greift NUR bei menschlichen Pushes. Commits, die die CI mit dem
  # default GITHUB_TOKEN pusht (Dashboard Bot, 5x/Tag Daten-Updates), lösen
  # per GitHub-Rekursionsschutz KEINE Workflows aus → dieser push-Trigger
  # sieht Bot-Daten-Updates nicht. Deshalb zusätzlich der schedule unten.
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - '.nojekyll'
      - '**.json'

  # Sicherheitsnetz-Trigger: republisht main, damit Bot-Daten-Updates auch ohne Push-Trigger
  # auf der Live-Seite landen (Bot-Commits mit GITHUB_TOKEN loesen per Rekursionsschutz keine
  # Workflows aus). Deploy ist gratis (public repo) + concurrency-sicher.
  #
  # 29.08.2026 (Lucas: „muss es dann alle 15 min rennen?") — von `*/15` auf stuendlich.
  # Gemessen an den echten Lauf-Zeiten der letzten drei Tage lieferte `*/15` NICHT alle 15
  # Minuten, sondern im Median alle ~1,9 Stunden, mit Luecken bis 11 Stunden — 8 statt 96 Laeufe
  # pro Tag. GitHub drosselt hochfrequente Schedules; genau das steht seit dem 12.08. in
  # poly-live-scan.yml („*/5 lief real ~stuendlich … kein Cron-Tuning hilft"). Weniger verlangen
  # liefert hier mehr: eine stuendliche Bitte haelt GitHub zuverlaessig ein.
  #
  # Dass die Seite dadurch nicht traeger wird, liegt an der Fetch-Strategie: main-dashboard.js,
  # betfair-radar.js, polymarket-tab.js, status-checks.js und poly-wallets.js holen ihre JSONs
  # PRIMAER von raw.githubusercontent.com/main — also commit-frisch, ohne auf den Deploy zu
  # warten. Der Deploy liefert fuer diese Flaechen nur noch den Code aus.
  #
  # Minute 20 statt 0: auf der vollen Stunde starten repo-weit bis zu 11 Jobs gleichzeitig.
  schedule:
    - cron: '20 * * * *'

  # 01.07.2026 (Lucas: „Deploy failt die ganze Zeit"): der workflow_run-Trigger (nach JEDEM Daten-
  # Workflow, v.a. dem alle paar Minuten laufenden „Poly Positionen überwachen") feuerte so viele
  # Deploys, dass sie sich schneller überholten als sie fertig wurden → jeder neue „cancelte" den
  # vorigen (Thundering Herd), sichtbar als „Error: Deployment cancelled". Entfernt. Der */15-Schedule
  # (+ menschliche Pushes) republisht main zuverlässig und überschneidet sich praktisch nie. Damit
  # landen Bot-Daten-Updates spätestens ~15 Min nach dem Commit live — reicht fürs Dashboard.

  # Manuell jederzeit ausführbar (für sofortigen Deploy nach wichtigen Updates)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig. 01.07.2026 (Lucas: „deploy github pages failt ständig — Error:
# Deployment cancelled"): cancel-in-progress:true brach bei den vielen Triggern (Push + */15-Schedule
# + 4× workflow_run) laufende Deploys ab → die abgebrochenen Läufe failten. Offizielle Pages-Empfehlung:
# laufenden Deploy FERTIGLAUFEN lassen, nur dazwischen wartende Läufe überspringen → cancel-in-progress:false.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🔧 Pages einrichten
        uses: actions/configure-pages@v5

      - name: 🧹 Ballast raus (Deploy-Speed)
        # 01.07.2026 (Lucas: „Deploy failt die ganze Zeit"): path:'.' lud das GANZE Repo als Pages-
        # Artefakt hoch — u.a. daily-tiktok (68 MB generierte TikTok-PNGs), die die Live-Seite nie
        # fetcht. Deploy dauerte 10–18 Min statt Sekunden → wurde vom nächsten Trigger überholt →
        # „Error: Deployment cancelled". Fix: alles rauswerfen, was die STATISCHE Seite nicht braucht
        # (nur im ephemeren Runner-Checkout — das Repo bleibt unberührt). BEHALTEN: *.html/js/css, alle
        # Wurzel-*.json (Daten), matches/ (Event-Pages), icons/, manifest.json, sw.js.
        #
        # 28.08.2026 (Lucas: „auf der Seite ist nichts") — DIESELBE KRANKHEIT, GRÖSSERE DOSIS.
        # Der Fix oben warf `daily-tiktok` raus. Danach kamen die datensatz-eigenen Varianten
        # dazu — `mls_daily-tiktok` (35,7 MB) und `liga_daily-tiktok` (12,3 MB) — und die kannte
        # diese Liste nicht. Damit lud jeder Deploy wieder 48 MB PNGs hoch, die keine einzige
        # HTML- oder JS-Datei je anfasst (nachgeprüft: null Referenzen). Artefakt zuletzt
        # 198 MB alle 15 Minuten. Deshalb jetzt ein GLOB statt einer Namensliste: die nächste
        # `<datensatz>_daily-tiktok` fällt automatisch mit raus, statt in einem halben Jahr
        # wieder still den Deploy auszubremsen.
        run: |
          # `studio_templates` steht hier bewusst NICHT mehr drin: tiktok-studio.js laedt
          # daraus zur Laufzeit `studio_templates/_common.css` und die Template-HTMLs. Der
          # Ordner ist 52 KB — er wurde geloescht, seit die Liste existiert, und die
          # TikTok-Studio-Seite lief live seither in 404er. Gefunden am 28.08.2026 von dem
          # Test, der prueft, ob der Deploy etwas wegwirft, was das Frontend fetcht.
          rm -rf *daily-tiktok wm_live_story_outputs outputs \
                 archive tests sharp_signals wm_story_angles || true
          # 02.09.2026 (Lucas: „was nun mit diesem MB Groessen Problem"): das Artefakt stand bei
          # 169,3 von 170 MB. Ein erster Anlauf zaehlte die groessten unbenutzten JSONs namentlich
          # auf — also genau die Bauart, die am 28.08. still veraltet ist und den Deploy gekippt
          # hat. Jetzt entscheidet eine REGEL: ein Wurzel-JSON, das keine ausgelieferte HTML/JS-
          # Datei erwaehnt, wird nicht ausgeliefert. Das gilt auch fuer die naechste Datei, die
          # jemand anlegt, ohne dass sie hier eingetragen werden muss.
          python3 scripts/pages_ballast.py --loeschen || true
          echo "Artefakt-Größe nach dem Aufräumen:"
          du -sh . || true

      - name: 📦 Seiten hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Auf GitHub Pages deployen
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # 06.08.2026 (Lucas: "solang immer alles geht"): der Pages-Backend erlaubt nur EIN aktives
      # Deployment. Kollidiert unser Deploy mit einem noch finalisierenden (anderer Trigger), failt der
      # CREATE-Call mit 400 "in progress deployment". Statt rot zu werden: bis zu 3 Versuche mit Pause --
      # bis dahin ist das blockierende Deployment i.d.R. fertig. Erst der letzte Versuch failt hart.
      - name: "⏳ Warten & 2. Versuch (nur wenn 1 failte)"
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: "🚀 Deploy (Versuch 2)"
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: "⏳ Warten & 3. Versuch (nur wenn 2 failte)"
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 90

      - name: "🚀 Deploy (Versuch 3 -- final, failt hart)"
        id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4

