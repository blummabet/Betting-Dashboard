name: 🚀 Deploy to GitHub Pages

on:
  # Deployen wenn sich HTML/JS/CSS oder WM-Spieldaten geändert haben
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - '.nojekyll'
      - '**.json'

  # Manuell jederzeit ausführbar
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig — laufenden Deploy abbrechen statt queuen
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🔧 Pages einrichten
        uses: actions/configure-pages@v5

      - name: 📦 Seiten hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
