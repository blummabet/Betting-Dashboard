name: 🚀 Deploy to GitHub Pages

on:
  # Deployen wenn sich HTML/JS/CSS oder WM-Spieldaten geändert haben.
  # ACHTUNG: greift NUR bei menschlichen Pushes. Commits, die die CI mit dem
  # default GITHUB_TOKEN pusht (Dashboard Bot, 5x/Tag Daten-Updates), lösen
  # per GitHub-Rekursionsschutz KEINE Workflows aus → dieser push-Trigger
  # sieht Bot-Daten-Updates nicht. Deshalb zusätzlich der schedule unten.
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - '.nojekyll'
      - '**.json'

  # Universeller Sicherheitsnetz-Trigger: republisht main alle 15 Min, damit
  # JEDES Bot-Daten-Update (Venues, Kickoffs, wm_status, Poly, Lineups …) auf
  # der Live-Seite landet — ohne dass man jeden Daten-Workflow einzeln
  # verdrahten muss. Deploy ist gratis (public repo) + concurrency-sicher.
  schedule:
    - cron: '*/15 * * * *'

  # Sofort-Deploy direkt nach Abschluss eines Daten-Workflows.
  # FIX 13.06.2026: Der */15-Schedule läuft bei GitHub oft 15-30 Min verspätet →
  # FT-Ergebnisse/Resolves (z.B. USA-PRY 4:1) landeten erst spät live, obwohl main
  # längst korrekt war. workflow_run feuert WORKFLOW-basiert (nicht commit-basiert)
  # → umgeht die GITHUB_TOKEN-Rekursionssperre und deployt sofort nach jedem
  # Bot-Daten-Update. Schedule bleibt als Sicherheitsnetz.
  workflow_run:
    workflows:
      - "🌍 WM 2026 Daten aktualisieren"
      - "📊 Ergebnisse holen"
      - "💹 WM Poly Positionen überwachen"
      - "⚽ Liga aktualisieren (Top 5)"   # 25.06.2026 (Lucas): Bot-Commit von liga-data.json sofort deployen
    types: [completed]

  # Manuell jederzeit ausführbar
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig. 01.07.2026 (Lucas: „deploy github pages failt ständig — Error:
# Deployment cancelled"): cancel-in-progress:true brach bei den vielen Triggern (Push + */15-Schedule
# + 4× workflow_run) laufende Deploys ab → die abgebrochenen Läufe failten. Offizielle Pages-Empfehlung:
# laufenden Deploy FERTIGLAUFEN lassen, nur dazwischen wartende Läufe überspringen → cancel-in-progress:false.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🔧 Pages einrichten
        uses: actions/configure-pages@v5

      - name: 📦 Seiten hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
