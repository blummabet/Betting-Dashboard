name: ✅ CI — Tests (Backend + Frontend)

# 27.06.2026 (Lucas: „professionell"): Backend (pytest) UND Frontend (jsdom-Render-Tests) bei jedem
# Push/PR. Bisher liefen die Tests nur lokal. Frontend-Render-Tests fangen Dataset-Awareness-
# Regressionen (Liga vs WM) auf echter Render-Ebene, nicht nur per grep.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      # 🔴 01.10.2026: CI war seit dem 22.09. rot (Frontend) bzw. laenger (Backend), lokal gruen.
      # Ursache: der Standard-Checkout ist flach (fetch-depth 1) — jede Datei hat dort genau EINEN
      # Commit. Waechter, die gegen `git log` messen (uebersicht-refresh-takt, tote_quellen),
      # lasen daraus „alles ist 0 Tage alt / aendert sich alle 10.080 Min" und schlugen an.
      # Volle Historie, aber ohne alte Datei-Inhalte (blob:none) — git log -- <pfad> braucht nur
      # Commits und Baeume. Kostet Sekunden, nicht die Hunderte MB der Daten-Historie.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 📦 Dependencies
        run: pip install -r requirements.txt
      - name: 🧪 pytest
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      # 🔴 01.10.2026: CI war seit dem 22.09. rot (Frontend) bzw. laenger (Backend), lokal gruen.
      # Ursache: der Standard-Checkout ist flach (fetch-depth 1) — jede Datei hat dort genau EINEN
      # Commit. Waechter, die gegen `git log` messen (uebersicht-refresh-takt, tote_quellen),
      # lasen daraus „alles ist 0 Tage alt / aendert sich alle 10.080 Min" und schlugen an.
      # Volle Historie, aber ohne alte Datei-Inhalte (blob:none) — git log -- <pfad> braucht nur
      # Commits und Baeume. Kostet Sekunden, nicht die Hunderte MB der Daten-Historie.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 📦 jsdom installieren
        run: npm install --no-audit --no-fund
      - name: 🖥️ Frontend-Render-Tests (jsdom)
        run: npm test

      # 12.07.2026: Der Whale-Tab blieb beim Umschalten auf MLS stumm leer
      # (window._pwDataset überschrieb die gleichnamige Funktion _pwDataset()).
      # Dieser Guard schaltet den Datensatz WIRKLICH um und hätte das sofort gefangen.
      - name: 🐋 Poly-Wallets Datensatz-Umschalter
        run: node tests/test_poly_wallets_dataset_switch.js
