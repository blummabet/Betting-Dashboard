name: 📈 Liga Odds Refresh (dicht)

# 09.07.2026 (Lucas: „Liga auf top"). Der volle update-liga-Lauf holt Quoten nur 2×/Tag (06/18 UTC)
# → Steam-Moves (der eigentliche Edge) werden verwaschen/verpasst. Dieser schlanke Dienst holt NUR
# die Liga-Quoten (1X2/O/U/BTTS/AH) + erkennt Sharp-Moves alle 2h — analog zu fetch-pinnacle-odds
# (WM). Kein voller Pipeline-Lauf (keine Form/xG/Lineups). Kosten: ~6 Ligen × 1 Bulk-Call/Lauf.
on:
  schedule:
    # 30.08.2026: von :00 auf :17 — Begründung s. fetch-mls-odds-dense.yml. Der eigene
    # Gesundheits-Log dieses Workflows ist der Beleg: 2h-Takt bestellt, 3–7h geliefert.
    - cron: '17 */2 * * *'   # alle 2h, bewusst NICHT auf der vollen Stunde
  workflow_dispatch:

permissions:
  contents: write
  actions: read          # run_health.py liest die Steps DIESES Laufs

# Teilt die Gruppe mit update-liga → kein gleichzeitiges Schreiben/Pushen von liga-data.json.
concurrency:
  group: update-liga
  cancel-in-progress: false

jobs:
  liga-odds-refresh:
    runs-on: ubuntu-latest
    env:
      COCOBET_DATASET: liga
      COCOBET_PROFILE: liga_default
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Dependencies
        run: pip install -r requirements.txt

      - name: 💰 Liga-Quoten holen (nur fetch_liga_odds)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FETCH_EXTRA_MARKETS: '1'   # 20.08.2026 (Lucas): Pinnacle-BTTS + alternate_totals pro Spiel holen (Credits aufgeladen) → fair_btts wird berechnet, BTTS handelbar statt ~Modell
        run: python fetch_liga_odds.py

      - name: 📡 Liga Sharp-Moves erkennen (Radar)
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
        run: python detect_wm_sharp_moves.py || true

      # Picks aus den frischen Odds neu generieren — Liga läuft voll nur 2×/Tag, ohne diesen
      # Schritt wären Steam-Picks bis zu 12h alt. Nutzt die bestehenden Signal-Daten (Form/xG/
      # Lineups vom letzten Volllauf) + die eben geholten Odds. Rein Odds-getrieben, keine Fetches.
      # ── Poly-Wallets im 2h-Takt (25.08.2026, Audit-Befund 07) ────────────────────────
      # Spiegel von fetch-mls-odds-dense: der Wallet-Snapshot haelt nur das AKTUELLE Fenster
      # (Top-Holder + juengste grosse Trades). Der 2h-Takt ist die dichteste Sammlung, die wir
      # haben — die Vollaeufe von update-liga (06/18 UTC) allein wuerden das meiste verpassen.
      # Fuer Liga lief das bisher gar nicht, obwohl seit dem 19.08. real auf Poly gehandelt wird.
      - name: 💰 Liga Polymarket Smart-Money + Wallets
        run: python fetch_wm_poly_smartmoney.py
        continue-on-error: true

      - name: 📒 Liga Wallet-Ledger fortschreiben
        run: python build_poly_wallet_ledger.py
        continue-on-error: true

      - name: 🎯 Liga-Picks aus frischen Odds generieren
        run: python generate_liga_picks.py || true

      - name: 🆕 Liga Neuer-Pick-Noti (Intraday)
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_new_picks.py || true

      # 30.08.2026 (Lucas): Schattenbuch zum Gegensignal-Filter. Schreibt JEDEN announce-faehigen
      # Pick mit — den gesendeten wie den aussortierten — und rechnet beide ab. Muss NACH der Noti
      # laufen (gleicher Stand) und VOR dem Commit.
      - name: 📓 Push-Schattenbuch fortschreiben
        run: python pick_push_ledger.py || true

      # 28.08.2026 (Lucas: „Fehler, die wir gar nicht mitkriegen") — 135 Steps stehen repo-weit
      # auf continue-on-error. Dieser Waechter fragt ueber die GitHub-API die Steps DIESES Laufs
      # ab und meldet jeden gescheiterten, auch wenn der Job gruen bleibt. `if: always()`, damit
      # er gerade dann laeuft, wenn vorher etwas schiefging. Muss VOR dem Commit stehen, sonst
      # bleibt health/ auf der Runner-Platte liegen.
      - name: 🩺 Lauf-Gesundheit (verschluckte Fehler sichtbar machen)
        if: always()
        continue-on-error: true
        run: python3 run_health.py --slug liga-odds-dense
        env:
          GITHUB_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      - name: 💾 Odds + Snapshots + Closing committen
        run: |
          git config user.name  "CocoBet Bot"
          git config user.email "bot@cocobet.local"
          python build_dashboard_pulse.py || true   # 14.08.2026 (Lucas): Puls oefter frisch (gegen "Stand vor 3h")
          git add dashboard_pulse.json 2>/dev/null || true
          # 28.08.2026: eigene Zeile, eigener Pfad — health/<slug>.json wird NUR von diesem
          # Workflow geschrieben, deshalb kann sie mit keinem anderen kollidieren.
          git add health/liga-odds-dense.json 2>/dev/null || true
          git add liga-data.json 2>/dev/null || true
          git add liga-odds-history.json 2>/dev/null || true
          git add liga_closing_lines.json 2>/dev/null || true
          git add liga_sharp_moves_log.json 2>/dev/null || true
          git add liga_sharp_dedup.json 2>/dev/null || true
          git add liga_pick_announce_state.json 2>/dev/null || true
          git add liga_pick_push_ledger.json 2>/dev/null || true
          # Poly-Wallets (25.08.2026, Audit-Befund 07) — ohne diese Zeilen bleibt der
          # 2h-Snapshot auf dem Runner liegen und die Historie entsteht trotzdem nicht.
          git add liga_poly_wallets.json2>/dev/null || true
          git add liga_poly_smartmoney.json2>/dev/null || true
          git add liga_poly_wallet_ledger.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Änderung — nichts zu committen."; exit 0
          fi
          git commit -m "liga: dichter Odds-Refresh + Move-Scan [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            git pull origin main --no-rebase -X ours --autostash 2>&1 || true
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
            if [ -n "$CONFLICTS" ]; then
              echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
              git diff --staged --quiet || git commit -m "🔧 auto-resolve merge conflicts"
            fi
            if git push 2>&1; then echo "✅ Push nach Versuch $attempt"; exit 0; fi
            echo "⚠️ Push $attempt fehlgeschlagen — retry in $((attempt * 3))s…"; sleep $((attempt * 3))
          done
          echo "❌ Push fehlgeschlagen"; exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
