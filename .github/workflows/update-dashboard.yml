name: 🔄 Dashboard aktualisieren

on:
  # Läuft automatisch nach jedem erfolgreichen fetch-prematch Lauf.
  # Damit ist sichergestellt dass generate_picks.js immer frische prematch-data.json liest.
  workflow_run:
    workflows: ["Fetch Pre-Match Data"]
    types: [completed]

  # 29.06.2026 (Lucas, Telegram-Ausmisten): Die 3 täglichen Crons (7/9/11 UTC) dienten NUR
  # dem alten Vor-WM-Telegram (telegram_bot.py picks/recap/IM BLICK aus picks_output.json).
  # Das kollidierte mit der WM-Recap (telegram_wm.py, 09 UTC) und postete veraltete Inhalte
  # in den Public-Channel. Crons + Telegram-Steps entfernt. Workflow läuft nur noch via
  # workflow_run (Dashboard-Regen nach fetch-prematch) + manuell.

  # Manuell: jederzeit per Knopfdruck auf GitHub ausführbar
  workflow_dispatch:

# Berechtigung zum Zurückschreiben ins Repo
permissions:
  contents: write

# AUDIT-Fix 08.06.2026: Concurrency-Group hinzugefügt.
# Vorher: 3× tägliche Crons (07/09/11 UTC) konnten gleichzeitig laufen wenn
# workflow_run-Trigger (nach fetch-prematch) mit einer Schedule-Zeit kollidiert.
# Folge: 2× picks_output.json schreiben, 2× telegram_bot.py senden = Doppel-Post.
# Jetzt: serialisiert, nicht abgebrochen.
concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Bei workflow_run-Trigger: nur ausführen wenn fetch-prematch erfolgreich war.
    # Bei schedule/dispatch: immer ausführen.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. Repository auschecken
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      # 2. Python einrichten
      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Python-Abhängigkeiten installieren
      - name: 📦 Dependencies installieren
        run: pip install -r requirements.txt

      # 4. Dashboard-Daten aktualisieren (API-Football → season-finish.html)
      - name: 📊 Dashboard aktualisieren
        run: python update_dashboard.py
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      # 5. Statistiken aktualisieren (Understat xG + ClubElo Elo — kein Corner-Fetch)
      #    --fast überspringt /fixtures/statistics Calls (750 APIF-Credits/Run) da diese
      #    einmal täglich via refresh-xg.yml aktualisiert werden. Spart ~3.750 Credits/Tag.
      - name: 📈 Statistiken aktualisieren
        run: python refresh_stats.py --fast
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      # 6a. Node.js für Picks-Generierung einrichten
      - name: 🎯 Picks generieren (JS Engine)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 6b. Prematch-Daten validieren — Picks nur generieren wenn Daten vorhanden
      - name: 🔍 Prematch-Daten validieren
        id: prematch_check
        run: |
          COUNT=$(node -e "
            try {
              const d = require('./prematch-data.json');
              const n = (d.fixtures || []).length;
              process.stdout.write(String(n));
            } catch(e) { process.stdout.write('0'); }
          " 2>/dev/null || echo 0)
          echo "fixture_count=$COUNT" >> $GITHUB_OUTPUT
          echo "prematch-data.json enthält $COUNT Fixtures"
          if [ "$COUNT" -eq 0 ]; then
            echo "⚠️  WARNUNG: prematch-data.json ist leer — Picks werden NICHT neu generiert."
            echo "   Stale picks_output.json bleibt erhalten. Prüfe fetch-prematch Logs."
          fi

      # 6c. Picks generieren — nur wenn prematch-data.json Fixtures enthält
      - name: 🎯 Picks generieren (run)
        if: steps.prematch_check.outputs.fixture_count != '0'
        run: node generate_picks.js

      # 6d. Picks in History speichern — nur wenn Picks generiert wurden
      - name: 📝 Picks speichern
        if: steps.prematch_check.outputs.fixture_count != '0'
        run: python save_picks.py
        continue-on-error: true

      # 7. Polymarket-Preise holen (Gamma API → polymarket_prices.json)
      - name: 🟣 Polymarket-Preise holen
        run: python fetch_poly_prices.py
        continue-on-error: true

      # 7b. Match-Seiten generieren (statische HTML pro Spiel → matches/*.html)
      - name: 📄 Match-Seiten generieren
        if: steps.prematch_check.outputs.fixture_count != '0'
        run: python generate_match_pages.py
        continue-on-error: true

      # 8. Vergangene Picks auswerten (Sofascore Ergebnisse → picks_history.json)
      - name: ✅ Picks auswerten
        run: python resolve_picks.py
        continue-on-error: true

      # 29.06.2026 (Lucas): Alte Telegram-Sends (telegram_bot.py picks/recap/IM BLICK) entfernt —
      # das war das Vor-WM-Domestic-System und doppelte/störte den Public-Channel. Telegram läuft
      # jetzt ausschließlich über telegram_wm.py (WM/Liga: Morning + Recap + Spotlight).

      # 9. Geänderte Dateien zurück ins Repo committen und pushen
      - name: 💾 Änderungen speichern & pushen
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "actions@github.com"
          for f in season-finish.html season-finish-v2.html stats_cache.json picks_history.json squad_cache.json xg_cache.json picks_output.json polymarket_prices.json poly_trader_data.json telegram_sent.json; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "⚠️  $f nicht vorhanden — übersprungen"
            fi
          done
          # Match-Seiten stagen (gesamter matches/ Ordner)
          if [ -d "matches" ]; then
            git add matches/
          fi
          if git diff --staged --quiet; then
            echo "Keine Änderungen — kein Commit nötig."
          else
            git commit -m "🔄 Auto-Update $(date +'%d.%m.%Y %H:%M') UTC"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            # Robust pull+push mit Retry — --autostash schützt vor Race Conditions
            PUSHED=0
            for attempt in 1 2 3 4 5; do
              bash scripts/ci_pull.sh main || true   # 03.09.2026: raeumt untrackte Kollisionen weg (s. Skript)
              CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
              if [ -n "$CONFLICTS" ]; then
                echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
                git diff --staged --quiet || git commit -m "🔧 auto-resolve merge conflicts"
              fi
              if git push 2>&1; then
                echo "✅ Push erfolgreich nach Versuch $attempt"
                PUSHED=1
                break
              fi
              echo "⚠️ Push $attempt fehlgeschlagen — retry in $((attempt * 3))s..."
              sleep $((attempt * 3))
            done
            if [ "$PUSHED" = "0" ]; then echo "❌ Push fehlgeschlagen"; exit 1; fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
