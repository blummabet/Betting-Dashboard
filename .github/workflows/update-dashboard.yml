name: 🔄 Dashboard aktualisieren

on:
  # Automatisch: täglich 06:00, 14:00, 18:00 UTC (08:00 / 16:00 / 20:00 MEZ)
  # 18:00 UTC = nach dem 17:00 UTC prematch-fetch → Picks mit frischen Quoten synced
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 14 * * *'
    - cron: '0 18 * * *'

  # Manuell: jederzeit per Knopfdruck auf GitHub ausführbar
  workflow_dispatch:

# Berechtigung zum Zurückschreiben ins Repo
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. Repository auschecken
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      # 2. Python einrichten
      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Python-Abhängigkeiten installieren
      - name: 📦 Dependencies installieren
        run: pip install -r requirements.txt

      # 4. Dashboard-Daten aktualisieren (API-Football → season-finish.html)
      - name: 📊 Dashboard aktualisieren
        run: python update_dashboard.py
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      # 5. Statistiken aktualisieren (API-Football + ClubElo → stats_cache.json)
      - name: 📈 Statistiken aktualisieren
        run: python refresh_stats.py
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      # 6a. Picks via echte JS-Logik generieren (identisch mit Browser-Cards)
      - name: 🎯 Picks generieren (JS Engine)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 🎯 Picks generieren (run)
        run: node generate_picks.js
        continue-on-error: true

      # 6b. Picks in History speichern
      - name: 📝 Picks speichern
        run: python save_picks.py
        continue-on-error: true

      # 7. Polymarket-Preise holen (Gamma API → polymarket_prices.json)
      - name: 🟣 Polymarket-Preise holen
        run: python fetch_poly_prices.py
        continue-on-error: true

      # 8. Vergangene Picks auswerten (Sofascore Ergebnisse → picks_history.json)
      - name: ✅ Picks auswerten
        run: python resolve_picks.py
        continue-on-error: true

      # 9. Geänderte Dateien zurück ins Repo committen und pushen
      - name: 💾 Änderungen speichern & pushen
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "actions@github.com"
          # Nur existierende Dateien stagen — fehlt eine, kein fataler Abbruch
          for f in season-finish.html season-finish-v2.html stats_cache.json picks_history.json squad_cache.json xg_cache.json picks_output.json polymarket_prices.json; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "⚠️  $f nicht vorhanden — übersprungen"
            fi
          done
          # Nur committen wenn wirklich etwas geändert wurde
          if git diff --staged --quiet; then
            echo "Keine Änderungen — kein Commit nötig."
          else
            git commit -m "🔄 Auto-Update $(date +'%d.%m.%Y %H:%M') UTC"
            git pull origin main --no-rebase -X ours
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
