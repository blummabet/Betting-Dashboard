name: 📐 xG + Corner-Statistiken aktualisieren (täglich)

on:
  # Automatisch: täglich um 04:00 UTC (06:00 MEZ)
  # → läuft VOR dem Dashboard-Update (06:00 UTC) damit corners im selben Tag fließen
  schedule:
    - cron: '0 4 * * *'

  # Manuell: jederzeit per Knopfdruck auf GitHub ausführbar
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-xg:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. Repository auschecken
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      # 2. Python einrichten
      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Dependencies installieren
      - name: 📦 Dependencies installieren
        run: pip install -r requirements.txt

      # 4. xG via API-Football /fixtures/statistics (shots-xG, 11 Ligen)
      #    Business Plan: ~750 Calls (50 Fixtures × 15 Ligen) statt früher 25 → besser
      - name: 📐 xG-Statistiken aktualisieren
        run: python refresh_xg.py
        continue-on-error: false
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        timeout-minutes: 25

      # 5. Vollständige Stats (Understat xG + ClubElo + Corner-Averages via /fixtures/statistics)
      #    Läuft einmal täglich hier (NICHT in update-dashboard.yml via --fast).
      #    Business Plan: 50 Fixtures statt 25 → präzisere Corner-Averages.
      - name: 📊 Vollständige Statistiken (mit Corners)
        run: python refresh_stats.py
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        timeout-minutes: 30

      # 6. Geänderte Caches ins Repo pushen
      - name: 💾 Stats-Daten speichern & pushen
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "actions@github.com"
          git add stats_cache.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen — kein Commit nötig."
          else
            git commit -m "📐 Stats+Corner Update $(date +'%d.%m.%Y') UTC"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            # Robust pull+push mit Retry — --autostash schützt vor Race Conditions
            PUSHED=0
            for attempt in 1 2 3 4 5; do
              bash scripts/ci_pull.sh main || true   # 03.09.2026: raeumt untrackte Kollisionen weg (s. Skript)
              CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
              if [ -n "$CONFLICTS" ]; then
                echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
                git diff --staged --quiet || git commit -m "🔧 auto-resolve merge conflicts"
              fi
              if git push 2>&1; then
                echo "✅ Push erfolgreich nach Versuch $attempt"
                PUSHED=1
                break
              fi
              echo "⚠️ Push $attempt fehlgeschlagen — retry in $((attempt * 3))s..."
              sleep $((attempt * 3))
            done
            if [ "$PUSHED" = "0" ]; then echo "❌ Push fehlgeschlagen"; exit 1; fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
