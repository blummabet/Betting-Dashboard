name: 🔍 Corner/HT Coverage Probe

# Manuell auslösen (Actions → diesen Workflow → Run). Prüft, welche Bücher Corner- + Halbzeit-
# Märkte für die 5 Ligen liefern (v.a. ob Pinnacle/Betfair dabei = Steam möglich, oder reiner
# Modell-Markt). Kein Pipeline-Teil. Schreibt corner_probe.json zum Ansehen.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 📦 Dependencies
        run: pip install -r requirements.txt
      - name: 🔍 Probe Corner + HT Märkte
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python probe_corner_markets.py
      - name: 💾 corner_probe.json committen
        run: |
          git config user.name "CocoBet Bot"
          git config user.email "bot@cocobet.local"
          git add corner_probe.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Kein Ergebnis (keine Events?) — nichts zu committen."
          else
            git commit -m "🔍 Corner/HT Coverage-Probe $(date +'%d.%m.%Y') "
            for attempt in 1 2 3 4 5; do
              bash scripts/ci_pull.sh main || true   # 03.09.2026: raeumt untrackte Kollisionen weg (s. Skript)
              CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
              if [ -n "$CONFLICTS" ]; then
                echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
                git diff --staged --quiet || git commit -m "🔧 auto-resolve merge conflicts"
              fi
              if git push 2>&1; then echo "✅ Push nach Versuch $attempt"; break; fi
              echo "⚠️ Push $attempt fehlgeschlagen — retry…"; sleep $((attempt * 3))
            done
          fi
