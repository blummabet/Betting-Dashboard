name: 🔒 MLS Closing-Capture (nah am Anpfiff)

# 09.07.2026 (Lucas: „MLS voll ready"). Pendant zu capture-closing-liga.yml. MLS-Spiele stoßen
# US-Abend an = späte UTC-Nacht (~23:00–05:00 UTC). Dieser Job läuft alle 15 min in diesen Bändern
# und ruft fetch_liga_odds im CLOSING_CAPTURE_ONLY-Modus (dataset-aware, mls): der Guard
# _has_imminent_kickoff feuert TheOddsAPI NUR an, wenn ein MLS-Spiel in [-20 … +90] min anpfeift.
# Committet NUR mls_closing_lines.json + mls-odds-history.json (verwirft mls-data.json → clobbert nie
# Picks). resolve_wm_results liest mls_closing_lines.json bevorzugt (cocobet_dataset → mls_-Präfix).
on:
  schedule:
    # 13.07.2026 (MLS-Audit): Band begann erst 22:00 UTC → Nachmittags-/Frühabend-Anstöße
    # (13:00–17:00 ET = 17:00–21:00 UTC; Hitze-Slots, Feiertage, Decision Day 15:00 ET) liefen
    # gegen eine TOTE Closing-Linie → CLV dort wertlos. Der interne _has_imminent_kickoff-Guard
    # macht Läufe ohne nahen Anpfiff zum No-Op → Quota-neutral.
    - cron: '*/15 16-23 * * *'   # US-Nachmittag + Abend (UTC)
    # 28.08.2026: MLS-Anpfiffe in mls-data.json enden um 03:00 UTC (00h:119, 01h:60, 02h:70,
    # 03h:6, danach nichts bis 17h). 4-5 Uhr fing nie etwas ein → -8 Läufe/Tag.
    - cron: '*/15 0-3 * * *'     # US-Abend/-Nacht-Anpfiffe (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-closing-mls
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      COCOBET_DATASET: mls
      COCOBET_PROFILE: mls_default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 📦 Dependencies
        run: pip install -r requirements.txt

      - name: 🔒 MLS-Closing nah am Anpfiff erfassen
        run: python fetch_liga_odds.py
        continue-on-error: true
        env:
          CLOSING_CAPTURE_ONLY: '1'
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: 📡 MLS Sharp-Moves erkennen + Alert (nah am Anpfiff)
        # B1 (25.07): der 15-Min-Anpfiff-Job ist das dichteste Band → Steam-Moves
        # kurz vor Kickoff werden hier erkannt und sofort auf Telegram gealertet
        # (Dedup verhindert Wiederholung; re-alert nur bei +2pp Progression).
        # Nur bei imminentem Anpfiff hat der Fetch die History bewegt → sonst No-Op.
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
        run: python detect_wm_sharp_moves.py || true

      - name: 💾 Closing committen (nur wenn geändert)
        run: |
          git config user.name  "CocoBet Bot"
          git config user.email "bot@cocobet.local"
          # mls-data.json bewusst VERWERFEN — der CLV-Resolver liest primär mls_closing_lines.json.
          git checkout -- mls-data.json 2>/dev/null || true
          git add mls_closing_lines.json2>/dev/null || true
          git add mls-odds-history.json2>/dev/null || true
          git add mls_sharp_moves_log.json2>/dev/null || true
          git add mls_sharp_dedup.json2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Closing-Änderung — nichts zu committen."; exit 0
          fi
          git commit -m "🔒 MLS Closing-Capture $(date -u +'%d.%m.%Y %H:%M') UTC"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            git pull origin main --no-rebase -X ours --autostash 2>&1 || true
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
            if [ -n "$CONFLICTS" ]; then
              echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
              git diff --staged --quiet || git commit -m "🔧 auto-resolve closing merge"
            fi
            if git push 2>&1; then echo "✅ Push nach Versuch $attempt"; exit 0; fi
            echo "⚠️ Push $attempt fehlgeschlagen — retry…"; sleep $((attempt * 3))
          done
          echo "❌ Push fehlgeschlagen"; exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
