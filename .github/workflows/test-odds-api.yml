name: Test TheOddsAPI Markets

on:
  workflow_dispatch:  # nur manuell auslösbar (GitHub → Actions → Run workflow)

jobs:
  test-odds:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Specialty Markets (alle Ligen)
        run: node test-cards-api.js
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        timeout-minutes: 5
