name: 🎬 Daily TikTok-Cards

on:
  # PRIMÄR 04:30 UTC = 06:30 Wien (Sommerzeit). 30 Min NACH fetch-wm-data.yml
  # (04:00 UTC) damit die Picks vor dem TikTok-Rendering frisch geschrieben sind.
  # WICHTIG: zusätzlich teilt sich dieser Workflow die concurrency-Group mit
  # fetch-wm-data → wartet auch wenn fetch länger als 30 Min braucht.
  # Cron-Latenz + Playwright/Chromium-Install ~3-5 Min, daher ankommen typisch
  # zwischen 07:00 und 07:45 Wien.
  #
  # BACKUP 05:30 UTC = 07:30 Wien (eingeführt 07.06.2026).
  # GitHub-Actions Cron-Skips sind real — primärer Run wurde am 07.06. übersprungen.
  # Backup-Run prüft via Anti-Double-Send-Guard in generate_daily_tiktok.py
  # (tiktok_sent.json + PNG-Existenz). Wenn primärer erfolgreich war: silent skip.
  # 20.07.2026 WM-WINTERISIERUNG: Das ist die WM-Variante (COCOBET_DATASET nicht gesetzt → Default wm).
  # WM ist beendet → kein täglicher WM-TikTok-Lauf mehr. MLS-TikTok läuft eigenständig in update-mls.yml
  # (Preview 19:00 / Review 07:00 UTC, COCOBET_DATASET=mls). Reaktivieren für WM 2030: einkommentieren.
  # schedule:
  #   - cron: '30 4 * * *'
  #   - cron: '30 5 * * *'

  # Manuell auslösbar — optional anderes Datum reinpushen
  workflow_dispatch:
    inputs:
      date:
        description: 'Datum (YYYY-MM-DD, leer = heute)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # Bug-Fix 07.06.2026: Gleiche Group wie fetch-wm-data damit TikTok-Render NIE
  # parallel zu Pick-Generation läuft. Vorher konnte TikTok stale wm2026-data.json
  # rendern während fetch-wm-data sie gerade neu schrieb.
  group: fetch-wm-data
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Dependencies + Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          # Chromium für headless screenshot — nur Chromium, kein Firefox/WebKit
          playwright install chromium --with-deps

      - name: 🎬 TikTok-Cards generieren + pushen
        run: python generate_daily_tiktok.py
        env:
          TELEGRAM_TOKEN:           ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID:  ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
          DAILY_TIKTOK_DATE:        ${{ github.event.inputs.date }}

      - name: 💾 HTML + PNG ins Repo zurückschreiben
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "actions@github.com"
          mkdir -p daily-tiktok
          # Refactor 2026-06-06: State-Files aus state_files_registry.json
          # 02.09.2026: hier stand eine zerschredderte Kommando-Substitution:
          #     git add $(python3            2>/dev/null || true
          #     git add state_files_registry.py 2>/dev/null || true
          #     git add --bash-list          2>/dev/null || true
          #     git add <job>)               2>/dev/null || true
          # Gemeint war EINE Zeile: `git add $(python3 state_files_registry.py --bash-list <job>)`.
          # Ein frueherer „eine Datei pro git add"-Umbau hat sie an den Leerzeichen zerlegt —
          # seitdem lief das offene $( ueber vier Zeilen und `python3` ohne Argumente las stdin.
          # Gestaged wurde dabei nichts Verlaessliches. Jetzt die Registry EINMAL auswerten und
          # dann Datei fuer Datei stagen: eine fehlende Datei kostet dann genau sich selbst,
          # nicht den ganzen Commit (die Lehre aus dem sechsstuendigen Betfair-Ausfall).
          for f in $(python3 state_files_registry.py --bash-list daily_tiktok 2>/dev/null); do
            [ -e "$f" ] && git add "$f"
          done
          # 02.09.2026 (Lucas: „Haben diese Tik Tok … auch da ein Speicher Problem" / „brauch ich
          # ja danach nicht mehr … sind eh auf telegram gepusht und dort gespeichert"): 145 MB im
          # Arbeitsbaum, alles in git, nirgends eine Aufraeum-Logik, ~2,2 MB/Tag Zuwachs.
          # Geraeumt wird deshalb ALLES ausser den Karten von HEUTE — die bleiben, weil der
          # Backup-Cron um 05:30 ihre Existenz als Doppel-Sende-Schutz liest (sonst posten wir
          # dieselben Karten zweimal) und weil eine Karte bei fehlgeschlagenem Versand noch da
          # sein muss. Dazu Match-Daten ohne Event-Seite und ohne Index-Eintrag, aelter als 7 Tage.
          # Die Event-SEITEN selbst bleiben unangetastet — das ist der SEO-Bestand.
          # Dieser Schritt steht bewusst NACH dem Generieren und Senden.
          # `git add -A` je Ordner, damit auch die LOESCHUNGEN in den Commit kommen.
          python3 scripts/archiv_aufraeumen.py --loeschen || true
          for d in daily-tiktok mls_daily-tiktok liga_daily-tiktok matches/data; do
            [ -d "$d" ] && git add -A "$d"
          done
          if git diff --staged --quiet; then
            echo "Keine neuen Files."
          else
            TIMESTAMP=$(date +'%d.%m.%Y')
            git commit -m "🎬 Daily TikTok-Cards ${TIMESTAMP}"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            # Robust push mit Retry (siehe fetch-wm-data.yml für Doku)
            PUSHED=0
            for attempt in 1 2 3 4 5; do
              bash scripts/ci_pull.sh main || true   # 03.09.2026: raeumt untrackte Kollisionen weg (s. Skript)
              CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
              if [ -n "$CONFLICTS" ]; then
                echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
                git diff --staged --quiet || git commit -m "🔧 auto-resolve merge conflicts"
              fi
              if git push 2>&1; then
                echo "✅ Push erfolgreich"
                PUSHED=1
                break
              fi
              sleep $((attempt * 3))
            done
            if [ "$PUSHED" = "0" ]; then exit 1; fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
