name: 🎬 Daily TikTok-Cards

on:
  # PRIMÄR 04:30 UTC = 06:30 Wien (Sommerzeit). 30 Min NACH fetch-wm-data.yml
  # (04:00 UTC) damit die Picks vor dem TikTok-Rendering frisch geschrieben sind.
  # WICHTIG: zusätzlich teilt sich dieser Workflow die concurrency-Group mit
  # fetch-wm-data → wartet auch wenn fetch länger als 30 Min braucht.
  # Cron-Latenz + Playwright/Chromium-Install ~3-5 Min, daher ankommen typisch
  # zwischen 07:00 und 07:45 Wien.
  #
  # BACKUP 05:30 UTC = 07:30 Wien (eingeführt 07.06.2026).
  # GitHub-Actions Cron-Skips sind real — primärer Run wurde am 07.06. übersprungen.
  # Backup-Run prüft via Anti-Double-Send-Guard in generate_daily_tiktok.py
  # (tiktok_sent.json + PNG-Existenz). Wenn primärer erfolgreich war: silent skip.
  # 20.07.2026 WM-WINTERISIERUNG: Das ist die WM-Variante (COCOBET_DATASET nicht gesetzt → Default wm).
  # WM ist beendet → kein täglicher WM-TikTok-Lauf mehr. MLS-TikTok läuft eigenständig in update-mls.yml
  # (Preview 19:00 / Review 07:00 UTC, COCOBET_DATASET=mls). Reaktivieren für WM 2030: einkommentieren.
  # schedule:
  #   - cron: '30 4 * * *'
  #   - cron: '30 5 * * *'

  # Manuell auslösbar — optional anderes Datum reinpushen
  workflow_dispatch:
    inputs:
      date:
        description: 'Datum (YYYY-MM-DD, leer = heute)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # Bug-Fix 07.06.2026: Gleiche Group wie fetch-wm-data damit TikTok-Render NIE
  # parallel zu Pick-Generation läuft. Vorher konnte TikTok stale wm2026-data.json
  # rendern während fetch-wm-data sie gerade neu schrieb.
  group: fetch-wm-data
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Dependencies + Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          # Chromium für headless screenshot — nur Chromium, kein Firefox/WebKit
          playwright install chromium --with-deps

      - name: 🎬 TikTok-Cards generieren + pushen
        run: python generate_daily_tiktok.py
        env:
          TELEGRAM_TOKEN:           ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID:  ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
          DAILY_TIKTOK_DATE:        ${{ github.event.inputs.date }}

      - name: 💾 HTML + PNG ins Repo zurückschreiben
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "actions@github.com"
          mkdir -p daily-tiktok
          # Refactor 2026-06-06: State-Files aus state_files_registry.json
          git add $(python32>/dev/null || true
          git add state_files_registry.py2>/dev/null || true
          git add --bash-list2>/dev/null || true
          git add daily_tiktok)2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine neuen Files."
          else
            TIMESTAMP=$(date +'%d.%m.%Y')
            git commit -m "🎬 Daily TikTok-Cards ${TIMESTAMP}"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            # Robust push mit Retry (siehe fetch-wm-data.yml für Doku)
            PUSHED=0
            for attempt in 1 2 3 4 5; do
              git pull origin main --no-rebase -X ours --autostash 2>&1 || true
              CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
              if [ -n "$CONFLICTS" ]; then
                echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
                git diff --staged --quiet || git commit -m "🔧 auto-resolve merge conflicts"
              fi
              if git push 2>&1; then
                echo "✅ Push erfolgreich"
                PUSHED=1
                break
              fi
              sleep $((attempt * 3))
            done
            if [ "$PUSHED" = "0" ]; then exit 1; fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
