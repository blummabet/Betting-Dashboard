name: 🎬 WM Live-Story Engine

on:
  # 03.07.2026 (Lucas: „ich kann auf WM verzichten"): WM Live-Story PAUSIERT. Der Hook kam
  # strukturell 1 Tag zu spät (Argentinien 10h nach Anpfiff) → für Live-Content unbrauchbar.
  # Cron auskommentiert → läuft nur noch manuell (workflow_dispatch). MLS/Liga-Content läuft
  # stattdessen dataset-aware über update-mls.yml / update-liga.yml.
  # schedule:
  #   - cron: '0 6 * * *'   # 06:00 UTC = 08:00 Wien

  workflow_dispatch:
    inputs:
      force_angle:
        description: 'Nur diese Angle laufen lassen (matchOfDay/killerStat/underdogRecap/playerSpotlight)'
        required: false
        default: ''
      dry_run:
        description: 'Vorschau anzeigen, nichts persistieren'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: wm-live-story
  cancel-in-progress: false

jobs:
  generate-story:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Repo
        uses: actions/checkout@v4

      - name: 🐍 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Playwright + Chromium installieren
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: 🎬 Story-Engine ausführen
        run: python generate_wm_live_story.py
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
          FORCE_ANGLE:             ${{ github.event.inputs.force_angle }}
          DRY_RUN:                 ${{ github.event.inputs.dry_run || 'false' }}

      - name: 💾 Card + State + Telegram-Log persistieren
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "actions@github.com"
          # Refactor 2026-06-06: State-Files aus state_files_registry.json
          # 02.09.2026: hier stand eine zerschredderte Kommando-Substitution:
          #     git add $(python3            2>/dev/null || true
          #     git add state_files_registry.py 2>/dev/null || true
          #     git add --bash-list          2>/dev/null || true
          #     git add <job>)               2>/dev/null || true
          # Gemeint war EINE Zeile: `git add $(python3 state_files_registry.py --bash-list <job>)`.
          # Ein frueherer „eine Datei pro git add"-Umbau hat sie an den Leerzeichen zerlegt —
          # seitdem lief das offene $( ueber vier Zeilen und `python3` ohne Argumente las stdin.
          # Gestaged wurde dabei nichts Verlaessliches. Jetzt die Registry EINMAL auswerten und
          # dann Datei fuer Datei stagen: eine fehlende Datei kostet dann genau sich selbst,
          # nicht den ganzen Commit (die Lehre aus dem sechsstuendigen Betfair-Ausfall).
          for f in $(python3 state_files_registry.py --bash-list daily_wm_story 2>/dev/null); do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "Keine Änderungen — kein Commit."
          else
            TIMESTAMP=$(date +'%d.%m.%Y %H:%M')
            git commit -m "🎬 WM Live-Story ${TIMESTAMP} UTC [skip ci]"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            for attempt in 1 2 3; do
              bash scripts/ci_pull.sh main || true   # 03.09.2026: raeumt untrackte Kollisionen weg (s. Skript)
              if git push 2>&1; then
                echo "✅ Push erfolgreich (Versuch $attempt)"
                break
              fi
              sleep $((attempt * 3))
            done
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
