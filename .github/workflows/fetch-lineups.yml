name: 🟢 Lineups holen (stündlich)

on:
  # Stündlich zwischen 07:00–21:00 UTC (09:00–23:00 MEZ)
  # Lineups werden ~60–75 Min vor Anstoß freigegeben.
  # API-Cost: ~30–60 Calls/Tag (nur Spiele im ±2h–12h Fenster)
  schedule:
    - cron: '0 7-21 * * *'   # jede Stunde von 07:00 bis 21:00 UTC

  # Manuell auslösbar
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-lineups:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Dependencies installieren
        run: pip install -r requirements.txt

      # Lineups fetchen — nur Spiele im Kickoff-Fenster ±2h bis +12h
      # Bestätigte Lineups werden gecacht und nicht erneut gefetcht.
      - name: 🟢 Lineups holen
        run: python fetch_lineups.py
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        timeout-minutes: 10

      # lineup_cache.json ins Repo pushen
      - name: 💾 Lineup-Cache speichern & pushen
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "actions@github.com"
          git add lineup_cache.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen — kein Commit nötig."
          else
            git commit -m "🟢 Lineups Update $(date +'%d.%m.%Y %H:%M') UTC"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            # Robust pull+push mit Retry — --autostash schützt vor Race Conditions
            PUSHED=0
            for attempt in 1 2 3 4 5; do
              bash scripts/ci_pull.sh main || true   # 03.09.2026: raeumt untrackte Kollisionen weg (s. Skript)
              CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
              if [ -n "$CONFLICTS" ]; then
                echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
                git diff --staged --quiet || git commit -m "🔧 auto-resolve merge conflicts"
              fi
              if git push 2>&1; then
                echo "✅ Push erfolgreich nach Versuch $attempt"
                PUSHED=1
                break
              fi
              echo "⚠️ Push $attempt fehlgeschlagen — retry in $((attempt * 3))s..."
              sleep $((attempt * 3))
            done
            if [ "$PUSHED" = "0" ]; then echo "❌ Push fehlgeschlagen"; exit 1; fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
