name: ⚡ Poly Live-Scan (nur laufende Spiele, schnell)

# 11.08.2026 (Lucas, Stufe 1/A): schlanker LIVE-only Lauf. Greift NUR Maerkte im Live-Fenster ab
# (Anpfiff bis LIVE_TAIL_H danach) und schreibt poly_money_broad_live(.history).json. Ueberspringt den
# schweren Vor-Spiel-Teil des Global-Scans. Poly ist geoblockt (Rechenzentrums-IP) -> nur self-hosted.
#
# 12.08.2026 (Lucas): GitHubs Cron DROSSELT hochfrequente Schedules (*/5 lief real ~stuendlich statt
# alle 5 Min). Loesung damals: stuendlich starten und INTERN alle 15 Min scannen, gut eine Stunde lang.
# Der Job belegt dafuer durchgehend EINEN self-hosted Runner -> gedacht war der 2. Mac-Runner.
#
# ⚠️ 31.08.2026 — GEMESSEN, und die Annahme hielt nicht. Ist-Laeufe je Tag aus der Commit-Historie
# (26.-31.08.), erwartet 96 bei 15-Min-Takt:
#
#   Live-Scan  (70-Min-Loop, stuendlich)   8 · 12 · 10 · 25 · 28 · 12   =  8-29%, Luecken 3-12 STUNDEN
#   Global-Scan (kurz, alle 30 Min)                   38 · 54 · 38      =  79-112%, groesste Luecke 31 Min
#   Betfair-Radar (kurz, */10)                        99 · 90 · 102     =  ~100%, groesste Luecke 15-17 Min
#
# Auf DERSELBEN Maschine erreichen die kurzen Jobs volle Abdeckung. Der Runner ist also gesund —
# der lang haltende Job ist das Problem: er will den Runner ueber eine Stunde exklusiv, kommt gegen
# die kurzen Jobs kaum dran, und `cancel-in-progress` raeumt den wartenden Lauf beim naechsten
# stuendlichen Start ab, bevor er je startet. Aus Warten wird so Aushungern.
#
# Deshalb jetzt: KURZER Einzeldurchlauf im 15-Min-Takt (4,19,34,49 — versetzt zu Betfair auf */10
# und zum Global-Scan auf :15/:45, und weg von :00, wo repo-weit alles gleichzeitig startet).
# Gleiche Ziel-Taktung wie vorher, nur ueber den Scheduler statt gegen ihn. cancel-in-progress ist
# AUS: ein Lauf von wenigen Minuten muss seinen Vorgaenger nicht verdraengen, und genau das
# Verdraengen war Teil der Krankheit.
on:
  schedule:
    - cron: '4,19,34,49 * * * *'   # 15-Min-Takt, versetzt zu Betfair (*/10) und Global-Scan (:15/:45)
  workflow_dispatch:

permissions:
  contents: write
  actions: read          # run_health.py liest die Steps DIESES Laufs

concurrency:
  group: poly-live-scan
  cancel-in-progress: false   # 31.08.2026: kurzer Lauf — Verdraengen brachte nur Aushungern (s. Kopf)

jobs:
  live:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 12   # Backstop fuer EINEN Durchlauf; laenger heisst haengt, nicht arbeitet
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4
        with:
          clean: false

      - name: 🐍 Python einrichten (Mac)
        run: |
          PYTHON=""
          for PY in /opt/homebrew/bin/python3.13 /opt/homebrew/bin/python3.12 /opt/homebrew/bin/python3.11 /usr/local/bin/python3.13 /usr/local/bin/python3.12 /usr/local/bin/python3.11 /usr/bin/python3; do
            if "$PY" --version >/dev/null 2>&1; then PYTHON="$PY"; break; fi
          done
          if [ -z "$PYTHON" ]; then echo "Kein Python gefunden"; exit 1; fi
          echo "$PYTHON ($($PYTHON --version))"
          echo "POLY_PYTHON=$PYTHON" >> $GITHUB_ENV
          $PYTHON -m pip install --break-system-packages requests --quiet 2>/dev/null || true

      - name: ⚡ Live-Scan (ein Durchlauf)
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
          GITHUB_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          git config user.name "CocoBet Bot"
          git config user.email "bot@cocobet.local"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --local credential.helper "" 2>/dev/null || true   # headless-Runner: macOS-Keychain gesperrt (-25308) -> Helper aus, Auth laeuft ueber Token-in-URL
          # nach einem evtl. abgebrochenen Vorgaenger-Loop sauber aufsetzen
          git merge --abort 2>/dev/null || true
          git rebase --abort 2>/dev/null || true

          run_once () {
            echo "──── Live-Scan · $(date -u +'%H:%M:%S') UTC ────"
            git pull origin main --no-rebase -X ours --autostash 2>&1 || true
            "${POLY_PYTHON}" poly_money_broad.py --live-only || echo "  ⚠️ live-only Fehler (Loop laeuft weiter)"
            "${POLY_PYTHON}" poly_live_watch.py           || echo "  ⚠️ live-watch Fehler (Loop laeuft weiter)"
            "${POLY_PYTHON}" poly_live_signal_track.py    || echo "  ⚠️ live-signal-track Fehler (Loop laeuft weiter)"
            for f in poly_money_broad_live.json poly_money_broad_live_history.json poly_live_watch_seen.json poly_live_signal_track.json poly_football_tags.json; do
              [ -f "$f" ] && git add "$f"
            done
            if git diff --staged --quiet; then
              echo "  Keine Aenderungen — kein Commit."
              return 0
            fi
            git commit -m "⚡ Poly Live-Scan $(date -u +'%d.%m.%Y %H:%M') UTC" || return 0
            for attempt in 1 2 3 4 5; do
              git pull origin main --no-rebase -X ours --autostash 2>&1 || true
              CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
              if [ -n "$CONFLICTS" ]; then
                echo "$CONFLICTS" | while read cf; do git checkout --ours -- "$cf"; git add "$cf"; done
                git diff --staged --quiet || git commit -m "auto-resolve merge conflicts"
              fi
              if git push 2>&1; then echo "  Push OK (Versuch $attempt)"; return 0; fi
              echo "  Push $attempt fehlgeschlagen — retry…"; sleep $((attempt * 3))
            done
            echo "  Push nach 5 Versuchen fehlgeschlagen — naechste Iteration versucht es erneut."
          }

          run_once
          echo "Durchlauf fertig — der naechste Trigger uebernimmt in ~15 Min."

      # 30.08.2026 (Lucas-Checkup): die Übersicht meldete selbst „letzte Erfassung vor 3 h — der
      # Live-Scan (Mac-Runner) lief zuletzt nicht", und im Repo stand nichts, woran man sähe warum:
      # run_health.py lief hier nie — derselbe blinde Fleck wie bei den MLS-Workflows.
      #
      # Dieser Workflow committet INNERHALB des Scan-Schritts, es gibt also keinen eigenen
      # Commit-Step, vor den der Wächter passen würde. Er hängt deshalb hinten dran und schreibt
      # seine Datei selbst weg. `if: always()` bleibt wichtig: ein Lauf, der in den Backstop läuft
      # oder mittendrin stirbt, ist genau der Fall, über den wir sonst nie etwas erfahren.
      - name: 🩺 Lauf-Gesundheit (verschluckte Fehler sichtbar machen)
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
        run: |
          "${POLY_PYTHON:-python3}" run_health.py --slug poly-live-scan || true
          git add health/poly-live-scan.json 2>/dev/null || true
          git diff --staged --quiet || {
            git commit -m "🩺 Live-Scan-Gesundheit $(date -u +'%d.%m.%Y %H:%M') UTC [skip ci]" || true
            git pull origin main --no-rebase -X ours --autostash 2>&1 || true
            git push 2>&1 || echo "  Push der Gesundheitsdatei fehlgeschlagen — nicht kritisch"
          }
