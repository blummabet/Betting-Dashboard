name: 📊 Ergebnisse holen

on:
  # Automatisch: 04:00, 18:00, 23:00 Uhr Vienna (CEST = UTC+2)
  #   04:00 Vienna = 02:00 UTC
  #   18:00 Vienna = 16:00 UTC
  #   23:00 Vienna = 21:00 UTC
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 16 * * *'
    - cron: '0 21 * * *'

  # Manuell ausführbar per Knopfdruck auf GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-results:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Dependencies installieren
        run: pip install -r requirements.txt

      - name: 📊 Ergebnisse von API-Football holen
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_results.py

      # Picks sofort nach dem Ergebnis-Fetch auswerten — nicht auf den nächsten
      # update-dashboard.yml Lauf (06:00/14:00 UTC) warten.
      - name: ✅ Picks auswerten (resolve)
        run: python resolve_picks.py
        continue-on-error: true

      - name: 💾 Ergebnisse & aufgewertete Picks speichern & pushen
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "actions@github.com"
          git add results-cache.json picks_history.json
          if git diff --staged --quiet; then
            echo "Keine neuen Ergebnisse — kein Commit nötig."
          else
            git commit -m "📊 Ergebnisse + Picks aufgelöst $(date +'%d.%m.%Y %H:%M') UTC"
            git pull origin main --no-rebase -X ours
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
