name: 📊 Ergebnisse holen

on:
  # Automatisch: 04:00, 18:00, 23:00, 01:30 Uhr Vienna (CEST = UTC+2)
  #   04:00 Vienna = 02:00 UTC  → Nacht-Catch, alle gestrigen Spiele garantiert fertig
  #   18:00 Vienna = 16:00 UTC  → Nachmittagsspiele (SCO, SUI, frühe Liga-Spiele)
  #   23:00 Vienna = 21:00 UTC  → Abendspiele (aber 21:00-CEST-Anpfiffe noch live!)
  #   01:30 Vienna = 23:30 UTC  → Sicherheitsnetz: alle 21:00-CEST-Spiele fertig
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 16 * * *'
    - cron: '0 21 * * *'
    - cron: '30 23 * * *'

  # Manuell ausführbar per Knopfdruck auf GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-results:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Dependencies installieren
        run: pip install -r requirements.txt

      - name: 📊 Ergebnisse von API-Football holen
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_results.py

      # Picks sofort nach dem Ergebnis-Fetch auswerten — nicht auf den nächsten
      # update-dashboard.yml Lauf (06:00/14:00 UTC) warten.
      - name: ✅ Picks auswerten (resolve)
        run: python resolve_picks.py
        continue-on-error: true

      # ── WM 2026 Abend-Catch (11.06.2026) ──────────────────────────────────
      # fetch-wm-data.yml holt WM-Ergebnisse nur 4/8/12/16/20 UTC → Abendspiele
      # (21:00-UTC-Anpfiff endet ~23:00) blieben bis 04:00 UTC unaufgelöst.
      # Dieser Workflow läuft 21:00 + 23:30 UTC → Score holen + Picks/Bets noch
      # in derselben Nacht auflösen. Reine Resolver (KEIN Regenerieren der Picks),
      # alle stdlib → laufen unter plain python. update_signal_weights bleibt
      # bewusst draußen (läuft in manage-wm-poly, sonst doppelte Gewichtung).
      - name: ⚽ WM Spielergebnisse fetchen
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_wm_match_results.py
        continue-on-error: true

      - name: 📊 WM Picks resolven (WIN/LOSS)
        run: python resolve_wm_picks.py
        continue-on-error: true

      - name: 🎯 WM Pick-Confidence berechnen
        run: python compute_pick_confidence.py
        continue-on-error: true

      - name: 💹 WM Bets resolven (P&L + CLV)
        run: python resolve_wm_results.py
        continue-on-error: true

      - name: 📉 Steam-CLV berechnen (Einstieg vs Closing pro Steam-Pick)
        run: python resolve_steam_clv.py
        continue-on-error: true

      - name: 🎯 CLV-Bilanz aggregieren (Scoreboard)
        run: python compute_clv_summary.py
        continue-on-error: true

      - name: 💾 Ergebnisse & aufgewertete Picks speichern & pushen
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "actions@github.com"
          git add results-cache.json
          git add picks_history.json
          git add \
                  wm2026-data.json wm_results.json \
                  pick_confidence_stats.json wm2026-poly-history.json \
                  wm_clv_summary.json
          if git diff --staged --quiet; then
            echo "Keine neuen Ergebnisse — kein Commit nötig."
          else
            git commit -m "📊 Ergebnisse + Picks aufgelöst $(date +'%d.%m.%Y %H:%M') UTC"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            # Robust pull+push mit Retry — --autostash schützt vor Race Conditions
            PUSHED=0
            for attempt in 1 2 3 4 5; do
              git pull origin main --no-rebase -X ours --autostash 2>&1 || true
              CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
              if [ -n "$CONFLICTS" ]; then
                echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
                git diff --staged --quiet || git commit -m "🔧 auto-resolve merge conflicts"
              fi
              if git push 2>&1; then
                echo "✅ Push erfolgreich nach Versuch $attempt"
                PUSHED=1
                break
              fi
              echo "⚠️ Push $attempt fehlgeschlagen — retry in $((attempt * 3))s..."
              sleep $((attempt * 3))
            done
            if [ "$PUSHED" = "0" ]; then echo "❌ Push fehlgeschlagen"; exit 1; fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
