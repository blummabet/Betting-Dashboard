name: 🤖 Poly Auto-Trader · Daily Heartbeat

on:
  # 06:00 UTC = 08:00 Wien. Status-Snapshot direkt nach den ersten Tages-Crons.
  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      # 🔴 27.09.2026 (Marsborne, 2x $5 im Abstand von 3,5 Min): ein geplanter Lauf, der
      # hinter einem anderen in der Warteschlange stand, checkt den Commit von SEINEM
      # Ausloese-Zeitpunkt aus — nicht den neuesten. Jeder Dedup-Stand, den der Lauf davor
      # gesichert hat, fehlt ihm. Deshalb: auf den neuesten Stand, BEVOR etwas sendet oder setzt.
      # Waechter: tests/test_workflow_frisch_vor_wirkung.py
      - name: 🔄 Auf den neuesten Stand (vor jeder Wirkung)
        run: bash scripts/ci_pull.sh main || true

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🤖 Heartbeat senden
        run: python3 poly_heartbeat.py
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
