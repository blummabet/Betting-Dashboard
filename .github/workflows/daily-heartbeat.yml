name: 🤖 Poly Auto-Trader · Daily Heartbeat

on:
  # 06:00 UTC = 08:00 Wien. Status-Snapshot direkt nach den ersten Tages-Crons.
  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🤖 Heartbeat senden
        run: python3 poly_heartbeat.py
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
