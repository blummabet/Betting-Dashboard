name: 🟣 Place Polymarket Bets

# Triggered from the CocoBet dashboard when the user clicks "Jetzt platzieren"
# Payload: { "orders": [...] } — array of bet orders from the UI
on:
  repository_dispatch:
    types: [place-poly-bets]

jobs:
  place-bets:
    name: Place bets on Polymarket CLOB
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find Python and install dependencies
        run: |
          PYTHON=""
          for PY in /opt/homebrew/bin/python3.13 /opt/homebrew/bin/python3.12 /opt/homebrew/bin/python3.11 /usr/local/bin/python3.13 /usr/local/bin/python3.12 /usr/local/bin/python3.11; do
            if "$PY" --version &>/dev/null 2>&1; then
              PYTHON="$PY"
              break
            fi
          done
          if [ -z "$PYTHON" ]; then
            echo "❌ Kein Python >= 3.11 gefunden"; exit 1
          fi
          echo "✅ $PYTHON ($($PYTHON --version))"
          echo "POLY_PYTHON=$PYTHON" >> $GITHUB_ENV
          $PYTHON -m pip install --break-system-packages --upgrade \
            "git+https://github.com/Polymarket/py-clob-client.git" \
            requests
          $PYTHON -c "from py_clob_client.client import ClobClient; import py_clob_client; v = getattr(py_clob_client, '__version__', '?'); print('✅ py-clob-client', v)"

      - name: Place Polymarket orders
        env:
          POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY }}
          ORDERS_JSON:      ${{ toJson(github.event.client_payload.orders) }}
        run: ${{ env.POLY_PYTHON }} polymarket_bet.py

      - name: Commit updated picks_history.json
        run: |
          git config user.name  "CocoBet Bot"
          git config user.email "bot@cocobet.local"
          git add picks_history.json
          # Only commit if there are actual changes
          git diff --staged --quiet || git commit -m "poly: log placed bets [skip ci]"
          git push
