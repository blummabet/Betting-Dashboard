name: 🟣 Place Polymarket Bets

# Triggered from the CocoBet dashboard when the user clicks "Jetzt platzieren"
# Payload: { "orders": [...] } — array of bet orders from the UI
on:
  repository_dispatch:
    types: [place-poly-bets]

# K3 Fix 05.06.2026 — Concurrency-Gruppe verhindert doppelte Bets:
# Teilt sich die Gruppe mit manage-wm-poly.yml. Wenn ein Cron-Run gerade
# läuft und der User parallel im UI "Jetzt platzieren" klickt, wartet
# der UI-Trigger statt parallel zu laufen → keine doppelten Orders.
concurrency:
  group: poly-trading
  cancel-in-progress: false

jobs:
  place-bets:
    name: Place bets on Polymarket CLOB
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: write
    # DATASET-AWARE (12.07.2026, Lucas: „MLS ist auf Polymarket da"). Das Dashboard schickt im
    # repository_dispatch-Payload optional `dataset` ("mls"/"liga"); ohne Angabe bleibt es WM.
    # polymarket_bet.py ist bereits dataset-aware → schreibt dann mls_auto_bets_placed.json usw.
    env:
      COCOBET_DATASET: ${{ github.event.client_payload.dataset || 'wm' }}
      COCOBET_PROFILE: ${{ github.event.client_payload.profile || 'wm2026' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find Python and install dependencies
        run: |
          PYTHON=""
          for PY in /opt/homebrew/bin/python3.13 /opt/homebrew/bin/python3.12 /opt/homebrew/bin/python3.11 /usr/local/bin/python3.13 /usr/local/bin/python3.12 /usr/local/bin/python3.11; do
            if "$PY" --version &>/dev/null 2>&1; then
              PYTHON="$PY"
              break
            fi
          done
          if [ -z "$PYTHON" ]; then
            echo "❌ Kein Python >= 3.11 gefunden"; exit 1
          fi
          echo "✅ $PYTHON ($($PYTHON --version))"
          echo "POLY_PYTHON=$PYTHON" >> $GITHUB_ENV
          $PYTHON -m pip uninstall -y py-clob-client py-clob-client-v2 2>/dev/null || true
          $PYTHON -m pip install --break-system-packages requests 2>&1 | tail -2
          $PYTHON -m pip install --break-system-packages "git+https://github.com/Polymarket/py-clob-client-v2.git@main" 2>&1 | tail -3
          $PYTHON -c "from py_clob_client_v2.client import ClobClient; print('✅ py-clob-client-v2 ok')"

      - name: Place Polymarket orders
        env:
          POLY_PRIVATE_KEY:          ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_API_KEY:              ${{ secrets.POLY_API_KEY }}
          POLY_API_SECRET:           ${{ secrets.POLY_API_SECRET }}
          POLY_API_PASSPHRASE:       ${{ secrets.POLY_API_PASSPHRASE }}
          POLY_FUNDER_ADDRESS:       ${{ secrets.POLY_FUNDER_ADDRESS }}
          TELEGRAM_TOKEN:            ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID:   ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
          ORDERS_JSON:               ${{ toJson(github.event.client_payload.orders) }}
        run: ${{ env.POLY_PYTHON }} polymarket_bet.py

      - name: Commit updated picks_history.json
        run: |
          git config user.name  "CocoBet Bot"
          git config user.email "bot@cocobet.local"
          git add picks_history.json
          # dataset-aware: platzierte Bets landen je Datensatz in eigener Datei
          git add wm_auto_bets_placed.json2>/dev/null || true
          git add mls_auto_bets_placed.json2>/dev/null || true
          git add liga_auto_bets_placed.json2>/dev/null || true
          # Only commit if there are actual changes
          git diff --staged --quiet && { echo "nichts zu committen"; exit 0; }
          git commit -m "poly: log placed bets [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            git pull origin main --no-rebase -X ours --autostash 2>&1 || true
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
            if [ -n "$CONFLICTS" ]; then
              echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
              git diff --staged --quiet || git commit -m "🔧 auto-resolve merge conflicts"
            fi
            if git push 2>&1; then echo "✅ Push nach Versuch $attempt"; exit 0; fi
            echo "⚠️ Push $attempt fehlgeschlagen — retry…"; sleep $((attempt * 3))
          done
          echo "❌ Push fehlgeschlagen"; exit 1
