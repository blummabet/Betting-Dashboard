name: 📈 Pinnacle Odds Refresh (dicht)

# 23.06.2026 (Lucas): Pinnacle nur 5×/Tag (fetch-wm-data) → Steam-Moves wirken „verwaschen".
# Dieser schlanke Extra-Dienst holt NUR die Pinnacle-Odds + erkennt Moves (Sharp Radar) alle 2h,
# interleaved mit fetch-wm-data (4,8,12,16,20 UTC) → Pinnacle ~alle 2h frisch. Kein voller
# Pipeline-Lauf (keine Form/Lineups/Poly). Kosten: ~720 TheOddsAPI-Credits/Lauf × ~6 = ~4,3k/Tag
# (~130k/Monat) — bei 5-Mio-Limit unkritisch. Nach 1 Woche Verbrauch prüfen, Cadence justieren.
on:
  # 20.07.2026 WM-WINTERISIERUNG: WM 2026 ist beendet (Finale 19.07.). Schedule pausiert, damit der
  # Fetcher nicht mehr gegen ein totes Turnier läuft (TheOddsAPI hat die WM gedroppt). Reaktivieren
  # für WM 2030 / Testläufe: die schedule-Zeile wieder einkommentieren.
  # schedule:
  #   - cron: '0 2,6,10,14,18,22 * * *'   # füllt die Lücken zwischen fetch-wm-data (4,8,12,16,20)
  workflow_dispatch:

permissions:
  contents: write

# Teilt die Gruppe mit fetch-wm-data → kein gleichzeitiges Schreiben/Pushen von wm2026-data.json.
concurrency:
  group: fetch-wm-data
  cancel-in-progress: false

jobs:
  pinnacle-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 💰 Pinnacle-Odds holen (nur fetch_wm_odds)
        env:
          ODDS_API_KEY:            ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
        run: python fetch_wm_odds.py

      - name: 📡 Sharp-Moves erkennen (Radar)
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
        run: python detect_wm_sharp_moves.py || true

      - name: 💾 Odds + Snapshots committen
        run: |
          git config user.name  "CocoBet Bot"
          git config user.email "bot@cocobet.local"
          # 02.09.2026: hier stand `git add <pfad>2>/dev/null` OHNE Leerzeichen. Die Shell liest
          # das als Pfad `<pfad>2` — eine Datei, die es nicht gibt. `|| true` schluckt den Fehler,
          # danach ist NICHTS gestaged, der Commit-Schritt meldet „keine Änderung" und der Job wird
          # gruen. Genau die Signatur „frischer Job, alte Daten", die uns schon den sechsstuendigen
          # Betfair-Ausfall gekostet hat. 83 solche Zeilen in 18 Workflows, alle mit Leerzeichen.
          git add wm2026-data.json 2>/dev/null || true
          git add wm2026-odds-history.json 2>/dev/null || true
          git add wm_sharp_moves_log.json 2>/dev/null || true
          git add wm_sharp_dedup.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Änderung — nichts zu committen."; exit 0
          fi
          git commit -m "pinnacle: dichter Odds-Refresh + Move-Scan [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # 08.07.2026 (Lucas: Push „rejected — fetch first"): robust gegen parallele Pushes anderer
          # Workflows. Pull --autostash + Konflikt-Resolve (ours) + Retry, statt nacktem git push.
          for attempt in 1 2 3 4 5; do
            git pull origin main --no-rebase -X ours --autostash 2>&1 || true
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
            if [ -n "$CONFLICTS" ]; then
              echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
              git diff --staged --quiet || git commit -m "🔧 auto-resolve merge conflicts"
            fi
            if git push 2>&1; then echo "✅ Push nach Versuch $attempt"; exit 0; fi
            echo "⚠️ Push $attempt fehlgeschlagen — retry in $((attempt * 3))s…"; sleep $((attempt * 3))
          done
          echo "❌ Push fehlgeschlagen"; exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
