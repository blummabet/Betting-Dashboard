name: 📊 Pinnacle × Poly Lag-Scanner
# 04.08.2026 (Lucas): Messphase — alle aktiven Ligen gegen Pinnacle snapshotten, damit
# poly_pinnacle_stats.py (Phase 2) den Round-Trip-Backtest rechnen kann (Einstieg auf Polys
# nachhinkendem Preis bei Pinnacle-Move, Ausstieg bei Konvergenz). Reines Messen, keine Trades.
# Nach der Auswertung (1–2 Wochen) einfach deaktivieren. Takt/Kosten frei justierbar.
on:
  schedule:
    # 28.08.2026 (Lucas: „Last senken"): von */30 auf stündlich, -24 Läufe/Tag. Der gemessene
    # Poly-Lag gegenüber Pinnacle bewegt sich in Stunden, nicht in halben — für die Lag-Statistik
    # reicht ein Snapshot pro Stunde. Minute 25 statt 0: weg von der vollen Stunde, auf der
    # repo-weit bis zu 11 Jobs gleichzeitig starten.
    - cron: '25 * * * *'     # stündlich, versetzt zur vollen Stunde
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pinnacle-poly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Dependencies installieren
        run: pip install -r requirements.txt

      - name: 📊 Pinnacle × Poly Snapshot (alle aktiven Ligen)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python poly_pinnacle_scan.py

      - name: 💾 Snapshot committen
        if: always()
        run: |
          git config user.name  "CocoBet Bot"
          git config user.email "bot@cocobet.local"
          git add pinnacle_poly_scan.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "pinnacle×poly: Snapshot [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Push-Retry (04.08.2026, Lucas): parallele Workflows (Liga/WM/…) pushen oft gleichzeitig
          # auf main → origin bewegt sich zwischen pull --rebase und push → "fetch first". Darum in
          # einer Schleife rebasen+pushen bis es klappt (max 6 Versuche, wachsender Backoff).
          for i in 1 2 3 4 5 6; do
            bash scripts/ci_pull.sh main rebase || true   # 03.09.2026: raeumt untrackte Kollisionen weg
            if git push; then echo "push ok (Versuch $i)"; break; fi
            echo "push abgewiesen (Versuch $i) — neu rebasen …"; sleep $((i * 3))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
