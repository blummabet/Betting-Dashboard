name: 💹 WM Poly Positionen überwachen

on:
  # FIX 13.06.2026 — Pre-Match-Hard-Close-Lücke geschlossen.
  # Vorher: nur 5×/Tag (06/10/14/18/22 UTC) → der 2h-Hard-Close (PRE_MATCH_CLOSE_HOURS)
  # traf nur Spiele, die 0-2h nach einem Cron anstießen. 45/72 WM-Spiele stießen in
  # die 4h-Lücken → Positionen rutschten ins In-Play und wurden bis zur Auflösung
  # gehalten (NO_INPLAY_LOSS_SELL) → voller Verlust möglich. WIDERSPRUCH zur Regel
  # „kein Trade geht ins In-Play".
  # 16.06.2026: 0,30 (alle 30min). Jetzt auf GitHubs Cloud-Runner (kein Mac-Sleep mehr,
  # kein Single-Runner-Stau) → geplante Läufe feuern zuverlässig. GitHub kann hochfrequente
  # */15-Schedules unter Last trotzdem drosseln, darum 0,30 + Hard-Close auf 40min vor
  # Anpfiff (pre_match_close_hours=0.67) → bei 30min-Kadenz landet GARANTIERT ein Lauf im
  # Fenster [KO-40, KO-10], sicher pre-match. Fängt die Lineup-Steam (droppt 60-90min vor
  # KO) weiterhin. Anpfiffe 00-04 + 16-23 UTC, Vorlauf → 14:00-04:00.
  # (Mit Cloud-Runner könnte man später wieder */15 + 20min-Close testen.)
  # + 2 Tages-Läufe fürs Housekeeping (Profit-/Age-Trigger auf lang gehaltene Positionen).
  # 20.07.2026 WM-WINTERISIERUNG: WM beendet → WM-Poly-Management pausiert (kein Trading gegen totes
  # Turnier). MLS-Poly läuft unberührt in manage-mls-poly.yml weiter. Reaktivieren: einkommentieren.
  # schedule:
  #   - cron: '0,30 14-23 * * *'   # Abend-Anpfiffe (16-23 UTC) inkl. Vorlauf
  #   - cron: '0,30 0-5 * * *'     # Nacht-Anpfiffe (00-04 UTC) inkl. Vorlauf
  #   - cron: '0 6,10 * * *'       # Tages-Housekeeping (lang gehaltene Positionen)

  # Manuell auslösbar (z.B. direkt nach einer neuen Position)
  workflow_dispatch:
    inputs:
      reason:
        description: 'Grund für manuellen Run (optional)'
        required: false
        default: 'manual check'

permissions:
  contents: write

# K3 Fix 05.06.2026 — Concurrency-Gruppe verhindert doppelte Bets:
# Wenn der Cron-Run (auto_wm_poly_trigger) und der manuelle UI-Trigger
# (poly-bets.yml via repository_dispatch) gleichzeitig laufen, kann
# dieselbe Order doppelt platziert werden. Beide Workflows teilen sich
# jetzt die Gruppe "poly-trading" und warten aufeinander.
# cancel-in-progress: false — laufende Trades NIEMALS abbrechen,
# sonst entstehen orphan-Orders auf der CLOB die niemand getrackt hat.
concurrency:
  # AUDIT-Fix 08.06.2026: Geteilte Group mit fetch-wm-data wegen shared files:
  # wm_poly_prices.json, wm2026-poly-history.json, wm_results.json werden von
  # BEIDEN Workflows geschrieben. Bei zeitnahen Pushes konnte `git pull -X ours`
  # Commits überschreiben. Jetzt: serialisiert (nie parallel).
  # Cron-Versatz (04/08/12/16/20 vs 06/10/14/18/22 UTC) → in der Praxis warten
  # weniger als 2× pro Tag <5min auf Vorgänger.
  group: fetch-wm-data
  cancel-in-progress: false

jobs:
  monitor-positions:
    # 16.06.2026 (Lucas): zurück auf den Mac (self-hosted). WICHTIGE LEKTION:
    # Polymarket geoblockt JEDE Rechenzentrums-IP (GitHub-Cloud US UND Hetzner-EU-VPS →
    # beide 403 „Trading restricted in your region"). NUR Wohn-/Privat-IPs (Mac zuhause)
    # dürfen Orders platzieren. Datacenter-IPs sind generell gesperrt (VPN/Proxy-Schutz).
    # → Trading MUSS vom Heimnetz laufen. Mac am Strom + Sleep aus = residential + zuverlässig.
    # Label 'macOS' trifft NUR den Mac, NICHT den (noch laufenden) Linux-VPS (der würde
    # wieder geoblockt). VPS kann gekündigt werden — wird hier nicht mehr genutzt.
    runs-on: [self-hosted, macOS]
    # 28.08.2026: ohne timeout gilt GitHubs Default von 360 Minuten — ein haengender Lauf
    # besetzt dann einen der zwei Mac-Runner einen halben Tag und blockiert die Poly-
    # Manager von Liga und MLS gleich mit. betfair.yml steht seit jeher auf 8.
    timeout-minutes: 20

    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python + py-clob-client-v2 einrichten (Mac)
        run: |
          PYTHON=""
          for PY in /opt/homebrew/bin/python3.13 /opt/homebrew/bin/python3.12 /opt/homebrew/bin/python3.11 /usr/local/bin/python3.13 /usr/local/bin/python3.12 /usr/local/bin/python3.11; do
            if "$PY" --version &>/dev/null 2>&1; then PYTHON="$PY"; break; fi
          done
          if [ -z "$PYTHON" ]; then echo "❌ Kein Python >= 3.11 gefunden"; exit 1; fi
          echo "✅ $PYTHON ($($PYTHON --version))"
          echo "POLY_PYTHON=$PYTHON" >> $GITHUB_ENV
          $PYTHON -m pip install --break-system-packages requests --quiet
          $PYTHON -m pip uninstall -y py-clob-client py-clob-client-v2 2>/dev/null || true
          $PYTHON -m pip install --break-system-packages "git+https://github.com/Polymarket/py-clob-client-v2.git@main" 2>&1 | tail -3
          $PYTHON -c "from py_clob_client_v2.client import ClobClient; print('✅ py-clob-client-v2 ok')"

      # ── Phase 1 (16.06.2026): Pinnacle-Odds frisch holen VOR den Poly-Preisen ──
      # Grund: der Auto-Trader-Edge = Pinnacle-fair vs Live-Poly. fetch-wm-data holt
      # Pinnacle nur 5×/Tag (alle 4h) → bei 15min-Trading-Takt war die fair bis zu 4h
      # alt → Steam-Moves erst 4h spät gesehen, Poly längst konvergiert. Jetzt jeder
      # Trading-Zyklus auf frischer Pinnacle-fair. WICHTIG: wm2026-data.json wird hier
      # NICHT committet (das macht fetch-wm-data, owner) — Race vermieden; die frischen
      # Edges fliessen über fetch_wm_poly_prices in wm_poly_prices.json (committet).
      - name: 📈 Pinnacle-Odds frisch (Phase 1 Steam-Frische)
        run: ${{ env.POLY_PYTHON }} fetch_wm_odds.py
        continue-on-error: true
        env:
          ODDS_API_KEY:            ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      # ── Dann Poly-Preise frisch holen (Gamma API, kein Key) → fair/edge neu ──────
      - name: 💹 WM Polymarket Preise aktualisieren
        run: ${{ env.POLY_PYTHON }} fetch_wm_poly_prices.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      # ── Polymarket USDC Balance via CLOB API holen ───────────────────────────
      # K4 Fix 05.06.2026 — Balance MUSS vor Auto-Trigger gefetcht werden,
      # damit auto_wm_poly_trigger.py die aktuelle Bankroll kennt und nicht
      # mehr riskiert als verfügbar. Vorher: Balance lief NACH Trigger →
      # Trigger arbeitete mit veralteter Balance-Datei vom letzten Run.
      # Hinweis: Polymarket hält Gelder im CLOB-Vertrag (nicht on-chain im Wallet)
      # → POLY_PRIVATE_KEY nötig um CLOB API zu authentifizieren
      - name: 💰 Polymarket Balance fetchen
        run: ${{ env.POLY_PYTHON }} fetch_wm_poly_balance.py
        continue-on-error: true
        env:
          POLY_PRIVATE_KEY:    ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_FUNDER_ADDRESS: ${{ secrets.POLY_FUNDER_ADDRESS }}
          POLY_API_KEY:        ${{ secrets.POLY_API_KEY }}
          POLY_API_SECRET:     ${{ secrets.POLY_API_SECRET }}
          POLY_API_PASSPHRASE: ${{ secrets.POLY_API_PASSPHRASE }}

      # ── Auto-Trigger: erkennt Steam Lag + Edge Signale und kauft automatisch ─────
      # AUDIT-Fix 08.06.2026: TELEGRAM_CHAT_ID (public) entfernt — auto-trigger
      # nutzt es nicht. Auto-Bet-Alerts gehen IMMER an Trades-Channel (privat).
      - name: 🤖 Auto-Trigger WM Bets
        run: ${{ env.POLY_PYTHON }} auto_wm_poly_trigger.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:            ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID:   ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
          POLY_PRIVATE_KEY:          ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_FUNDER_ADDRESS:       ${{ secrets.POLY_FUNDER_ADDRESS }}
          POLY_API_KEY:              ${{ secrets.POLY_API_KEY }}
          POLY_API_SECRET:           ${{ secrets.POLY_API_SECRET }}
          POLY_API_PASSPHRASE:       ${{ secrets.POLY_API_PASSPHRASE }}
          AUTO_TRIGGER_ENABLED:      ${{ secrets.AUTO_TRIGGER_ENABLED || 'false' }}

      # ── Dann Positionen prüfen & Sell-Alerts senden ───────────────────────────
      - name: 📊 WM Poly Positionen prüfen + Auto-Sell
        run: ${{ env.POLY_PYTHON }} manage_wm_poly_positions.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:           ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TRADES_CHAT_ID:  ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
          POLY_PRIVATE_KEY:         ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_FUNDER_ADDRESS:      ${{ secrets.POLY_FUNDER_ADDRESS }}
          POLY_API_KEY:             ${{ secrets.POLY_API_KEY }}
          POLY_API_SECRET:          ${{ secrets.POLY_API_SECRET }}
          POLY_API_PASSPHRASE:      ${{ secrets.POLY_API_PASSPHRASE }}
          AUTO_SELL_ENABLED:        ${{ secrets.AUTO_SELL_ENABLED || 'false' }}

      # 19.07.2026 — Maker-Lebenszyklus (No-op solange maker_enabled=false).
      - name: 🅼 WM Maker-Orders verwalten (Default AUS)
        run: ${{ env.POLY_PYTHON }} manage_poly_maker_orders.py
        continue-on-error: true
        env:
          POLY_PRIVATE_KEY:    ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_FUNDER_ADDRESS: ${{ secrets.POLY_FUNDER_ADDRESS }}
          POLY_API_KEY:        ${{ secrets.POLY_API_KEY }}
          POLY_API_SECRET:     ${{ secrets.POLY_API_SECRET }}
          POLY_API_PASSPHRASE: ${{ secrets.POLY_API_PASSPHRASE }}

      # ── Bets gegen Ergebnisse resolven: P&L + CLV berechnen ──────────────────
      - name: 📈 WM Bets resolven (P&L + CLV)
        run: ${{ env.POLY_PYTHON }} resolve_wm_results.py
        continue-on-error: true

      # ── Lern-Ledger aktualisieren ───────────────────────────────────────────
      # FIX 12.06.2026: erfasst aufgelöste CARD-Picks (mit signals[] + WIN/LOSS)
      # aus wm2026-data.json in wm_signal_ledger.json (append-only, dedup). MUSS
      # vor update_signal_weights laufen — der Updater liest jetzt den Ledger,
      # nicht mehr wm_results.json (= Trade-P&L ohne Signale → war immer leer).
      - name: 🧾 Signal-Lern-Ledger aktualisieren
        run: ${{ env.POLY_PYTHON }} build_signal_ledger.py --write
        continue-on-error: true

      # ── Signal-Engine Lern-Update ───────────────────────────────────────────
      # Nach jedem resolved Pick: Bayesian-Update der Signal-Weights basierend
      # auf Win/Loss-Outcome aus dem Ledger. Schreibt signal_weights.json — wird
      # per State-File-Registry committet.
      - name: 🧠 Signal-Weights lernen
        run: ${{ env.POLY_PYTHON }} update_signal_weights.py
        continue-on-error: true

      # ── Lern-Ebene 2: Segment-Kalibrierung (20.06.2026) ─────────────────────
      # Liest den Ledger → prozess-justierte Performance je Segment → pick_calibration.json.
      # generate_wm_picks nudged daraus die Conviction gedeckelt (erst ab min_picks, WM 50).
      - name: 📐 Pick-Kalibrierung aktualisieren
        run: ${{ env.POLY_PYTHON }} compute_pick_calibration.py --write
        continue-on-error: true

      # ── Position-Health-Monitor: prüft offene Trades auf These-Erhalt ────────
      # Berechnet pro offener Position einen 4-Faktor-Health-Score (0-100):
      #   Edge-Persistenz · Pinnacle-Drift · CLV-Status · Time-Pressure
      # Sendet Telegram-Alert bei Score <60 (Warning) oder <40 (Critical).
      # Schreibt position_health.json für UI-Block im Polymarket-Trading-Tab.
      - name: 🩺 Position-Health-Check
        run: ${{ env.POLY_PYTHON }} monitor_open_positions.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      # ── Aktualisierte Positions-Datei + Preise zurückschreiben ────────────────
      - name: 💾 Status speichern
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "actions@github.com"
          # Refactor 2026-06-06: State-Files aus state_files_registry.json
          git add $(python32>/dev/null || true
          git add state_files_registry.py2>/dev/null || true
          git add --bash-list2>/dev/null || true
          git add manage_wm_poly)2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Änderungen — kein Commit."
          else
            TIMESTAMP=$(date +'%d.%m.%Y %H:%M')
            git commit -m "💹 WM Poly Update ${TIMESTAMP} UTC"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            # ── Robust pull+push mit Retry (siehe fetch-wm-data.yml für Doku) ──
            PUSHED=0
            for attempt in 1 2 3 4 5; do
              git pull origin main --no-rebase -X ours --autostash 2>&1 || true
              CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
              if [ -n "$CONFLICTS" ]; then
                echo "⚠️ Auto-resolve Konflikte (ours) — Versuch $attempt:"
                echo "$CONFLICTS" | while read f; do
                  git checkout --ours -- "$f"
                  git add "$f"
                done
                git diff --staged --quiet || git commit -m "🔧 auto-resolve merge conflicts"
              fi
              if git push 2>&1; then
                echo "✅ Push erfolgreich nach Versuch $attempt"
                PUSHED=1
                break
              fi
              echo "⚠️ Push $attempt fehlgeschlagen — retry in $((attempt * 3))s..."
              sleep $((attempt * 3))
            done
            if [ "$PUSHED" = "0" ]; then
              echo "❌ Push nach 5 Versuchen fehlgeschlagen"
              exit 1
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
