name: 🧬 Squad-Daten aktualisieren

on:
  # Automatisch: täglich um 03:00 Uhr Vienna-Zeit (01:00 UTC)
  schedule:
    - cron: '0 1 * * *'

  # Manuell: jederzeit per Knopfdruck auf GitHub ausführbar
  workflow_dispatch:

# Berechtigung zum Zurückschreiben ins Repo
permissions:
  contents: write

jobs:
  fetch-squads:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. Repository auschecken
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      # 2. Python einrichten
      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Python-Abhängigkeiten installieren
      - name: 📦 Dependencies installieren
        run: pip install -r requirements.txt

      # 4. Squad-Daten holen (API-Football /players → squad_cache.json)
      #    Fetcht Starter + Importance-Scores für alle Stake-Teams.
      #    Läuft täglich damit neue Stammspieler zeitnah erkannt werden.
      - name: 🧬 Squad-Daten fetchen
        run: python fetch_squads.py
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      # 5. xG-Daten holen (API-Football /teams/statistics → xg_cache.json)
      #    Fetcht Heim/Auswärts-spezifische Tore-Schnitte pro Team.
      #    Basis für das einheitliche Poisson-FV-Modell in pick-engine.js.
      - name: 📐 xG-Statistiken fetchen
        run: python fetch_xg.py
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      # 6. Caches ins Repo committen
      - name: 💾 Caches speichern & pushen
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "actions@github.com"
          git add squad_cache.json
          git add xg_cache.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen — kein Commit nötig."
          else
            git commit -m "🧬 Squad+xG Cache Update $(date +'%d.%m.%Y') UTC"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            # Robust pull+push mit Retry — --autostash schützt vor Race Conditions
            PUSHED=0
            for attempt in 1 2 3 4 5; do
              git pull origin main --no-rebase -X ours --autostash 2>&1 || true
              CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
              if [ -n "$CONFLICTS" ]; then
                echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
                git diff --staged --quiet || git commit -m "🔧 auto-resolve merge conflicts"
              fi
              if git push 2>&1; then
                echo "✅ Push erfolgreich nach Versuch $attempt"
                PUSHED=1
                break
              fi
              echo "⚠️ Push $attempt fehlgeschlagen — retry in $((attempt * 3))s..."
              sleep $((attempt * 3))
            done
            if [ "$PUSHED" = "0" ]; then echo "❌ Push fehlgeschlagen"; exit 1; fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
