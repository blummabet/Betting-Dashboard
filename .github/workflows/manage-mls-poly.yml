name: 💹 MLS Poly Positionen überwachen

# 12.07.2026 (Lucas: „MLS ist auf Polymarket da", Woche 25, Spiele ab 17.07.).
# Pendant zu manage-wm-poly.yml, aber für den MLS-Datensatz (COCOBET_DATASET=mls) →
# arbeitet ausschließlich auf mls_poly_prices.json / mls_auto_bets_placed.json /
# mls_poly_balance.json / mls_position_health.json. WM bleibt vollständig unberührt.
#
# ⚠️ TRADING IST STANDARDMÄSSIG AUS. Bewusst EIGENE Secrets (MLS_AUTO_TRIGGER_ENABLED /
# MLS_AUTO_SELL_ENABLED), NICHT die WM-Schalter — sonst hätte ein aktiver WM-Trader sofort
# auch MLS mitgehandelt. Solange die MLS-Secrets nicht existieren, ist der Default 'false':
# der Auto-Trader analysiert nur (Dry-Run), platziert und verkauft NICHTS.
# Lucas flippt MLS live selbst, wenn er die Namens-/Preis-Zuordnung am 1. Lauf geprüft hat.
#
# Läuft self-hosted auf dem Mac: Polymarket geoblockt JEDE Rechenzentrums-IP (GitHub-Cloud
# US UND EU-VPS → 403). Nur Wohn-/Privat-IPs dürfen Orders platzieren. (Die reinen DATEN-
# Fetcher — Preise/Smart-Money — laufen dagegen in update-mls.yml auf ubuntu, das geht.)
on:
  schedule:
    - cron: '0,30 22,23 * * *'   # Vorlauf US-Abend-Anpfiffe (UTC)
    - cron: '0,30 0-5 * * *'     # MLS-Anpfiffe US-Abend = UTC-Nacht
    - cron: '0 12 * * *'         # Tages-Housekeeping (lang gehaltene Positionen)
  workflow_dispatch:
    inputs:
      reason:
        description: 'Grund für manuellen Run (optional)'
        required: false
        default: 'manual check'

permissions:
  contents: write

# Teilt die Gruppe mit update-mls / fetch-mls-odds-dense — alle schreiben mls-data.json +
# mls_poly_prices.json → serialisieren, sonst überschreiben sich die Pushes.
concurrency:
  # 28.08.2026: eigene Spur. Dieser Workflow laeuft auf dem Mac, update-mls und
  # fetch-mls-odds-dense auf ubuntu — keine geteilten Dateien, nur der Git-Push, und den fangen
  # die Rebase-Retry-Schleifen ab. In der gemeinsamen Spur wurde jeder wartende Lauf gecancelt.
  group: manage-mls-poly
  cancel-in-progress: false

jobs:
  monitor-mls-positions:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20      # 28.08.2026: vorher GitHubs Default 360 — ein haengender Lauf konnte
                             # einen der zwei Mac-Runner sechs Stunden besetzen.
    env:
      COCOBET_DATASET: mls
      COCOBET_PROFILE: mls_default

    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4

      # 28.08.2026 — identisch zu manage-liga-poly.yml, gleiche Krankheit, gleicher Verlauf:
      # committete Laeufe 25.08. 10 → 26.08. 6 → 27.08. 3 → 28.08. 2. Der alte Schritt baute
      # py-clob-client-v2 bei jedem Lauf neu aus GitHub, war der einzige ohne continue-on-error
      # vor dem Commit und konnte ohne timeout einen der zwei Mac-Runner blockieren. Der
      # Preis-Fetch braucht den Client gar nicht (nur urllib) — Daten-Pfad und Trading-Pfad
      # gehoeren deshalb getrennt.
      - name: 🐍 Python finden (Mac, kein setup-python auf self-hosted)
        run: |
          PYTHON=""
          for PY in /opt/homebrew/bin/python3.13 /opt/homebrew/bin/python3.12 /opt/homebrew/bin/python3.11 /usr/local/bin/python3.13 /usr/local/bin/python3.12 /usr/local/bin/python3.11; do
            if "$PY" --version &>/dev/null 2>&1; then PYTHON="$PY"; break; fi
          done
          if [ -z "$PYTHON" ]; then echo "❌ Kein Python >= 3.11 gefunden"; exit 1; fi
          echo "✅ $PYTHON ($($PYTHON --version))"
          echo "POLY_PYTHON=$PYTHON" >> $GITHUB_ENV
          $PYTHON -m pip install --break-system-packages requests --quiet

      - name: 🔌 CLOB-Client nur bei Bedarf nachziehen (Trading-Pfad)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          PY="${{ env.POLY_PYTHON }}"
          if $PY -c "from py_clob_client_v2.client import ClobClient" 2>/dev/null; then
            echo "✅ py-clob-client-v2 bereits da — kein Neubau."
            exit 0
          fi
          echo "↻ py-clob-client-v2 fehlt oder ist kaputt — einmalig neu bauen."
          $PY -m pip uninstall -y py-clob-client py-clob-client-v2 2>/dev/null || true
          $PY -m pip install --break-system-packages "git+https://github.com/Polymarket/py-clob-client-v2.git@main" 2>&1 | tail -3
          $PY -c "from py_clob_client_v2.client import ClobClient; print('✅ py-clob-client-v2 ok')"

      # Frische Pinnacle-Fair VOR den Poly-Preisen: der Trade-Edge = Pinnacle-fair vs Live-Poly.
      - name: 📈 MLS Pinnacle-Odds frisch (Steam-Frische)
        run: ${{ env.POLY_PYTHON }} fetch_liga_odds.py
        continue-on-error: true
        env:
          ODDS_API_KEY:            ${{ secrets.ODDS_API_KEY }}
          FETCH_EXTRA_MARKETS:     '1'   # 20.08.2026 (Lucas): Pinnacle-BTTS im selben Trader-Lauf holen
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      - name: 💹 MLS Polymarket Preise aktualisieren
        run: ${{ env.POLY_PYTHON }} fetch_wm_poly_prices.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      - name: 💰 MLS Polymarket Balance fetchen
        run: ${{ env.POLY_PYTHON }} fetch_wm_poly_balance.py
        continue-on-error: true
        env:
          POLY_PRIVATE_KEY:    ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_FUNDER_ADDRESS: ${{ secrets.POLY_FUNDER_ADDRESS }}
          POLY_API_KEY:        ${{ secrets.POLY_API_KEY }}
          POLY_API_SECRET:     ${{ secrets.POLY_API_SECRET }}
          POLY_API_PASSPHRASE: ${{ secrets.POLY_API_PASSPHRASE }}

      # ⚠️ AUTO-TRADER — MLS-EIGENER Schalter, Default 'false' (Dry-Run: analysiert, kauft NICHT).
      - name: 🤖 Auto-Trigger MLS Bets (Default AUS)
        run: ${{ env.POLY_PYTHON }} auto_wm_poly_trigger.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:            ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID:   ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
          POLY_PRIVATE_KEY:          ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_FUNDER_ADDRESS:       ${{ secrets.POLY_FUNDER_ADDRESS }}
          POLY_API_KEY:              ${{ secrets.POLY_API_KEY }}
          POLY_API_SECRET:           ${{ secrets.POLY_API_SECRET }}
          POLY_API_PASSPHRASE:       ${{ secrets.POLY_API_PASSPHRASE }}
          AUTO_TRIGGER_ENABLED:      ${{ secrets.MLS_AUTO_TRIGGER_ENABLED || 'false' }}

      # ⚠️ AUTO-SELL — MLS-eigener Schalter, Default 'false' (nur Alerts, kein Verkauf).
      - name: 📊 MLS Poly Positionen prüfen + Auto-Sell (Default AUS)
        run: ${{ env.POLY_PYTHON }} manage_wm_poly_positions.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:           ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TRADES_CHAT_ID:  ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
          POLY_PRIVATE_KEY:         ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_FUNDER_ADDRESS:      ${{ secrets.POLY_FUNDER_ADDRESS }}
          POLY_API_KEY:             ${{ secrets.POLY_API_KEY }}
          POLY_API_SECRET:          ${{ secrets.POLY_API_SECRET }}
          POLY_API_PASSPHRASE:      ${{ secrets.POLY_API_PASSPHRASE }}
          AUTO_SELL_ENABLED:        ${{ secrets.MLS_AUTO_SELL_ENABLED || 'true' }}   # 22.08.2026 (Lucas: „will Auto-Sell, damit ich nichts selbst machen muss"). Aus: Secret MLS_AUTO_SELL_ENABLED=false setzen.

      # 31.07.2026 (Lucas): der globale Poly-Scan (Money-Broad · Cross-Sport · Whale-Watch · E-Sport)
      # läuft jetzt entkoppelt + HÄUFIG in poly-global-scan.yml (alle 30 Min, ganztags) — sonst wurden
      # tagsüber angepfiffene Fußball-/E-Sport-Märkte nie im 3h-Fenster erfasst. Hier NICHT mehr, sonst
      # doppelter Scan/Alert. Dieser Workflow bleibt rein MLS-Trading.

      # 19.07.2026 — Maker-Lebenszyklus: ruhende Limit-Orders, die nicht füllen, kurz vor Anpfiff
      # stornieren + als Taker crossen. No-op solange maker_enabled=false (Default).
      - name: 🅼 MLS Maker-Orders verwalten (Default AUS)
        run: ${{ env.POLY_PYTHON }} manage_poly_maker_orders.py
        continue-on-error: true
        env:
          COCOBET_DATASET:     mls
          COCOBET_PROFILE:     mls_default
          POLY_PRIVATE_KEY:    ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_FUNDER_ADDRESS: ${{ secrets.POLY_FUNDER_ADDRESS }}
          POLY_API_KEY:        ${{ secrets.POLY_API_KEY }}
          POLY_API_SECRET:     ${{ secrets.POLY_API_SECRET }}
          POLY_API_PASSPHRASE: ${{ secrets.POLY_API_PASSPHRASE }}

      - name: 📈 MLS Bets resolven (P&L + CLV)
        run: ${{ env.POLY_PYTHON }} resolve_wm_results.py
        continue-on-error: true

      - name: 🩺 MLS Position-Health-Check
        run: ${{ env.POLY_PYTHON }} monitor_open_positions.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      # 12.07.2026: Dieser Workflow committet mls-data.json → braucht denselben harten Wipe-Stopp
      # wie update-mls. Ohne ihn könnte ein leer-geschriebener Datensatz gepusht werden.
      # KEIN `|| true`: ein Wipe macht den Job ROT statt ins Live-Frontend zu wandern.
      - name: 🛡️ Wipe-Check (kein leerer Datensatz darf committet werden)
        run: ${{ env.POLY_PYTHON }} check_not_wiped.py

      - name: 💾 Status speichern
        run: |
          git config user.name "CocoBet Bot"
          git config user.email "bot@cocobet.local"
          # 25.07.2026 (Lucas: „falsche balance"): FATALER Bug gefunden — `git add a b c` kippt
          # KOMPLETT (fatal pathspec, exit 128, staged NICHTS), sobald EINE Datei fehlt; mit
          # `2>/dev/null || true` blieb das still. Deshalb wurden mls_poly_balance.json UND
          # mls_results.json NIE committet — sie standen je neben einer Datei, die ohne Bets/
          # Positionen gar nicht existiert (mls_auto_bets_placed.json bzw. mls_pick_calibration.json).
          # Fix: nur EXISTIERENDE Dateien einzeln adden — eine fehlende reißt nichts mehr mit.
          for f in \
            mls_poly_prices.json mls_poly_balance.json mls_auto_bets_placed.json \
            mls_poly_positions.json mls_position_health.json mls_position_health_alerts.json \
            mls_poly_resting_orders.json \
            poly_cross_sport.json poly_cross_sport_history.json \
            poly_money_broad.json poly_money_broad_close.json poly_money_broad_history.json poly_wallet_track.json \
            poly_whale_seen.json poly_whale_public_seen.json \
            esports_poly_prices.json esports_poly_wallets.json esports_poly_smartmoney.json esports_poly_coherence.json esports_poly_status.json \
            mls-poly-history.json mls_book_health.json mls_kill_switch.json \
            mls-data.json mls-odds-history.json \
            mls_results.json mls_pick_calibration.json mls_poly_slugs.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "Keine Änderungen — kein Commit."; exit 0
          fi
          git commit -m "💹 MLS Poly Update $(date -u +'%d.%m.%Y %H:%M') UTC"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            bash scripts/ci_pull.sh main || true   # 03.09.2026: raeumt untrackte Kollisionen weg (s. Skript)
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
            if [ -n "$CONFLICTS" ]; then
              echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
              git diff --staged --quiet || git commit -m "🔧 auto-resolve merge conflicts"
            fi
            if git push 2>&1; then echo "✅ Push nach Versuch $attempt"; exit 0; fi
            echo "⚠️ Push $attempt fehlgeschlagen — retry…"; sleep $((attempt * 3))
          done
          echo "❌ Push fehlgeschlagen"; exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
