name: 📊 Track-Record-Card (Daily Telegram)

on:
  # 1× täglich 19:00 UTC = 21:00 Wien (nach Abendspielen)
  schedule:
    - cron: '0 19 * * *'

  # Manuell auslösbar via "Run workflow" Button — auch ohne Trigger-Schwellen (FORCE)
  workflow_dispatch:
    inputs:
      force:
        description: 'Trigger-Schwellen ignorieren (immer senden)'
        required: false
        default: 'false'
        type: boolean

# K7 Fix 05.06.2026 — write-Permission nötig für State-Persistenz:
# Ohne contents:write konnte track_record_state.json nie committet werden →
# Trigger-Schwellen (MIN_RESOLVED/MIN_NEW) griffen nie, weil State leer war
# → tägliche Card wurde unbegrenzt gepostet, auch wenn nichts Neues vorlag.
permissions:
  contents: write

concurrency:
  group: track-record-card
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repo
        uses: actions/checkout@v4

      - name: 🐍 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: 📊 Track-Record-Card generieren + posten
        run: python generate_track_record_card.py
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
          FORCE:                   ${{ github.event.inputs.force || 'false' }}
          TRACK_RECORD_MIN_RESOLVED: "5"
          TRACK_RECORD_MIN_NEW:      "3"

      # K7 Fix 05.06.2026 — State committen, sonst werden Trigger-Schwellen ignoriert
      - name: 💾 Track-Record-State persistieren
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "actions@github.com"
          # Refactor 2026-06-06: State-Files aus state_files_registry.json
          git add $(python32>/dev/null || true
          git add state_files_registry.py2>/dev/null || true
          git add --bash-list2>/dev/null || true
          git add track_record_card)2>/dev/null || true
          if true; then
            if ! git diff --staged --quiet; then
              TIMESTAMP=$(date +'%d.%m.%Y %H:%M')
              git commit -m "📊 Track-Record-State ${TIMESTAMP} UTC [skip ci]"
              git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
              # Pull+Push mit Retry (parallele Workflows tolerieren)
              for attempt in 1 2 3; do
                git pull origin main --no-rebase -X ours --autostash 2>&1 || true
                if git push 2>&1; then
                  echo "✅ State-Commit erfolgreich (Versuch $attempt)"
                  break
                fi
                sleep $((attempt * 3))
              done
            else
              echo "Keine State-Änderung — kein Commit."
            fi
          else
            echo "ℹ️  track_record_state.json existiert nicht (Card wurde nicht gesendet)"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
