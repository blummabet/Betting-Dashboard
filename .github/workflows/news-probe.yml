name: 📰 Liga News-Probe (Diagnose)

# 26.06.2026 (Lucas): einmalig abklopfen, was API-Football „News" für die 5 Ligen liefert.
# Kein Pipeline-Teil — schreibt liga_news_probe.json zum Ansehen. Manuell auslösen.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 📰 News-Endpoint abklopfen
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python fetch_liga_news_probe.py
      - name: 💾 Sample committen
        run: |
          git config user.name  "CocoBet Bot"
          git config user.email "bot@cocobet.local"
          git add liga_news_probe.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "news-probe: API-Football /news Sample [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase origin main || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
