name: 🐋 Poly Global-Scan (alle Sportarten, häufig)

# 31.07.2026 (Lucas): der globale Polymarket-Scan (Money-Broad, Cross-Sport, Whale-Watch) war an den
# MLS-Handelszyklus gekoppelt (manage-mls-poly: nur 22–06 UTC + Mittag). Der Scan erfasst aber nur
# Märkte im 3h-Anpfiff-Fenster — d.h. jedes Fußball-/E-Sport-Spiel, das TAGSÜBER angepfiffen wird,
# war nie im Fenster eines Laufs → nie erfasst (Poly liefert 800 Soccer-Events, wir sahen 2).
# Fix: eigener, HÄUFIGER Workflow rund um die Uhr, entkoppelt vom MLS-Trading. Read-only Tracking.
# Läuft self-hosted auf dem Mac (Polymarket geoblockt Rechenzentrums-IPs → nur Wohn-IP).
on:
  schedule:
    # 28.08.2026 („Last senken") von 2x auf 1x pro Stunde gesenkt — und am 29.08. WIEDER
    # ZURUECKGEDREHT. Die Kuerzung war die falsche Richtung: dieser Workflow ist nicht zu gierig,
    # er ist ausgehungert. Gemessene Laeufe pro Tag: 23.08. = 30, 24.08. = 26, 25.08. = 27,
    # 26.08. = 18, dann 27.08. = 2, 28.08. = 2, 29.08. = 1. Er beliefert Whales, Wallets,
    # Cross-Sport und die Shortlist („Heute spielenswert") — deren Kandidaten-Datei hoerte am
    # 26.08. 22:34 auf zu wachsen, im Gleichschritt mit dem Einbruch. Die Kapazitaets-Begruendung
    # von gestern gilt nicht mehr: der Mac hat seit dem 28.08. vier Runner statt zwei.
    - cron: '15,45 * * * *'    # alle 30 Min, versetzt zu den :00/:30-Laeufen
  workflow_dispatch:

permissions:
  contents: write
  actions: read          # run_health.py liest die Steps DIESES Laufs

concurrency:
  group: poly-global-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 25   # 06.08.2026 (Lucas): OHNE Timeout blockiert EIN haengender Lauf via concurrency ALLE folgenden Scans (war „eingefroren seit 04:30"). Timeout < 30-Min-Takt -> selbstheilend.
    steps:
      - name: 📥 Repo auschecken
        uses: actions/checkout@v4
        with:
          clean: false   # 02.08.2026: node_modules NICHT wegräumen — sonst muss jsdom jeden Lauf neu
                         # installiert werden (npm ci löscht node_modules zuerst); ein Netz-Aussetzer
                         # auf der Wohn-IP ließ dann den Shortlist-Emitter still ausfallen (poly_status 🔴).

      - name: 🐍 Python einrichten (Mac)
        run: |
          PYTHON=""
          for PY in /opt/homebrew/bin/python3.13 /opt/homebrew/bin/python3.12 /opt/homebrew/bin/python3.11 /usr/local/bin/python3.13 /usr/local/bin/python3.12 /usr/local/bin/python3.11 /usr/bin/python3; do
            if "$PY" --version >/dev/null 2>&1; then PYTHON="$PY"; break; fi
          done
          if [ -z "$PYTHON" ]; then echo "❌ Kein Python gefunden"; exit 1; fi
          echo "✅ $PYTHON ($($PYTHON --version))"
          echo "POLY_PYTHON=$PYTHON" >> $GITHUB_ENV
          $PYTHON -m pip install --break-system-packages requests --quiet 2>/dev/null || true

      - name: 🟢 Node bereitstellen (Shortlist-Emitter) — haenge-sicher
        shell: bash -l {0}   # Login-Shell sourced das Profil (nvm/Homebrew-PATH) -> `command -v node` findet node auch bei nvm.
        # 06.08.2026 (Lucas): node absolut aufloesen (Runner hat /opt/homebrew/bin nicht auf PATH, wie
        # bei Python) und als NODE_BIN exportieren (der Emitter nutzt es). KEIN npm-install im Scan —
        # das haengt auf der Wohn-IP und blockte via concurrency alle Laeufe. jsdom ist ueber clean:false
        # persistiert; fehlt es mal, meldet der Emitter das (poly_status), Install macht man einmalig manuell.
        run: |
          NVM_NODE="$(ls -t "$HOME"/.nvm/versions/node/*/bin/node 2>/dev/null | head -1)"
          NODE=""
          for N in "$(command -v node 2>/dev/null)" "$NVM_NODE" /opt/homebrew/bin/node /usr/local/bin/node /usr/bin/node; do
            [ -n "$N" ] && "$N" --version >/dev/null 2>&1 && { NODE="$N"; break; }
          done
          if [ -z "$NODE" ]; then echo "⚠️ Kein node gefunden — Emitter setzt aus."; exit 0; fi
          echo "NODE_BIN=$NODE" >> $GITHUB_ENV
          echo "✅ node: $NODE ($($NODE --version))"
          if "$NODE" -e "require.resolve('jsdom')" 2>/dev/null; then
            echo "✅ jsdom vorhanden"
          else
            echo "ℹ️ jsdom fehlt — installiere (Step-Timeout 5 Min + Job-Timeout schuetzen vor Haenger)…"
            "$(dirname "$NODE")/npm" install jsdom@^24 --no-audit --no-fund 2>/dev/null || echo "⚠️ jsdom-Install fehlgeschlagen — Emitter setzt aus (poly_status meldet es)."
            "$NODE" -e "require.resolve('jsdom')" 2>/dev/null && echo "✅ jsdom jetzt da" || true
          fi
        continue-on-error: true
        timeout-minutes: 5

      - name: 🎯 Cross-Sport Poly-Radar (Poly vs Pinnacle, read-only)
        run: ${{ env.POLY_PYTHON }} poly_cross_sport.py
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: 🌐 Poly-Geld breit (ALLE Ligen/Sportarten)
        run: ${{ env.POLY_PYTHON }} poly_money_broad.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      # 29.08.2026 (Lucas: „mach den Preispfad") — direkt NACH dem Sweep, damit der Punkt den
      # Preis dieses Laufs traegt. Kostet keine einzige zusaetzliche API-Anfrage: die Preise
      # stehen schon in poly_money_upcoming.json / _close.json, sie wurden bisher nur bei jedem
      # Lauf ueberschrieben statt fortgeschrieben.
      - name: 📉 Preispfad fortschreiben (gratis — nur Preise, keine Holder-Calls)
        run: ${{ env.POLY_PYTHON }} poly_price_path.py
        continue-on-error: true

      - name: 📈 Shortlist Paper-Track (Heute-wetten Track-Record, read-only)
        run: ${{ env.POLY_PYTHON }} poly_shortlist_track.py
        continue-on-error: true

      - name: 🔥 Heute-spielenswert → Trades-Channel (Top-Plays der Shortlist)
        run: ${{ env.POLY_PYTHON }} push_shortlist_trades.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      # 05.09.2026 (Lucas: „250.000 ist fuer mich ein Vermoegen, fuer den ein normaler Bet") —
      # MUSS vor dem Whale-Watch laufen: der baut daraus die Zeile „Normalgroesse fuer dieses
      # Konto". Faellt der Schritt aus, fehlt die Zeile, der Push geht trotzdem raus.
      - name: 📐 Wallet-Norm (was ist fuer DIESES Konto ein normaler Einsatz)
        run: ${{ env.POLY_PYTHON }} poly_wallet_norm.py
        continue-on-error: true

      - name: 🐋 Poly Whale-Watch (Trades-Channel + öffentlicher Whale-Push)
        run: ${{ env.POLY_PYTHON }} poly_whale_watch.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}
          TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}

      # 02.09.2026 (Lucas): „Schaffst du die Polymarket pushes auch auszuwerten?" — direkt NACH
      # dem Whale-Watch, damit ein soeben gesendeter Push im selben Lauf im Ledger landet und
      # faellige Pushs gegen den Slug-Sieger abgerechnet werden.
      - name: 🐋 Public-Whale-Pushs abrechnen (Slug → Trefferquote/ROI/CLV)
        run: ${{ env.POLY_PYTHON }} poly_public_eval.py
        continue-on-error: true

      - name: ⚖️ Cross-Sport-Edge-Alert (Poly vs Pinnacle, konvergierend)
        run: ${{ env.POLY_PYTHON }} poly_cross_sport_watch.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      - name: 🎮 E-Sport Poly-Daten (eigener Wallets-Datensatz)
        run: ${{ env.POLY_PYTHON }} fetch_poly_esports.py
        continue-on-error: true

      # 24.08.2026 (Lucas): Wetten, die direkt aus dem „Heute"-Tab ausgelöst wurden, haben kein
      # Fixture — resolve_wm_results sieht sie nie. Hier über den Poly-Slug abrechnen (P&L + CLV),
      # VOR den Integritäts-Checks, damit der Guard den frischen Stand prüft.
      - name: 🎯 Direkt-Wetten abrechnen (Slug → P&L/CLV)
        run: ${{ env.POLY_PYTHON }} poly_direct_bets.py
        continue-on-error: true

      - name: 🛡️ Poly-Daten-Integrität (Ausgabe-Checks → poly_status.json)
        run: ${{ env.POLY_PYTHON }} poly_data_integrity.py
        continue-on-error: true

      # 29.08.2026 — dieser Workflow ist der letzte Problemfall: geplant stuendlich, tatsaechlich
      # 3 Laeufe in 28 Stunden (00:28, 20:53, 03:11). Er beliefert Whales, Wallets, Cross-Sport
      # und den Integritaets-Report — also genau die Kacheln, die Lucas dauernd als „vor 8 Std"
      # sieht. Elf seiner zwoelf Arbeitsschritte stehen auf continue-on-error; ob die Laeufe
      # scheitern oder gar nicht erst starten, war bisher nicht unterscheidbar. Ab jetzt schon.
      - name: 🩺 Lauf-Gesundheit (verschluckte Fehler sichtbar machen)
        if: always()
        continue-on-error: true
        run: ${{ env.POLY_PYTHON || 'python3' }} run_health.py --slug poly-global
        env:
          GITHUB_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TRADES_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_CHAT_ID }}

      - name: 💾 Poly-Global-Dateien committen
        run: |
          git config user.name "CocoBet Bot"
          git config user.email "bot@cocobet.local"
          for f in \
            poly_money_broad.json poly_money_broad_close.json poly_money_broad_history.json poly_money_upcoming.json poly_wallet_track.json \
            poly_price_path.json \
            poly_resolutions.json poly_shortlist_track.json poly_status.json poly_football_tags.json \
            poly_direct_bets.json poly_whale_follow_track.json \
            poly_whale_public_ledger.json poly_public_record.json \
            poly_cross_sport.json poly_cross_sport_history.json poly_cross_sport_seen.json \
            poly_whale_seen.json poly_whale_public_seen.json \
            poly_wallet_norm.json poly_wallet_norm_state.json \
            shortlist_push_seen.json \
            esports_poly_prices.json esports_poly_wallets.json esports_poly_smartmoney.json esports_poly_coherence.json esports_poly_status.json \
            health/poly-global.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "Keine Änderungen — kein Commit."; exit 0
          fi
          git commit -m "🐋 Poly Global-Scan $(date -u +'%d.%m.%Y %H:%M') UTC"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --local credential.helper "" 2>/dev/null || true   # headless-Runner: macOS-Keychain gesperrt (-25308) -> Helper aus, Auth laeuft ueber Token-in-URL
          for attempt in 1 2 3 4 5; do
            bash scripts/ci_pull.sh main || true   # 03.09.2026: raeumt untrackte Kollisionen weg (s. Skript)
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
            if [ -n "$CONFLICTS" ]; then
              echo "$CONFLICTS" | while read f; do git checkout --ours -- "$f"; git add "$f"; done
              git diff --staged --quiet || git commit -m "🔧 auto-resolve merge conflicts"
            fi
            if git push 2>&1; then echo "✅ Push nach Versuch $attempt"; exit 0; fi
            echo "⚠️ Push $attempt fehlgeschlagen — retry…"; sleep $((attempt * 3))
          done
          echo "❌ Push fehlgeschlagen"; exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
