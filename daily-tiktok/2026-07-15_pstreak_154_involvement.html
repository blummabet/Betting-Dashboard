<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0e18; display:flex; align-items:center; justify-content:center; min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
.card { width:360px; height:640px; position:relative; overflow:hidden; padding:30px 26px;
  background:
    radial-gradient(circle at 50% 30%, rgba(240,136,62,0.12) 0%, transparent 46%),
    linear-gradient(180deg,#0a0e18 0%,#080d18 100%); }
.grid { position:absolute; inset:0;
  background-image:linear-gradient(rgba(255,255,255,0.014) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.014) 1px,transparent 1px);
  background-size:24px 24px; }
.in { position:relative; }
.top { display:flex; align-items:center; justify-content:space-between; }
.eyebrow { font-size:10px; font-weight:800; letter-spacing:2px; color:#f0883e; }
.badge { font-size:9px; font-weight:900; letter-spacing:1px; background:#f5c518; color:#000;
  border-radius:5px; padding:3px 7px; }
.crestwrap { display:flex; flex-direction:column; align-items:center; margin-top:30px; }
.cb { width:92px; height:92px; border-radius:50%; background:rgba(240,136,62,.10); border:2px solid #f0883e;
  display:flex; align-items:center; justify-content:center; overflow:hidden; }
.team { font-size:23px; font-weight:800; color:#f2f5ff; margin-top:13px; text-align:center; }
.league { font-size:12px; color:#76819c; margin-top:3px; }
.numwrap { text-align:center; margin-top:22px; }
.num { font-size:80px; font-weight:900; color:#f0883e; line-height:1; }
.num span { font-size:36px; }
.mkt { font-size:16px; font-weight:600; color:#f2f5ff; margin-top:4px; }
.dots { margin-top:15px; font-size:15px; letter-spacing:5px; }
.hook { text-align:center; margin-top:24px; font-size:18px; font-weight:800; color:#f2f5ff; }
.brand { position:absolute; bottom:20px; left:0; right:0; text-align:center; font-size:10px;
  font-weight:700; letter-spacing:4px; color:rgba(255,255,255,.22); text-transform:uppercase; }
</style></head><body>
<div class="card"><div class="grid"></div><div class="in">
  <div class="top"><div class="eyebrow">🔥 IN FORM</div><div class="badge">COCOBET</div></div>
  <div class="crestwrap"><div class="cb"><img src="https://media.api-sports.io/football/players/154.png" style="width:84px;height:84px;border-radius:50%;object-fit:cover;" alt=""></div>
    <div class="team">Lionel Messi</div><div class="league">🇦🇷 Argentinien</div></div>
  <div class="numwrap"><div class="num">8<span>×</span></div>
    <div class="mkt">mit Torbeteiligung in Folge</div>
    <div class="dots"><span style="color:#f0883e">●</span><span style="color:#f0883e">●</span><span style="color:#f0883e">●</span><span style="color:#f0883e">●</span><span style="color:#f0883e">●</span><span style="color:#f0883e">●</span><span style="color:#f0883e">●</span><span style="color:#f0883e">●</span><span style="color:rgba(255,255,255,.16)">●</span></div></div>
  <div style="margin-top:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:11px 14px;"><div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:11px;color:#76819c;">Nächster Test</span><span style="font-size:13px;font-weight:700;color:#f2f5ff;">England · 15.07.</span></div></div>
  <div class="hook">Hält die Serie gegen England?</div>
</div><div class="brand">cocobet</div></div>
</body></html>
