<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Hook</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a0e18;
  display:flex; align-items:center; justify-content:center;
  min-height:100vh;
  font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.card {
  width:360px; height:640px;
  background:
    radial-gradient(circle at 50% 38%, rgba(245,197,24,0.10) 0%, transparent 45%),
    linear-gradient(180deg, #0a0e18 0%, #080d18 100%);
  border-radius:24px;
  padding:34px 28px 28px;
  position:relative; overflow:hidden;
  display:flex; flex-direction:column;
  border:1px solid rgba(255,255,255,0.04);
  background-image:
    radial-gradient(circle at 50% 38%, rgba(245,197,24,0.10) 0%, transparent 45%),
    linear-gradient(rgba(255,255,255,0.014) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: auto, 24px 24px, 24px 24px;
}

.logo {
  display:flex; justify-content:center; margin-bottom:24px;
}
.logo-circle {
  width:54px; height:54px; border-radius:50%;
  background:#f5c518;
  display:flex; align-items:center; justify-content:center;
  font-size:9px; font-weight:900; color:#000;
  letter-spacing:1px;
  box-shadow: 0 0 24px rgba(245,197,24,0.25);
}

.badge {
  display:flex; justify-content:center; margin-bottom:30px;
}
.badge-inner {
  font-size:11px; font-weight:700; letter-spacing:2px;
  color:#f5c518;
  background:rgba(245,197,24,0.10);
  border:1px solid rgba(245,197,24,0.35);
  border-radius:24px; padding:9px 22px;
}

.number-box {
  border:1px solid rgba(245,197,24,0.30);
  border-radius:14px;
  padding:34px 20px 28px;
  text-align:center;
  margin-bottom:28px;
  background:rgba(245,197,24,0.025);
  box-shadow:
    inset 0 0 32px rgba(245,197,24,0.06),
    0 0 48px rgba(245,197,24,0.08);
  position:relative;
}
.number {
  font-size:104px; font-weight:900;
  color:#f5c518; line-height:1;
  letter-spacing:-3px;
  text-shadow: 0 0 28px rgba(245,197,24,0.45);
}
.number-sub {
  font-size:11px; font-weight:600;
  color:rgba(255,255,255,0.32);
  margin-top:10px; letter-spacing:2.5px;
  text-transform:uppercase;
}

.hook {
  text-align:center; margin-bottom:14px;
  font-size:22px; font-weight:800;
  color:#fff; line-height:1.3;
  letter-spacing:-.3px;
}
.hook .acc { color:#f5c518; }
.hook .yellow { color:#f5c518; }

.mystery {
  text-align:center;
  font-size:16px; font-weight:600;
  color:rgba(255,255,255,0.45);
  margin-bottom:28px;
}

.highlight {
  border:1px solid rgba(245,197,24,0.35);
  border-radius:10px;
  padding:12px 16px;
  text-align:center;
  background:rgba(245,197,24,0.06);
  margin-bottom:auto;
}
.highlight-text {
  font-size:13px; font-weight:700;
  color:#f5c518;
}

.cta {
  font-size:11px; font-weight:600;
  color:rgba(255,255,255,0.25);
  text-align:center;
  letter-spacing:3px;
  border-top:1px solid rgba(255,255,255,0.05);
  padding-top:14px; margin-top:18px;
}

.brand {
  font-size:10px; font-weight:700;
  color:rgba(255,255,255,0.18);
  text-align:center;
  letter-spacing:4px;
  margin-top:14px;
  text-transform:uppercase;
}
</style>
</head>
<body>
<div class="card">
  <div style="position:absolute;top:18px;right:18px;font-size:9px;font-weight:800;letter-spacing:1.5px;color:#f5c518;opacity:.7;border:1px solid rgba(245,197,24,.3);border-radius:6px;padding:3px 8px;">DAILY KILLER-STAT</div>
  <div class="logo"><div class="logo-circle">COCO<br>BET</div></div>
  <div class="badge"><div class="badge-inner">⚡ KILLER-STAT</div></div>

  <div class="number-box">
    <div class="number">3.3</div>
    <div class="number-sub">Tore pro Spiel</div>
  </div>

  <div class="hook">
    <span class="acc">Norwegen</span> trifft<br>
    in fast jedem Spiel.
  </div>

  <div class="mystery">Wer stoppt sie?</div>

  <div class="highlight">
    <div class="highlight-text">⚡ 15 Spiele · 50 Tore · Quali 2024/25</div>
  </div>

  <div class="cta">ANTWORT IM VIDEO</div>
  <div class="brand">cocobet</div>
</div>
</body>
</html>
