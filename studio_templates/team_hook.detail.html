<style>
/*
 * team_hook.detail.html — Detail-Variante (3 Stats + Story-Box)
 * Style: Hidden-Gem-Aesthetik (Österreich-Vorlage 07.06.2026).
 * Komposition: Frame-Badges oben, Flagge zentriert groß, Team-Name fett mittig,
 * dünne Trennlinie, 3-Spalten-Stat-Grid mit subtilen Cards, Story-Box mit
 * cyan-thin-border + highlighteten Schlüsselworten, Tagline-Punchline mittig.
 */
.tdh-bg {
  background: radial-gradient(ellipse at top, #14204a 0%, #0a0e27 70%);
  padding: 70px 70px 200px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  position: relative;
}
.tdh-bg::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(125,211,252,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(125,211,252,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}
.tdh-top {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 60px;
  position: relative;
  z-index: 2;
}
.tdh-story-badge {
  border: 2px solid rgba(125,211,252,0.5);
  border-radius: 18px;
  padding: 16px 28px;
  text-align: left;
  background: rgba(10,14,39,0.4);
}
.tdh-story-badge .lbl {
  font-size: 22px;
  letter-spacing: 4px;
  opacity: 0.7;
  font-weight: 600;
}
.tdh-story-badge .brand {
  font-size: 24px;
  font-weight: 800;
  color: var(--accent, #fbbf24);
  letter-spacing: 3px;
  margin-top: 4px;
}
.tdh-tier-badge {
  border: 2px solid rgba(125,211,252,0.5);
  border-radius: 60px;
  padding: 14px 32px;
  font-size: 24px;
  font-weight: 800;
  color: #7dd3fc;
  letter-spacing: 3px;
  background: rgba(10,14,39,0.4);
}
.tdh-flag {
  font-size: 180px;
  line-height: 1;
  margin-bottom: 24px;
  filter: drop-shadow(0 10px 28px rgba(0,0,0,0.45));
  position: relative;
  z-index: 2;
}
.tdh-team-name {
  font-size: 96px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -2px;
  margin-bottom: 18px;
  position: relative;
  z-index: 2;
}
.tdh-team-sub {
  font-size: 28px;
  font-weight: 600;
  opacity: 0.7;
  letter-spacing: 3px;
  text-transform: uppercase;
  line-height: 1.4;
  margin-bottom: 40px;
  position: relative;
  z-index: 2;
  max-width: 800px;
}
.tdh-divider {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(125,211,252,0.3), transparent);
  margin-bottom: 40px;
  position: relative;
  z-index: 2;
}
.tdh-stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 18px;
  width: 100%;
  margin-bottom: 48px;
  position: relative;
  z-index: 2;
}
.tdh-stat {
  background: rgba(125,211,252,0.05);
  border: 1px solid rgba(125,211,252,0.18);
  border-radius: 22px;
  padding: 32px 18px;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 200px;
}
.tdh-stat-val {
  font-size: 56px;
  font-weight: 900;
  line-height: 1;
  color: #7dd3fc;
  margin-bottom: 14px;
  letter-spacing: -1px;
}
.tdh-stat-lbl {
  font-size: 19px;
  font-weight: 600;
  opacity: 0.65;
  letter-spacing: 2px;
  text-transform: uppercase;
  line-height: 1.25;
}
.tdh-story {
  background: rgba(125,211,252,0.04);
  border: 1.5px solid rgba(125,211,252,0.28);
  border-radius: 20px;
  padding: 32px 36px;
  font-size: 36px;
  line-height: 1.4;
  font-weight: 500;
  text-align: left;
  margin-bottom: 44px;
  position: relative;
  z-index: 2;
  width: 100%;
}
.tdh-punchline {
  font-size: 40px;
  font-weight: 700;
  line-height: 1.3;
  text-align: center;
  padding: 0 10px;
  position: relative;
  z-index: 2;
}
.tdh-punchline .accent {
  color: #7dd3fc;
}
.tdh-footnote {
  position: absolute;
  bottom: 90px;
  left: 70px;
  right: 70px;
  display: flex;
  justify-content: space-between;
  font-size: 18px;
  opacity: 0.45;
  letter-spacing: 1px;
  z-index: 2;
}
</style>
<div class="stc tdh-bg">
  <div class="tdh-top">
    <div class="tdh-story-badge">
      <div class="lbl">STORY</div>
      <div class="brand">COCOBET</div>
    </div>
    <div class="tdh-tier-badge">💎 HIDDEN GEM</div>
  </div>

  <div class="tdh-flag">{{flag}}</div>
  <div class="tdh-team-name">{{team_name}}</div>
  <div class="tdh-team-sub">{{team_sub}}</div>

  <div class="tdh-divider"></div>

  <div class="tdh-stats-grid">
    {{#if stat1}}<div class="tdh-stat"><div class="tdh-stat-val">✓</div><div class="tdh-stat-lbl">{{stat1}}</div></div>{{/if}}
    {{#if stat2}}<div class="tdh-stat"><div class="tdh-stat-val">✓</div><div class="tdh-stat-lbl">{{stat2}}</div></div>{{/if}}
    {{#if stat3}}<div class="tdh-stat"><div class="tdh-stat-val">✓</div><div class="tdh-stat-lbl">{{stat3}}</div></div>{{/if}}
  </div>

  {{#if hook}}<div class="tdh-story">{{hook}}</div>{{/if}}
  {{#if punchline}}<div class="tdh-punchline"><span class="accent">{{punchline}}</span></div>{{/if}}

  <div class="tdh-footnote">
    <span>{{detail_label}}</span>
    <span>cocobet</span>
  </div>
  <div class="stc-brand">{{brand}}<small>{{brand_sub}}</small></div>
</div>
