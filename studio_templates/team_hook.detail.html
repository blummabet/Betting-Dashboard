<style>
.td-bg { background: linear-gradient(180deg, #0a0e27 0%, #1a1f4e 100%); padding: 100px 80px 200px; }
.td-head { display: flex; align-items: center; gap: 32px; margin-bottom: 50px; }
.td-flag { font-size: 160px; line-height: 1; }
.td-team-info { flex: 1; }
.td-team-name { font-size: 64px; font-weight: 900; line-height: 1; letter-spacing: -1px; }
.td-team-sub { font-size: 28px; opacity: 0.7; margin-top: 8px; letter-spacing: 2px; }
.td-hook { font-size: 52px; font-weight: 800; line-height: 1.15; margin-bottom: 60px; padding: 28px 32px; background: rgba(255,255,255,0.06); border-left: 6px solid var(--accent, #fbbf24); border-radius: 16px; }
.td-label { font-size: 26px; font-weight: 700; color: var(--accent, #fbbf24); letter-spacing: 3px; margin-bottom: 24px; }
.td-stat { background: rgba(255,255,255,0.05); border-radius: 24px; padding: 32px 36px; margin-bottom: 20px; font-size: 38px; font-weight: 600; line-height: 1.3; }
.td-stat::before { content: "✓ "; color: var(--accent, #fbbf24); font-weight: 900; margin-right: 8px; }
.td-punchline { margin-top: 50px; font-size: 38px; font-weight: 700; line-height: 1.3; color: var(--accent, #fbbf24); text-align: center; padding: 0 20px; }
</style>
<div class="stc td-bg">
  <div class="td-head">
    <div class="td-flag">{{flag}}</div>
    <div class="td-team-info">
      <div class="td-team-name">{{team_name}}</div>
      <div class="td-team-sub">{{team_sub}}</div>
    </div>
  </div>
  <div class="td-hook">{{hook}}</div>
  <div class="td-label">{{detail_label}}</div>
  {{#if stat1}}<div class="td-stat">{{stat1}}</div>{{/if}}
  {{#if stat2}}<div class="td-stat">{{stat2}}</div>{{/if}}
  {{#if stat3}}<div class="td-stat">{{stat3}}</div>{{/if}}
  {{#if punchline}}<div class="td-punchline">{{punchline}}</div>{{/if}}
  <div class="stc-brand">{{brand}}<small>{{brand_sub}}</small></div>
</div>
