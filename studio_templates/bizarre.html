<style>
.b-bg { background: linear-gradient(180deg, #0a0e27 0%, #1e293b 100%); padding: 120px 80px; }
.b-hook { font-size: 52px; font-weight: 600; opacity: 0.8; margin-bottom: 24px; }
.b-subject { font-size: 84px; font-weight: 900; line-height: 1.05; margin-bottom: 24px; letter-spacing: -1px; }
.b-quote { display: inline-block; background: var(--accent, #fbbf24); color: var(--primary-bg, #0a0e27); padding: 24px 48px; border-radius: 24px; font-size: 96px; font-weight: 900; margin-bottom: 80px; box-shadow: 0 12px 32px rgba(251,191,36,0.4); }
.b-cmp { background: rgba(255,255,255,0.06); border-left: 6px solid var(--accent, #fbbf24); padding: 32px 40px; border-radius: 20px; margin-bottom: 28px; font-size: 40px; font-weight: 600; line-height: 1.3; }
.b-cmp::before { content: "→ "; color: var(--accent, #fbbf24); font-weight: 900; }
</style>
<div class="stc b-bg">
  <div class="b-hook">DAS HEISST ZU SAGEN</div>
  <div class="b-subject">{{subject}}</div>
  {{#if quote}}<div class="b-quote">@{{quote}}</div>{{/if}}
  {{#if cmp1}}<div class="b-cmp">{{cmp1}}</div>{{/if}}
  {{#if cmp2}}<div class="b-cmp">{{cmp2}}</div>{{/if}}
  {{#if cmp3}}<div class="b-cmp">{{cmp3}}</div>{{/if}}
  <div class="stc-brand">{{brand}}<small>{{brand_sub}}</small></div>
</div>
