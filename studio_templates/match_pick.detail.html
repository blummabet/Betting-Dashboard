<style>
/*
 * match_pick.detail.html — Pick mit 3 Reasons (Hidden-Gem-Stil)
 * Angeglichen an Österreich-Vorlage 08.06.2026.
 * Komposition: STORY-Badge + PICK Tier-Badge, Pick-Hauptzeile + Quote/Edge,
 * 3 Reason-Cards mit Cyan-Border-Left.
 */
.md-bg {
  background: radial-gradient(ellipse at top, #14204a 0%, #0a0e27 70%);
  padding: 60px 70px 200px;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}
.md-bg::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(125,211,252,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(125,211,252,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}
.md-top {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 40px;
  position: relative;
  z-index: 2;
}
.md-story-badge {
  border: 2px solid rgba(125,211,252,0.5);
  border-radius: 18px;
  padding: 16px 28px;
  text-align: left;
  background: rgba(10,14,39,0.4);
}
.md-story-badge .lbl {
  font-size: 22px;
  letter-spacing: 4px;
  opacity: 0.7;
  font-weight: 600;
}
.md-story-badge .brand {
  font-size: 24px;
  font-weight: 800;
  color: var(--accent, #fbbf24);
  letter-spacing: 3px;
  margin-top: 4px;
}
.md-tier-badge {
  border: 2px solid rgba(125,211,252,0.5);
  border-radius: 60px;
  padding: 14px 32px;
  font-size: 24px;
  font-weight: 800;
  color: #7dd3fc;
  letter-spacing: 3px;
  background: rgba(10,14,39,0.4);
}
.md-day {
  font-size: 26px;
  opacity: 0.6;
  margin-bottom: 14px;
  letter-spacing: 3px;
  text-align: center;
  width: 100%;
  position: relative;
  z-index: 2;
}
.md-match {
  font-size: 56px;
  font-weight: 800;
  line-height: 1.1;
  margin-bottom: 36px;
  text-align: center;
  width: 100%;
  position: relative;
  z-index: 2;
  text-shadow: 0 4px 24px rgba(0,0,0,0.5);
}
.md-pick-row {
  display: flex;
  gap: 18px;
  align-items: stretch;
  margin-bottom: 44px;
  width: 100%;
  position: relative;
  z-index: 2;
}
.md-pick-main {
  flex: 2;
  background: rgba(251,191,36,0.10);
  border: 2px solid rgba(251,191,36,0.4);
  border-radius: 24px;
  padding: 28px 32px;
}
.md-pick-lbl {
  font-size: 22px;
  font-weight: 700;
  color: var(--accent, #fbbf24);
  letter-spacing: 3px;
  margin-bottom: 12px;
}
.md-pick-mkt {
  font-size: 52px;
  font-weight: 900;
  line-height: 1.05;
}
.md-pick-side {
  flex: 1;
  background: rgba(125,211,252,0.06);
  border: 1.5px solid rgba(125,211,252,0.32);
  border-radius: 24px;
  padding: 28px;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.md-pick-side-lbl {
  font-size: 22px;
  opacity: 0.7;
  letter-spacing: 2px;
  margin-bottom: 10px;
  text-transform: uppercase;
}
.md-pick-side-val {
  font-size: 56px;
  font-weight: 900;
  color: #7dd3fc;
  line-height: 1;
}
.md-pick-side-val small {
  font-size: 22px;
  opacity: 0.75;
}
.md-label {
  font-size: 26px;
  font-weight: 700;
  color: #7dd3fc;
  letter-spacing: 3px;
  margin-bottom: 22px;
  text-transform: uppercase;
  width: 100%;
  position: relative;
  z-index: 2;
}
.md-reason {
  background: rgba(125,211,252,0.06);
  border-left: 5px solid #7dd3fc;
  padding: 24px 32px;
  border-radius: 18px;
  margin-bottom: 18px;
  font-size: 32px;
  font-weight: 600;
  line-height: 1.3;
  width: 100%;
  position: relative;
  z-index: 2;
}
.md-reason::before {
  content: "→ ";
  color: #7dd3fc;
  font-weight: 900;
}
</style>
<div class="stc md-bg">
  <div class="md-top">
    <div class="md-story-badge">
      <div class="lbl">STORY</div>
      <div class="brand">COCOBET</div>
    </div>
    <div class="md-tier-badge">🎯 PICK · WARUM</div>
  </div>
  <div class="md-day">{{date_time}}</div>
  <div class="md-match">{{match_label}}</div>
  <div class="md-pick-row">
    <div class="md-pick-main">
      <div class="md-pick-lbl">PICK</div>
      <div class="md-pick-mkt">{{pick}}</div>
    </div>
    <div class="md-pick-side">
      <div class="md-pick-side-lbl">QUOTE</div>
      <div class="md-pick-side-val">{{odds}}</div>
    </div>
    <div class="md-pick-side">
      <div class="md-pick-side-lbl">EDGE</div>
      <div class="md-pick-side-val">{{edge_short}}<small>pp</small></div>
    </div>
  </div>
  <div class="md-label">{{detail_label}}</div>
  {{#if reason1}}<div class="md-reason">{{reason1}}</div>{{/if}}
  {{#if reason2}}<div class="md-reason">{{reason2}}</div>{{/if}}
  {{#if reason3}}<div class="md-reason">{{reason3}}</div>{{/if}}
  <div class="stc-brand">{{brand}}<small>{{brand_sub}}</small></div>
</div>
