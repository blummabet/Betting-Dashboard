<style>
.md-bg { background: linear-gradient(135deg, #064e3b 0%, #022c22 100%); padding: 100px 80px 200px; }
.md-day { font-size: 28px; opacity: 0.65; margin-bottom: 20px; letter-spacing: 3px; }
.md-match { font-size: 56px; font-weight: 800; line-height: 1.15; margin-bottom: 40px; }
.md-pick-row { display: flex; gap: 20px; align-items: stretch; margin-bottom: 50px; }
.md-pick-main { flex: 2; background: rgba(52,211,153,0.12); border: 2px solid rgba(52,211,153,0.45); border-radius: 24px; padding: 28px 32px; }
.md-pick-lbl { font-size: 22px; font-weight: 700; color: var(--success, #34d399); letter-spacing: 2px; margin-bottom: 12px; }
.md-pick-mkt { font-size: 56px; font-weight: 900; line-height: 1.05; }
.md-pick-side { flex: 1; background: rgba(255,255,255,0.05); border-radius: 24px; padding: 28px; text-align: center; }
.md-pick-side-lbl { font-size: 22px; opacity: 0.7; letter-spacing: 2px; margin-bottom: 10px; }
.md-pick-side-val { font-size: 60px; font-weight: 900; color: var(--success, #34d399); line-height: 1; }
.md-pick-side-val small { font-size: 24px; opacity: 0.75; }
.md-label { font-size: 26px; font-weight: 700; color: var(--success, #34d399); letter-spacing: 3px; margin-bottom: 22px; }
.md-reason { background: rgba(255,255,255,0.05); border-left: 5px solid var(--success, #34d399); padding: 24px 30px; border-radius: 18px; margin-bottom: 18px; font-size: 32px; font-weight: 600; line-height: 1.3; }
.md-reason::before { content: "→ "; color: var(--success, #34d399); font-weight: 900; }
</style>
<div class="stc md-bg">
  <div class="md-day">{{date_time}}</div>
  <div class="md-match">{{match_label}}</div>
  <div class="md-pick-row">
    <div class="md-pick-main">
      <div class="md-pick-lbl">🎯 PICK</div>
      <div class="md-pick-mkt">{{pick}}</div>
    </div>
    <div class="md-pick-side">
      <div class="md-pick-side-lbl">QUOTE</div>
      <div class="md-pick-side-val">{{odds}}</div>
    </div>
    <div class="md-pick-side">
      <div class="md-pick-side-lbl">EDGE</div>
      <div class="md-pick-side-val">{{edge_short}}<small>pp</small></div>
    </div>
  </div>
  <div class="md-label">{{detail_label}}</div>
  {{#if reason1}}<div class="md-reason">{{reason1}}</div>{{/if}}
  {{#if reason2}}<div class="md-reason">{{reason2}}</div>{{/if}}
  {{#if reason3}}<div class="md-reason">{{reason3}}</div>{{/if}}
  <div class="stc-brand">{{brand}}<small>{{brand_sub}}</small></div>
</div>
