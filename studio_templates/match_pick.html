<style>
.m-bg { background: linear-gradient(135deg, #064e3b 0%, #022c22 100%); padding: 120px 80px; }
.m-day { font-size: 32px; opacity: 0.7; margin-bottom: 32px; letter-spacing: 3px; }
.m-match { font-size: 62px; font-weight: 800; line-height: 1.15; margin-bottom: 100px; }
.m-pick-label { font-size: 30px; font-weight: 700; color: var(--success, #34d399); margin-bottom: 16px; letter-spacing: 3px; }
.m-pick { font-size: 88px; font-weight: 900; line-height: 1.05; margin-bottom: 60px; letter-spacing: -1px; }
.m-odds-row { display: flex; gap: 32px; margin-bottom: 60px; }
.m-odds-box { flex: 1; background: rgba(52,211,153,0.1); border: 2px solid rgba(52,211,153,0.4); border-radius: 24px; padding: 36px; text-align: center; }
.m-odds-label { font-size: 24px; font-weight: 600; opacity: 0.7; margin-bottom: 12px; letter-spacing: 2px; }
.m-odds-val { font-size: 72px; font-weight: 900; color: var(--success, #34d399); }
.m-why { background: rgba(255,255,255,0.06); border-radius: 24px; padding: 40px; font-size: 38px; font-weight: 600; line-height: 1.35; }
</style>
<div class="stc m-bg">
  <div class="m-day">{{date_time}}</div>
  <div class="m-match">{{match_label}}</div>
  <div class="m-pick-label">🎯 PICK</div>
  <div class="m-pick">{{pick}}</div>
  <div class="m-odds-row">
    {{#if odds}}<div class="m-odds-box"><div class="m-odds-label">QUOTE</div><div class="m-odds-val">{{odds}}</div></div>{{/if}}
    {{#if edge}}<div class="m-odds-box"><div class="m-odds-label">EDGE</div><div class="m-odds-val">{{edge}}</div></div>{{/if}}
  </div>
  {{#if why}}<div class="m-why">{{why}}</div>{{/if}}
  <div class="stc-brand">{{brand}}<small>{{brand_sub}}</small></div>
</div>
