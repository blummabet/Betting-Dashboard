<style>
/*
 * match_pick.html — Pick-Hook Card (Hidden-Gem-Stil)
 * Angeglichen an Österreich-Vorlage 08.06.2026.
 * Komposition: STORY-Badge + PICK Tier-Badge, Match-Label,
 * Pick als Gold-Hero, Odds+Edge Cyan-Boxes, optionales Why.
 */
.m-bg {
  background: radial-gradient(ellipse at top, #14204a 0%, #0a0e27 70%);
  padding: 70px 70px 200px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  position: relative;
}
.m-bg::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(125,211,252,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(125,211,252,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}
.m-top {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 50px;
  position: relative;
  z-index: 2;
}
.m-story-badge {
  border: 2px solid rgba(125,211,252,0.5);
  border-radius: 18px;
  padding: 16px 28px;
  text-align: left;
  background: rgba(10,14,39,0.4);
}
.m-story-badge .lbl {
  font-size: 22px;
  letter-spacing: 4px;
  opacity: 0.7;
  font-weight: 600;
}
.m-story-badge .brand {
  font-size: 24px;
  font-weight: 800;
  color: var(--accent, #fbbf24);
  letter-spacing: 3px;
  margin-top: 4px;
}
.m-tier-badge {
  border: 2px solid rgba(125,211,252,0.5);
  border-radius: 60px;
  padding: 14px 32px;
  font-size: 24px;
  font-weight: 800;
  color: #7dd3fc;
  letter-spacing: 3px;
  background: rgba(10,14,39,0.4);
}
.m-day {
  font-size: 30px;
  opacity: 0.65;
  margin-bottom: 18px;
  letter-spacing: 3px;
  position: relative;
  z-index: 2;
}
.m-match {
  font-size: 64px;
  font-weight: 800;
  line-height: 1.1;
  margin-bottom: 70px;
  position: relative;
  z-index: 2;
  text-shadow: 0 4px 24px rgba(0,0,0,0.5);
}
.m-pick-label {
  font-size: 30px;
  font-weight: 700;
  color: #7dd3fc;
  margin-bottom: 16px;
  letter-spacing: 3px;
  position: relative;
  z-index: 2;
}
.m-pick {
  font-size: 86px;
  font-weight: 900;
  line-height: 1.05;
  margin-bottom: 50px;
  letter-spacing: -1px;
  color: var(--accent, #fbbf24);
  position: relative;
  z-index: 2;
  text-shadow: 0 4px 24px rgba(0,0,0,0.5);
}
.m-odds-row {
  display: flex;
  gap: 28px;
  margin-bottom: 50px;
  position: relative;
  z-index: 2;
  width: 100%;
}
.m-odds-box {
  flex: 1;
  background: rgba(125,211,252,0.06);
  border: 1.5px solid rgba(125,211,252,0.32);
  border-radius: 24px;
  padding: 36px 24px;
  text-align: center;
}
.m-odds-label {
  font-size: 22px;
  font-weight: 600;
  opacity: 0.7;
  margin-bottom: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.m-odds-val {
  font-size: 72px;
  font-weight: 900;
  color: #7dd3fc;
  line-height: 1;
  letter-spacing: -1px;
}
.m-why {
  background: rgba(125,211,252,0.04);
  border-left: 5px solid #7dd3fc;
  border-radius: 18px;
  padding: 30px 36px;
  font-size: 36px;
  font-weight: 600;
  line-height: 1.35;
  text-align: left;
  position: relative;
  z-index: 2;
  width: 100%;
}
</style>
<div class="stc m-bg">
  <div class="m-top">
    <div class="m-story-badge">
      <div class="lbl">STORY</div>
      <div class="brand">COCOBET</div>
    </div>
    <div class="m-tier-badge">🎯 PICK</div>
  </div>
  <div class="m-day">{{date_time}}</div>
  <div class="m-match">{{match_label}}</div>
  <div class="m-pick-label">UNSER PICK</div>
  <div class="m-pick">{{pick}}</div>
  <div class="m-odds-row">
    {{#if odds}}<div class="m-odds-box"><div class="m-odds-label">QUOTE</div><div class="m-odds-val">{{odds}}</div></div>{{/if}}
    {{#if edge}}<div class="m-odds-box"><div class="m-odds-label">EDGE</div><div class="m-odds-val">{{edge}}</div></div>{{/if}}
  </div>
  {{#if why}}<div class="m-why">{{why}}</div>{{/if}}
  <div class="stc-brand">{{brand}}<small>{{brand_sub}}</small></div>
</div>
