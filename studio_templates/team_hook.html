<style>
.h-bg { background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #3a1b6e 100%); padding: 140px 80px 200px; }
.h-flag { font-size: 280px; line-height: 1; margin-bottom: 40px; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.4)); }
.h-hook { font-size: 88px; font-weight: 900; line-height: 1.05; letter-spacing: -2px; text-shadow: 0 4px 24px rgba(0,0,0,0.5); margin-bottom: 60px; }
.h-stat { font-size: 46px; font-weight: 600; line-height: 1.35; opacity: 0.95; background: rgba(255,255,255,0.08); padding: 36px 40px; border-radius: 24px; border-left: 8px solid var(--accent, #fbbf24); }
.h-tag { position: absolute; bottom: 160px; left: 0; right: 0; text-align: center; font-size: 32px; font-weight: 700; color: var(--accent, #fbbf24); letter-spacing: 3px; }
</style>
<div class="stc h-bg">
  <div class="h-flag">{{flag}}</div>
  <div class="h-hook">{{hook}}</div>
  <div class="h-stat">{{stat}}</div>
  <div class="h-tag">{{tag}}</div>
  <div class="stc-brand">{{brand}}<small>{{brand_sub}}</small></div>
</div>
