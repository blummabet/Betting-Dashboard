<style>
.k-bg { background: linear-gradient(135deg, #7c2d12 0%, #431407 100%); padding: 120px 80px; text-align: center; }
.k-flag { font-size: 140px; line-height: 1; margin-bottom: 24px; }
.k-team { font-size: 42px; font-weight: 700; opacity: 0.85; margin-bottom: 120px; letter-spacing: 4px; }
.k-number { font-size: 360px; font-weight: 900; line-height: 0.9; letter-spacing: -12px; margin-bottom: 20px; background: linear-gradient(135deg, var(--accent, #fbbf24), var(--accent-secondary, #dc2626)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 20px 60px rgba(220,38,38,0.4); }
.k-unit { font-size: 64px; font-weight: 800; letter-spacing: 8px; margin-bottom: 80px; }
.k-context { font-size: 38px; font-weight: 600; line-height: 1.3; opacity: 0.95; margin-bottom: 40px; background: rgba(255,255,255,0.08); padding: 32px; border-radius: 24px; }
.k-punch { font-size: 46px; font-weight: 800; line-height: 1.2; color: var(--accent, #fbbf24); padding: 0 20px; }
</style>
<div class="stc k-bg">
  <div class="k-flag">{{flag}}</div>
  <div class="k-team">{{team_upper}}</div>
  <div class="k-number">{{number}}</div>
  <div class="k-unit">{{unit_upper}}</div>
  {{#if context}}<div class="k-context">{{context}}</div>{{/if}}
  {{#if punchline}}<div class="k-punch">{{punchline}}</div>{{/if}}
  <div class="stc-brand">{{brand}}<small>{{brand_sub}}</small></div>
</div>
