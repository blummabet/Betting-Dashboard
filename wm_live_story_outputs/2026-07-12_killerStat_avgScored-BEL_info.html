<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Info</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a0e18;
  display:flex; align-items:center; justify-content:center;
  min-height:100vh;
  font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.card {
  width:360px; height:640px;
  background:
    radial-gradient(circle at 50% 30%, rgba(245,197,24,0.08) 0%, transparent 50%),
    linear-gradient(180deg, #0a0e18 0%, #080d18 100%);
  background-image:
    radial-gradient(circle at 50% 30%, rgba(245,197,24,0.08) 0%, transparent 50%),
    linear-gradient(rgba(255,255,255,0.014) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: auto, 24px 24px, 24px 24px;
  border-radius:24px;
  padding:26px 24px 22px;
  position:relative; overflow:hidden;
  display:flex; flex-direction:column;
  border:1px solid rgba(255,255,255,0.04);
}
.top { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.brand-top { font-size:11px; font-weight:800; letter-spacing:3px; color:#f5c518; }
.badge-top {
  font-size:10px; font-weight:700; letter-spacing:1px;
  color:#f5c518;
  background:rgba(245,197,24,0.10);
  border:1px solid rgba(245,197,24,0.35);
  border-radius:18px; padding:5px 12px;
}

.flag { font-size:54px; text-align:center; margin-bottom:6px; line-height:1; }
.name {
  font-size:28px; font-weight:900; color:#fff;
  text-align:center; letter-spacing:-.5px; margin-bottom:4px;
}
.role {
  text-align:center; font-size:11px; color:rgba(255,255,255,0.35);
  letter-spacing:2.5px; text-transform:uppercase; margin-bottom:22px;
}

.divider {
  height:1px; background:rgba(255,255,255,0.06);
  margin-bottom:20px;
}

.stats {
  display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:22px;
}
.stat {
  background:rgba(255,255,255,0.025);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:10px;
  padding:14px 8px; text-align:center;
}
.stat-val {
  font-size:30px; font-weight:900; line-height:1;
  color:#f5c518;
}
.stat-val.blue { color:#60a5fa; }
.stat-val.yellow { color:#f5c518; }
.stat-lbl {
  font-size:9px; font-weight:600;
  color:rgba(255,255,255,0.32);
  letter-spacing:1px; text-transform:uppercase;
  margin-top:8px; line-height:1.4;
}

.fact-box {
  border:1px solid rgba(245,197,24,0.30);
  background:rgba(245,197,24,0.06);
  border-radius:10px;
  padding:14px 16px; margin-bottom:18px;
}
.fact-box .text {
  font-size:13px; color:rgba(255,255,255,0.85); line-height:1.55;
}
.fact-box .text strong { color:#f5c518; }

.quote {
  font-size:16px; font-weight:800; color:#fff;
  text-align:center; line-height:1.35;
  margin-bottom:auto;
}
.quote .acc { color:#f5c518; }

.footer {
  display:flex; justify-content:space-between;
  border-top:1px solid rgba(255,255,255,0.05);
  padding-top:12px; margin-top:16px;
}
.footer .ft { font-size:9px; color:rgba(255,255,255,0.22); }
</style>
</head>
<body>
<div class="card">
  
  <div class="top">
    <div class="brand-top">COCOBET</div>
    <div class="badge-top">⚡ KILLER-STAT</div>
  </div>

  <div class="flag">🇧🇪</div>
  <div class="name">Belgien</div>
  <div class="role">Ø 3.4 Tore/Spiel · 15 Spiele Datenbasis</div>

  <div class="divider"></div>

  <div class="stats">
    <div class="stat">
      <div class="stat-val">3.4</div>
      <div class="stat-lbl">Tore Ø</div>
    </div>
    <div class="stat">
      <div class="stat-val blue">0.8</div>
      <div class="stat-lbl">Gegen Ø</div>
    </div>
    <div class="stat">
      <div class="stat-val yellow">15</div>
      <div class="stat-lbl">Spiele</div>
    </div>
  </div>

  <div class="fact-box">
    <div class="text"><strong>Höchster Tor-Schnitt</strong> aller 48 qualifizierten WM-Teams. Form-Datenbasis: 15 Spiele.</div>
  </div>

  <div class="quote">Tor-Maschine ohne <span class="acc">Stopper</span> in Sicht. ⚽</div>

  <div class="footer">
    <div class="ft">Daten: WM-Quali + Tests 2024/25</div>
    <div class="ft">cocobet</div>
  </div>
</div>
</body>
</html>
